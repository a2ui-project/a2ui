name: server
description: >-
  The server of the hosted triage UI: serves the web app, signs the triager in
  to GitHub, and passes the app's GitHub calls through with the triager's
  token.
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  cryptography: ^2.7.0
  http: ^1.6.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3

dev_dependencies:
  test: ^1.26.2
