<!--
Karma's default context page plus the Content Security Policy to test under. It
matches the default policy of an MCP Apps iframe: no 'unsafe-eval', inline
scripts and styles allowed, and images only from data: and blob: URLs. 'self'
lets the page load Karma's scripts and the test bundle.
-->
<html>
  <head>
    <title></title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <script src="context.js"></script>
    <script type="text/javascript">
      %CLIENT_CONFIG%
      window.__karma__.setupContext(window);

      %MAPPINGS%
    </script>
    %SCRIPTS%
    <script type="module">
      window.__karma__.loaded();
    </script>
    <script nomodule>
      window.__karma__.loaded();
    </script>
  </body>
</html>
