<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A2UI test app</title>
  </head>
  <body>
    <p id="status">Waiting for the host</p>
    <script>
      // Web application used by the real-frame scenarios of @a2ui/catalog-iframe. It runs in the
      // sandboxed inner frame, either inline through WebAppFrameSrcdoc or from this URL through
      // WebAppFrameUrl, so a test cannot reach into it. Instead, the app reports everything it
      // receives as actions and takes its orders from the data model: the host writes a JSON
      // string to the path bound as "command", and each command makes the app send exactly one
      // protocol message.
      var port = null;
      var hostContext = null;

      function send(message) {
        if (port) {
          port.postMessage(message);
        }
      }

      function report(action, data) {
        send({type: 'a2ui_action', action: action, data: data});
      }

      function runCommand(command) {
        switch (command.kind) {
          case 'action':
            report(command.action, command.data || {});
            break;
          case 'ambient_action':
            // Sent on the window channel instead of the port; the host must ignore it.
            window.parent.postMessage(
              {type: 'a2ui_action', action: command.action, data: command.data || {}},
              '*',
            );
            break;
          case 'set':
            send({
              type: 'a2ui_data_model_change',
              key: command.key,
              subpath: command.subpath,
              value: command.value,
            });
            break;
          case 'call':
            send({
              type: 'a2ui_function_call',
              call: command.call,
              callId: command.callId,
              args: command.args,
            });
            break;
          case 'resize':
            send({type: 'a2ui_size_changed', width: command.width, height: command.height});
            break;
          case 'report_host_context':
            report('host_context', {hostContext: hostContext});
            break;
          case 'navigate_top': {
            // A sandboxed frame without allow-top-navigation must not be able to do this.
            var blocked = false;
            var error = '';
            try {
              window.top.location.href = command.url;
            } catch (e) {
              blocked = true;
              error = e && e.name ? String(e.name) : String(e);
            }
            report('navigate_top_result', {blocked: blocked, error: error});
            break;
          }
          default:
            report('unknown_command', {command: command});
        }
      }

      function onPortMessage(event) {
        var msg = event.data || {};
        if (msg.type === 'a2ui_data_model_update') {
          if (msg.key === 'command' && typeof msg.value === 'string') {
            runCommand(JSON.parse(msg.value));
          } else {
            report('data_seen', {key: msg.key, subpath: msg.subpath, value: msg.value});
          }
        } else if (msg.type === 'a2ui_function_result') {
          report('function_result', {
            call: msg.call,
            callId: msg.callId,
            status: msg.status,
            result: msg.result,
            error: msg.error,
          });
        } else if (msg.type === 'a2ui_host_context_update') {
          hostContext = msg.value;
        }
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) {
          return;
        }
        var msg = event.data || {};
        if (msg.type !== 'a2ui_app_frame_init' || !event.ports || !event.ports[0]) {
          return;
        }
        port = event.ports[0];
        port.onmessage = onPortMessage;
        var value = msg.value || {};
        hostContext = value.hostContext || null;
        document.getElementById('status').textContent = 'Connected';
        report('app_ready', {
          config: value.config,
          initialData: value.initialData,
          allowedEvents: Object.keys(value.allowedEvents || {}),
          allowedFunctions: Object.keys(value.allowedFunctions || {}),
          mutableDataKeys: value.mutableDataKeys,
          hostContext: value.hostContext,
          location: {href: window.location.href, search: window.location.search},
        });
      });

      window.parent.postMessage({type: 'a2ui_app_frame_ready'}, '*');
    </script>
  </body>
</html>
