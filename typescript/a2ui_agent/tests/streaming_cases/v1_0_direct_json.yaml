- name: test_interleaved_conversational_text
  description: Tests that conversational text and A2UI content are interleaved correctly.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components: {}
  action: process_chunk
  steps:
    - input: "Hello! "
      expect:
        - text: "Hello! "
    - input: "Here is your UI: <a2ui-json>"
      expect:
        - text: "Here is your UI: "
    - input: '[{"createSurface": {"root": "root", "surfaceId": "s1"}}]'
      expect:
        - a2ui:
            - createSurface:
                root: root
                surfaceId: s1
    - input: </a2ui-json> That's all!
      expect:
        - text: " That's all!"
- name: test_split_tag_handling_for_text
  description: Tests that the parser handles the opening tag split across chunks correctly.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components: {}
  action: process_chunk
  steps:
    - input: Talking <a2u
      expect:
        - text: "Talking "
    - input: i-json>
      expect: []
    - input: '[{"createSurface": {"root": "r", "surfaceId": "s"}}] </a2ui-json> End.'
      expect:
        - a2ui:
            - createSurface:
                root: r
                surfaceId: s
        - text: " End."
