# These are locally-authored v1.0 translations of v0.9 cases from conformance/agent/streaming_parser.yaml.
# They are a stopgap because no canonical v1.0 streaming cases exist.
# They should be promoted to conformance/agent/ or retired once upstream v1.0 cases land.
- name: test_incremental_yielding
  description: Tests that partial chunks are buffered and yielded correctly.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Text:
          type: object
          properties:
            text:
              type: string
  action: process_chunk
  steps:
    - input: Here is your
      expect:
        - text: Here is your
    - input: " response.<a2ui-json>["
      expect:
        - text: " response."
    - input: '{"createSurface": {"surfaceId": "s1", "root": "root-column"}},'
      expect:
        - a2ui:
            - createSurface:
                surfaceId: s1
                root: root-column
- name: test_waiting_for_root_component
  description: Tests that components are not yielded until reachable from root.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Text:
          type: object
          additionalProperties: true
        Card:
          type: object
          properties:
            child:
              type: string
              title: ComponentId
            children:
              type: array
              items:
                type: string
                title: ComponentId
          additionalProperties: true
  action: process_chunk
  steps:
    - input: '<a2ui-json>[{"createSurface": {"root": "root", "surfaceId": "s1"}},'
      expect:
        - a2ui:
            - createSurface:
                root: root
                surfaceId: s1
    - input: '{"updateComponents": {"surfaceId": "s1", "components": [{"id": "c1", "component":
        "Text", "text": {"literalString": "hello"}}'
      expect: []
    - input: ', {"id": "root", "component": "Card", "child": "c1"}]}</a2ui-json>'
      expect:
        - a2ui:
            - updateComponents:
                surfaceId: s1
                components:
                  - id: c1
                    component: Text
                    text:
                      literalString: hello
                  - id: root
                    component: Card
                    child: c1
- name: test_complete_surface_ignore_orphan_component
  description: Tests that orphan components (not reachable from root) are ignored.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Text:
          type: object
          additionalProperties: true
  action: process_chunk
  steps:
    - input: '<a2ui-json>[{"createSurface": {"root": "root", "surfaceId": "s1"}}, '
      expect:
        - a2ui:
            - createSurface:
                root: root
                surfaceId: s1
    - input: '{"updateComponents": {"surfaceId": "s1", "components": [{"id": "root",
        "component": "Text", "text": "root"}, {"id": "orphan", "component": "Text",
        "text": "orphan"}]}}] </a2ui-json>'
      expect:
        - a2ui:
            - updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Text
                    text: root
- name: test_circular_reference_detection
  description: Tests that circular references are detected during streaming.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Card:
          type: object
          properties:
            child:
              type: string
              title: ComponentId
  action: process_chunk
  steps:
    - input: '<a2ui-json>[{"createSurface": {"root": "c1", "surfaceId": "s1"}},'
      expect:
        - a2ui:
            - createSurface:
                root: c1
                surfaceId: s1
    - input: '{"updateComponents": {"surfaceId": "s1", "components": [{"id": "c1", "component":
        "Card", "child": "c2"}]}},{"updateComponents": {"surfaceId": "s1", "components":
        [{"id": "c2", "component": "Card", "child": "c1"}]}}]}} </a2ui-json>'
      expectError:
        category: RecursionError
        message: Circular reference detected
- name: test_self_reference_detection
