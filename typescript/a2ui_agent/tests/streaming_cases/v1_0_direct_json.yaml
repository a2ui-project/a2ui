- name: test_url_placeholders_with_hints
  description: "Verifies that properties hinting at being images or links get specialized
    placeholders (Note: Python test actually expects full resolution as all components
    are provided in the chunk)."
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Container:
          type: object
          properties:
            children:
              type: array
              items:
                type: string
                title: ComponentId
            imageUrl:
              type: object
              properties:
                path:
                  type: string
        Card:
          type: object
          properties:
            href:
              type: object
              properties:
                path:
                  type: string
  action: process_chunk
  steps:
    - input: <a2ui-json>[
      expect: []
    - input: '{"createSurface": {"root": "root", "surfaceId": "s1"}}, '
      expect:
        - a2ui:
            - createSurface:
                root: root
                surfaceId: s1
    - input: '{"updateComponents": {"surfaceId": "s1", "components": [{"id": "root",
        "component": "Container", "children": ["img-comp", "link-comp"]},{"id": "img-comp",
        "component": "Container", "imageUrl": {"path": "/heroImage"}},{"id": "link-comp",
        "component": "Card", "href": {"path": "/docs"}}]}}, '
      expect:
        - a2ui:
            - updateComponents:
                surfaceId: s1
                components:
                  - id: img-comp
                    component: Container
                    imageUrl:
                      path: /heroImage
                  - id: link-comp
                    component: Card
                    href:
                      path: /docs
                  - id: root
                    component: Container
                    children:
                      - img-comp
                      - link-comp
    - input: "]}]</a2ui-json>"
      expect: []
