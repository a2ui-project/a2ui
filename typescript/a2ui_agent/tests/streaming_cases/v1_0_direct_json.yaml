- name: test_multiple_a2ui_blocks
  description: Tests that multiple A2UI blocks are handled correctly with interleaved
    text.
  catalog:
    protocolVersion: v1.0
    s2cSchema: test_data/s2c_v10.json
    catalogSchema:
      catalogId: test_catalog
      components:
        Text:
          type: object
          properties:
            text:
              type: string
  action: process_chunk
  steps:
    - input: 'Some text here <a2ui-json>[{"createSurface": {"root": "root", "surfaceId":
        "s1"}}] </a2ui-json> mid text'
      expect:
        - text: "Some text here "
        - a2ui:
            - createSurface:
                root: root
                surfaceId: s1
        - text: " mid text"
    - input: ' more text <a2ui-json>[{"updateComponents": {"surfaceId": "s1", "components":
        [{"id": "root", "component": "Text", "text": "block2"}]}}] </a2ui-json> trailing
        text'
      expect:
        - text: " more text "
        - a2ui:
            - updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Text
                    text: block2
        - text: " trailing text"
