[project]
name = "mcp-apps-seating"
version = "0.1.0"
description = "MCP Apps seating booking demo"
requires-python = ">=3.10"
dependencies = ["anyio>=4.5", "click>=8.2.0", "httpx>=0.27", "mcp<2.0.0"]

[project.scripts]
mcp-apps-seating = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
