[project]
name = "react-app-demo-agent"
version = "0.1.0"
description = "Demo agent for the A2UI ReactApp prototype: Gemini streaming, Express, ReactApp checks and SSE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "a2ui-agent-sdk",
  "a2ui-core",
  "a2ui-react-app",
  "fastapi>=0.115.0",
  "google-genai>=1.20.0",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.14.0",
  "pyink>=25.12.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.0.0",
]

# Its own uv workspace root, like python/a2ui_react_app, so uv never edits the
# repository's root workspace. The SDKs and a2ui-react-app are editable path
# dependencies on the source in this checkout.
[tool.uv.workspace]
members = []

[tool.uv.sources]
a2ui-agent-sdk = { path = "../../../../../python/a2ui_agent", editable = true }
a2ui-core = { path = "../../../../../python/a2ui_core", editable = true }
a2ui-react-app = { path = "../../python/a2ui_react_app", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
react-app-demo-agent = "react_app_demo_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_app_demo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyink]
unstable = true
target-version = []
pyink-indentation = 4
pyink-use-majority-quotes = true

[tool.mypy]
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
  "a2ui.inference_formats.express.generated.*",
  "antlr4.*",
]
follow_imports = "skip"
ignore_missing_imports = true
