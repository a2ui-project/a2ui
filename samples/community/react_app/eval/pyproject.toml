[project]
name = "a2ui-react-app-eval"
version = "0.1.0"
description = "Evals of the ReactApp prototype and of Express multi-line strings, on the A2UI eval runner (Inspect AI)."
requires-python = ">=3.10"
dependencies = [
  "a2ui-agent-sdk",
  "a2ui-core",
  "a2ui-eval",
  "a2ui-react-app",
  "inspect-ai>=0.3.217",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "mypy>=1.14.0",
  "pyink>=25.12.0",
  "pytest>=9.1.1",
  "types-PyYAML>=6.0.12.20241221",
]

# Like python/a2ui_react_app, this directory is its own uv workspace root, so it
# resolves here with its own lock file and never edits the repository's root
# workspace. The eval runner and the SDKs come from the monorepo as editable
# path dependencies.
[tool.uv.workspace]
members = []

[tool.uv.sources]
a2ui-agent-sdk = { path = "../../../../python/a2ui_agent", editable = true }
a2ui-core = { path = "../../../../python/a2ui_core", editable = true }
a2ui-eval = { path = "../../../../eval", editable = true }
a2ui-react-app = { path = "../python/a2ui_react_app", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["react_app_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.pyink]
unstable = true
target-version = []
pyink-indentation = 4
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]

[tool.mypy]
strict = true
explicit_package_bases = true
ignore_missing_imports = true
