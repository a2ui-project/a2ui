[project]
name = "a2ui-contact-lookup"
version = "0.1.0"
description = "Sample Contact Lookup agent that uses a2ui extension and is hosted as an A2A server agent on Cloud Run."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==0.3.25",
    "google-adk>=1.28.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "uvicorn",
    "google-cloud-aiplatform>=1.84",
    # a2ui-agent-sdk 0.9.0 and a2ui-a2a 0.1.0 predate per-request processors
    # (`A2uiRequestProcessor.open_stream`, `to_a2a_parts`), so the sample needs
    # a later release.
    "a2ui-agent-sdk>0.9.0",
    "a2ui-a2a>0.1.0",
    # Imported by the sample too. Listing it also applies its source below,
    # since uv only applies sources to direct dependencies.
    "a2ui-core>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
# The SDK releases with per-request processors aren't published yet, so the
# sample runs on the SDKs in this repository. These paths point outside the
# sample directory, which a deployment doesn't upload, so the deploy script
# ships wheels of the SDKs instead (see ../../build_sdk_wheels.sh).
a2ui-a2a = { path = "../../../../../../../python/a2ui_a2a", editable = true }
a2ui-agent-sdk = { path = "../../../../../../../python/a2ui_agent", editable = true }
a2ui-core = { path = "../../../../../../../python/a2ui_core", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
start = "main:serve"
