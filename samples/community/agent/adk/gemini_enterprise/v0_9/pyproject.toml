[project]
name = "a2ui-v09-demo"
version = "0.1.0"
description = "Sample ADK-based agent that demonstrates A2UI (Agent-to-UI) v0.9, served over the A2A protocol."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The `http-server` extra pulls in `starlette` and `sse-starlette`, which
    # are required by A2AStarletteApplication / JSONRPCApplication.
    "a2a-sdk[http-server]>=0.3.25,<0.4",
    "click>=8.1.8",
    "google-adk>=1.28.1",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "uvicorn",
    # Required for Vertex AI when GOOGLE_GENAI_USE_VERTEXAI=TRUE (Cloud Run).
    "google-cloud-aiplatform>=1.84",
    # A2UI agent SDK (catalog negotiation, prompts, parsing and validation) and
    # its A2A part helpers. a2ui-agent-sdk 0.9.0 and a2ui-a2a 0.1.0 predate
    # per-request processors (`A2uiRequestProcessor.open_stream`,
    # `to_a2a_parts`), so the sample needs a later release.
    "a2ui-agent-sdk>0.9.0",
    "a2ui-a2a>0.1.0",
    # Imported by the sample too. Listing it also applies its source below,
    # since uv only applies sources to direct dependencies.
    "a2ui-core>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
# The SDK releases with per-request processors aren't published yet, so the
# sample runs on the SDKs in this repository. These paths point outside the
# sample directory, which a deployment doesn't upload, so the deploy script
# ships wheels of the SDKs instead (see ../build_sdk_wheels.sh).
a2ui-a2a = { path = "../../../../../../python/a2ui_a2a", editable = true }
a2ui-agent-sdk = { path = "../../../../../../python/a2ui_agent", editable = true }
a2ui-core = { path = "../../../../../../python/a2ui_core", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

# Cloud Run buildpacks run the `start` script to launch the server.
[project.scripts]
start = "main:serve"
