# Self-contained config so this folder can be lifted into its own repo.
# Unlike the monorepo root, @a2ui/* resolves from the public npm registry
# (the samples depend on the published renderer packages, not workspace builds).
# The explicit @a2ui scope overrides the monorepo root .yarnrc.yml, which points
# @a2ui at a private registry that requires auth.
nodeLinker: node-modules

npmScopes:
  a2ui:
    npmRegistryServer: "https://registry.npmjs.org"
    npmAlwaysAuth: false
