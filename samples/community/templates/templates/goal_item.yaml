version: "0.1"
templateId: GoalItem
description: Card showing an individual objective with priority, title, target date, and action button.

parameters:
  title:
    type: string
    title: Goal Title
    description: Summary title of the objective.
  priority:
    type: enum
    title: Priority Level
    description: Urgency rating for the objective.
    values:
      - High
      - Medium
      - Low
    default: Medium
  targetDate:
    type: string
    title: Target Date
    description: Target completion date in YYYY-MM-DD format.
    default: "2026-12-31"

layout:
  component: Card
  child:
    component: Column
    children:
      - component: Row
        justify: spaceBetween
        align: center
        children:
          - component: Text
            text: "Priority: ${priority}"
            variant: caption
          - component: Icon
            name: star
      - component: Text
        text: ${title}
        variant: h4
      - component: Divider
        axis: horizontal
      - component: Row
        justify: spaceBetween
        align: center
        children:
          - component: Text
            text: "Due: ${targetDate}"
            variant: caption
          - component: Button
            child:
              component: Text
              text: View Details

sampleData:
  title: Launch A2UI SDK v1.0
  priority: High
  targetDate: "2026-09-30"
