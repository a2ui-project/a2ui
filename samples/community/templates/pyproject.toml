    "uvicorn>=0.30.0",
    "google-genai>=1.0.0",
    "a2ui-agent-sdk",
    "a2ui-core"
]

[tool.uv.sources]
a2ui-agent-sdk = { path = "../../../agent_sdks/python/a2ui_agent", editable = true }
