<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A2UI MCP Apps Sandbox Proxy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      const inner = document.createElement('iframe');
      inner.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
      document.body.appendChild(inner);

      // Relay messages between inner iframe and parent host
      window.addEventListener('message', event => {
        if (event.source === window.parent) {
          if (event.data?.method === 'ui/notifications/sandbox-resource-ready') {
            const html = event.data.params?.html || '';
            inner.srcdoc = html;
          } else if (inner.contentWindow) {
            inner.contentWindow.postMessage(event.data, '*');
          }
        } else if (event.source === inner.contentWindow) {
          window.parent.postMessage(event.data, '*');
        }
      });

      // Notify parent that sandbox proxy is ready
      window.parent.postMessage(
        {
          jsonrpc: '2.0',
          method: 'ui/notifications/sandbox-proxy-ready',
          params: {},
        },
        '*',
      );
    </script>
  </body>
</html>
