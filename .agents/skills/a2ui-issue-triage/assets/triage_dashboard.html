<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2UI GitHub Issue Triage Dashboard</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Marked Library for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for HTML Sanitization (XSS mitigation) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
      :root {
        --bg-base: #0d0e12;
        --bg-surface: #15171e;
        --bg-surface-elevated: #1e212b;
        --border-color: #2b2f3d;
        --border-focus: #4b5563;

        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;

        --accent-primary: #6366f1;
        --accent-hover: #4f46e5;

        /* Priority Colors */
        --color-p0: #ef4444;
        --color-p1: #f97316;
        --color-p2: #eab308;
        --color-p3: #10b981;
        --color-p4: #6b7280;

        --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-sans);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header Bar */
      header {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }

      .brand-container {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .brand-logo {
        width: 1.75rem;
        height: 1.75rem;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 700;
        color: white;
        font-size: 0.9rem;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .global-actions {
        display: flex;
        gap: 0.75rem;
      }

      button {
        font-family: var(--font-sans);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background-color: var(--bg-surface-elevated);
        color: var(--text-primary);
        border-color: var(--border-focus);
      }

      .btn-primary {
        background-color: var(--accent-primary);
        color: white;
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
      }

      .assignee-reason {
        margin-top: 0.4rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-style: italic;
        line-height: 1.35;
      }

      /* Read-only summary of the parts of a suggestion that are not editable
         here: assignee, action and labels. Priority and the comment have their
         own controls. */
      .suggestion-summary {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: rgba(148, 163, 184, 0.06);
      }

      .suggestion-row {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: 0.5rem;
        font-size: 0.8rem;
        line-height: 1.4;
      }

      .suggestion-key {
        color: var(--text-muted);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        padding-top: 0.1rem;
      }

      .suggestion-value {
        color: var(--text-primary);
        word-break: break-word;
      }

      .suggestion-value.is-empty {
        color: var(--text-muted);
        font-style: italic;
      }

      .apply-status {
        margin-bottom: 0.6rem;
        font-size: 0.78rem;
        line-height: 1.4;
        padding: 0.5rem 0.65rem;
        border-radius: 6px;
        word-break: break-word;
      }

      .apply-status.is-ok {
        color: #86efac;
        background-color: rgba(34, 197, 94, 0.12);
      }

      .apply-status.is-error {
        color: #fca5a5;
        background-color: rgba(239, 68, 68, 0.12);
      }

      /* Main Workspace Layout */
      .workspace {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Left Sidebar: Issue List */
      .sidebar {
        width: 24rem;
        border-right: 1px solid var(--border-color);
        background-color: var(--bg-surface);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .search-container {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
      }

      .search-input {
        width: 100%;
        background-color: var(--bg-base);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .search-input:focus {
        border-color: var(--accent-primary);
      }

      .issue-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
      }

      .issue-item {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
        transition: background-color 0.2s ease;
        position: relative;
      }

      .issue-item:hover {
        background-color: var(--bg-surface-elevated);
      }

      .issue-item.active {
        background-color: var(--bg-surface-elevated);
        border-left: 3px solid var(--accent-primary);
        padding-left: calc(1rem - 3px);
      }

      .remaining-issues-item {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        background-color: rgba(66, 153, 225, 0.05); /* soft blue tint */
        color: var(--text-secondary);
        border-left: 3px solid rgba(66, 153, 225, 0.4);
        padding-left: calc(1rem - 3px);
      }

      .remaining-issues-content {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .remaining-icon {
        font-size: 1rem;
      }

      .remaining-text {
        font-weight: 500;
        color: var(--text-secondary);
      }

      .issue-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .issue-id {
        color: var(--text-muted);
        font-family: var(--font-display);
        font-size: 0.8rem;
        font-weight: 500;
      }

      .priority-badge {
        font-family: var(--font-display);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        text-transform: uppercase;
        color: #fff;
      }

      .badge-p0 {
        background-color: var(--color-p0);
      }
      .badge-p1 {
        background-color: var(--color-p1);
      }
      .badge-p2 {
        background-color: var(--color-p2);
      }
      .badge-p3 {
        background-color: var(--color-p3);
      }
      .badge-p4 {
        background-color: var(--color-p4);
      }
      .badge-none {
        background-color: var(--text-muted);
      }

      .issue-title {
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text-primary);
      }

      .issue-subtext {
        margin-top: 0.35rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .reviewed-icon {
        color: var(--accent-primary);
        font-size: 0.85rem;
        font-weight: 700;
        display: none;
      }

      .issue-item.reviewed .reviewed-icon {
        display: inline;
      }

      /* Middle Pane: Issue Detail */
      .detail-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: var(--bg-base);
      }

      .detail-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--border-color);
        background-color: var(--bg-surface);
        flex-shrink: 0;
      }

      .detail-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .detail-title {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .github-link {
        font-size: 0.8rem;
        color: var(--accent-primary);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        white-space: nowrap;
        margin-top: 0.35rem;
      }

      .github-link:hover {
        text-decoration: underline;
      }

      .detail-meta {
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .detail-body-container {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
      }

      .section-label {
        font-family: var(--font-display);
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
      }

      .issue-body {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1.5rem;
        line-height: 1.6;
        font-size: 0.925rem;
        margin-bottom: 2rem;
      }

      /* Markdown Styles */
      .issue-body p {
        margin-bottom: 1rem;
      }
      .issue-body p:last-child {
        margin-bottom: 0;
      }
      .issue-body code {
        background-color: rgba(255, 255, 255, 0.08);
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.85em;
      }
      .issue-body pre {
        background-color: #08090c;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        margin-bottom: 1rem;
        border: 1px solid var(--border-color);
      }
      .issue-body pre code {
        background-color: transparent;
        padding: 0;
        font-size: 0.85rem;
      }

      .comments-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .comment-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1rem 1.25rem;
      }

      .comment-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 0.35rem;
      }

      .comment-author {
        font-weight: 500;
        color: var(--text-primary);
      }

      .comment-body {
        font-size: 0.875rem;
        line-height: 1.5;
      }

      /* Right Pane: Triage Form */
      .triage-pane {
        width: 24rem;
        background-color: var(--bg-surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }

      /* Resizer Splitter Bar */
      .resizer {
        width: 4px;
        cursor: col-resize;
        background-color: var(--border-color);
        flex-shrink: 0;
        transition: background-color 0.15s ease;
        position: relative;
      }

      .resizer:hover,
      .resizer.dragging {
        background-color: var(--accent-primary);
        box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
      }

      .triage-pane-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
      }

      .triage-pane-title {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 600;
      }

      .triage-form {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      select,
      textarea,
      input[type='text'] {
        width: 100%;
        background-color: var(--bg-base);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.6rem;
        border-radius: 6px;
        font-family: var(--font-sans);
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s ease;
      }

      select:focus,
      textarea:focus,
      input[type='text']:focus {
        border-color: var(--accent-primary);
      }

      textarea {
        resize: vertical;
        min-height: 180px;
        line-height: 1.5;
        font-size: 0.85rem;
      }

      /* Label Checklist Multi-select */
      .triage-actions {
        padding: 1.5rem;
        border-top: 1px solid var(--border-color);
        background-color: var(--bg-surface);
        flex-shrink: 0;
      }

      .btn-block {
        width: 100%;
        padding: 0.75rem;
        font-weight: 600;
      }

      /* Empty state */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        text-align: center;
        color: var(--text-secondary);
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .empty-state h3 {
        font-family: var(--font-display);
        color: var(--text-primary);
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-container">
        <div class="brand-logo">A2</div>
        <h1>A2UI Issue Triage</h1>
      </div>
      <div class="global-actions">
        <button class="btn-secondary" onclick="abortTriage()">Abort</button>
        <button class="btn-primary" onclick="finishSession()">Finish</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Left: Issues List -->
      <aside class="sidebar">
        <div class="search-container">
          <input
            type="text"
            class="search-input"
            id="searchBar"
            placeholder="Search issues..."
            oninput="filterIssues()"
          />
        </div>
        <ul class="issue-list" id="issueListContainer">
          <!-- Issue items dynamically loaded -->
        </ul>
      </aside>

      <!-- Middle: Detailed View -->
      <main class="detail-pane" id="detailPane">
        <div class="empty-state">
          <div class="empty-state-icon">📥</div>
          <h3>No Issue Selected</h3>
          <p>Select an issue from the sidebar to review details and begin triaging.</p>
        </div>
      </main>

      <!-- Pane Resizer Splitter -->
      <div class="resizer" id="paneResizer" style="visibility: hidden"></div>

      <!-- Right: Triage Decisions Panel -->
      <aside class="triage-pane" id="triagePane" style="visibility: hidden">
        <div class="triage-pane-header">
          <h3 class="triage-pane-title">Triage Decisions</h3>
        </div>
        <div class="triage-form">
          <div class="form-group">
            <label for="triagePriority">Priority</label>
            <select id="triagePriority" onchange="updateActiveDecision('priority', this.value)">
              <option value="None">None</option>
              <option value="P0">P0 - Urgent (Assignee Required)</option>
              <option value="P1">P1 - High Priority (Active/Soon)</option>
              <option value="P2">P2 - Medium Priority (Upcoming)</option>
              <option value="P3">P3 - Low Priority (Community Help)</option>
              <option value="P4">P4 - Not a priority (stays open)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Suggestion</label>
            <div class="suggestion-summary">
              <div class="suggestion-row">
                <span class="suggestion-key">Assignee</span>
                <span class="suggestion-value" id="suggestionAssignee"></span>
              </div>
              <div class="suggestion-row">
                <span class="suggestion-key">Action</span>
                <span class="suggestion-value" id="suggestionAction"></span>
              </div>
              <div class="suggestion-row">
                <span class="suggestion-key">Labels</span>
                <span class="suggestion-value" id="suggestionLabels"></span>
              </div>
            </div>
            <div id="assigneeReason" class="assignee-reason" style="display: none"></div>
          </div>

          <div class="form-group">
            <label for="triageReply">Comment</label>
            <textarea
              id="triageReply"
              placeholder="Leave empty to apply without commenting..."
              oninput="updateActiveDecision('reply', this.value)"
            ></textarea>
          </div>
        </div>

        <div class="triage-actions">
          <div id="applyStatus" class="apply-status" style="display: none"></div>
          <button id="applyBtn" class="btn-primary btn-block" onclick="applyActiveIssue()">
            Apply to GitHub
          </button>
          <button
            id="discussBtn"
            class="btn-secondary btn-block"
            style="margin-top: 0.5rem"
            onclick="markActiveIssueInDiscussion()"
          >
            Add label 'status: in-discussion'
          </button>
        </div>
      </aside>
    </div>

    <script>
      let repoData = {repo: '', issues: []};
      let decisions = {}; // keyed by issue ID
      let activeIssueId = null;

      // The action is decided by the agent and shown read-only, so an unknown
      // value would otherwise be displayed verbatim and applied unchecked.
      // Suggestions are coerced to a known action on load.
      const ACTION_LABELS = {
        investigate: 'Keep open, mark for research',
        assign_and_fix: 'Keep open, assign to developer',
        backlog: 'Keep open, no active work planned',
        needs_info: 'Ask for info, apply status: waiting-for-user-response',
        close_duplicate: 'Close as duplicate',
        close_invalid: 'Close as invalid/spam',
        close_resolved: 'Close as resolved/answered',
      };

      const VALID_ACTIONS = Object.keys(ACTION_LABELS);

      const formatDate = dateStr => {
        if (!dateStr) return 'N/A';
        const date = new Date(dateStr);
        return date.toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      };

      // Labels in the repository, populated dynamically from data on load
      const standardLabels = [];

      async function loadIssues() {
        try {
          const res = await fetch('/api/comments');
          if (!res.ok) throw new Error('Failed to fetch issue data');
          repoData = await res.json();

          // Dynamically override standard labels list with real repo labels if available,
          // filtering out priority labels (P0-P4) since they are managed via the priority
          // dropdown, and 'status: needs-triage', which is owned by scripts/triage.mjs and
          // reconciled on every run — setting it by hand here would have no lasting effect.
          if (Array.isArray(repoData.labels) && repoData.labels.length > 0) {
            const filteredLabels = repoData.labels.filter(
              label => !/^[Pp][0-4]$/.test(label) && label !== 'status: needs-triage',
            );
            standardLabels.splice(0, standardLabels.length, ...filteredLabels);
          }

          // Pre-populate decisions object with AI suggestions
          repoData.issues.forEach(issue => {
            const existingAssignees = Array.isArray(issue.assignees) ? issue.assignees : [];
            const initialAssignees =
              existingAssignees.length > 0
                ? existingAssignees
                : issue.suggestions.assignee
                  ? issue.suggestions.assignee
                      .split(',')
                      .map(a => a.trim())
                      .filter(Boolean)
                  : [];

            decisions[issue.id] = {
              id: issue.id,
              applied: false,
              inDiscussion: false,
              pending: false,
              error: '',
              priority: issue.suggestions.priority || 'None',
              assignee: initialAssignees,
              action: VALID_ACTIONS.includes(issue.suggestions?.action)
                ? issue.suggestions.action
                : 'investigate',
              labels: issue.suggestions.labels || [],
              reply: issue.suggestions.reply || '',
            };
          });

          renderIssueList();
        } catch (err) {
          console.error(err);
          document.getElementById('detailPane').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" style="color: var(--color-p0);">⚠️</div>
            <h3>Failed to Load Issues</h3>
            <p>${err.message}</p>
          </div>`;
        }
      }

      function renderIssueList() {
        const container = document.getElementById('issueListContainer');
        container.innerHTML = '';

        repoData.issues.forEach(issue => {
          const dec = decisions[issue.id];
          const pClass =
            dec.priority !== 'None' ? `badge-${dec.priority.toLowerCase()}` : 'badge-none';

          const li = document.createElement('li');
          li.className = `issue-item ${dec.applied || dec.inDiscussion ? 'reviewed' : ''} ${issue.id === activeIssueId ? 'active' : ''}`;
          li.id = `issue-item-${issue.id}`;
          li.onclick = () => selectIssue(issue.id);

          li.innerHTML = `
          <div class="issue-meta">
            <span class="issue-id">#${issue.id}</span>
            <span class="priority-badge ${pClass}" id="list-priority-badge-${issue.id}">${dec.priority}</span>
          </div>
          <div class="issue-title">${issue.title}</div>
          <div class="issue-subtext">
            <span>@${issue.author}</span>
            <span class="reviewed-icon">✓ Reviewed</span>
          </div>
        `;
          container.appendChild(li);
        });

        // Append remaining backlog info card if there are more issues
        if (repoData.total_issues_count && repoData.total_issues_count > repoData.issues.length) {
          const remaining = repoData.total_issues_count - repoData.issues.length;
          const li = document.createElement('li');
          li.className = 'remaining-issues-item';
          li.innerHTML = `
          <div class="remaining-issues-content">
            <span class="remaining-icon">ℹ️</span>
            <span class="remaining-text">${remaining} more issue${remaining > 1 ? 's' : ''} to be reviewed after these</span>
          </div>
        `;
          container.appendChild(li);
        }
      }

      function selectIssue(id) {
        activeIssueId = id;
        renderIssueList(); // refresh active highlight

        const issue = repoData.issues.find(i => i.id === id);
        const dec = decisions[id];

        // Render Details
        const detailPane = document.getElementById('detailPane');
        const cleanBody = DOMPurify.sanitize(
          marked.parse(issue.body || '*No description provided.*'),
        );

        let commentsHtml = '';
        if (issue.comments && issue.comments.length > 0) {
          commentsHtml = `
          <div class="section-label" style="margin-top: 2rem;">Comments (${issue.comments.length})</div>
          <div class="comments-container">
            ${issue.comments
              .map(
                c => `
              <div class="comment-card">
                <div class="comment-meta">
                  <span class="comment-author">@${c.author}</span>
                </div>
                <div class="comment-body">${DOMPurify.sanitize(marked.parse(c.body))}</div>
              </div>
            `,
              )
              .join('')}
          </div>
        `;
        } else {
          commentsHtml = `
          <div class="section-label" style="margin-top: 2rem;">Comments</div>
          <p style="font-size: 0.875rem; color: var(--text-muted); italic">No comments on this issue yet.</p>
        `;
        }

        detailPane.innerHTML = `
        <div class="detail-header">
          <div class="detail-title-row">
            <h2 class="detail-title">${issue.title}</h2>
          </div>
          <div class="detail-meta" style="margin-bottom: 0.5rem;">
            Opened by <strong>@${issue.author}</strong> • 
            <a class="github-link" href="https://github.com/${repoData.repo}/issues/${issue.id}" target="_blank">
              View on GitHub ↗
            </a>
          </div>
          <div class="detail-dates" style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 1.5rem; display: flex; gap: 16px;">
            <span>Opened: <strong>${formatDate(issue.createdAt)}</strong></span>
            <span>Last modified: <strong>${formatDate(issue.updatedAt || issue.createdAt)}</strong></span>
          </div>
        </div>
        <div class="detail-body-container">
          <div class="section-label">Description</div>
          <div class="issue-body">${cleanBody}</div>
          ${commentsHtml}
        </div>
      `;

        // Pre-fill Form Controls on Right
        document.getElementById('triagePane').style.visibility = 'visible';
        document.getElementById('paneResizer').style.visibility = 'visible';
        document.getElementById('triagePriority').value = dec.priority;

        // The parts of the suggestion that are not editable here are shown as
        // read-only text; only priority and the comment can be changed.
        renderSuggestionSummary(dec);

        // Populate suggested assignee reason if present
        const reasonEl = document.getElementById('assigneeReason');
        if (reasonEl) {
          const reason = issue.suggestions && issue.suggestions.assignee_reason;
          if (reason) {
            reasonEl.textContent = reason;
            reasonEl.style.display = 'block';
          } else {
            reasonEl.textContent = '';
            reasonEl.style.display = 'none';
          }
        }

        document.getElementById('triageReply').value = dec.reply;

        updateApplyButton(dec);
      }

      function renderSuggestionSummary(dec) {
        const set = (id, value) => {
          const el = document.getElementById(id);
          el.textContent = value || 'None';
          el.classList.toggle('is-empty', !value);
        };

        const assignees = Array.isArray(dec.assignee) ? dec.assignee : [];
        set('suggestionAssignee', assignees.map(a => '@' + a).join(', '));
        set('suggestionAction', ACTION_LABELS[dec.action] || dec.action);
        set('suggestionLabels', (dec.labels || []).join(', '));
      }

      function updateActiveDecision(field, value) {
        if (!activeIssueId) return;
        decisions[activeIssueId][field] = value;

        // Dynamically update priority badge in sidebar list
        if (field === 'priority') {
          const badge = document.getElementById(`list-priority-badge-${activeIssueId}`);
          if (badge) {
            badge.textContent = value;
            badge.className = `priority-badge ${value !== 'None' ? `badge-${value.toLowerCase()}` : 'badge-none'}`;
          }
        }
      }

      function setApplyStatus(message, kind) {
        const el = document.getElementById('applyStatus');
        if (!message) {
          el.style.display = 'none';
          el.textContent = '';
          return;
        }
        el.textContent = message;
        el.className = `apply-status is-${kind}`;
        el.style.display = 'block';
      }

      // Both dispositions are final: the writes already reached GitHub, so the
      // buttons lock rather than offering an undo the dashboard cannot perform.
      function updateApplyButton(dec) {
        const applyBtn = document.getElementById('applyBtn');
        const discussBtn = document.getElementById('discussBtn');
        const settled = Boolean(dec.applied) || Boolean(dec.inDiscussion);

        applyBtn.disabled = settled || Boolean(dec.pending);
        discussBtn.disabled = settled || Boolean(dec.pending);

        applyBtn.textContent = dec.applied
          ? 'Applied'
          : dec.pending === 'apply'
            ? 'Applying…'
            : 'Apply to GitHub';
        applyBtn.className = dec.applied ? 'btn-secondary btn-block' : 'btn-primary btn-block';

        discussBtn.textContent = dec.inDiscussion
          ? "Marked 'status: in-discussion'"
          : dec.pending === 'discuss'
            ? 'Adding label…'
            : "Add label 'status: in-discussion'";

        if (dec.applied) {
          setApplyStatus(`#${dec.id} applied to GitHub.`, 'ok');
        } else if (dec.inDiscussion) {
          setApplyStatus(`#${dec.id} parked for team discussion.`, 'ok');
        } else if (dec.pending) {
          setApplyStatus('', null);
        } else {
          setApplyStatus(dec.error || '', dec.error ? 'error' : null);
        }
      }

      // Shared by both buttons: POST one issue, record the outcome on the
      // decision, and move on only when GitHub confirmed the write.
      async function postIssueDisposition(endpoint, mode, body, onSuccess) {
        if (!activeIssueId) return;
        const dec = decisions[activeIssueId];
        if (dec.applied || dec.inDiscussion || dec.pending) return;

        dec.pending = mode;
        dec.error = '';
        updateApplyButton(dec);

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body(dec)),
          });

          if (!res.ok) {
            const payload = await res.json().catch(() => ({}));
            throw new Error(payload.error || `Request failed with status ${res.status}`);
          }

          onSuccess(dec);
          const item = document.getElementById(`issue-item-${activeIssueId}`);
          if (item) item.classList.add('reviewed');
        } catch (err) {
          dec.error = `Not applied: ${err.message}`;
        } finally {
          dec.pending = false;
          updateApplyButton(dec);
        }

        if (dec.applied || dec.inDiscussion) advanceToNextUnsettled();
      }

      async function applyActiveIssue() {
        await postIssueDisposition(
          '/api/apply',
          'apply',
          // The server applies one decision at a time; assignees go over as the
          // comma-separated string the gh CLI expects.
          dec => ({
            ...dec,
            assignee: Array.isArray(dec.assignee) ? dec.assignee.join(',') : dec.assignee || '',
          }),
          dec => {
            dec.applied = true;
          },
        );
      }

      async function markActiveIssueInDiscussion() {
        await postIssueDisposition(
          '/api/discuss',
          'discuss',
          dec => ({id: dec.id}),
          dec => {
            dec.inDiscussion = true;
          },
        );
      }

      function advanceToNextUnsettled() {
        const order = repoData.issues;
        const currentIndex = order.findIndex(issue => issue.id === activeIssueId);
        const rotated = order.slice(currentIndex + 1).concat(order.slice(0, currentIndex));
        const nextIssue = rotated.find(
          issue => !decisions[issue.id].applied && !decisions[issue.id].inDiscussion,
        );

        if (nextIssue) {
          selectIssue(nextIssue.id);
        } else {
          alert("Every issue has been handled. Click 'Finish' to close the session.");
        }
      }

      function filterIssues() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        repoData.issues.forEach(issue => {
          const li = document.getElementById(`issue-item-${issue.id}`);
          if (li) {
            const match =
              issue.title.toLowerCase().includes(q) || issue.author.toLowerCase().includes(q);
            li.style.display = match ? 'block' : 'none';
          }
        });
      }

      function renderSummaryPage(decisionList) {
        const triaged = decisionList.filter(d => d.applied);
        const unchanged = decisionList.filter(d => !d.applied);

        const getIssueDetails = id => {
          const issue = repoData.issues.find(i => i.id === id);
          return issue
            ? {title: issue.title, author: issue.author}
            : {title: `Issue #${id}`, author: ''};
        };

        let triagedCardsHtml = '';
        if (triaged.length > 0) {
          triagedCardsHtml = triaged
            .map(d => {
              const details = getIssueDetails(d.id);
              const pClass =
                d.priority !== 'None' ? `badge-${d.priority.toLowerCase()}` : 'badge-none';

              const actionText = ACTION_LABELS[d.action] || d.action;

              return `
            <div style="
              background-color: #15171e;
              border: 1px solid #2b2f3d;
              border-radius: 8px;
              padding: 1rem;
              display: flex;
              flex-direction: column;
              gap: 0.5rem;
              text-align: left;
            ">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                <h4 style="font-size: 0.925rem; font-weight: 500; font-family: 'Outfit', sans-serif;">
                  <a href="https://github.com/${repoData.repo}/issues/${d.id}" target="_blank" style="color: #f3f4f6; text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;">
                    <span style="color: #818cf8; font-family: monospace;">#${d.id}</span> ${details.title}
                    <span style="font-size: 0.75rem; color: #6b7280;">↗</span>
                  </a>
                </h4>
                <span class="priority-badge ${pClass}">${d.priority}</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 0.75rem; margin-top: 0.25rem;">
                <span style="background-color: #1e212b; border: 1px solid #2b2f3d; padding: 0.15rem 0.4rem; border-radius: 4px; color: #9ca3af;">
                  Assignee: <strong>${(() => {
                    const list = Array.isArray(d.assignee)
                      ? d.assignee
                      : d.assignee
                        ? d.assignee.split(',')
                        : [];
                    return list.length > 0
                      ? list
                          .map(login => {
                            const found = repoData.assignees.find(a => a.login === login);
                            return found && found.name ? `${found.name} (@${login})` : `@${login}`;
                          })
                          .join(', ')
                      : 'None';
                  })()}</strong>
                </span>
                <span style="background-color: #1e212b; border: 1px solid #2b2f3d; padding: 0.15rem 0.4rem; border-radius: 4px; color: #9ca3af;">
                  Action: <strong>${actionText}</strong>
                </span>
              </div>
              ${
                d.reply
                  ? `
                <div style="
                  background-color: #0d0e12;
                  border-radius: 4px;
                  padding: 0.5rem 0.75rem;
                  font-size: 0.8rem;
                  color: #9ca3af;
                  margin-top: 0.25rem;
                  border-left: 2px solid #6366f1;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
                ">
                  "${d.reply}"
                </div>
              `
                  : ''
              }
            </div>
          `;
            })
            .join('');
        } else {
          triagedCardsHtml = `<p style="font-size: 0.875rem; color: #6b7280; font-style: italic; text-align: left;">No issues were applied in this session.</p>`;
        }

        let unchangedCardsHtml = '';
        if (unchanged.length > 0) {
          unchangedCardsHtml = unchanged
            .map(d => {
              const details = getIssueDetails(d.id);
              return `
            <div style="
              background-color: #15171e;
              border: 1px solid #2b2f3d;
              border-radius: 8px;
              padding: 0.85rem 1rem;
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 1rem;
              text-align: left;
            ">
              <h4 style="font-size: 0.9rem; font-weight: 500; font-family: 'Outfit', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">
                <a href="https://github.com/${repoData.repo}/issues/${d.id}" target="_blank" style="color: #9ca3af; text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;">
                  <span style="color: #6b7280; font-family: monospace;">#${d.id}</span> ${details.title}
                  <span style="font-size: 0.75rem; color: #6b7280;">↗</span>
                </a>
              </h4>
              <span style="
                font-family: 'Outfit', sans-serif;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 0.15rem 0.4rem;
                border-radius: 4px;
                background-color: #2b2f3d;
                color: #9ca3af;
                text-transform: uppercase;
              ">Unchanged</span>
            </div>
          `;
            })
            .join('');
        } else {
          unchangedCardsHtml = `<p style="font-size: 0.875rem; color: #6b7280; font-style: italic; text-align: left;">Every issue was applied.</p>`;
        }

        document.body.innerHTML = `
        <div style="
          min-height: 100vh;
          background-color: #0d0e12;
          color: #f3f4f6;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 3rem 2rem;
          overflow-y: auto;
        ">
          <!-- Header -->
          <div style="text-align: center; margin-bottom: 2.5rem; max-width: 36rem;">
            <div style="font-size: 4.5rem; margin-bottom: 1rem; line-height: 1;">🎉</div>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Triage Submitted!</h2>
            <p style="color: #9ca3af; font-family: 'Inter', sans-serif; font-size: 0.95rem; line-height: 1.5;">The local server has been shut down. You can now safely close this browser tab. A summary of your triage actions is shown below.</p>
          </div>
          
          <!-- Summary Content Grid -->
          <div style="width: 100%; max-width: 48rem; display: flex; flex-direction: column; gap: 2.5rem;">
            
            <!-- Section 1: Applied Changes -->
            <div>
              <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #818cf8; border-bottom: 1px solid #2b2f3d; padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <span>Applied to GitHub</span>
                <span style="font-size: 0.8rem; background-color: rgba(99, 102, 241, 0.15); padding: 0.1rem 0.5rem; border-radius: 12px; color: #a5b4fc;">${triaged.length}</span>
              </h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${triagedCardsHtml}
              </div>
            </div>
            
            <!-- Section 2: Left Unchanged -->
            <div>
              <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; border-bottom: 1px solid #2b2f3d; padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <span>Left Unchanged</span>
                <span style="font-size: 0.8rem; background-color: rgba(156, 163, 175, 0.15); padding: 0.1rem 0.5rem; border-radius: 12px; color: #d1d5db;">${unchanged.length}</span>
              </h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${unchangedCardsHtml}
              </div>
            </div>
            
          </div>
        </div>
      `;
      }

      async function finishSession() {
        // Map assignee array back to comma-separated string
        const decisionList = Object.values(decisions).map(d => ({
          ...d,
          assignee: Array.isArray(d.assignee) ? d.assignee.join(',') : d.assignee || '',
        }));

        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({decisions: decisionList}),
          });
          if (!res.ok) throw new Error('Failed to save triage decisions');

          renderSummaryPage(Object.values(decisions));
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }

      async function abortTriage() {
        if (
          confirm(
            'Abort the triage session? Issues you already applied stay applied on GitHub; ' +
              'any edits not yet applied are lost.',
          )
        ) {
          try {
            // Render the aborted page immediately
            document.body.innerHTML = `
            <div style="
              height: 100vh;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              background-color: #0d0e12;
              color: #f3f4f6;
              font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
              text-align: center;
              padding: 2rem;
            ">
              <div style="font-size: 4rem; margin-bottom: 1rem;">🛑</div>
              <h2 style="font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Triage Session Aborted</h2>
              <p style="color: #9ca3af; font-size: 0.95rem; max-width: 24rem; line-height: 1.5; font-family: sans-serif;">The local server has been shut down. You can now safely close this browser tab.</p>
            </div>
          `;
            // Notify the backend to exit
            await fetch('/api/abort', {method: 'POST'});
          } catch (err) {
            console.error(err);
          }
        }
      }

      // Draggable Splitter/Resizer Logic
      function initResizer() {
        const resizer = document.getElementById('paneResizer');
        const triagePane = document.getElementById('triagePane');

        const savedWidth = localStorage.getItem('triagePaneWidth');
        if (savedWidth) {
          triagePane.style.width = savedWidth;
        }

        let startX = 0;
        let startWidth = 0;

        resizer.addEventListener('mousedown', e => {
          e.preventDefault();
          startX = e.clientX;
          startWidth = triagePane.getBoundingClientRect().width;

          resizer.classList.add('dragging');

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
          const dx = e.clientX - startX;
          let newWidth = startWidth - dx;

          if (newWidth < 280) newWidth = 280;
          if (newWidth > 600) newWidth = 600;

          triagePane.style.width = `${newWidth}px`;
        }

        function onMouseUp() {
          resizer.classList.remove('dragging');
          localStorage.setItem('triagePaneWidth', triagePane.style.width);

          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        }
      }

      // Initialize
      window.onload = () => {
        loadIssues();
        initResizer();
      };
    </script>
  </body>
</html>
