version: "0.1"
templateId: TeamMemberKnowledgePanel
description: Card showing competency panel with user experience years and completed task count.

parameters:
  userName:
    type: string
    title: User Display Name
    description: The full name of the team member.
  role:
    type: string
    title: Role Name
    description: The operational role of the team member.
  experienceYears:
    type: integer
    title: Years of Experience
    description: The number of years of professional experience.
    minimum: 0
  completedTasks:
    type: integer
    title: Completed Tasks Count
    description: The count of completed tasks or tickets.
    minimum: 0

layout:
  component: Card
  child:
    component: Column
    children:
      - component: Row
        align: center
        children:
          - component: Icon
            name: check
          - component: Text
            text: "Competency: ${userName}"
            variant: h4
      - component: Divider
        axis: horizontal
      - component: Row
        justify: spaceBetween
        children:
          - component: Column
            align: center
            children:
              - component: Text
                text: Role
                variant: caption
              - component: Text
                text: ${role}
                variant: body
          - component: Column
            align: center
            children:
              - component: Text
                text: Experience
                variant: caption
              - component: Text
                text: "${experienceYears} Yrs"
                variant: body
          - component: Column
            align: center
            children:
              - component: Text
                text: Tasks
                variant: caption
              - component: Text
                text: "${completedTasks} Done"
                variant: body
      - component: Text
        text: Verified Core Contributor
        variant: caption

sampleData:
  userName: Alice Smith
  role: Systems Architect
  experienceYears: 9
  completedTasks: 142
