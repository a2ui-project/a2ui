edition = "2023";

package a2ui.v1_0;

import "google/protobuf/struct.proto";

option go_package = "a2ui.org/specification/v1_0/proto/a2uiproto";
option java_multiple_files = true;
option java_package = "org.a2ui.v1_0";

// RendererDataModel conveys the data models for all active surfaces for synchronization.
message RendererDataModel {
  // The protocol version (e.g. "v1.0").
  string version = 1;
  // Map of surface IDs to their current root data models.
  map<string, google.protobuf.Struct> surfaces = 2;
}
