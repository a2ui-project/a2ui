edition = "2023";

package a2ui.v1_0;

import "agent_to_renderer.proto";

option go_package = "a2ui.org/specification/v1_0/proto/a2uiproto";
option java_multiple_files = true;
option java_package = "org.a2ui.v1_0";

// CatalogSample demonstrates A2UI components and messages in a self-contained sample.
message CatalogSample {
  // Display name of the sample.
  string name = 1;
  // Description of what the sample demonstrates.
  string description = 2;
  // Ordered sequence of Agent-to-Renderer messages for the sample.
  repeated AgentToRendererMessage messages = 3;
}
