edition = "2023";

package a2ui.v1_0;

import "renderer_to_agent_list.proto";

option go_package = "a2ui.org/specification/v1_0/proto/a2uiproto";
option java_multiple_files = true;
option java_package = "org.a2ui.v1_0";

// RendererToAgentListWrapper wraps a list of Renderer-to-Agent messages for transports requiring a top-level object.
message RendererToAgentListWrapper {
  // Wrapped list of Renderer-to-Agent messages.
  RendererToAgentMessageList messages = 1;
}
