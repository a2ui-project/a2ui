- name: test_inline_item_loop_unrolling
  description: Verifies inline component layout unrolling for each element of an array.
  action: expand_template
  template:
    version: "0.1"
    templateId: MemberList
    parameters:
      members:
        type: array
    layout:
      component: Column
      children:
        loop:
          param: members
          as: m
          item:
            component: Row
            children:
              - component: Text
                text: ${m.name}
    catalogs:
      - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
    name: MemberList
  instance_id: team_col
  template_id: MemberList
  args:
    members:
      - name: Alice
      - name: Bob
  expect:
    - id: team_col
      component: Column
      children:
        - team_col_item_0
        - team_col_item_1
    - id: team_col_item_0
      component: Row
      children:
        - team_col_item_0_child_0_text
    - id: team_col_item_0_child_0_text
      component: Text
      text: Alice
    - id: team_col_item_1
      component: Row
      children:
        - team_col_item_1_child_0_text
    - id: team_col_item_1_child_0_text
      component: Text
      text: Bob
- name: test_named_template_loop_unrolling
  description: Verifies unrolling an array by invoking another registered template
    for each element.
  action: expand_template
  templates:
    - version: "0.1"
      templateId: TagBadge
      parameters:
        label:
          type: string
      layout:
        component: Text
        text: "#${label}"
      catalogs:
        - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
      name: TagBadge
    - version: "0.1"
      templateId: TagContainer
      parameters:
        tags:
          type: array
      layout:
        component: Row
        children:
          loop:
            param: tags
            template: TagBadge
      catalogs:
        - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
      name: TagContainer
  instance_id: row_tags
  template_id: TagContainer
  args:
    tags:
      - label: alpha
      - label: beta
  expect:
    - id: row_tags
      component: Row
      children:
        - row_tags_item_0
        - row_tags_item_1
    - id: row_tags_item_0
      component: Text
      text: "#alpha"
    - id: row_tags_item_1
      component: Text
      text: "#beta"
- name: test_empty_loop_array_emits_empty_children
  description: Verifies that an empty array parameter unrolls cleanly to empty children
    list.
  action: expand_template
  template:
    version: "0.1"
    templateId: EmptyListChecker
    parameters:
      items:
        type: array
    layout:
      component: Column
      children:
        loop:
          param: items
          item:
            component: Text
            text: Item
    catalogs:
      - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
    name: EmptyListChecker
  instance_id: empty_col
  template_id: EmptyListChecker
  args:
    items: []
  expect:
    - id: empty_col
      component: Column
      children: []
- name: test_primitive_list_iteration
  description: Verifies iterating over primitive strings in an array using item.value
    fallback.
  action: expand_template
  template:
    version: "0.1"
    templateId: ColorChips
    parameters:
      colors:
        type: array
    layout:
      component: Row
      children:
        loop:
          param: colors
          as: c
          item:
            component: Text
            text: ${c.value}
    catalogs:
      - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
    name: ColorChips
  instance_id: chip_row
  template_id: ColorChips
  args:
    colors:
      - Crimson
      - Azure
  expect:
    - id: chip_row
      component: Row
      children:
        - chip_row_item_0
        - chip_row_item_1
    - id: chip_row_item_0
      component: Text
      text: Crimson
    - id: chip_row_item_1
      component: Text
      text: Azure
- name: test_non_array_loop_parameter_raises_error
  description: Verifies that passing a non-array string value to a loop raises a clear
    ValidationError.
  action: expand_template
  template:
    version: "0.1"
    templateId: FailingLoop
    parameters:
      items:
        type: array
    layout:
      component: Column
      children:
        loop:
          param: items
          item:
            component: Text
            text: Fail
    catalogs:
      - https://a2ui.org/specification/v0_9_1/catalogs/basic/catalog.json
    name: FailingLoop
  instance_id: fail_inst
  template_id: FailingLoop
  args:
    items: not_an_array
  expect_error:
    category: ValidationError
    message: failed validation
