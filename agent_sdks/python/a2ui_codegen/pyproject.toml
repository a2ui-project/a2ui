[project]
name = "a2ui-codegen"
version = "0.1.0"
description = "A2UI Typesafe API Generator CLI and Code Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2ui-core>=0.1.1",
    "jsonschema>=4.20.0",
    "pydantic>=2.10.0",
    "referencing>=0.35.0",
]

[project.scripts]
a2ui-codegen = "a2ui.codegen.cli:main"

[tool.uv.sources]
a2ui-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
