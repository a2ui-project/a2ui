name: a2ui_flutter
description: Flutter framework adapter for the A2UI protocol.
version: 0.11.0-wip001
repository: https://github.com/a2ui-project/a2ui/tree/main/dart/a2ui_flutter

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.7"

resolution: workspace

dependencies:
  a2ui_core: ^0.2.0
  audioplayers: ^6.6.0
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.5
  genai_primitives: ^0.2.3
  intl: ^0.20.2
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  meta: ^1.17.0
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  video_player: ^2.11.1
  video_player_win: ^3.2.2

dev_dependencies:
  async: ^2.13.0
  build: ^4.0.7
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  test: ^1.26.2
