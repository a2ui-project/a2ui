name: a2ui_flutter
description: Flutter framework adapter for A2UI.
version: 0.1.0
repository: https://github.com/a2ui-project/a2ui/tree/main/dart/a2ui_flutter
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  a2ui_core: ^0.2.2
  flutter:
    sdk: flutter
  path_parsing: ^1.1.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_schema_builder: ^0.1.7
  video_player_platform_interface: ^6.9.0
