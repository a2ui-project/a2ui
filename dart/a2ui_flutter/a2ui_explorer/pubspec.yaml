name: a2ui_explorer
description: The gallery app of the A2UI Flutter renderer.
publish_to: "none"

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  a2ui_core:
    path: ../../a2ui_core
  a2ui_flutter:
    path: ..
  flutter:
    sdk: flutter
  json_schema_builder: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
