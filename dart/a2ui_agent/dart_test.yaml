tags:
  # Tests that time an operation, such as the shared scaling suites. A slow
  # or loaded machine can fail them, so they are skipped unless the
  # `performance` preset is selected, which runs only them, one test file at
  # a time: `dart test -P performance`.
  performance:
    skip: "Timing test, run with `dart test -P performance`."
    presets: {performance: {skip: false}}

presets:
  performance:
    include_tags: performance
    concurrency: 1
