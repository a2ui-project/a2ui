- name: test_preserve_non_macro_components
  description: Verifies standard primitive components in a message envelope are untouched while macros expand.
  macros:
    - name: SimpleBadge
      parameters:
        label:
          type: string
      template:
        component: Text
        text: "${label}"
  input_messages:
    - surfaceUpdate:
        surfaceId: main
        components:
          - component: Button
            id: btn_primary
            title: Submit
          - component: SimpleBadge
            id: badge_1
            label: New
          - component: Divider
            id: div_1
  expected_messages:
    - surfaceUpdate:
        surfaceId: main
        components:
          - component: Button
            id: btn_primary
            title: Submit
          - component: Text
            id: badge_1
            text: New
          - component: Divider
            id: div_1

- name: test_expand_macro_with_default_parameter
  description: Verifies macro expansion uses parameter default value when parameter is omitted in invocation.
  macros:
    - name: AlertBox
      parameters:
        title:
          type: string
        level:
          type: string
          default: info
      template:
        component: Card
        child:
          component: Text
          text: "${title} [${level}]"
  input_messages:
    - surfaceUpdate:
        surfaceId: main
        components:
          - component: AlertBox
            id: alert_notice
            title: System Maintenance
  expected_messages:
    - surfaceUpdate:
        surfaceId: main
        components:
          - component: Text
            id: alert_notice__text_1
            text: "System Maintenance [info]"
          - component: Card
            id: alert_notice
            child: alert_notice__text_1
