- name: test_codegen_catalog_with_functions
  description: Tests generating catalog function wrappers with FunctionCall return values.
  catalog_schema:
    catalogId: fn_catalog
    components:
      LinkButton:
        properties:
          title:
            type: string
        required: [title]
    functions:
      openUrl:
        description: Opens a URL in the browser.
        properties:
          call:
            const: openUrl
          args:
            type: object
            properties:
              url:
                type: string
                description: Destination URL.
              target:
                type: string
                description: Window target.
            required: [url]
        required: [call, args]
  args: ["codegen", "--catalog", "${CATALOG_PATH}", "--out", "${OUT_DIR}"]
  expect:
    exit_code: 0
    files:
      fn_catalog.py:
        content_contains:
          - "class LinkButton(ComponentBuilderNode):"
          - "def open_url(*, url: str, target: Optional[str] = None, call_id: Optional[str] = None) -> FunctionCall:"
          - 'r"""Opens a URL in the browser."""'
          - 'return FunctionCall(call="openUrl", args=args, call_id=call_id)'
          - '"open_url"'

