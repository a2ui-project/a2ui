# ==============================================================================
# A2UI CLI Codegen Conformance Test Suite
# ==============================================================================

- name: test_cli_help
  description: Verifies top-level CLI help text and registered commands.
  args: ["--help"]
  expect:
    exit_code: 0
    stdout_contains:
      - "Usage: a2ui [options] [command]"
      - "codegen"
      - "Generates typesafe A2UI component libraries"

- name: test_cli_codegen_help
  description: Verifies codegen command help text, flags, and option descriptions.
  args: ["codegen", "--help"]
  expect:
    exit_code: 0
    stdout_contains:
      - "Usage: a2ui codegen [options]"
      - "-c, --catalog <path>"
      - "-o, --out <dir>"
      - "--lang <language>"
      - "--base-import <module>"
      - "--catalog-name <name>"

- name: test_cli_missing_required_catalog_flag
  description: Verifies error reporting when the mandatory --catalog option is missing.
  args: ["codegen", "--out", "${OUT_DIR}"]
  expect:
    exit_code: 1
    stderr_contains:
      - "required option '-c, --catalog <path>' not specified"

- name: test_cli_missing_required_out_flag
  description: Verifies error reporting when the mandatory --out option is missing.
  catalog_schema:
    catalogId: test_catalog
    components: {}
  args: ["codegen", "--catalog", "${CATALOG_PATH}"]
  expect:
    exit_code: 1
    stderr_contains:
      - "required option '-o, --out <dir>' not specified"

- name: test_cli_nonexistent_catalog_file
  description: Verifies error reporting when the specified catalog file does not exist.
  args: ["codegen", "--catalog", "nonexistent/catalogs/catalog.json", "--out", "${OUT_DIR}"]
  expect:
    exit_code: 1
    stderr_contains:
      - "Error: Catalog file not found at:"

- name: test_cli_malformed_json_catalog
  description: Verifies error reporting when the catalog file contains malformed JSON.
  raw_catalog_content: "{ invalid_json: [,"
  args: ["codegen", "--catalog", "${CATALOG_PATH}", "--out", "${OUT_DIR}"]
  expect:
    exit_code: 1
    stderr_contains:
      - "Error reading or parsing catalog JSON:"

