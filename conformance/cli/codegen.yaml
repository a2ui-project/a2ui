- name: test_codegen_catalog_with_functions
  description: Tests generating catalog function wrappers with FunctionCall return values.
  catalog_schema:
    catalogId: fn_catalog
    components:
      LinkButton:
        properties:
          title:
            type: string
        required: [title]
    functions:
      openUrl:
        description: Opens a URL in the browser.
        properties:
          call:
            const: openUrl
          args:
            type: object
            properties:
              url:
                type: string
                description: Destination URL.
              target:
                type: string
                description: Window target.
            required: [url]
        required: [call, args]
  args: ["codegen", "--catalog", "${CATALOG_PATH}", "--out", "${OUT_DIR}"]
  expect:
    exit_code: 0
    files:
      fn_catalog.py:
        content_contains:
          - "class LinkButton(ComponentBuilderNode):"
          - "class OpenUrl(FunctionCall):"
          - "def __init__(self, *, url: str, target: Optional[str] = None, **kwargs: Any):"
          - 'super().__init__(call="openUrl", args=args, **kwargs)'
          - 'r"""Opens a URL in the browser."""'
          - '"OpenUrl"'
        content_not_contains:
          - "call_id"
          # A catalog function has one spelling: its class. No lowercase
          # factory is emitted beside it.
          - "def open_url("
          - '"open_url"'

