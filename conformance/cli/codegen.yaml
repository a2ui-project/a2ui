- name: test_codegen_official_basic_catalog
  description: Tests generating code from the authoritative official basic catalog schema file.
  args:
    - "codegen"
    - "-c"
    - "${REPO_ROOT}/specification/v0_9_1/catalogs/basic/catalog.json"
    - "-o"
    - "${OUT_DIR}"
  expect:
    exit_code: 0
    files:
      basic.py:
        content_contains:
          - '"""Type-safe A2UI builders for basic (version v0.9.1).'
          - "class Button(ComponentBuilderNode):"
          - "class Card(ComponentBuilderNode):"
          - "class Column(ComponentBuilderNode):"
          - "class Row(ComponentBuilderNode):"
          - "class Text(ComponentBuilderNode):"
          - "class Modal(ComponentBuilderNode):"
          - "class ChoicePicker(ComponentBuilderNode):"
          # Enums stay strict Literals, opened only by the OPEN_ENUM metadata.
          # Long aliases wrap at 88 columns, so assert the pieces.
          - "TextVariant = Annotated["
          - 'Literal["h1", "h2", "h3", "h4", "h5", "caption", "body"], OPEN_ENUM'
          # Child slots drive flattening; there is no separate traversal.
          - "child: Child"
          - "children: ChildList"
          # Checkable components expose their validation rules.
          - "checks: Optional[Sequence[CheckRule]] = None"
          # accessibility resolves through the shared common_types ref.
          - "accessibility: Optional[AccessibilityAttributes] = None"
          # Inline object schemas become named models, named after their parent
          # unless the parent is already the singular of the property.
          - "class TabItem(BuilderBaseModel):"
          - "class ChoicePickerOption(BuilderBaseModel):"
          - "tabs: Sequence[TabItem]"
          - "options: Sequence[ChoicePickerOption]"
          # Every oneOf branch survives, including Icon.name's custom SVG form.
          - "name: IconName | IconNameSvgPath | DataBinding | FunctionCall"
          # Wire names that differ from the Python name carry an alias.
          - 'serialization_alias="validationRegexp"'
          - "class OpenUrl(FunctionCall):"
        content_not_contains:
          - "def to_dict("
          - "_serialize_prop"
          - "call_id"
          - "Slot"
          # Functions are reached through their class alone.
          - "def open_url("
          - '"create_surface"'
          - '"update_components"'
