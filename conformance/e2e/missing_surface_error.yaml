- name: missing_surface_error
  action: e2e_scenario
  description: Update for an uncreated surface triggers an INTEGRITY_ERROR outbound envelope, followed by a text-only apology.
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  formats:
    - direct_json
    - express
  source:
    kind: hand_authored
    from: dart/a2ui_flutter/example/test/chat_session_test.dart
  turns:
    - userText: "Show a card"
      modelChunks:
        direct_json:
          - "<a2ui-json>\n"
          - |
            [
              {
                "version": "1.0",
                "updateComponents": {
                  "surfaceId": "missing",
                  "components": [
                    {
                      "id": "root",
                      "component": "Text",
                      "text": "Hi"
                    }
                  ]
                }
              }
            ]
            </a2ui-json>
        express:
          - "<a2ui>\n"
          - |
            surface("missing", update=true)
            root = Text("Hi")
            </a2ui>
      expectWire:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: missing
                components:
                  - id: root
                    component: Text
                    text: Hi
      expectViewTree:
        missing: null
      expectOutbound:
        - version: "1.0"
          error:
            code: INTEGRITY_ERROR
            surfaceId:
              $match: any
            message:
              $match: any
    - userText: null
      modelChunks:
        direct_json:
          - "Sorry about that."
        express:
          - "Sorry about that."
      expectWire:
        - text: "Sorry about that."
      expectViewTree:
        missing: null
      expectOutbound: []
