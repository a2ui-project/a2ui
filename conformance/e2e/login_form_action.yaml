- name: login_form_action
  action: e2e_scenario
  description: Login form with email and password fields, typed email, Sign In action,
    and signed-in confirmation.
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  formats:
    - direct_json
    - express
  source:
    kind: hand_authored
    from: dart/a2ui_flutter/e2e_test/test/chat_turn_test.dart
  turns:
    - userText: Show a login form with an email field, a password field, and a "Sign
        In" button.
      modelChunks:
        direct_json:
          - "Please sign in below.


            <a"
          - "2ui-json>

            "
          - "[\n  {\n    \"version\": \"1.0\",\n    \"createSurface\": {\n      \"surfaceId\"\
            : \"login\",\n      \"catalogId\": \"https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json\"\
            ,\n      \"sendDataModel\": true,\n      \"components\": [\n        {\n  \
            \        \"id\": \"root\",\n          \"component\": \"Card\",\n         \
            \ \"child\": \"form\"\n        },\n        {\n          \"id\": \"form\",\n\
            \          \"component\": \"Column\",\n          \"children\": [\n       \
            \     \"heading\",\n            \"emailField\",\n            \"passwordField\"\
            ,\n            \"signInButton\"\n          ]\n        },\n        {\n    \
            \      \"id\": \"heading\",\n          \"component\": \"Text\",\n        \
            \  \"text\": \"### Sign in to your account\"\n        },\n        {\n    \
            \      \"id\": \"emailField\",\n          \"component\": \"TextField\",\n\
            \          \"label\": \"Email\",\n          \"value\": {\n            \"@path\"\
            : \"/email\"\n          }\n        },\n        {\n          \"id\": \"passwordField\"\
            ,\n          \"component\": \"TextField\",\n          \"label\": \"Password\"\
            ,\n          \"value\": {\n            \"@path\": \"/password\"\n        \
            \  },\n          \"variant\": \"obscured\"\n        },\n        {\n      \
            \    \"id\": \"signInButton\",\n          \"component\": \"Button\",\n   \
            \       \"variant\": \"primary\",\n          \"child\": \"signInLabel\",\n\
            \          \"action\": {\n            \"event\": {\n              \"name\"\
            : \"sign_in\",\n              \"context\": {\n                \"email\": {\n\
            \                  \"@path\": \"/email\"\n                }\n            \
            \  }\n            }\n          }\n        },\n        {\n          \"id\"\
            : \"signInLabel\",\n          \"component\": \"Text\",\n          \"text\"\
            : \"Sign In\"\n        }\n      ],\n      \"dataModel\": {\n        \"email\"\
            : \"\",\n        \"password\": \"\"\n      }\n    }\n  }\n]\n</a2ui-json>\n"
        express:
          - "Please sign in below.


            <a"
          - "2ui>

            "
          - 'surface("login", sendDataModel=true)

            $/email = ""

            $/password = ""

            root = Card(form)

            form = Column([heading, emailField, passwordField, signInButton])

            heading = Text("### Sign in to your account")

            emailField = TextField("Email", $/email)

            passwordField = TextField("Password", $/password, variant="obscured")

            signInButton = Button(signInLabel, "primary", Event("sign_in", {email: $/email}))

            signInLabel = Text("Sign In")

            </a2ui>

            '
      expectWire:
        - text: Please sign in below.
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: login
                catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
                sendDataModel: true
                components:
                  - id: root
                    component: Card
                    child: form
                  - id: form
                    component: Column
                    children:
                      - heading
                      - emailField
                      - passwordField
                      - signInButton
                  - id: heading
                    component: Text
                    text: "### Sign in to your account"
                  - id: emailField
                    component: TextField
                    label: Email
                    value:
                      "@path": /email
                  - id: passwordField
                    component: TextField
                    label: Password
                    value:
                      "@path": /password
                    variant: obscured
                  - id: signInButton
                    component: Button
                    variant: primary
                    child: signInLabel
                    action:
                      event:
                        name: sign_in
                        context:
                          email:
                            "@path": /email
                  - id: signInLabel
                    component: Text
                    text: Sign In
                dataModel:
                  email: ""
                  password: ""
      expectViewTree:
        login:
          id: root
          type: Card
          children:
            - id: form
              type: Column
              children:
                - id: heading
                  type: Text
                  text: "### Sign in to your account"
                - id: emailField
                  type: TextField
                  label: Email
                  value: ""
                - id: passwordField
                  type: TextField
                  label: Password
                  value: ""
                - id: signInButton
                  type: Button
                  children:
                    - id: signInLabel
                      type: Text
                      text: Sign In
      expectErrors: []
      uiOps:
        - op: user_input
          surfaceId: login
          targetNode: emailField
          inputValue: ada@example.com
        - op: user_gesture
          surfaceId: login
          targetNode: signInButton
      expectDataModel:
        login:
          email: ada@example.com
          password: ""
      expectOutbound:
        - version: "1.0"
          action:
            name: sign_in
            surfaceId: login
            sourceComponentId: signInButton
            timestamp:
              $match: any
            context:
              email: ada@example.com
    - userText: null
      modelChunks:
        direct_json:
          - "You are now signed in.


            <a"
          - "2ui-json>

            "
          - "[\n  {\n    \"version\": \"1.0\",\n    \"updateComponents\": {\n      \"\
            surfaceId\": \"login\",\n      \"components\": [\n        {\n          \"\
            id\": \"root\",\n          \"component\": \"Card\",\n          \"child\":\
            \ \"confirmation\"\n        },\n        {\n          \"id\": \"confirmation\"\
            ,\n          \"component\": \"Column\",\n          \"children\": [\n     \
            \       \"signedInTitle\",\n            \"signedInDetail\"\n          ]\n\
            \        },\n        {\n          \"id\": \"signedInTitle\",\n          \"\
            component\": \"Text\",\n          \"text\": \"### Welcome back!\"\n      \
            \  },\n        {\n          \"id\": \"signedInDetail\",\n          \"component\"\
            : \"Text\",\n          \"text\": \"Signed in as ada@example.com.\",\n    \
            \      \"variant\": \"body\"\n        }\n      ]\n    }\n  }\n]\n</a2ui-json>\n"
        express:
          - "You are now signed in.


            <a"
          - "2ui>

            "
          - 'surface("login", update=true)

            root = Card(confirmation)

            confirmation = Column([signedInTitle, signedInDetail])

            signedInTitle = Text("### Welcome back!")

            signedInDetail = Text("Signed in as ada@example.com.", "body")

            </a2ui>

            '
      expectWire:
        - text: You are now signed in.
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: login
                components:
                  - id: root
                    component: Card
                    child: confirmation
                  - id: confirmation
                    component: Column
                    children:
                      - signedInTitle
                      - signedInDetail
                  - id: signedInTitle
                    component: Text
                    text: "### Welcome back!"
                  - id: signedInDetail
                    component: Text
                    text: Signed in as ada@example.com.
                    variant: body
      expectViewTree:
        login:
          id: root
          type: Card
          children:
            - id: confirmation
              type: Column
              children:
                - id: signedInTitle
                  type: Text
                  text: "### Welcome back!"
                - id: signedInDetail
                  type: Text
                  text: Signed in as ada@example.com.
  features:
    - F-CORE-01
    - F-CORE-17
    - F-CORE-23
    - F-AGT-04
    - F-AGT-07
    - F-AGT-37
    - F-AGT-57
    - F-RND-01
    - F-RND-05
    - F-RND-06
