# See node_resolution.md for the operation and assertion contract.
- name: scoped_binding_write
  description: >-
    Given two template items, when the first value binding is written,
    only that node emits, the write uses its data scope, and all nodes keep identity.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes:
      root:
        component_id: root
        type: Column
        state: resolved
        data_path: /
        props:
          children: [{node: root/children/0}, {node: root/children/1}]
      root/children/0:
        component_id: nameField
        data_path: /people/0
        props:
          label: {value: Name, writable: false}
          value: {value: Ada, writable: true}
      root/children/1:
        component_id: nameField
        data_path: /people/1
        props:
          value: {value: Lin, writable: true}
  steps:
    - op: write
      node: root/children/0
      property: value
      value: Grace
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Grace, writable: true}}}
          root/children/1: {props: {value: {value: Lin, writable: true}}}
        data: {/people/0/name: Grace, /people/1/name: Lin}
        emissions: {root/children/0: 1}
        same_nodes: [root, root/children/0, root/children/1]
    - op: set_data
      path: /people/0/name
      value: Grace
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Grace, writable: true}}}
          root/children/1: {}
        emissions: {}
        same_nodes: [root, root/children/0, root/children/1]

- name: complete_property_update
  description: >-
    Given two instances of one definition, when two properties change together,
    each instance emits one complete snapshot and the parent stays silent.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes: {root: {}, root/children/0: {}, root/children/1: {}}
  steps:
    - op: update_components
      components:
        - {id: nameField, component: TextField, label: Updated, value: Fixed}
      expect:
        nodes:
          root: {}
          root/children/0:
            props:
              label: {value: Updated, writable: false}
              value: {value: Fixed, writable: false}
          root/children/1:
            props:
              label: {value: Updated, writable: false}
              value: {value: Fixed, writable: false}
        emissions: {root/children/0: 1, root/children/1: 1}
        same_nodes: [root, root/children/0, root/children/1]

- name: template_membership
  description: >-
    Given two template items, when items are appended, inserted, and removed,
    surviving positions retain identity and removed nodes are destroyed once.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes: {root: {}, root/children/0: {}, root/children/1: {}}
  steps:
    - op: set_data
      path: /people
      value: [{name: Ada}, {name: Lin}, {name: Grace}]
      expect:
        nodes:
          root:
            props:
              children: [{node: root/children/0}, {node: root/children/1}, {node: root/children/2}]
          root/children/0: {}
          root/children/1: {}
          root/children/2:
            component_id: nameField
            data_path: /people/2
            props: {value: {value: Grace, writable: true}}
        emissions: {root: 1}
        same_nodes: [root, root/children/0, root/children/1]
    - op: set_data
      path: /people
      value: [{name: Ada}, {name: New}, {name: Lin}, {name: Grace}]
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Ada, writable: true}}}
          root/children/1: {props: {value: {value: New, writable: true}}}
          root/children/2: {props: {value: {value: Lin, writable: true}}}
          root/children/3:
            data_path: /people/3
            props: {value: {value: Grace, writable: true}}
        emissions: {root: 1, root/children/1: 1, root/children/2: 1}
        same_nodes: [root, root/children/0, root/children/1, root/children/2]
    - op: set_data
      path: /people
      value: [{name: Ada}]
      expect:
        nodes:
          root: {props: {children: [{node: root/children/0}]}}
          root/children/0: {props: {value: {value: Ada, writable: true}}}
        emissions: {root: 1}
        same_nodes: [root, root/children/0]
        destroyed: {root/children/1: 1, root/children/2: 1, root/children/3: 1}
    - op: dispose
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1, root/children/0: 1}

- name: shared_definition_independent_instances
  description: >-
    Given a shared child under two parents, when one parent definition is removed,
    that parent and its child are destroyed while the other instance stays live.
  action: resolve_nodes
  fixture: test_data/node/shared_child.yaml
  expect:
    nodes:
      root: {props: {children: [{node: root/children/0}, {node: root/children/1}]}}
      root/children/0: {props: {child: {node: root/children/0/child}}}
      root/children/0/child: {component_id: shared, props: {text: {value: Hello, writable: true}}}
      root/children/1: {props: {child: {node: root/children/1/child}}}
      root/children/1/child: {component_id: shared, props: {text: {value: Hello, writable: true}}}
  steps:
    - op: remove_component
      component_id: left
      expect:
        nodes:
          root: {}
          root/children/0: {component_id: left, state: pending}
          root/children/1: {}
          root/children/1/child:
            {component_id: shared, props: {text: {value: Hello, writable: true}}}
        emissions: {root: 1}
        same_nodes: [root, root/children/1, root/children/1/child]
        replaced_nodes: [root/children/0]
        destroyed: {root/children/0: 1, root/children/0/child: 1}
    - op: set_data
      path: /greeting
      value: Still here
      expect:
        nodes:
          root: {}
          root/children/0: {}
          root/children/1: {}
          root/children/1/child: {props: {text: {value: Still here, writable: true}}}
        emissions: {root/children/1/child: 1}
        same_nodes: [root, root/children/0, root/children/1, root/children/1/child]

- name: root_lifecycle
  description: >-
    Given an empty surface, when the root arrives and is removed,
    the tree appears and disappears; resolver disposal destroys a later root once.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components: [{id: root, component: Text, text: Hello}]
      expect:
        nodes:
          root:
            {component_id: root, state: resolved, props: {text: {value: Hello, writable: false}}}
        emissions: {}
    - op: remove_component
      component_id: root
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1}
    - op: update_components
      components: [{id: root, component: Text, text: Again}]
      expect:
        nodes:
          root: {props: {text: {value: Again, writable: false}}}
        emissions: {}
    - op: dispose
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1}

- name: pending_child_replacement
  description: >-
    Given a pending child, when its definition arrives,
    the placeholder is replaced and destroyed while its parent emits once and keeps identity.
  action: resolve_nodes
  fixture: test_data/node/pending.yaml
  expect:
    nodes:
      root: {props: {child: {node: root/child}}}
      root/child: {component_id: greeting, state: pending}
  steps:
    - op: update_components
      components: [{id: greeting, component: Text, text: Hello}]
      expect:
        nodes:
          root: {props: {child: {node: root/child}}}
          root/child:
            {
              component_id: greeting,
              state: resolved,
              props: {text: {value: Hello, writable: false}},
            }
        emissions: {root: 1}
        same_nodes: [root]
        replaced_nodes: [root/child]
        destroyed: {root/child: 1}

- name: dispatch_time_event_context
  description: >-
    Given an event action, when data changes before invocation,
    no event is sent early and the invoked action uses the latest data.
  action: resolve_nodes
  fixture: test_data/node/action.yaml
  expect:
    nodes:
      root: {props: {action: {action: true}, child: {node: root/child}}}
      root/child: {}
  steps:
    - op: set_data
      path: /name
      value: Grace
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
    - op: invoke
      node: root
      property: action
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
        events: [{name: save, source_component_id: root, context: {name: Grace}}]

- name: function_action_without_event
  description: >-
    Given a function action, when it is invoked,
    the catalog function runs once and no action event is emitted.
  action: resolve_nodes
  fixture: test_data/node/action.yaml
  expect:
    nodes: {root: {}, root/child: {}}
  steps:
    - op: update_components
      components:
        - id: root
          component: Button
          child: label
          action:
            functionCall: {call: openUrl, args: {url: "https://example.test"}}
      expect:
        nodes:
          root: {props: {action: {action: true}}}
          root/child: {}
        emissions: {root: 1}
        same_nodes: [root, root/child]
    - op: invoke
      node: root
      property: action
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
        functions: [{name: openUrl, args: {url: "https://example.test"}}]

- name: unknown_component_type_placeholder
  description: >-
    Given a child referencing an unregistered component type, the child resolves
    to an unknown-type placeholder node and emits UNKNOWN_COMPONENT_TYPE once on the surface.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: unknownChild}
        - {id: unknownChild, component: CustomUnknownWidget, label: Hi}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: unknownChild
            type: CustomUnknownWidget
            state: unknown-type
        emissions: {}
        errors:
          - code: UNKNOWN_COMPONENT_TYPE
            surfaceId: s

- name: cyclic_component_reference_same_scope
  description: >-
    Given a cycle at the same dataPath, the repeated component resolves to a
    cyclic placeholder node and emits CYCLIC_REFERENCE on the surface.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: childCard}
        - {id: childCard, component: Card, child: root}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: childCard
            type: Card
            state: resolved
            props:
              child: {node: root/child/child}
          root/child/child:
            component_id: root
            type: Card
            state: cyclic
            data_path: /
        emissions: {}
        errors:
          - code: CYCLIC_REFERENCE
            surfaceId: s

- name: explicit_child_list_reorder_preserves_identity
  description: >-
    Given an explicit child list [a, b], when reordered to [b, a],
    the parent node identity is preserved and children resolve in the new order.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Column, children: [a, b]}
        - {id: a, component: Text, text: Alpha}
        - {id: b, component: Text, text: Beta}
      expect:
        nodes:
          root:
            component_id: root
            type: Column
            state: resolved
            props:
              children: [{node: root/children/0}, {node: root/children/1}]
          root/children/0:
            component_id: a
            type: Text
            state: resolved
            props:
              text: {value: Alpha, writable: false}
          root/children/1:
            component_id: b
            type: Text
            state: resolved
            props:
              text: {value: Beta, writable: false}
        emissions: {}
    - op: update_components
      components:
        - {id: root, component: Column, children: [b, a]}
      expect:
        nodes:
          root:
            props:
              children: [{node: root/children/0}, {node: root/children/1}]
          root/children/0:
            component_id: b
            props:
              text: {value: Beta, writable: false}
          root/children/1:
            component_id: a
            props:
              text: {value: Alpha, writable: false}
        emissions: {root: 1}
        same_nodes: [root]

- name: component_type_change_replaces_node
  description: >-
    Given a resolved child node, when its component definition changes type from
    Text to Button via message processing, the old node is destroyed and replaced.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: item}
        - {id: item, component: Text, text: Hello}
        - {id: btnLabel, component: Text, text: Click}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: item
            type: Text
            state: resolved
            props:
              text: {value: Hello, writable: false}
        emissions: {}
    - op: process_messages
      messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: item
                component: Button
                child: btnLabel
                action:
                  event:
                    name: clicked
      expect:
        nodes:
          root:
            props:
              child: {node: root/child}
          root/child:
            component_id: item
            type: Button
            state: resolved
            props:
              child: {node: root/child/child}
              action: {action: true}
          root/child/child:
            component_id: btnLabel
            type: Text
            state: resolved
            props:
              text: {value: Click, writable: false}
        emissions: {root: 1}
        same_nodes: [root]
        replaced_nodes: [root/child]
        destroyed: {root/child: 1}

- name: nested_array_child_references_tabs
  description: >-
    Given a Tabs component with structured tab items containing child references,
    each tab child reference resolves to a mounted ComponentNode.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - id: root
          component: Tabs
          tabs:
            - {title: "Tab 1", child: pane1}
            - {title: "Tab 2", child: pane2}
        - {id: pane1, component: Text, text: "First Pane"}
        - {id: pane2, component: Text, text: "Second Pane"}
      expect:
        nodes:
          root:
            component_id: root
            type: Tabs
            state: resolved
            props:
              tabs:
                - title: {value: "Tab 1", writable: false}
                  child: {node: root/tabs/0/child}
                - title: {value: "Tab 2", writable: false}
                  child: {node: root/tabs/1/child}
          root/tabs/0/child:
            component_id: pane1
            type: Text
            state: resolved
            props:
              text: {value: "First Pane", writable: false}
          root/tabs/1/child:
            component_id: pane2
            type: Text
            state: resolved
            props:
              text: {value: "Second Pane", writable: false}
        emissions: {}

- name: reactive_check_props_on_node
  description: >-
    Given a CheckBox with a validation check bound to its value path,
    isValid, validationErrors, and validationResults update reactively on write.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: set_data
      path: /accepted
      value: false
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - id: root
          component: CheckBox
          label: "Accept terms"
          value: {path: /accepted}
          checks:
            - condition: {path: /accepted}
              message: "You must accept terms"
      expect:
        nodes:
          root:
            component_id: root
            type: CheckBox
            state: resolved
            isValid: false
            validationErrors: ["You must accept terms"]
            validationResults:
              - valid: false
                message: "You must accept terms"
                severity: "error"
            props:
              label: {value: "Accept terms", writable: false}
              value: {value: false, writable: true}
        emissions: {}
    - op: write
      node: root
      property: value
      value: true
      expect:
        nodes:
          root:
            isValid: true
            validationErrors: []
            validationResults: []
            props:
              value: {value: true, writable: true}
        data: {/accepted: true}
        emissions: {root: 1}
        same_nodes: [root]

- name: out_of_order_streaming_before_root
  description: >-
    Given child definitions and data streamed before the root component,
    no nodes mount until root arrives, at which point the full tree resolves.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: set_data
      path: /greeting
      value: "Streamed Hello"
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - {id: leaf, component: Text, text: {path: /greeting}}
        - {id: wrapper, component: Card, child: leaf}
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - {id: root, component: Column, children: [wrapper]}
      expect:
        nodes:
          root:
            component_id: root
            type: Column
            state: resolved
            props:
              children: [{node: root/children/0}]
          root/children/0:
            component_id: wrapper
            type: Card
            state: resolved
            props:
              child: {node: root/children/0/child}
          root/children/0/child:
            component_id: leaf
            type: Text
            state: resolved
            props:
              text: {value: "Streamed Hello", writable: true}
        emissions: {}

- name: delete_surface_disposes_tree
  description: >-
    Given a mounted component tree, when deleteSurface is processed,
    all mounted nodes are destroyed once and the tree becomes empty.
  action: resolve_nodes
  fixture: test_data/node/shared_child.yaml
  expect:
    nodes:
      root: {}
      root/children/0: {}
      root/children/0/child: {}
      root/children/1: {}
      root/children/1/child: {}
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          deleteSurface:
            surfaceId: "s"
      expect:
        nodes: {}
        emissions: {}
        destroyed:
          root: 1
          root/children/0: 1
          root/children/0/child: 1
          root/children/1: 1
          root/children/1/child: 1
