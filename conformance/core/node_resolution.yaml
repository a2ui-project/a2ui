- name: reactive_check_props_on_node
  features: [F-CORE-27, F-CORE-45]
  description: >-
    Given a CheckBox with a validation check bound to its value path,
    isValid, validationErrors, and validationResults update reactively on write.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: set_data
      path: /accepted
      value: false
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - id: root
          component: CheckBox
          label: "Accept terms"
          value: {path: /accepted}
          checks:
            - condition: {path: /accepted}
              message: "You must accept terms"
      expect:
        nodes:
          root:
            component_id: root
            type: CheckBox
            state: resolved
            isValid: false
            validationErrors: ["You must accept terms"]
            validationResults:
              - valid: false
                message: "You must accept terms"
                severity: "error"
            props:
              label: {value: "Accept terms", writable: false}
              value: {value: false, writable: true}
        emissions: {}
    - op: write
      node: root
      property: value
      value: true
      expect:
        nodes:
          root:
            isValid: true
            validationErrors: []
            validationResults: []
            props:
              value: {value: true, writable: true}
        data: {/accepted: true}
        emissions: {root: 1}
        same_nodes: [root]

- name: out_of_order_streaming_before_root
  description: >-
    Given child definitions and data streamed before the root component,
    no nodes mount until root arrives, at which point the full tree resolves.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: set_data
      path: /greeting
      value: "Streamed Hello"
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - {id: leaf, component: Text, text: {path: /greeting}}
        - {id: wrapper, component: Card, child: leaf}
      expect:
        nodes: {}
        emissions: {}
    - op: update_components
      components:
        - {id: root, component: Column, children: [wrapper]}
      expect:
        nodes:
          root:
            component_id: root
            type: Column
            state: resolved
            props:
              children: [{node: root/children/0}]
          root/children/0:
            component_id: wrapper
            type: Card
            state: resolved
            props:
              child: {node: root/children/0/child}
          root/children/0/child:
            component_id: leaf
            type: Text
            state: resolved
            props:
              text: {value: "Streamed Hello", writable: true}
        emissions: {}

- name: delete_surface_disposes_tree
  features: [F-CORE-04, F-CORE-41, F-CORE-45]
  description: >-
    Given a mounted component tree, when deleteSurface is processed,
    all mounted nodes are destroyed once and the tree becomes empty.
  action: resolve_nodes
  fixture: test_data/node/shared_child.yaml
  expect:
    nodes:
      root: {}
      root/children/0: {}
      root/children/0/child: {}
      root/children/1: {}
      root/children/1/child: {}
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          deleteSurface:
            surfaceId: "s"
      expect:
        nodes: {}
        emissions: {}
        destroyed:
          root: 1
          root/children/0: 1
          root/children/0/child: 1
          root/children/1: 1
          root/children/1/child: 1

- name: inline_create_applies_data_before_components
  description: >-
    createSurface with inline dataModel and components resolves bound
    components against that data on creation without a post-creation emission.
  action: resolve_nodes
  fixture: test_data/node/inline_create.yaml
  expect: {nodes: {}}
  steps:
    - op: process_messages
      messages:
        - version: "1.0"
          createSurface:
            surfaceId: s
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
            dataModel: {greeting: Hi}
            components:
              - {id: root, component: Text, text: {"@path": /greeting}}
      expect:
        nodes:
          root:
            component_id: root
            type: Text
            state: resolved
            props:
              text: {value: Hi, writable: true}
        data: {/greeting: Hi}
        emissions: {}
        created_emissions: {root: 0}

- name: separate_data_message_keeps_arrival_order
  description: >-
    Separate updateComponents followed by updateDataModel in one batch creates
    nodes before data arrives and then emits once when data is written.
  action: resolve_nodes
  fixture: test_data/node/inline_create.yaml
  expect: {nodes: {}}
  steps:
    - op: process_messages
      messages:
        - version: "1.0"
          createSurface:
            surfaceId: s
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s
            components:
              - {id: root, component: Text, text: {"@path": /greeting}}
        - version: "1.0"
          updateDataModel:
            surfaceId: s
            path: /greeting
            value: Hi
      expect:
        nodes:
          root:
            component_id: root
            type: Text
            state: resolved
            props:
              text: {value: Hi, writable: true}
        data: {/greeting: Hi}
        emissions: {}
        created_emissions: {root: 1}

