# See node_resolution.md for the operation and assertion contract.
- name: scoped_binding_write
  features: [F-CORE-15, F-CORE-17, F-CORE-41, F-CORE-45]
  description: >-
    Given two template items, when the first value binding is written,
    only that node emits, the write uses its data scope, and all nodes keep identity.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes:
      root:
        component_id: root
        type: Column
        state: resolved
        data_path: /
        props:
          children: [{node: root/children/0}, {node: root/children/1}]
      root/children/0:
        component_id: nameField
        data_path: /people/0
        props:
          label: {value: Name, writable: false}
          value: {value: Ada, writable: true}
      root/children/1:
        component_id: nameField
        data_path: /people/1
        props:
          value: {value: Lin, writable: true}
  steps:
    - op: write
      node: root/children/0
      property: value
      value: Grace
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Grace, writable: true}}}
          root/children/1: {props: {value: {value: Lin, writable: true}}}
        data: {/people/0/name: Grace, /people/1/name: Lin}
        emissions: {root/children/0: 1}
        same_nodes: [root, root/children/0, root/children/1]
    - op: set_data
      path: /people/0/name
      value: Grace
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Grace, writable: true}}}
          root/children/1: {}
        emissions: {}
        same_nodes: [root, root/children/0, root/children/1]

- name: complete_property_update
  features: [F-CORE-17, F-CORE-40, F-CORE-45]
  description: >-
    Given two instances of one definition, when two properties change together,
    each instance emits one complete snapshot and the parent stays silent.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes: {root: {}, root/children/0: {}, root/children/1: {}}
  steps:
    - op: update_components
      components:
        - {id: nameField, component: TextField, label: Updated, value: Fixed}
      expect:
        nodes:
          root: {}
          root/children/0:
            props:
              label: {value: Updated, writable: false}
              value: {value: Fixed, writable: false}
          root/children/1:
            props:
              label: {value: Updated, writable: false}
              value: {value: Fixed, writable: false}
        emissions: {root/children/0: 1, root/children/1: 1}
        same_nodes: [root, root/children/0, root/children/1]

- name: template_membership
  features: [F-CORE-13, F-CORE-45]
  description: >-
    Given two template items, when items are appended, inserted, and removed,
    surviving positions retain identity and removed nodes are destroyed once.
  action: resolve_nodes
  fixture: test_data/node/two_people.yaml
  expect:
    nodes: {root: {}, root/children/0: {}, root/children/1: {}}
  steps:
    - op: set_data
      path: /people
      value: [{name: Ada}, {name: Lin}, {name: Grace}]
      expect:
        nodes:
          root:
            props:
              children: [{node: root/children/0}, {node: root/children/1}, {node: root/children/2}]
          root/children/0: {}
          root/children/1: {}
          root/children/2:
            component_id: nameField
            data_path: /people/2
            props: {value: {value: Grace, writable: true}}
        emissions: {root: 1}
        same_nodes: [root, root/children/0, root/children/1]
    - op: set_data
      path: /people
      value: [{name: Ada}, {name: New}, {name: Lin}, {name: Grace}]
      expect:
        nodes:
          root: {}
          root/children/0: {props: {value: {value: Ada, writable: true}}}
          root/children/1: {props: {value: {value: New, writable: true}}}
          root/children/2: {props: {value: {value: Lin, writable: true}}}
          root/children/3:
            data_path: /people/3
            props: {value: {value: Grace, writable: true}}
        emissions: {root: 1, root/children/1: 1, root/children/2: 1}
        same_nodes: [root, root/children/0, root/children/1, root/children/2]
    - op: set_data
      path: /people
      value: [{name: Ada}]
      expect:
        nodes:
          root: {props: {children: [{node: root/children/0}]}}
          root/children/0: {props: {value: {value: Ada, writable: true}}}
        emissions: {root: 1}
        same_nodes: [root, root/children/0]
        destroyed: {root/children/1: 1, root/children/2: 1, root/children/3: 1}
    - op: dispose
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1, root/children/0: 1}

- name: shared_definition_independent_instances
  features: [F-CORE-13, F-CORE-40, F-CORE-45]
  description: >-
    Given a shared child under two parents, when one parent definition is removed,
    that parent and its child are destroyed while the other instance stays live.
  action: resolve_nodes
  fixture: test_data/node/shared_child.yaml
  expect:
    nodes:
      root: {props: {children: [{node: root/children/0}, {node: root/children/1}]}}
      root/children/0: {props: {child: {node: root/children/0/child}}}
      root/children/0/child: {component_id: shared, props: {text: {value: Hello, writable: true}}}
      root/children/1: {props: {child: {node: root/children/1/child}}}
      root/children/1/child: {component_id: shared, props: {text: {value: Hello, writable: true}}}
  steps:
    - op: remove_component
      component_id: left
      expect:
        nodes:
          root: {}
          root/children/0: {component_id: left, state: pending}
          root/children/1: {}
          root/children/1/child:
            {component_id: shared, props: {text: {value: Hello, writable: true}}}
        emissions: {root: 1}
        same_nodes: [root, root/children/1, root/children/1/child]
        replaced_nodes: [root/children/0]
        destroyed: {root/children/0: 1, root/children/0/child: 1}
    - op: set_data
      path: /greeting
      value: Still here
      expect:
        nodes:
          root: {}
          root/children/0: {}
          root/children/1: {}
          root/children/1/child: {props: {text: {value: Still here, writable: true}}}
        emissions: {root/children/1/child: 1}
        same_nodes: [root, root/children/0, root/children/1, root/children/1/child]

- name: root_lifecycle
  features: [F-CORE-11, F-CORE-45]
  description: >-
    Given an empty surface, when the root arrives and is removed,
    the tree appears and disappears; resolver disposal destroys a later root once.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components: [{id: root, component: Text, text: Hello}]
      expect:
        nodes:
          root:
            {component_id: root, state: resolved, props: {text: {value: Hello, writable: false}}}
        emissions: {}
    - op: remove_component
      component_id: root
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1}
    - op: update_components
      components: [{id: root, component: Text, text: Again}]
      expect:
        nodes:
          root: {props: {text: {value: Again, writable: false}}}
        emissions: {}
    - op: dispose
      expect:
        nodes: {}
        emissions: {}
        destroyed: {root: 1}

- name: pending_child_replacement
  features: [F-CORE-11, F-CORE-45]
  description: >-
    Given a pending child, when its definition arrives,
    the placeholder is replaced and destroyed while its parent emits once and keeps identity.
  action: resolve_nodes
  fixture: test_data/node/pending.yaml
  expect:
    nodes:
      root: {props: {child: {node: root/child}}}
      root/child: {component_id: greeting, state: pending}
  steps:
    - op: update_components
      components: [{id: greeting, component: Text, text: Hello}]
      expect:
        nodes:
          root: {props: {child: {node: root/child}}}
          root/child:
            {
              component_id: greeting,
              state: resolved,
              props: {text: {value: Hello, writable: false}},
            }
        emissions: {root: 1}
        same_nodes: [root]
        replaced_nodes: [root/child]
        destroyed: {root/child: 1}

- name: dispatch_time_event_context
  features: [F-CORE-23, F-CORE-45]
  description: >-
    Given an event action, when data changes before invocation,
    no event is sent early and the invoked action uses the latest data.
  action: resolve_nodes
  fixture: test_data/node/action.yaml
  expect:
    nodes:
      root: {props: {action: {action: true}, child: {node: root/child}}}
      root/child: {}
  steps:
    - op: set_data
      path: /name
      value: Grace
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
    - op: invoke
      node: root
      property: action
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
        events: [{name: save, source_component_id: root, context: {name: Grace}}]

- name: function_action_without_event
  features: [F-CORE-28, F-CORE-45]
  description: >-
    Given a function action, when it is invoked,
    the catalog function runs once and no action event is emitted.
  action: resolve_nodes
  fixture: test_data/node/action.yaml
  expect:
    nodes: {root: {}, root/child: {}}
  steps:
    - op: update_components
      components:
        - id: root
          component: Button
          child: label
          action:
            functionCall: {call: openUrl, args: {url: "https://example.test"}}
      expect:
        nodes:
          root: {props: {action: {action: true}}}
          root/child: {}
        emissions: {root: 1}
        same_nodes: [root, root/child]
    - op: invoke
      node: root
      property: action
      expect:
        nodes: {root: {}, root/child: {}}
        emissions: {}
        same_nodes: [root, root/child]
        functions: [{name: openUrl, args: {url: "https://example.test"}}]

- name: event_property_is_not_an_action
  description: >-
    Given a component with a string event property, list items with an event
    key, and an event action, when the tree resolves, the event values stay
    plain and only the object whose only property is event becomes an action.
  action: resolve_nodes
  fixture: test_data/node/event_property.yaml
  expect:
    nodes:
      root:
        type: Select
        props:
          label: Color
          event: picked
          options: [{label: Red, event: red}, Blue]
          action: {action: true}
  steps: []

- name: metadata_only_update_emits_metadata_not_props
  description: >-
    Given v1.0 components carrying envelope metadata, when the tree resolves,
    each node exposes its own metadata apart from props and a component without
    metadata exposes none; when an update changes only envelope metadata,
    the node's metadata emits once, its props stay silent, and every node keeps identity.
  action: resolve_nodes
  fixture: test_data/node/metadata.yaml
  expect:
    nodes:
      root:
        component_id: root
        type: Card
        state: resolved
        props: {child: {node: root/child}}
        metadata: {extensions: {com_example_policy: restricted}}
      root/child:
        component_id: button
        type: Button
        props: {action: {action: true}, child: {node: root/child/child}}
        metadata: {extensions: {com_example_trace: t1}}
      root/child/child:
        component_id: label
        type: Text
        metadata: null
  steps:
    - op: update_components
      components:
        - id: button
          component: Button
          child: label
          action:
            event:
              name: save
              context: {name: {"@path": /name}}
          metadata: {extensions: {com_example_trace: t2, com_example_state: verified}}
      expect:
        nodes:
          root: {metadata: {extensions: {com_example_policy: restricted}}}
          root/child:
            props: {action: {action: true}, child: {node: root/child/child}}
            metadata: {extensions: {com_example_trace: t2, com_example_state: verified}}
          root/child/child: {metadata: null}
        emissions: {}
        metadata_emissions: {root/child: 1}
        same_nodes: [root, root/child, root/child/child]

- name: metadata_cleared_when_update_omits_it
  description: >-
    Given a resolved node with metadata, when a full component update omits
    metadata, the node's metadata clears and emits once while props stay silent.
  action: resolve_nodes
  fixture: test_data/node/metadata.yaml
  expect:
    nodes: {root: {}, root/child: {}, root/child/child: {}}
  steps:
    - op: update_components
      components:
        - id: button
          component: Button
          child: label
          action:
            event:
              name: save
              context: {name: {"@path": /name}}
      expect:
        nodes:
          root: {metadata: {extensions: {com_example_policy: restricted}}}
          root/child: {metadata: null}
          root/child/child: {metadata: null}
        emissions: {}
        metadata_emissions: {root/child: 1}
        same_nodes: [root, root/child, root/child/child]
    - op: update_components
      components:
        - id: button
          component: Button
          child: label
          action:
            event:
              name: save
              context: {name: {"@path": /name}}
      expect:
        nodes: {root: {}, root/child: {metadata: null}, root/child/child: {}}
        emissions: {}
        metadata_emissions: {}
        same_nodes: [root, root/child, root/child/child]

- name: metadata_and_props_update_together
  description: >-
    Given a resolved node, when one update changes both a property and the
    envelope metadata, props and metadata each emit exactly once.
  action: resolve_nodes
  fixture: test_data/node/metadata.yaml
  expect:
    nodes: {root: {}, root/child: {}, root/child/child: {}}
  steps:
    - op: update_components
      components:
        - id: label
          component: Text
          text: Saved
          metadata: {extensions: {com_example_trace: label_1}}
      expect:
        nodes:
          root: {}
          root/child: {}
          root/child/child:
            props: {text: {value: Saved, writable: false}}
            metadata: {extensions: {com_example_trace: label_1}}
        emissions: {root/child/child: 1}
        metadata_emissions: {root/child/child: 1}
        same_nodes: [root, root/child, root/child/child]

- name: invoke_action_with_dispatch_metadata
  description: >-
    Given an event action, when it is invoked with dispatch metadata,
    the emitted event carries that metadata envelope; without it, the event carries none.
  action: resolve_nodes
  fixture: test_data/node/metadata.yaml
  expect:
    nodes: {root: {}, root/child: {props: {action: {action: true}}}, root/child/child: {}}
  steps:
    - op: invoke
      node: root/child
      property: action
      metadata: {extensions: {com_example_attestation: signed}}
      expect:
        nodes: {root: {}, root/child: {}, root/child/child: {}}
        emissions: {}
        same_nodes: [root, root/child, root/child/child]
        events:
          - name: save
            source_component_id: button
            context: {name: Ada}
            metadata: {extensions: {com_example_attestation: signed}}
    - op: invoke
      node: root/child
      property: action
      expect:
        nodes: {root: {}, root/child: {}, root/child/child: {}}
        emissions: {}
        same_nodes: [root, root/child, root/child/child]
        events:
          - name: save
            source_component_id: button
            context: {name: Ada}

- name: unknown_component_type_placeholder
  description: >-
    Given a child referencing an unregistered component type, the child resolves
    to an unknown-type placeholder node and emits UNKNOWN_COMPONENT_TYPE once on the surface.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: unknownChild}
        - {id: unknownChild, component: CustomUnknownWidget, label: Hi}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: unknownChild
            type: CustomUnknownWidget
            state: unknown-type
        emissions: {}
        errors:
          - code: UNKNOWN_COMPONENT_TYPE
            surfaceId: s

- name: cyclic_component_reference_same_scope
  description: >-
    Given a cycle at the same dataPath, the repeated component resolves to a
    cyclic placeholder node and emits CYCLIC_REFERENCE on the surface.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: childCard}
        - {id: childCard, component: Card, child: root}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: childCard
            type: Card
            state: resolved
            props:
              child: {node: root/child/child}
          root/child/child:
            component_id: root
            type: Card
            state: cyclic
            data_path: /
        emissions: {}
        errors:
          - code: CYCLIC_REFERENCE
            surfaceId: s

- name: explicit_child_list_reorder_preserves_identity
  description: >-
    Given an explicit child list [a, b], when reordered to [b, a],
    the parent node identity is preserved and children resolve in the new order.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Column, children: [a, b]}
        - {id: a, component: Text, text: Alpha}
        - {id: b, component: Text, text: Beta}
      expect:
        nodes:
          root:
            component_id: root
            type: Column
            state: resolved
            props:
              children: [{node: root/children/0}, {node: root/children/1}]
          root/children/0:
            component_id: a
            type: Text
            state: resolved
            props:
              text: {value: Alpha, writable: false}
          root/children/1:
            component_id: b
            type: Text
            state: resolved
            props:
              text: {value: Beta, writable: false}
        emissions: {}
    - op: update_components
      components:
        - {id: root, component: Column, children: [b, a]}
      expect:
        nodes:
          root:
            props:
              children: [{node: root/children/0}, {node: root/children/1}]
          root/children/0:
            component_id: b
            props:
              text: {value: Beta, writable: false}
          root/children/1:
            component_id: a
            props:
              text: {value: Alpha, writable: false}
        emissions: {root: 1}
        same_nodes: [root]

- name: component_type_change_replaces_node
  description: >-
    Given a resolved child node, when its component definition changes type from
    Text to Button via message processing, the old node is destroyed and replaced.
  action: resolve_nodes
  fixture: test_data/node/empty.yaml
  expect: {nodes: {}}
  steps:
    - op: update_components
      components:
        - {id: root, component: Card, child: item}
        - {id: item, component: Text, text: Hello}
        - {id: btnLabel, component: Text, text: Click}
      expect:
        nodes:
          root:
            component_id: root
            type: Card
            state: resolved
            props:
              child: {node: root/child}
          root/child:
            component_id: item
            type: Text
            state: resolved
            props:
              text: {value: Hello, writable: false}
        emissions: {}
    - op: process_messages
      messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: item
                component: Button
                child: btnLabel
                action:
                  event:
                    name: clicked
      expect:
        nodes:
          root:
            props:
              child: {node: root/child}
          root/child:
            component_id: item
            type: Button
            state: resolved
            props:
              child: {node: root/child/child}
              action: {action: true}
          root/child/child:
            component_id: btnLabel
            type: Text
            state: resolved
            props:
              text: {value: Click, writable: false}
        emissions: {root: 1}
        same_nodes: [root]
        replaced_nodes: [root/child]
        destroyed: {root/child: 1}

