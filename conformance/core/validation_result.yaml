- name: test_validation_result_dynamic_object_return
  description: Verifies CheckRule evaluation capturing dynamic ValidationResult object returned from custom validation function.
  catalog:
    protocol_version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "form_surface"
            catalogId: "basic"
            dataModel:
              email: "invalid-email-address"
            components:
              - id: input
                component: TextField
                text:
                  path: "/email"
                checks:
                  - condition:
                      call: "email"
                      args:
                        value:
                          path: "/email"
  expect:
    surfaces:
      form_surface:
        validationResult:
          input:
            valid: false
            code: "INVALID_EMAIL"
            message: "Please enter a valid email address (e.g. user@example.com)."
            severity: "error"

- name: test_validation_result_boolean_fallback
  description: Verifies CheckRule evaluation when validation function returns primitive boolean, falling back to CheckRule message.
  catalog:
    protocol_version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "form_surface"
            catalogId: "basic"
            dataModel:
              age: 15
            components:
              - id: input
                component: TextField
                text:
                  path: "/age"
                checks:
                  - condition:
                      call: "numeric"
                      args:
                        value:
                          path: "/age"
                        min: 18
                    message: "Must be 18 or older."
  expect:
    surfaces:
      form_surface:
        validationResult:
          input:
            valid: false
            message: "Must be 18 or older."
            severity: "error"
