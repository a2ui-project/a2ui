# How the time to process messages grows with the surface they build.
#
# A processor checks each `updateComponents` against the surface it updates.
# One that walks the whole surface for every message takes time that grows
# with the square of the surface's size when the surface arrives in many small
# messages, as it does from an agent that streams.
#
# A `measure_growth` case processes a payload written at two sizes, n and 4n.
# Its `max_ratio` is the largest value allowed for the time at 4n divided by the
# time at n. `agent/direct_json/scaling.yaml` explains the measure and the limit
# of 8, how a harness times a case, and why the cases run apart from the other
# tests. Each timed run creates a processor holding the catalogs of
# `catalogPaths` and hands it the payload's messages in one `processMessages`
# call.

- name: test_scaling_process_single_component_messages_relaxed_v10
  description: Processing n messages of one component each, under a validation config, takes about four times as long at 4n, since each message is checked against what it changes rather than the whole surface.
  action: measure_growth
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  args:
    validation_config: relaxed
  operation: process_messages
  payload:
    - '[{"version": "v1.0", "createSurface": {"surfaceId": "s1", "catalogId": "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"}}, {"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Column", "children": ['
    - repeat: '"item_{i}"'
      separator: ", "
    - "]}]}}, "
    - repeat: '{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "item_{i}", "component": "Text", "text": "Item number {i}"}]}}'
      separator: ", "
    - "]"
  sizes: [200, 800]
  max_ratio: 8

- name: test_scaling_process_single_component_messages_v10
  description: Processing n messages of one component each, without a validation config, takes about four times as long at 4n.
  action: measure_growth
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  args:
    validation_config: none
  operation: process_messages
  payload:
    - '[{"version": "v1.0", "createSurface": {"surfaceId": "s1", "catalogId": "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"}}, {"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Column", "children": ['
    - repeat: '"item_{i}"'
      separator: ", "
    - "]}]}}, "
    - repeat: '{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "item_{i}", "component": "Text", "text": "Item number {i}"}]}}'
      separator: ", "
    - "]"
  sizes: [200, 800]
  max_ratio: 8

- name: test_scaling_process_single_component_messages_composition_v10
  description: Processing n messages of one component each, under a validation config and with a catalog whose components declare allowedParents and allowedChildren, takes about four times as long at 4n. A message that adds a child to a container checks the constraints the child changes, rather than every child of the container.
  action: measure_growth
  protocolVersion: "v1.0"
  catalogPaths:
    - "conformance/test_data/catalogs/composition_catalog_v1_0.json"
  args:
    validation_config: relaxed
  operation: process_messages
  payload:
    - '[{"version": "v1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/composition"}}, {"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Column", "children": ['
    - repeat: '"item_{i}"'
      separator: ", "
    - "]}]}}, "
    - repeat: '{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "item_{i}", "component": "Text", "text": "Item number {i}"}]}}'
      separator: ", "
    - "]"
  sizes: [1000, 4000]
  max_ratio: 8
