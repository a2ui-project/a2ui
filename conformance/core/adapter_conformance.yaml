- name: fallback_states_unknown_type_and_cyclic_diagnostics
  description: Verifies that unknown component types and same-scope cyclic references render safe fallback placeholders and emit UNKNOWN_COMPONENT_TYPE and CYCLIC_REFERENCE diagnostics on surface.onError.
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  action: render_surface
  steps:
    - op: process_messages
      messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "adapter_surface"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            components:
              - id: "root"
                component: "Column"
                children: ["unknown_widget", "cycle_card"]
              - id: "unknown_widget"
                component: "UnregisteredFutureWidget"
              - id: "cycle_card"
                component: "Card"
                child: "root"
      expectViewTree:
        id: "root"
        type: "Column"
        children:
          - id: "unknown_widget"
            state: "unknown-type"
          - id: "cycle_card"
            type: "Card"
            children:
              - id: "root"
                state: "cyclic"
      expectErrors:
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "adapter_surface"
        - code: "CYCLIC_REFERENCE"
          surfaceId: "adapter_surface"

- name: teardown_unmount_releases_subscriptions
  description: Verifies that unmounting the surface view disposes its NodeResolver and releases all active reactive subscriptions on the SurfaceModel and DataModel.
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  action: render_surface
  steps:
    - op: process_messages
      messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "adapter_surface"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            dataModel:
              status: "Mounted"
            components:
              - id: "root"
                component: "Card"
                child: "status_text"
              - id: "status_text"
                component: "Text"
                text:
                  "@path": "/status"
      expectViewTree:
        id: "root"
        type: "Card"
        children:
          - id: "status_text"
            type: "Text"
            text: "Mounted"
    - op: unmount_surface
      expectActiveSubscriptions: 0
