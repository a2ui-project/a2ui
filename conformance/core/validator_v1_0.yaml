- name: test_v10_agent_only_function_in_binding_error
  description: Tests that a component property bound to a function whose allowedCallers is agentOnly fails validation in v1.0, since a binding is a renderer call and agentOnly functions can't be bound to component properties. The error is a validation error, raised before any binding is evaluated.
  action: validate
  protocolVersion: "1.0"
  catalog:
    catalogId: arcana
    components:
      Label:
        type: object
        properties:
          id: {type: string}
          component: {const: Label}
          text:
            $ref: "common_types.json#/$defs/DynamicString"
        required:
          - component
          - text
    functions:
      getMoonPhase:
        type: object
        allowedCallers: agentOnly
        returnType: string
        properties:
          "@call": {const: getMoonPhase}
          args:
            type: object
            properties:
              date: {type: string}
            additionalProperties: false
        required:
          - "@call"
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s1
            catalogId: arcana
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Label
                text:
                  "@call": getMoonPhase
                  args:
                    date: today
      expectError:
        category: ValidationError
        surfaceId: s1
        rendererError:
          version: "1.0"
          error:
            code: VALIDATION_FAILED
            surfaceId: s1
            path: "/components/0/text"
            message: "agentOnly"

- name: test_v10_agent_only_function_in_action_error
  description: Tests that an action functionCall of a function whose allowedCallers is agentOnly fails validation in v1.0, since renderer UI actions can't run agentOnly functions, while a rendererOrAgent function can be.
  action: validate
  protocolVersion: "1.0"
  catalog:
    catalogId: arcana
    components:
      Trigger:
        type: object
        properties:
          id: {type: string}
          component: {const: Trigger}
          action:
            $ref: "common_types.json#/$defs/Action"
        required:
          - component
          - action
    functions:
      getMoonPhase:
        type: object
        allowedCallers: agentOnly
        returnType: string
        properties:
          "@call": {const: getMoonPhase}
          args:
            type: object
            additionalProperties: false
        required:
          - "@call"
      getTide:
        type: object
        allowedCallers: rendererOrAgent
        returnType: string
        properties:
          "@call": {const: getTide}
          args:
            type: object
            additionalProperties: false
        required:
          - "@call"
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s1
            catalogId: arcana
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Trigger
                action:
                  "@functionCall":
                    "@call": getTide
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s2
            catalogId: arcana
        - version: "1.0"
          updateComponents:
            surfaceId: s2
            components:
              - id: root
                component: Trigger
                action:
                  "@functionCall":
                    "@call": getMoonPhase
      expectError:
        category: ValidationError
        surfaceId: s2
        rendererError:
          version: "1.0"
          error:
            code: VALIDATION_FAILED
            surfaceId: s2
            path: "/components/0/action/@functionCall"
            message: "agentOnly"

- name: test_v10_agent_only_function_cross_catalog_and_nested_error
  description: Tests that a component property bound to an agentOnly function of another catalog than the component's, or holding one nested in the args of a renderer call, fails validation in v1.0.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
    - conformance/test_data/catalogs/allowed_callers_catalog_v1_0.json
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s1
