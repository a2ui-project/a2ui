- name: test_v10_topology_at_child_cycle_detection_error
  features: [F-CORE-12]
  description: >-
    Tests that circular references across @child single, static list, dynamic
    template, and nested Tabs.tabs[i].child slots fail validation in v1.0 strict mode.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  strictMode: true
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_cycle_single
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_cycle_single
            components:
              - id: root
                component: Card
                child:
                  "@child": c1
              - id: c1
                component: Card
                child:
                  "@child": root
      expectError: "Circular component reference"
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_cycle_list
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_cycle_list
            components:
              - id: root
                component: Column
                children:
                  "@child": [c1]
              - id: c1
                component: Column
                children:
                  "@child": [root]
      expectError: "Circular component reference"
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_cycle_tpl
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_cycle_tpl
            components:
              - id: root
                component: List
                children:
                  "@child": tplCard
                  "@path": "/items"
              - id: tplCard
                component: Card
                child:
                  "@child": root
      expectError: "Circular component reference"
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_cycle_tabs
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_cycle_tabs
            components:
              - id: root
                component: Tabs
                tabs:
                  - title: "One"
                    child:
                      "@child": pane_1
              - id: pane_1
                component: Card
                child:
                  "@child": root
      expectError: "Circular component reference"

