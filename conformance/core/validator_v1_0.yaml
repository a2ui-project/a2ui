- name: test_v10_topology_template_child_reachable
  description: Tests that a component referenced only as a list template is reachable from the root in v1.0 strict mode.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  strictMode: true
  steps:
    - messages:
        - version: "1.0"
          createSurface:
