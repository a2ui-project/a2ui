- name: test_v10_topology_at_child_valid_tree_across_all_slot_forms
  features: [F-CORE-11, F-CORE-12, F-CORE-13]
  description: >-
    Tests that v1.0 strict topology validation accepts reachable components across
    @child single slots, static lists, dynamic templates, and nested Tabs.tabs[i].child
    array-of-objects, alongside @action and @functionCall on Button.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  strictMode: true
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_valid_at_child
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_valid_at_child
            components:
              - id: root
                component: Card
                child:
                  "@child": tabsComp
              - id: tabsComp
                component: Tabs
                tabs:
                  - title: "Actions"
                    child:
                      "@child": actionCol
                  - title: "Items"
                    child:
                      "@child": itemList
              - id: actionCol
                component: Column
                children:
                  "@child": [saveBtn, openBtn]
              - id: saveBtn
                component: Button
                child:
                  "@child": saveLbl
                action:
