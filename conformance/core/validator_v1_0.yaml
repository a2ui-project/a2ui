- name: test_v10_uax31_astral_plane_identifier_accepted
  description: Tests that an astral-plane UAX #31 identifier starting with XID_Start U+1D465 ('𝑥Label') is accepted for component types and IDs in v1.0 strict mode.
  action: validate
  protocolVersion: "1.0"
  catalog:
    catalogId: astral_v10
    components:
      Stack:
        type: object
        properties:
          id: {type: string}
          component: {const: Stack}
          children:
            type: array
            items:
              $ref: "common_types.json#/$defs/ComponentId"
        required:
          - component
          - children
      "𝑥Label":
        type: object
        properties:
          id: {type: string}
          component: {const: "𝑥Label"}
          text: {type: string}
        required:
          - component
          - text
  strictMode: true
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s1
            catalogId: astral_v10
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Stack
                children: ["𝑥Label"]
              - id: "𝑥Label"
                component: "𝑥Label"
                text: "Astral plane"

