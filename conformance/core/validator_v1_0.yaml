        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Text
                text:
                  "@call": readSessionToken
                  catalogId: https://a2ui.org/catalogs/v10/allowed_callers
      expectError:
        category: ValidationError
        surfaceId: s1
        rendererError:
          version: "1.0"
          error:
            code: VALIDATION_FAILED
            surfaceId: s1
            path: "/components/0/text"
            message: "agentOnly"
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s2
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s2
            components:
              - id: root
                component: Text
                text:
                  "@call": formatString
                  args:
                    value:
                      "@call": readSessionToken
                      catalogId: https://a2ui.org/catalogs/v10/allowed_callers
      expectError:
        category: ValidationError
        surfaceId: s2
        rendererError:
          version: "1.0"
          error:
            code: VALIDATION_FAILED
            surfaceId: s2
            path: "/components/0/text/args/value"
            message: "agentOnly"

- name: test_v10_validate_at_prefixed_component_envelope_mixins
  description: >-
    Tests that PayloadValidator accepts @metadata, @accessibility, and @checks
    on v1.0 components while continuing to accept legacy bare metadata,
    accessibility, and checks during the v1.0 transition window (#1376).
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - catalogs/basic/v1/catalog.json
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s_at_mixins
            catalogId: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json
        - version: "1.0"
          updateComponents:
            surfaceId: s_at_mixins
            components:
              - id: root
                component: TextField
                label: "Email"
                value: ""
                "@accessibility":
                  label: "Email address"
                  description: "Enter your work email"
                "@metadata":
                  extensions:
                    com_example_field: "email"
                "@checks":
                  - condition:
                      "@call": required
                      args:
                        value: ""
                    message: "Email is required"

