- name: test_validator_1_0
  features: [F-CORE-07, F-CORE-11]
  description: Tests schema validation of v1.0 message envelopes (inline components, optional catalogId, data deletion) against the basic v1.0 catalog schema.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "https://a2ui.org/catalogs/basic/v1/catalog.json"
            sendDataModel: true
            components:
              - id: "root"
                component: "Text"
                text: "Inline Text"
            dataModel:
              counter: 100
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: "s_nocat"
    - messages:
        - version: "1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/user/token"
            value: null
    - messages:
        - createSurface:
            surfaceId: "s1"
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "missing_field"
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: 123
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.surfaceId"
            code: "type_mismatch"

- name: test_custom_catalog_1_0
  description: Tests component property schema validation in v1.0 against custom catalog schema.
  action: validate
  protocolVersion: "1.0"
  catalog:
    catalogId: "custom"
    components:
      Canvas:
        type: object
        properties:
          id: {type: string}
          component: {const: Canvas}
          children:
            type: array
            items:
              $ref: "common_types.json#/$defs/ComponentId"
        required:
          - component
          - children
      Chart:
        type: object
        properties:
          id: {type: string}
          component: {const: Chart}
          chartType:
            enum:
              - doughnut
              - pie
          title: {type: string}
        required:
          - component
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: s1
            catalogId: custom
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Canvas
                children: [c1, c2]
              - id: c1
                component: Chart
                chartType: doughnut
                title: Chart 1
              - id: c2
                component: Chart
                chartType: pie
                title: Chart 2
    - messages:
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Chart
                chartType: bar
      expectError:
        category: "ValidationError"
        surfaceId: "s1"
        path: "/components/0/chartType"
        details:
          - path: "/chartType"
            code: "invalid_value"
            surfaceId: "s1"
        rendererError:
          version: "1.0"
          error:
            code: "VALIDATION_FAILED"
            surfaceId: "s1"
            path: "/components/0/chartType"
            message: "chartType"
    - messages:
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
      expectError:
        category: "ValidationError"
        surfaceId: "s1"
        path: "/components/0/children"
        details:
          - path: "/children"
            code: "missing_field"
            surfaceId: "s1"
        rendererError:
          version: "1.0"
          error:
            code: "VALIDATION_FAILED"
            surfaceId: "s1"
            path: "/components/0/children"
            message: "children"
    - messages:
        - version: "1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: UnknownComponent
      expectError:
        category: "ValidationError"
        surfaceId: "s1"
        path: "/components/0/component"
        details:
          - path: "/component"
            code: "invalid_value"
            surfaceId: "s1"
        rendererError:
          version: "1.0"
          error:
            code: "VALIDATION_FAILED"
            surfaceId: "s1"
            path: "/components/0/component"
            message: "UnknownComponent"

- name: test_v10_topology_circular_reference_error
  features: [F-CORE-12]
  description: Tests that circular component references fail validation in v1.0 strict mode.
  action: validate
  protocolVersion: "1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  strictMode: true
  steps:
    - messages:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "https://a2ui.org/catalogs/basic/v1/catalog.json"
        - version: "1.0"
          updateComponents:
            surfaceId: "s1"
            components:
              - id: "root"
                component: "Column"
                children: {"@child": ["c1"]}
              - id: "c1"
                component: "Column"
                children: {"@child": ["root"]}
      expectError: "Circular component reference"

