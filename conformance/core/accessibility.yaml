  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        components:
          - id: "root"
            component: "Column"
            children: ["submit_btn"]
          - id: "submit_btn"
            component: "Button"
            child: "submit_btn_label"
            action:
              event:
                name: "tap"
          - id: "submit_btn_label"
            component: "Text"
            text: "Submit Form"
  surface:
    id: root
    component: Column
    children: [submit_btn]
    components:
      submit_btn:
        component: Button
        child: "submit_btn_label"
        title: "Submit Form"
        action:
          event:
            name: "tap"
      submit_btn_label:
        component: Text
        text: "Submit Form"
  assertions:
    axeCore:
      - "button-name"
    accessibilityTree:
      submit_btn:
        label: "Submit Form"

- name: test_accessibility_interactive_roles_and_states
  description: Verifies accessibility role mapping and ARIA states for Button, TextField, CheckBox, ChoicePicker.
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        components:
          - id: "root"
            component: "Column"
            children: ["btn", "text_input", "check_box", "choice_picker"]
          - id: "btn"
            component: "Button"
            child: "btn_label"
            action:
              event:
                name: "tap"
            accessibility:
              label: "Submit Feedback"
          - id: "btn_label"
            component: "Text"
            text: "Submit"
          - id: "text_input"
            component: "TextField"
            label: "Your Email"
            accessibility:
              description: "Enter a valid email address"
          - id: "check_box"
            component: "CheckBox"
            label: "I agree to terms"
            value: true
            accessibility:
              label: "Accept Terms and Conditions"
          - id: "choice_picker"
            component: "ChoicePicker"
            variant: "mutuallyExclusive"
            value: ["1"]
            options:
              - label: "Option 1"
                value: "1"
              - label: "Option 2"
                value: "2"
            accessibility:
              label: "Select Preference"
  surface:
    id: root
    component: Column
    children: [btn, text_input, check_box, choice_picker]
    components:
      btn:
        component: Button
        child: "btn_label"
        title: "Submit"
        action:
          event:
            name: "tap"
        accessibility:
          label: "Submit Feedback"
      btn_label:
        component: Text
        text: "Submit"
      text_input:
        component: TextField
        label: "Your Email"
        accessibility:
          description: "Enter a valid email address"
      check_box:
        component: CheckBox
        label: "I agree to terms"
        value: true
        checked: true
        accessibility:
          label: "Accept Terms and Conditions"
      choice_picker:
        component: ChoicePicker
        variant: "mutuallyExclusive"
        value: ["1"]
        options:
          - label: "Option 1"
            value: "1"
          - label: "Option 2"
            value: "2"
        selectedIndex: 0
        accessibility:
          label: "Select Preference"
  assertions:
    axeCore:
      - "button-name"
      - "aria-valid-attr-value"
      - "aria-allowed-attr"
    accessibilityTree:
      btn:
        label: "Submit Feedback"
        role: "button"
      text_input:
        description: "Enter a valid email address"
        role: "textbox"
      check_box:
        label: "Accept Terms and Conditions"
        role: "checkbox"
        checked: true
      choice_picker:
        label: "Select Preference"
        role: "radiogroup"

- name: test_accessibility_dynamic_label_and_hidden_binding
  description: Verifies dynamic data bindings in accessibility attributes (label, hidden) reactively update accessibility trees.
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        dataModel:
          buttonLabel: "Mute Audio"
          isButtonHidden: false
          isStatusHidden: true
        components:
          - id: "root"
            component: "Column"
            children: ["dynamic_btn", "dynamic_status"]
          - id: "dynamic_btn"
            component: "Button"
            child: "dynamic_btn_label"
            action:
              event:
                name: "tap"
            accessibility:
              label:
                "@path": "/buttonLabel"
              hidden:
                "@path": "/isButtonHidden"
          - id: "dynamic_btn_label"
            component: "Text"
            text: "Dynamic Action"
          - id: "dynamic_status"
            component: "Text"
            text: "Status"
            accessibility:
              hidden:
                "@path": "/isStatusHidden"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "a11y_surface"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            dataModel:
              buttonLabel: "Mute Audio"
              isButtonHidden: false
              isStatusHidden: true
            components:
              - id: "root"
                component: "Column"
                children: ["dynamic_btn", "dynamic_status"]
              - id: "dynamic_btn"
                component: "Button"
                child: "dynamic_btn_label"
                action:
                  event:
                    name: "tap"
                accessibility:
                  label:
                    "@path": "/buttonLabel"
                  hidden:
                    "@path": "/isButtonHidden"
              - id: "dynamic_btn_label"
                component: "Text"
                text: "Dynamic Action"
              - id: "dynamic_status"
                component: "Text"
                text: "Status"
                accessibility:
                  hidden:
                    "@path": "/isStatusHidden"
      assertions:
        axeCore:
          - "button-name"
          - "aria-hidden-focus"
        accessibilityTree:
          dynamic_btn:
            label: "Mute Audio"
            hidden: false
          dynamic_status:
            hidden: true
    - messages:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "a11y_surface"
            path: "/buttonLabel"
            value: "Unmute Audio"
        - version: "v1.0"
          updateDataModel:
            surfaceId: "a11y_surface"
            path: "/isButtonHidden"
            value: true
      assertions:
        axeCore:
          - "button-name"
          - "aria-hidden-focus"
        accessibilityTree:
          dynamic_btn:
            label: "Unmute Audio"
            hidden: true
          dynamic_status:
            hidden: true
  surface:
    id: root
    component: Column
    children: [dynamic_btn, dynamic_status]
    components:
      dynamic_btn:
        component: Button
        child: "dynamic_btn_label"
        title: "Dynamic Action"
        action:
          event:
            name: "tap"
        accessibility:
          label:
            "@path": "/buttonLabel"
          hidden:
            "@path": "/isButtonHidden"
      dynamic_btn_label:
        component: Text
        text: "Dynamic Action"
      dynamic_status:
        component: Text
        text: "Status"
        accessibility:
          hidden:
            "@path": "/isStatusHidden"
  assertions:
    axeCore:
      - "button-name"
      - "aria-hidden-focus"
    accessibilityTree:
      dynamic_btn:
        label: "Mute Audio"
        hidden: false
      dynamic_status:
        hidden: true
