- name: test_accessibility_attributes_plumbing
  description: Verifies plumbing of AccessibilityAttributes (label, description, live, hidden) to accessibility node trees and axe-core rules.
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        components:
          - id: "root"
            component: "Column"
            children: ["btn1", "status_text"]
          - id: "btn1"
            component: "Button"
            child: "btn1_label"
            action:
              event:
                name: "tap"
            accessibility:
              label: "Mute Notifications"
              description: "Silences notifications about this conversation"
          - id: "btn1_label"
            component: "Text"
            text: "Mute"
          - id: "status_text"
            component: "Text"
            text: "Status: Active"
            accessibility:
              live: "polite"
  surface:
    id: root
    component: Column
    children: [btn1, status_text]
    components:
      btn1:
        component: Button
        child: "btn1_label"
        title: "Mute"
        action:
          event:
            name: "tap"
        accessibility:
          label: "Mute Notifications"
          description: "Silences notifications about this conversation"
      btn1_label:
        component: Text
        text: "Mute"
      status_text:
        component: Text
        text: "Status: Active"
        accessibility:
          live: "polite"
  assertions:
    axeCore:
      - "button-name"
      - "aria-valid-attr-value"
      - "aria-allowed-attr"
    accessibilityTree:
      btn1:
        label: "Mute Notifications"
        description: "Silences notifications about this conversation"
      status_text:
        live: "polite"

- name: test_accessibility_live_region_assertive
  description: Verifies assertive live region announcement for critical alert banner updates.
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        components:
          - id: "root"
            component: "Card"
            child: "alert_box"
          - id: "alert_box"
            component: "Text"
            text: "Connection Lost!"
            accessibility:
              label: "Critical Alert"
              live: "assertive"
  surface:
    id: root
    component: Card
    child: alert_box
    components:
      alert_box:
        component: Text
        text: "Connection Lost!"
        accessibility:
          label: "Critical Alert"
          live: "assertive"
  assertions:
    axeCore:
      - "aria-valid-attr-value"
    accessibilityTree:
      alert_box:
        label: "Critical Alert"
        live: "assertive"

- name: test_accessibility_hidden_subtree
  description: Verifies that setting hidden=true hides the component and its children from assistive technologies.
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  action: accessibility_check
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "a11y_surface"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        components:
          - id: "root"
            component: "Column"
            accessibility:
              hidden: true
            children: ["visible_text", "decorative_icon"]
          - id: "visible_text"
            component: "Text"
            text: "Visible Content"
          - id: "decorative_icon"
            component: "Icon"
            name: "star"
  surface:
    id: root
    component: Column
    accessibility:
      hidden: true
    children: [visible_text, decorative_icon]
    components:
      visible_text:
        component: Text
        text: "Visible Content"
      decorative_icon:
        component: Icon
        name: "star"
  assertions:
    axeCore:
      - "aria-hidden-focus"
    accessibilityTree:
      root:
        hidden: true

