- name: test_accessibility_attributes_plumbing
  description: Verifies plumbing of AccessibilityAttributes (label, description, live, hidden) to accessibility node trees and axe-core rules.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Column
    children: [btn1, status_text]
    components:
      btn1:
        component: Button
        title: "Mute"
        accessibility:
          label: "Mute Notifications"
          description: "Silences notifications about this conversation"
      status_text:
        component: Text
        text: "Status: Active"
        accessibility:
          live: "polite"
  assertions:
    axeCore:
      - "button-name"
      - "aria-valid-attr-value"
      - "aria-allowed-attr"
    accessibilityTree:
      btn1:
        label: "Mute Notifications"
        description: "Silences notifications about this conversation"
      status_text:
        live: "polite"

- name: test_accessibility_live_region_assertive
  description: Verifies assertive live region announcement for critical alert banner updates.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Container
    child: alert_box
    components:
      alert_box:
        component: Text
        text: "Connection Lost!"
        accessibility:
          label: "Critical Alert"
          live: "assertive"
  assertions:
    axeCore:
      - "aria-valid-attr-value"
    accessibilityTree:
      alert_box:
        label: "Critical Alert"
        live: "assertive"

- name: test_accessibility_hidden_subtree
  description: Verifies that setting hidden=true hides the component and its children from assistive technologies.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Column
    accessibility:
      hidden: true
    children: [visible_text, decorative_icon]
    components:
      visible_text:
        component: Text
        text: "Visible Content"
      decorative_icon:
        component: Icon
        name: "star"
  assertions:
    axeCore:
      - "aria-hidden-focus"
    accessibilityTree:
      root:
        hidden: true

- name: test_accessibility_implicit_label_inference
  description: Verifies default screen reader semantic inference from visible text properties when explicit accessibility attributes are omitted.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Column
    children: [submit_btn]
    components:
      submit_btn:
        component: Button
        title: "Submit Form"
  assertions:
    axeCore:
      - "button-name"
    accessibilityTree:
      submit_btn:
        label: "Submit Form"

- name: test_accessibility_interactive_roles_and_states
  description: Verifies accessibility role mapping and ARIA states for Button, TextField, CheckBox, ChoicePicker.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Column
    children: [btn, text_input, check_box, choice_picker]
    components:
      btn:
        component: Button
        title: "Submit"
        accessibility:
          label: "Submit Feedback"
      text_input:
        component: TextField
        label: "Your Email"
        accessibility:
          description: "Enter a valid email address"
      check_box:
        component: CheckBox
        label: "I agree to terms"
        checked: true
        accessibility:
          label: "Accept Terms and Conditions"
      choice_picker:
        component: ChoicePicker
        options:
          - label: "Option 1"
            value: "1"
          - label: "Option 2"
            value: "2"
        selectedIndex: 0
        accessibility:
          label: "Select Preference"
  assertions:
    axeCore:
      - "button-name"
      - "aria-valid-attr-value"
      - "aria-allowed-attr"
    accessibilityTree:
      btn:
        label: "Submit Feedback"
        role: "button"
      text_input:
        description: "Enter a valid email address"
        role: "textbox"
      check_box:
        label: "Accept Terms and Conditions"
        role: "checkbox"
        checked: true
      choice_picker:
        label: "Select Preference"
        role: "radiogroup"

- name: test_accessibility_dynamic_label_and_hidden_binding
  description: Verifies dynamic data bindings in accessibility attributes (label, hidden) reactively update accessibility trees.
  protocolVersion: "v1.0"
  catalogPath: "specification/v1_0/catalogs/basic/catalog.json"
  action: accessibility_check
  surface:
    id: root
    component: Column
    children: [dynamic_btn, dynamic_status]
    components:
      dynamic_btn:
        component: Button
        title: "Dynamic Action"
        accessibility:
          label:
            path: "/buttonLabel"
          hidden:
            path: "/isButtonHidden"
      dynamic_status:
        component: Text
        text: "Status"
        accessibility:
          hidden:
            path: "/isStatusHidden"
  assertions:
    axeCore:
      - "button-name"
      - "aria-hidden-focus"
    accessibilityTree:
      dynamic_btn:
        label:
          path: "/buttonLabel"
        hidden:
          path: "/isButtonHidden"
      dynamic_status:
        hidden:
          path: "/isStatusHidden"
