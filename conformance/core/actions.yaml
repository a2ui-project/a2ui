# ==============================================================================
# Action Dispatch Conformance Test Suite
# ==============================================================================

- name: test_action_event_basic
  description: Verifies dispatching a basic server event with name only.
  action: dispatch_action
  actionPayload:
    event:
      name: "submit"
  expectDispatched:
    name: "submit"

- name: test_action_event_with_literal_context
  description: Verifies event action preserves literal context properties.
  action: dispatch_action
  actionPayload:
    event:
      name: "filter_change"
      context:
        query: "books"
        limit: 10
        active: true
  expectDispatched:
    name: "filter_change"
    context:
      query: "books"
      limit: 10
      active: true

- name: test_action_event_context_literal_keys_path_and_call
  description: Verifies context keys literally named 'path' and 'call' are preserved as literal keys (D1).
  action: dispatch_action
  actionPayload:
    event:
      name: "save"
      context:
        path: "/custom/file.txt"
        call: "external"
        regular: "data"
  expectDispatched:
    name: "save"
    context:
      path: "/custom/file.txt"
      call: "external"
      regular: "data"

- name: test_action_event_with_data_binding
  description: Verifies event action dynamically resolves bound context values from DataModel.
  action: dispatch_action
  dataModel:
    user:
      id: "u_123"
      role: "admin"
  actionPayload:
    event:
      name: "user_action"
      context:
        userId:
          path: "/user/id"
        role:
          path: "/user/role"
        staticKey: "constant"
  expectDispatched:
    name: "user_action"
    context:
      userId: "u_123"
      role: "admin"
      staticKey: "constant"

- name: test_action_event_with_relative_scope
  description: Verifies event action resolves relative data bindings against the provided scope.
  action: dispatch_action
  scope: "/items/1"
  dataModel:
    items:
      - title: "Item 0"
        id: "id_0"
      - title: "Item 1"
        id: "id_1"
  actionPayload:
    event:
      name: "select_item"
      context:
        selectedId:
          path: "id"
        selectedTitle:
          path: "title"
  expectDispatched:
    name: "select_item"
    context:
      selectedId: "id_1"
      selectedTitle: "Item 1"

- name: test_action_event_with_user_message
  description: Verifies event action preserves and dispatches userMessage.
  action: dispatch_action
  actionPayload:
    event:
      name: "feedback"
      userMessage: "User requested additional details"
      context:
        score: 5
  expectDispatched:
    name: "feedback"
    userMessage: "User requested additional details"
    context:
      score: 5

- name: test_action_direct_name_shorthand
  description: Verifies v0.9 direct action name shorthand is dispatched as an event.
  action: dispatch_action
  actionPayload:
    name: "click"
    context:
      target: "btn1"
  expectDispatched:
    name: "click"
    context:
      target: "btn1"

- name: test_action_function_call_unknown_function_reports_expression_error
  description: >-
    Verifies a functionCall action naming an unregistered function dispatches
    one EXPRESSION_ERROR to the surface's error channel and no server event.
  action: dispatch_action
  actionPayload:
    functionCall:
      call: "noSuchFunction"
  expectDispatchedErrors:
    - code: "EXPRESSION_ERROR"

- name: test_action_event_context_unknown_function_reports_expression_error
  description: >-
    Verifies an event whose context calls an unregistered function dispatches
    one EXPRESSION_ERROR and still dispatches the event, with the failed
    value resolved to null.
  action: dispatch_action
  actionPayload:
    event:
      name: "submit"
      context:
        value:
          call: "noSuchFunction"
        kept: "literal"
  expectDispatched:
    name: "submit"
    context:
      value: null
      kept: "literal"
  expectDispatchedErrors:
    - code: "EXPRESSION_ERROR"
