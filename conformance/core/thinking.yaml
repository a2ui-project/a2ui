# Removing the model's thinking about A2UI before an app shows it to the user
# (issue #3576). `remove_a2ui_thinking` takes one thought and returns it
# without the sentences about the format: those with inline code, a data path,
# or a protocol term. Each case states the whole output, since the point of the
# function is the exact text the user reads.
#
# A sentence ends at `.`, `!` or `?` followed by whitespace, or by closing
# emphasis, quotes or brackets and then whitespace, and never spans a line. A
# list marker such as `1. ` or `- ` belongs to the line, not to its first
# sentence. A line that keeps only some of its sentences has them joined by one
# space after its marker, and keeps a trailing `\r`. A line that loses all of
# them is removed, and so are the blank lines after it, so no gap is left where
# it was. A fenced code block, or a block between a line holding only `<a2ui>`
# (or `<a2ui-json>`) and the line that closes it, is removed whole.

- name: test_keeps_a_thought_about_the_request_unchanged
  action: remove_a2ui_thinking
  input: "**Choosing a dishwasher**\n\nThe family needs a quiet model.  It must fit 60 cm.\n\n* Bosch is the quietest.\n* Miele lasts longest.\n"
  expect: "**Choosing a dishwasher**\n\nThe family needs a quiet model.  It must fit 60 cm.\n\n* Bosch is the quietest.\n* Miele lasts longest.\n"

- name: test_removes_a_sentence_with_inline_code
  action: remove_a2ui_thinking
  input: "The Bosch fits best. I'll put it in a `Card` with a `Button`. It is also the quietest."
  expect: "The Bosch fits best. It is also the quietest."

- name: test_removes_a_sentence_that_names_a_protocol_term
  action: remove_a2ui_thinking
  input: "First I set up the Data Model. The flight lands at 4:30 PM! Is that before evening? Next, the a2ui tags."
  expect: "The flight lands at 4:30 PM! Is that before evening?"

- name: test_removes_a_data_path
  action: remove_a2ui_thinking
  input: "Two guests are coming.\n$/booking/guests = 2\nThey want a quiet room."
  expect: "Two guests are coming.\nThey want a quiet room."

- name: test_removes_a_line_left_empty_with_the_blank_lines_after_it
  action: remove_a2ui_thinking
  input: "**Planning the A2UI screen**\n\nThe user has a $1200 budget.\n\nI'll check the JSON schema.\n\n\nThe Aero 14 costs $1149."
  expect: "The user has a $1200 budget.\n\nThe Aero 14 costs $1149."

- name: test_keeps_surface_and_component_in_their_everyday_sense
  action: remove_a2ui_thinking
  input: "A granite surface resists heat. The pump is the component that fails first."
  expect: "A granite surface resists heat. The pump is the component that fails first."

- name: test_removes_a_thought_that_is_all_about_the_format
  action: remove_a2ui_thinking
  input: "**Writing the DSL**\n\nThe root component is a `Column`.\n"
  expect: ""

- name: test_removes_a_sentence_for_every_protocol_term
  action: remove_a2ui_thinking
  input: "The family needs quiet. A catalog lists them. The syntax is strict. Each data binding is set. The surface id is main. Every component id is unique. The component tree is deep. Each variable name is short. Then createSurface runs. Then updateComponents runs. Then updateDataModel runs. Then deleteSurface runs. The schema matches. The JSON parses. The DSL compiles. The data model holds it. The root component is a Column. The A2UI block is done."
  expect: "The family needs quiet."

- name: test_matches_plurals_and_names_written_without_a_space
  action: remove_a2ui_thinking
  input: "Set the surfaceIds. Fill the dataModels. Check each componentId. Keep it short."
  expect: "Keep it short."

- name: test_matches_only_whole_words
  action: remove_a2ui_thinking
  input: "The surface idea is good. Cataloging takes time. The schematic is clear."
  expect: "The surface idea is good. Cataloging takes time. The schematic is clear."

- name: test_keeps_a_list_marker_with_its_line
  action: remove_a2ui_thinking
  input: "1. Use a `Card`.\n2. Pick the red one. Bind it to $/choice.\n- Set the data model.\n- Show the price."
  expect: "2. Pick the red one.\n- Show the price."

- name: test_ends_a_sentence_after_closing_emphasis
  action: remove_a2ui_thinking
  input: "**Planning the visit.** I add the JSON. She said \"it's late.\" Then the catalog."
  expect: "**Planning the visit.** She said \"it's late.\""

- name: test_removes_a_fenced_code_block_whole
  action: remove_a2ui_thinking
  input: "The Bosch fits.\n```\nroot = Text(\"Hi\")\n```\nIt is quiet."
  expect: "The Bosch fits.\nIt is quiet."

- name: test_removes_an_a2ui_block_whole
  action: remove_a2ui_thinking
  input: "The Bosch fits.\n<a2ui>\nroot = Text(\"Hi\")\n</a2ui>\nI wrap it in <a2ui> tags.\nIt is quiet."
  expect: "The Bosch fits.\nIt is quiet."

- name: test_ignores_trailing_whitespace_and_keeps_crlf
  action: remove_a2ui_thinking
  input: "The JSON is ready. \r\n\r\nShe wants red. \r\nIt fits. I add a `Card`.\r\n"
  expect: "She wants red. \r\nIt fits.\r\n"
