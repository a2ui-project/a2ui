# Conformance cases for reserved protocol keys (@path, @call, @index),
# strict rejection of unknown single-@ keys (^@[^@]), and prefix doubling
# unescaping (@@path -> @path).

- name: test_reserved_at_path_valid
  description: >-
    Valid v1.0 DataBinding using the reserved @path prefix.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: Text
            text:
              "@path": "/user/displayName"

- name: test_reserved_at_call_valid
  description: >-
    Valid v1.0 FunctionCall using the reserved @call prefix.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: Text
            text:
              "@call": "formatString"
              args:
                value: "Hello world"

- name: test_reserved_at_call_index
  description: >-
    Valid v1.0 FunctionCall invoking the @index system context function within a List template.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: List
            children:
              componentId: itemTemplate
              path: "/items"
          - id: itemTemplate
            component: Text
            text:
              "@call": "@index"
              args:
                offset: 1

- name: test_plain_object_with_literal_path_and_call
  description: >-
    A plain object containing 'path' and 'call' keys is valid in v1.0 and is not
    intercepted as a dynamic DataBinding or FunctionCall directive.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: CustomCard
            metadata:
              path: "/var/log/system.log"
              call: "audit"

- name: test_plain_object_escaped_doubled_at_key
  description: >-
    Literal @ keys escaped with prefix doubling (@@path, @@type) validate successfully
    as plain object keys.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: CustomCard
            metadata:
              "@@path": "/static/file"
              "@@type": "Resource"

- name: test_disallowed_unknown_single_at_key
  description: >-
    Dynamic objects containing unknown single-@ keys (^@[^@]) are disallowed to preserve
    backward compatibility for future directives.
  catalog:
    version: "1.0"
  action: validate
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: s1
        components:
          - id: root
            component: CustomCard
            metadata:
              "@if": true
              then: "active"
  expect_error:
    category: "ValidationError"
