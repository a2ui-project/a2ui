- name: "test_error_response_update_components_unallowed_parent"
  description: "Emits UNALLOWED_PARENT with /components/1 when a child component is placed inside a disallowed parent."
  action: "validate"
  protocolVersion: "v1.0"
  catalog:
    catalogId: "test-comp-catalog"
    protocolVersion: "v1.0"
    components:
      Container:
        type: "object"
        properties:
          component: {const: "Container"}
          children: {$ref: "common_types.json#/$defs/ChildList"}
        required: ["component"]
      RestrictedItem:
        type: "object"
        allowedParents: ["SpecialList"]
        properties:
          component: {const: "RestrictedItem"}
        required: ["component"]
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: "main"
        catalogId: "test-comp-catalog"
    - version: "v1.0"
      updateComponents:
        surfaceId: "main"
        components:
          - id: "root"
            component: "Container"
            children: ["item1"]
          - id: "item1"
            component: "RestrictedItem"
  expectError:
    category: "ValidationError"
    code: "UNALLOWED_PARENT"
    surfaceId: "main"
    path: "/components/1"
    details:
      - path: "/components/1"
        code: "UNALLOWED_PARENT"
        surfaceId: "main"
    rendererError:
      version: "v1.0"
      error:
        code: "UNALLOWED_PARENT"
        surfaceId: "main"
        path: "/components/1"
        message: "allowedParents"

