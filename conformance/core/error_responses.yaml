- name: "test_error_response_create_surface_invalid_theme_property"
  description: "Emits VALIDATION_FAILED with /theme/primaryColor when createSurface theme property has wrong type."
  action: "validate"
  protocolVersion: "v0.9"
  catalogPaths:
    - "specification/v0_9/catalogs/basic/catalog.json"
  payload:
    - version: "v0.9"
      createSurface:
        surfaceId: "main"
        catalogId: "https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json"
        theme:
          primaryColor: 12345
  expectError:
    category: "ValidationError"
    surfaceId: "main"
    path: "/theme/primaryColor"
    rendererError:
      version: "v0.9"
      error:
        code: "VALIDATION_FAILED"
        surfaceId: "main"
        path: "/theme/primaryColor"
        message: "primaryColor"

- name: "test_error_response_create_surface_unknown_catalog_id"
