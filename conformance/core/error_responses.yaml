- name: "test_error_response_update_components_buffered_streaming_non_strict"
  description: "Accepts dangling child references and orphaned components without error when strictMode is false."
  action: "validate"
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  strictMode: false
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        - version: "v1.0"
          updateComponents:
            surfaceId: "main"
            components:
              - id: "orphan1"
                component: "Text"
                text: "Buffered child"
              - id: "root"
                component: "Column"
                children: ["orphan1", "dangling_child"]
    - payload:
        - version: "v1.0"
          updateComponents:
            surfaceId: "main"
            components:
              - id: "dangling_child"
                component: "Text"
                text: "Arrived later"

