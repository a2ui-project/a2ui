- name: "test_error_response_update_components_circular_reference"
  description: "Emits RECURSION_LIMIT_EXCEEDED when components form a cycle in strict mode."
  action: "validate"
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  strictMode: true
  payload:
    - version: "v1.0"
      createSurface:
        surfaceId: "main"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
    - version: "v1.0"
      updateComponents:
        surfaceId: "main"
        components:
          - id: "root"
            component: "Column"
            children: ["child1"]
          - id: "child1"
            component: "Column"
            children: ["root"]
  expectError:
    category: "RecursionError"
    surfaceId: "main"
    rendererError:
      version: "v1.0"
      error:
        code: "RECURSION_LIMIT_EXCEEDED"
        surfaceId: "main"
        message: "root"

