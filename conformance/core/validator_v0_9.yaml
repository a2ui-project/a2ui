# ==============================================================================

- name: test_validator_0_9
  description: Tests schema validation of v0.9 message envelopes against the basic v0.9 catalog schema.
  action: validate
  protocolVersion: "v0.9"
  catalogPaths:
    - "specification/v0_9/catalogs/basic/catalog.json"
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: test-id
            catalogId: standard
            theme:
              primaryColor: "#0000ff"
              iconUrl: "http://img"
    - messages:
        - createSurface:
            surfaceId: "123"
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "missing_field"
    - messages:
        - version: "v0.8"
          createSurface:
            surfaceId: "123"
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: 123
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.surfaceId"
            code: "type_mismatch"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "123"
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.catalogId"
            code: "missing_field"

- name: test_custom_catalog_0_9
  description: Tests component property schema validation in v0.9 against custom catalog schema.
  action: validate
  protocolVersion: "v0.9"
  catalog:
    catalogId: "custom"
    components:
      Canvas:
        type: object
        properties:
          component:
            const: Canvas
          children:
            type: array
            items: {type: string}
        required:
          - component
          - children
      Chart:
        type: object
        properties:
          component:
            const: Chart
          chartType:
            enum:
              - doughnut
              - pie
          title:
            type: string
        required:
          - component
          - chartType
          - title
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: s1
            catalogId: custom
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Canvas
                children:
                  - c1
                  - c2
              - id: c1
                component: Canvas
                children: []
              - id: c2
                component: Chart
                chartType: pie
                title: My Chart
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Chart
                chartType: line
                title: Invalid Chart
      expectError:
        category: "ValidationError"
        details:
          - path: "chartType"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
                children: 123
      expectError:
        category: "ValidationError"
        details:
          - path: "children"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
      expectError:
        category: "ValidationError"
        details:
          - path: "children"
            code: "missing_field"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: UnknownComponent
      expectError:
        category: "ValidationError"
        details:
          - path: "component"
            code: "invalid_value"

- name: test_recursion_limit_function_call_depth_exceeded_error
  description: Tests that nested functionCall expressions exceeding maximum depth (5) raise a RecursionError.
  action: validate
  protocolVersion: "v0.9"
  catalogPaths:
    - "specification/v0_9/catalogs/basic/catalog.json"
  strictMode: true
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
            catalogId: "test-catalog"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s1"
            components:
              - id: "root"
                component: "Text"
                text:
                  call: "f1"
                  args:
                    v:
                      call: "f2"
                      args:
                        v:
                          call: "f3"
                          args:
                            v:
                              call: "f4"
                              args:
                                v:
                                  call: "f5"
                                  args:
                                    v:
                                      call: "f6"
                                      args: {}
      expectError: "functionCall depth"

