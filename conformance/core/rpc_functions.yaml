- name: test_rpc_ui_binding_triggers_call_agent_function_async_resolution
  description: Verifies a component property bound to an agent function initially resolves to null/undefined while emitting outbound callAgentFunction, and updates reactively when agentFunctionResponse arrives.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiBindingScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      component:
        id: "root"
        component: "Text"
        text:
          "@call": "fetchRemoteGreeting"
          catalogId: "store_catalog"
          args:
            user: "Ada"
      inboundResponseValue: "Hello from agent, Ada!"
  expect:
    initialValue: null
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "fetchRemoteGreeting"
          catalogId: "store_catalog"
          args:
            user: "Ada"
    resolvedValue: "Hello from agent, Ada!"

- name: test_rpc_ui_action_missing_local_function_fallback_to_agent
  description: Verifies an undeclared function invoked from a UI action in relaxed mode falls back to dispatching callAgentFunction to the agent.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiActionFallbackScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      actionPayload:
        functionCall:
          "@call": "undeclaredAgentAction"
          catalogId: "store_catalog"
          args:
            orderId: "ord-99"
      inboundResponseValue:
        accepted: true
  expect:
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "undeclaredAgentAction"
          catalogId: "store_catalog"
          args:
            orderId: "ord-99"
    result:
      accepted: true
