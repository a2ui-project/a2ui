- name: test_rpc_ui_binding_triggers_call_agent_function_async_resolution
  features: [F-CORE-24, F-CORE-28, F-CORE-29]
  description: Verifies a component property bound to an agent function initially resolves to null/undefined while emitting outbound callAgentFunction, and updates reactively when agentFunctionResponse arrives.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiBindingScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      component:
        id: "root"
        component: "Text"
        text:
          "@call": "fetchRemoteGreeting"
          catalogId: "store_catalog"
          args:
            user: "Ada"
      inboundResponseValue: "Hello from agent, Ada!"
  expect:
    initialValue: null
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "fetchRemoteGreeting"
          catalogId: "store_catalog"
          args:
            user: "Ada"
    resolvedValue: "Hello from agent, Ada!"

- name: test_rpc_ui_action_missing_local_function_fallback_to_agent
  description: Verifies an undeclared function invoked from a UI action in relaxed mode falls back to dispatching callAgentFunction to the agent.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiActionFallbackScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      actionPayload:
        functionCall:
          "@call": "undeclaredAgentAction"
          catalogId: "store_catalog"
          args:
            orderId: "ord-99"
      inboundResponseValue:
        accepted: true
  expect:
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "undeclaredAgentAction"
          catalogId: "store_catalog"
          args:
            orderId: "ord-99"
    result:
      accepted: true

- name: test_rpc_ui_binding_agent_error_resolves_null
  description: Verifies that when a dynamic value binding calling an agent function receives an error response, the binding resolves to null, sibling components render intact, and the surface reports EXPRESSION_ERROR with the failed call's functionCallId.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiBindingScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      components:
        - id: "root"
          component: "Column"
          children:
            - "bound_text"
            - "sibling_text"
        - id: "bound_text"
          component: "Text"
          text:
            "@call": "remoteTitle"
            catalogId: "store_catalog"
            args:
              itemId: "item-42"
        - id: "sibling_text"
          component: "Text"
          text: "Static subtitle"
      observe:
        componentId: "bound_text"
        property: "text"
      inboundResponseError:
        code: "EXECUTION_ERROR"
        message: "Backend unavailable"
  expect:
    initialValue: null
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "remoteTitle"
