- name: test_rpc_call_agent_function_timeout_handling
  features: [F-CORE-39]
  description: Verifies callAgentFunction timeout emitting TIMEOUT error code.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-timeout-1"
      timeoutMs: 10
      callFunction:
        "@call": "longRunningTask"
        catalogId: "basic"
        args: {}
  expectError:
    code: "TIMEOUT"

- name: test_rpc_call_agent_function_duplicate_call_id_error
  description: Verifies callAgentFunction rejecting duplicate pending functionCallId with DUPLICATE error code.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-dup-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
    secondOutboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-dup-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
  expectError:
    code: "DUPLICATE"

- name: test_rpc_call_agent_function_cancelled
  description: Verifies cancelling the surface's pending calls (the surface-scoped cancellation, not a per-call signal) rejects the in-flight callAgentFunction with CANCELLED error code.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-cancel-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
    afterCall: "cancel"
  expectError:
    code: "CANCELLED"

- name: test_rpc_call_agent_function_disposed
  description: Verifies disposing RPC state rejects the in-flight callAgentFunction with CANCELLED (expect.inFlightError) and a callAgentFunction made after dispose with DISPOSED (expectError).
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-disposed-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
    afterCall: "dispose"
  expect:
    inFlightError:
      code: "CANCELLED"
  expectError:
    code: "DISPOSED"

- name: test_rpc_call_agent_function_no_listener
  description: Verifies callAgentFunction without an outbound listener rejects with NO_LISTENER error code.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-no-listener-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
    outboundListener: false
  expectError:
    code: "NO_LISTENER"

- name: test_rpc_call_agent_function_late_response_after_timeout_ignored
  description: Verifies a late agentFunctionResponse arriving after callAgentFunction times out is ignored without mutating settled state.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-late-timeout-1"
      timeoutMs: 10
      callFunction:
        "@call": "longRunningTask"
        catalogId: "basic"
        args: {}
    lateInboundResponse:
      version: "1.0"
      agentFunctionResponse:
        functionCallId: "call-late-timeout-1"
        value:
          status: "too-late"
  expect:
    lateResponseIgnored: true
  expectError:
    code: "TIMEOUT"

- name: test_rpc_call_agent_function_late_response_after_dispose_ignored
  description: Verifies a late agentFunctionResponse arriving after RPC state is disposed is ignored without mutating settled state.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    outboundCall:
      surfaceId: "main_surface"
      functionCallId: "call-late-dispose-1"
      callFunction:
        "@call": "fetchData"
        catalogId: "basic"
        args: {}
    afterCall: "dispose"
    lateInboundResponse:
      version: "1.0"
      agentFunctionResponse:
        functionCallId: "call-late-dispose-1"
        value:
          status: "too-late"
  expect:
    inFlightError:
      code: "CANCELLED"
    lateResponseIgnored: true
  expectError:
    code: "DISPOSED"

- name: test_rpc_call_renderer_function_with_surface_id_and_dynamic_args
  description: Verifies callRendererFunction with surfaceId resolves @path and @call in callFunction.args against the target surface's root DataContext (/).
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    surfaceId: "media_surface"
    dataModel:
      media:
        id: "video-456"
      prefix: "now-"
    message:
      version: "1.0"
      callRendererFunction:
        functionCallId: "call-401"
        surfaceId: "media_surface"
        callFunction:
          "@call": "echoArgs"
          catalogId: "media_catalog"
          args:
            mediaId:
              "@path": "/media/id"
            formatted:
              "@call": "formatString"
              catalogId: "basic"
              args:
                value: "${/prefix}${/media/id}"
    functionMetadata:
      echoArgs:
        allowedCallers: "rendererOrAgent"
        requiresUserActivation: false
  expect:
    response:
      version: "1.0"
      rendererFunctionResponse:
        functionCallId: "call-401"
        value:
          mediaId: "video-456"
          formatted: "now-video-456"

- name: test_rpc_call_renderer_function_format_string_arg_inherits_catalog
  description: Verifies that a formatString call inside callRendererFunction arguments scopes nested ${...} template calls to formatString's catalogId rather than the surface default catalog or outer RPC catalog.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    surfaceId: "media_surface"
    dataModel:
      count: 2
    message:
      version: "1.0"
      callRendererFunction:
        functionCallId: "call-401b"
        surfaceId: "media_surface"
        callFunction:
          "@call": "echoArgs"
          catalogId: "media_catalog"
          args:
            formatted:
              "@call": "formatString"
              catalogId: "basic"
              args:
                value: "Clips: ${pluralize(value: /count, one: 'clip', other: 'clips')}"
    functionMetadata:
      echoArgs:
        allowedCallers: "rendererOrAgent"
        requiresUserActivation: false
  expect:
    response:
      version: "1.0"
      rendererFunctionResponse:
        functionCallId: "call-401b"
        value:
          formatted: "Clips: clips"

