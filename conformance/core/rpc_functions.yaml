- name: test_rpc_call_renderer_function_with_surface_id_and_dynamic_args
  description: Verifies callRendererFunction with surfaceId resolves @path and @call in callFunction.args against the target surface's root DataContext (/).
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    surfaceId: "media_surface"
    dataModel:
      media:
        id: "video-456"
      prefix: "now-"
    message:
      version: "1.0"
      callRendererFunction:
        functionCallId: "call-401"
        surfaceId: "media_surface"
        callFunction:
          "@call": "echoArgs"
          catalogId: "media_catalog"
          args:
            mediaId:
              "@path": "/media/id"
            formatted:
              "@call": "formatString"
              catalogId: "basic"
              args:
                value: "${/prefix}${/media/id}"
    functionMetadata:
      echoArgs:
        allowedCallers: "rendererOrAgent"
        requiresUserActivation: false
  expect:
    response:
      version: "1.0"
      rendererFunctionResponse:
        functionCallId: "call-401"
        value:
          mediaId: "video-456"
          formatted: "now-video-456"

- name: test_rpc_call_renderer_function_without_surface_id_isolated_data_model
  description: Verifies that when surfaceId is omitted on callRendererFunction, @path in callFunction.args resolves against an isolated empty {} data model even when a surface with data exists.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    surfaceId: "existing_surface"
    dataModel:
      secret: "should-not-leak"
    message:
      version: "1.0"
      callRendererFunction:
        functionCallId: "call-402"
        callFunction:
          "@call": "echoArgs"
          catalogId: "media_catalog"
          args:
            leaked:
              "@path": "/secret"
            constant: "safe"
    functionMetadata:
      echoArgs:
        allowedCallers: "rendererOrAgent"
        requiresUserActivation: false
  expect:
    response:
      version: "1.0"
      rendererFunctionResponse:
        functionCallId: "call-402"
        value:
          leaked: null
          constant: "safe"

