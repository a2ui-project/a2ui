- name: test_rpc_ui_action_agent_error_halts_pipeline
  description: Verifies that when an agent function call in an action pipeline receives an error response, earlier effects are preserved, the remaining pipeline halts, and the surface reports EXPRESSION_ERROR with the failed call's functionCallId.
  catalog:
    protocolVersion: "1.0"
  action: handle_rpc
  args:
    uiActionFallbackScenario:
      surfaceId: "main_surface"
      catalogId: "store_catalog"
      localFunctions:
        markStarted:
          returnType: "boolean"
          effect:
            setData:
              path: "/started"
              value: true
        finish:
          returnType: "boolean"
          effect:
            setData:
              path: "/finished"
              value: true
      actionPayload:
        functionCall:
          "@call": "finish"
          catalogId: "store_catalog"
          args:
            steps:
              - "@call": "markStarted"
                catalogId: "store_catalog"
                args: {}
              - "@call": "remoteStep"
                catalogId: "store_catalog"
                args: {}
      inboundResponseError:
        code: "EXECUTION_ERROR"
        message: "Remote step failed"
  expect:
    outboundCall:
      version: "1.0"
      callAgentFunction:
        surfaceId: "main_surface"
        callFunction:
          "@call": "remoteStep"
          catalogId: "store_catalog"
          args: {}
    dataModel:
      started: true
    surfaceError:
      code: "EXPRESSION_ERROR"
      functionCallId: "$outboundCallId"
