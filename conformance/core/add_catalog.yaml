- name: test_add_catalog_rejects_held_catalog_id
  description: addCatalog fails with CatalogError for a catalog whose id the processor already holds.
  action: process_messages
  protocolVersion: "v1.0"
  catalogPaths:
    - "conformance/test_data/catalogs/simplified_catalog_v1_0.json"
  steps:
    - addCatalogPaths:
        - "conformance/test_data/catalogs/simplified_catalog_v1_0.json"
      expectError:
        category: "CatalogError"
