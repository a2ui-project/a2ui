# ==============================================================================
# A2UI Conformance Suite: Pure Schema Validation
#
# This suite verifies that A2UI message envelopes, catalog component properties,
# function call parameters, and theme objects strictly adhere to their respective
# JSON Schema specifications across protocol versions (v0.8, v0.9, v1.0).
# Graph topology and runtime state integrity checks are tested in message_processor.yaml.
# ==============================================================================

# ==============================================================================
# Part 1: Protocol v0.8 Schema Validation
# ==============================================================================

- name: test_validator_0_8
  description: Tests schema validation of v0.8 message envelopes against the standard v0.8 catalog schema.
  action: validate
  protocolVersion: "v0.8"
  catalogPaths:
    - "specification/v0_8/json/standard_catalog_definition.json"
  steps:
    - messages:
        - beginRendering:
            surfaceId: test-id
            root: root
            styles:
              primaryColor: "#ff0000"
    - messages:
        - beginRendering:
            surfaceId: 123
            root: root
      expectError: "123 is not of type 'string'"
    - messages:
        - beginRendering:
            surfaceId: id
            root: root
            styles: not-an-object
      expectError: "'not-an-object' is not of type 'object'"
    - messages:
        - beginRendering:
            surfaceId: id
      expectError: "'root' is a required property"

- name: test_custom_catalog_0_8
  description: Tests component property schema validation in v0.8 against custom catalog schema.
  action: validate
  protocolVersion: "v0.8"
  catalog:
    catalogId: "custom"
    components:
      Canvas:
        type: object
        properties:
          children:
            type: object
            properties:
              explicitList:
                type: array
                items:
                  type: string
            required:
              - explicitList
        required:
          - children
        additionalProperties: false
      Chart:
        type: object
        properties:
          type:
            type: string
            enum:
              - doughnut
              - pie
          chartData:
            type: object
            properties:
              path:
                type: string
            required:
              - path
        required:
          - type
          - chartData
  steps:
    - messages:
        - beginRendering:
            surfaceId: s1
            root: root
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: root
                component:
                  Canvas:
                    children:
                      explicitList:
                        - c1
                        - c2
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: []
              - id: c2
                component:
                  Chart:
                    type: pie
                    chartData:
                      path: /chart
    - messages:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Chart:
                    type: line
                    chartData:
                      path: /chart
      expectError: "'line' is not one of ['doughnut', 'pie']"
    - messages:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: 123
      expectError: "123 is not of type 'array'"
    - messages:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children: {}
      expectError: "'explicitList' is a required property"
    - messages:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: []
                    extraProperty: should-fail
      expectError: "Additional properties are not allowed"
    - messages:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  UnknownComponent:
                    foo: "bar"
      expectError: "'UnknownComponent' was unexpected"

# ==============================================================================
# Part 2: Protocol v0.9 / v0.9.1 Schema Validation
# ==============================================================================

- name: test_validator_0_9
  description: Tests schema validation of v0.9 message envelopes against the basic v0.9 catalog schema.
  action: validate
  protocolVersion: "v0.9"
  catalogPaths:
    - "specification/v0_9/catalogs/basic/catalog.json"
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: test-id
            catalogId: standard
            theme:
              primaryColor: "#0000ff"
              iconUrl: "http://img"
    - messages:
        - createSurface:
            surfaceId: "123"
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "missing_field"
    - messages:
        - version: "v0.8"
          createSurface:
            surfaceId: "123"
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: 123
            catalogId: standard
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.surfaceId"
            code: "type_mismatch"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "123"
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.catalogId"
            code: "missing_field"

- name: test_custom_catalog_0_9
  description: Tests component property schema validation in v0.9 against custom catalog schema.
  action: validate
  catalog:
    catalogId: "custom"
    components:
      Canvas:
        type: object
        properties:
          component:
            const: Canvas
          children:
            type: array
            items: {type: string}
        required:
          - component
          - children
      Chart:
        type: object
        properties:
          component:
            const: Chart
          chartType:
            enum:
              - doughnut
              - pie
          title:
            type: string
        required:
          - component
          - chartType
          - title
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: s1
            catalogId: custom
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Canvas
                children:
                  - c1
                  - c2
              - id: c1
                component: Canvas
                children: []
              - id: c2
                component: Chart
                chartType: pie
                title: My Chart
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Chart
                chartType: line
                title: Invalid Chart
      expectError:
        category: "ValidationError"
        details:
          - path: "chartType"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
                children: 123
      expectError:
        category: "ValidationError"
        details:
          - path: "children"
            code: "invalid_value"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
      expectError:
        category: "ValidationError"
        details:
          - path: "children"
            code: "missing_field"
    - messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: UnknownComponent
      expectError:
        category: "ValidationError"
        details:
          - path: "component"
            code: "invalid_value"

# ==============================================================================
# Part 3: Protocol v1.0 Schema Validation
# ==============================================================================

- name: test_validator_1_0
  description: Tests schema validation of v1.0 message envelopes (inline components, optional catalogId, data deletion) against the basic v1.0 catalog schema.
  action: validate
  protocolVersion: "v1.0"
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            sendDataModel: true
            components:
              - id: "root"
                component: "Text"
                text: "Inline Text"
            dataModel:
              counter: 100
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_nocat"
    - messages:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/user/token"
            value: null
    - messages:
        - createSurface:
            surfaceId: "s1"
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "missing_field"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "invalid_value"
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: 123
      expectError:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.surfaceId"
            code: "type_mismatch"

- name: test_custom_catalog_1_0
  description: Tests component property schema validation in v1.0 against custom catalog schema.
  action: validate
  protocolVersion: "v1.0"
  catalog:
    catalogId: "custom"
    components:
      Canvas:
        type: object
        properties:
          id: {type: string}
          component: {const: Canvas}
          children:
            type: array
            items: {type: string}
        required:
          - component
          - children
      Chart:
        type: object
        properties:
          id: {type: string}
          component: {const: Chart}
          chartType:
            enum:
              - doughnut
              - pie
          title: {type: string}
        required:
          - component
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: s1
            catalogId: custom
        - version: "v1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Canvas
                children: [c1, c2]
              - id: c1
                component: Chart
                chartType: doughnut
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Chart
                chartType: bar
      expectError:
        category: "ValidationError"
        details:
          - path: "chartType"
            code: "invalid_value"
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
      expectError:
        category: "ValidationError"
        details:
          - path: "children"
            code: "missing_field"
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: UnknownComponent
      expectError:
        category: "ValidationError"
        details:
          - path: "component"
            code: "invalid_value"

- name: test_validator_theme_schema
  description: Tests schema validation of surface theme properties against catalog theme schema.
  action: validate
  catalog:
    catalogId: "theme_cat"
    theme:
      type: "object"
      properties:
        primaryColor:
          type: "string"
          pattern: "^#[0-9a-fA-F]{6}$"
      required: ["primaryColor"]
      additionalProperties: false
  steps:
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
            catalogId: "theme_cat"
            theme:
              primaryColor: "#ff0000"
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
            catalogId: "theme_cat"
            theme:
              primaryColor: "not-a-hex"
      expectError:
        category: "ValidationError"
