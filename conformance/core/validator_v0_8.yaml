- name: test_v08_multi_surface_independent_roots
  description: Tests that two surfaces with different root IDs are each validated against their own root in v0.8 strict mode.
  action: validate
  protocolVersion: v0.8
  catalogPaths:
    - specification/v0_8/json/standard_catalog_definition.json
  strictMode: true
  steps:
    - messages:
        - beginRendering:
            surfaceId: surface_a
            root: root_a
        - beginRendering:
            surfaceId: surface_b
            root: root_b
        - surfaceUpdate:
            surfaceId: surface_a
            components:
              - id: root_a
                component:
                  Column:
                    children:
                      explicitList:
                        - child_a
              - id: child_a
                component:
                  Text:
                    text:
                      literalString: Hello A
        - surfaceUpdate:
            surfaceId: surface_b
            components:
              - id: root_b
                component:
                  Column:
                    children:
                      explicitList:
                        - child_b
              - id: child_b
                component:
                  Text:
                    text:
                      literalString: Hello B

- name: test_v08_multi_surface_missing_root_error
