- name: test_v08_property_nesting_depth_limit_exceeded_error
  description: Tests that a component property nested deeper than the global limit (50) fails validation in v0.8 strict mode.
  action: validate
  protocolVersion: v0.8
  catalog:
    catalogId: deep_catalog
    components:
      DeepComp:
        type: object
        additionalProperties: true
  strictMode: true
  steps:
    - messages:
        - beginRendering:
            surfaceId: s1
