  action: validate
  protocolVersion: v0.8
  catalogPaths:
    - specification/v0_8/json/standard_catalog_definition.json
  strictMode: true
  steps:
    - messages:
        - beginRendering:
            surfaceId: s1
            root: root
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: root
                component:
                  Column:
                    children:
                      explicitList:
                        - c1
              - id: c1
                component:
                  Text:
                    text:
                      literalString: A
              - id: c1
                component:
                  Text:
                    text:
                      literalString: B
      expectError:
        category: ValidationError
        message: Duplicate component ID

