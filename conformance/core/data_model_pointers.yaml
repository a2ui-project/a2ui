- name: test_pointer_escape_characters
  description: Verifies RFC 6901 JSON Pointer escape sequence resolution (~0 for ~ and ~1 for /).
  catalog:
    protocol_version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "basic"
            dataModel:
              "a/b":
                "c~d": "original_value"
              "slash/key": 100
    - payload:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/a~1b/c~0d"
            value: "escaped_value"
  expect:
    surfaces:
      s1:
        dataModel:
          "a/b":
            "c~d": "escaped_value"
          "slash/key": 100

- name: test_pointer_array_indexing
  description: Verifies numeric array indexing in JSON Pointers (/items/0, /items/1).
  catalog:
    protocol_version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "basic"
            dataModel:
              items: ["first", "second", "third"]
    - payload:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/items/1"
            value: "updated_second"
  expect:
    surfaces:
      s1:
        dataModel:
          items: ["first", "updated_second", "third"]

- name: test_pointer_auto_vivification
  description: Verifies automatic intermediate object creation when setting deep uncreated JSON Pointer paths.
  catalog:
    protocol_version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "basic"
            dataModel: {}
    - payload:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/deeply/nested/structure/key"
            value: "vivified_value"
  expect:
    surfaces:
      s1:
        dataModel:
          deeply:
            nested:
              structure:
                key: "vivified_value"
