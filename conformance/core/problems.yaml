# Problem reporting conformance suite: delivery timing (T1 to T6), delivery
# after deletion (X1), and lazy evaluation on unmounted surfaces (L1). See
# problems.md for the catalog, steps and assertions.
#
# The web_core runner skips these cases by name, and the Swift runner does not
# load this suite, until each SDK implements problem reporting.
#
# Step mappings:
#   * `await_delivery` waits one microtask: `Future<void>.microtask(() {})`
#     in Dart. Each port defines its own.
#   * `expect_reports` asserts the reports delivered since the start of the
#     case or the previous `expect_reports` assertion, in delivery order.

- name: T1_resolve_defers_delivery
  description: >-
    No listener runs before NodeResolver construction returns, and one has run
    after delivery.
  protocolVersion: "v0.9"
  action: report_problems
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Bogus"
      expect_reports: []
    - op: construct_resolver
      surfaceId: "s"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"

- name: T2_data_write_and_action_defer_delivery
  description: >-
    No listener runs before a data write or an action invocation returns, and
    one has run after delivery for each.
  protocolVersion: "v0.9"
  action: report_problems
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateDataModel:
            surfaceId: "s"
            path: "/flag"
            value: false
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Column"
                children: ["txt", "btn"]
              - id: "txt"
                component: "Text"
                text:
                  call: "maybeFail"
                  args:
                    flag:
                      path: "/flag"
                  returnType: "string"
              - id: "btn"
                component: "Button"
                action:
                  event:
                    name: "go"
                    context:
                      v:
                        call: "maybeFail"
                        args:
                          flag: true
                        returnType: "string"
    - op: construct_resolver
      surfaceId: "s"
    - op: await_delivery
      expect_reports: []
    - op: set
      surfaceId: "s"
      path: "/flag"
      value: true
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "EXPRESSION_ERROR"
          surfaceId: "s"
    - op: invoke_action
      surfaceId: "s"
      node: "btn"
      property: "action"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "EXPRESSION_ERROR"
          surfaceId: "s"

- name: T3_throwing_listener_does_not_stop_next_item
  description: >-
    A listener that throws on the first report does not stop delivery to a
    second listener or delivery of the next item.
  protocolVersion: "v0.9"
  action: report_problems
  listeners: ["first", "second"]
  throwOnFirstReport: true
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Column"
                children: ["a", "b"]
              - id: "a"
                component: "Bogus"
              - id: "b"
                component: "OtherBogus"
    - op: construct_resolver
      surfaceId: "s"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - listener: "first"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"
        - listener: "second"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"
        - listener: "first"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"
        - listener: "second"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"

- name: T4_resolve_and_dispose_at_once_delivers
  description: >-
    A resolver constructed and disposed in the same turn still delivers its
    reports.
  protocolVersion: "v0.9"
  action: report_problems
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Bogus"
    - op: construct_resolver
      surfaceId: "s"
      disposeImmediately: true
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"

- name: T5_listener_disposing_resolver_gets_remaining_items
  description: >-
    A listener that disposes the resolver on the first report still receives
    the remaining reports.
  protocolVersion: "v0.9"
  action: report_problems
  disposeResolverOnFirstReport: "s"
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Column"
                children: ["a", "b"]
              - id: "a"
                component: "Bogus"
              - id: "b"
                component: "OtherBogus"
    - op: construct_resolver
      surfaceId: "s"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"

- name: T6_errors_and_warnings_arrive_in_discovery_order
  description: >-
    Surface listeners receive errors and warnings in discovery order (error,
    warning, error), a microtask after the update that found them.
  protocolVersion: "v0.9"
  action: report_problems
  listeners: ["surface"]
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Text"
                text: "ready"
    - op: construct_resolver
      surfaceId: "s"
    - op: await_delivery
      expect_reports: []
    - op: process_messages
      messages:
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Column"
                children: ["a", "b", "c"]
              - id: "a"
                component: "Bogus"
              - id: "b"
                component: "Text"
                text:
                  path: "/missing"
              - id: "c"
                component: "OtherBogus"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - listener: "surface"
          kind: "error"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"
        - listener: "surface"
          kind: "warning"
          code: "MISSING_DATA_BINDING"
          path: "/missing"
        - listener: "surface"
          kind: "error"
          code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "s"

- name: X1_delete_surface_before_delivery_still_delivers
  description: >-
    deleteSurface before delivery still delivers what that surface reported
    before it was deleted.
  protocolVersion: "v0.9"
  action: report_problems
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "a"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          createSurface:
            surfaceId: "b"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "a"
            components:
              - id: "root"
                component: "Bogus"
        - version: "v0.9"
          updateComponents:
            surfaceId: "b"
            components:
              - id: "root"
                component: "Bogus"
    - op: construct_resolver
      surfaceId: "a"
      disposeImmediately: true
      expect_reports: []
    - op: construct_resolver
      surfaceId: "b"
      disposeImmediately: true
      expect_reports: []
    - op: delete_surface
      surfaceId: "a"
      expect_reports: []
    - op: await_delivery
      expect_reports:
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "a"
        - code: "UNKNOWN_COMPONENT_TYPE"
          surfaceId: "b"

- name: L1_unmounted_surface_evaluates_no_function
  description: >-
    A surface with no mounted resolver evaluates no catalog function when
    messages and data updates are processed.
  protocolVersion: "v0.9"
  action: report_problems
  steps:
    - op: process_messages
      messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "s"
            catalogId: "problem-delivery-test"
        - version: "v0.9"
          updateComponents:
            surfaceId: "s"
            components:
              - id: "root"
                component: "Text"
                text:
                  call: "reenter"
                  args:
                    tick:
                      path: "/tick"
                  returnType: "string"
        - version: "v0.9"
          updateDataModel:
            surfaceId: "s"
            path: "/tick"
            value: 1
        - version: "v0.9"
          updateDataModel:
            surfaceId: "s"
            path: "/tick"
            value: 2
      expect_reports: []
    - op: await_delivery
      expect_reports: []
      expectFunctionCalls: 0
