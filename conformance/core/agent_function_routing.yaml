    Verifies a call to an unknown reserved `@` system function is never sent to the agent and fails locally with an EXPRESSION_ERROR.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "@unknownSystemFunction"
        args: {}
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"

- name: test_agent_routing_identical_calls_share_one_request
  description: >-
    Verifies a second identical call made while the first awaits its response sends no request of its own, and both receive the agent's answer.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectValues: [null, null]
    - respond:
        call: 0
        value: 1.08
      expectValues: [1.08, 1.08]

- name: test_agent_routing_call_naming_default_catalog_shares_request
  description: >-
    Verifies a call that names the surface default catalog and an identical call that relies on it are the same call, so they share one request.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - evaluate:
        "@call": "fetchFxRate"
        catalogId: "conformance/routing"
        args:
          base: "EUR"
      expectValues: [null, null]
    - respond:
        call: 0
        value: 1.08
      expectValues: [1.08, 1.08]

- name: test_agent_routing_different_arguments_send_separate_requests
  description: >-
    Verifies calls to the same function with different arguments are separate requests, each answered on its own.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "USD"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "USD"
      expectValues: [null, null]
    - respond:
        call: 1
        value: 1.0
      expectValues: [null, 1.0]
    - respond:
        call: 0
        value: 1.08
      expectValues: [1.08, 1.0]

- name: test_agent_routing_check_rule_passes
  description: >-
    Verifies the condition of a check rule is sent to the agent, and the rule passes once the agent answers true.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "isAvailable"
        args:
          sku: "A-1"
      as: check
      expectOutbound:
        - "@call": "isAvailable"
          catalogId: "conformance/routing"
          args:
            sku: "A-1"
    - respond:
        call: 0
        value: true
      expectValues: [true]

- name: test_agent_routing_check_rule_fails
  description: >-
    Verifies the condition of a check rule is sent to the agent, and the rule fails once the agent answers false.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "isAvailable"
        args:
          sku: "B-2"
      as: check
      expectOutbound:
        - "@call": "isAvailable"
          catalogId: "conformance/routing"
          args:
            sku: "B-2"
    - respond:
        call: 0
        value: false
      expectValues: [false]

- name: test_agent_routing_action_function_call
  description: >-
    Verifies the functionCall of an action is sent to the agent when the action runs, and a value response completes it without errors.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "submitOrder"
        args:
          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - respond:
        call: 0
        value: true

- name: test_agent_routing_action_agent_error_is_expression_error
  description: >-
    Verifies an agent error response to the functionCall of an action is reported as an EXPRESSION_ERROR carrying the agent's message.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "submitOrder"
        args:
          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - respond:
        call: 0
        error:
          code: "EXECUTION_ERROR"
          message: "Order o-1 was rejected"
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Order o-1 was rejected"

- name: test_agent_routing_schema_only_function_sends_parsed_arguments
  description: >-
    Verifies a function the resolved catalog declares without an implementation is sent to the agent with its arguments parsed against its schema, so schema defaults are applied.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        quote:
          args:
            type: object
            properties:
              symbol:
                type: string
              currency:
                type: string
                default: "USD"
            required: [symbol]
            additionalProperties: false
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "quote"
        args:
          symbol: "GOOG"
      expectOutbound:
        - "@call": "quote"
          catalogId: "conformance/routing"
          args:
            symbol: "GOOG"
            currency: "USD"
      expectValues: [null]
    - respond:
        call: 0
        value: 180
      expectValues: [180]

- name: test_agent_routing_schema_only_function_with_invalid_arguments_is_not_sent
  description: >-
    Verifies a call to a schema-only function whose arguments do not match its schema is reported as an EXPRESSION_ERROR and is not sent to the agent.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        quote:
          args:
            type: object
            properties:
              symbol:
                type: string
              currency:
                type: string
                default: "USD"
            required: [symbol]
            additionalProperties: false
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "quote"
        args:
          symbol: 42
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Validation failed for function 'quote'"

- name: test_agent_routing_schema_only_function_requires_user_activation
  description: >-
    Verifies a schema-only function that requires user activation is not sent from a binding, which reports an EXPRESSION_ERROR, but is sent when an action runs it.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        confirmOrder:
          args:
            type: object
          requiresUserActivation: true
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "confirmOrder"
        args: {}
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "requires user activation"
    - evaluate:
        "@call": "confirmOrder"
        args: {}
      as: action
      expectOutbound:
        - "@call": "confirmOrder"
          catalogId: "conformance/routing"
          args: {}
