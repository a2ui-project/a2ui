  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value: "Hello"
      expectValues: ["Hello"]

- name: test_agent_routing_agent_result_feeds_local_function
  description: >-
    Verifies an agent call nested in the arguments of a local function is sent first, and the local function runs with the agent's answer once it arrives.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
