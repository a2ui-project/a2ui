        userMessage:
          "@call": "fetchGreeting"
          args: {}
      as: event
      expectOutbound:
        - "@call": "fetchGreeting"
          catalogId: "conformance/routing"
          args: {}
    - respond:
        call: 0
        value: null
      expectActions:
        - name: "send"
          context: {}

- name: test_agent_routing_cancelled_call_is_sent_again_when_its_value_is_rewritten
  description: >-
    Verifies an agent call cancelled while the surface stays live reports no error and is not remembered as a failure, so the binding sends it again when the object its argument is bound to is replaced by an equal one, and takes the answer. A core whose data model does not notify subscribers of an equal value runs test_agent_routing_cancelled_call_is_sent_again_on_unrelated_change instead.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  dataModel:
    pair:
      base: "EUR"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          pair:
            "@path": "/pair"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            pair:
              base: "EUR"
      expectValues: [null]
    - cancelSurfaceCalls: true
      expectValues: [null]
    - updateData:
        path: "/pair"
        value:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            pair:
              base: "EUR"
      expectValues: [null]
    - respond:
        call: 1
        value: 1.08
      expectValues: [1.08]

- name: test_agent_routing_cancelled_call_is_sent_again_on_unrelated_change
  description: >-
    Verifies an agent call cancelled while the surface stays live reports no error and is not remembered as a failure, so the binding sends it again when an unrelated path the binding reads changes, unlike a call the agent failed. A core that re-evaluates a nested call only when its own arguments change runs test_agent_routing_cancelled_call_is_sent_again_when_its_value_is_rewritten instead.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  dataModel:
    base: "EUR"
    label: "Rate"
  steps:
    - evaluate:
        "@call": "outerAgent"
        args:
          rate:
            "@call": "fetchFxRate"
            args:
              base:
                "@path": "/base"
          label:
            "@path": "/label"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - cancelSurfaceCalls: true
      expectValues: [null]
    - updateData:
        path: "/label"
        value: "Exchange rate"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]

- name: test_agent_routing_template_part_never_routes
  description: >-
    Verifies a formatString template part that calls a function the catalog does not implement is reported as an EXPRESSION_ERROR naming the function and renders empty without sending anything, also when the surface already holds an answer for that exact call.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value: "Rate: ${fetchRate(id: 7)}"
      expectValues: ["Rate: "]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchRate"
    - evaluate:
        "@call": "fetchRate"
        args:
          id: 7
      expectOutbound:
        - "@call": "fetchRate"
          catalogId: "conformance/routing"
          args:
            id: 7
      expectValues: ["Rate: ", null]
    - respond:
        call: 0
        value: 1.08
      expectValues: ["Rate: ", 1.08]
    - evaluate:
        "@call": "formatString"
        args:
          value: "Rate: ${fetchRate(id: 7)}"
      expectValues: ["Rate: ", 1.08, "Rate: "]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchRate"

- name: test_agent_routing_sibling_agent_arguments_are_sent_together
  description: >-
    Verifies agent calls in sibling arguments of one function are all sent, in any order, before any is answered, and that when one fails the enclosing call is not sent, the failure is reported once, and the other sibling's later answer changes nothing.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "outerAgent"
        args:
          rate:
            "@call": "fetchFxRate"
            args:
              base: "EUR"
          stock:
            "@call": "lookupSku"
            args:
              sku: "A-1"
      outboundInAnyOrder: true
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
        - "@call": "lookupSku"
          catalogId: "conformance/routing"
          args:
            sku: "A-1"
      expectValues: [null]
    - respond:
        call: 0
        error:
          code: "EXECUTION_ERROR"
          message: "Sibling lookup failed"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Sibling lookup failed"
    - respond:
        call: 1
        value: 3
      expectValues: [null]

- name: test_agent_routing_refused_call_in_action_is_expression_error
  description: >-
    Verifies a local call refused before it runs, because its arguments fail the function's schema, is reported as an EXPRESSION_ERROR in an action, and in an event action's context, which is then not dispatched.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
