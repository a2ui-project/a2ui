- name: test_agent_routing_failed_call_is_resent_only_when_its_arguments_change
  description: >-
    Verifies a binding whose agent call failed does not send it again when an unrelated path the binding reads changes, and sends it again when the call's own arguments change.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  dataModel:
    base: "EUR"
    label: "Rate"
  steps:
    - evaluate:
        "@call": "outerAgent"
        args:
          rate:
            "@call": "fetchFxRate"
            args:
              base:
                "@path": "/base"
          label:
            "@path": "/label"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - respond:
        call: 0
        error:
          code: "EXECUTION_ERROR"
          message: "Rate feed offline"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Rate feed offline"
    - updateData:
        path: "/label"
        value: "Exchange rate"
      expectValues: [null]
    - updateData:
        path: "/base"
        value: "USD"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "USD"
      expectValues: [null]

- name: test_agent_routing_event_user_message_must_be_a_string
  description: >-
    Verifies an event action whose userMessage resolves to a value that is neither a string nor null, synchronously from a binding or asynchronously from an agent call, reports an INVALID_ACTION and is not dispatched.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  dataModel:
    count: 3
  steps:
    - evaluate:
        name: "send"
        userMessage:
          "@path": "/count"
      as: event
      expectErrors:
        - code: "INVALID_ACTION"
    - evaluate:
        name: "send"
        userMessage:
          "@call": "fetchGreeting"
          args: {}
      as: event
      expectOutbound:
        - "@call": "fetchGreeting"
          catalogId: "conformance/routing"
          args: {}
    - respond:
        call: 0
        value: 42
      expectErrors:
        - code: "INVALID_ACTION"

- name: test_agent_routing_event_null_user_message_is_absent
  description: >-
    Verifies an event action whose userMessage resolves to null, from a binding to a missing path or from an agent's null answer, is dispatched without a userMessage and reports no error.
  action: route_agent_function
  protocolVersion: "1.0"
