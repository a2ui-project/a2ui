      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
    - evaluate:
        "@call": "isAvailable"
        args:
          sku: "A-1"
      as: check
      expectOutbound:
        - "@call": "isAvailable"
          catalogId: "conformance/routing"
          args:
            sku: "A-1"
    - evaluate:
        "@call": "submitOrder"
