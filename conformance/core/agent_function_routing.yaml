  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value:
            "@call": "fetchGreeting"
            args: {}
      expectOutbound:
        - "@call": "fetchGreeting"
          catalogId: "conformance/routing"
          args: {}
      expectValues: [null]
    - respond:
        call: 0
        value: "Hello"
      expectValues: ["Hello"]

- name: test_agent_routing_agent_error_is_expression_error
  description: >-
    Verifies an agent error response is reported as an EXPRESSION_ERROR carrying the agent's message, and the value stays null.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - respond:
        call: 0
        error:
          code: "UNKNOWN_FUNCTION"
          message: "No such function: fetchFxRate"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "No such function: fetchFxRate"
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null, null]

