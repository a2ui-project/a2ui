          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - deleteSurface: true

- name: test_agent_routing_event_action_after_delete_surface_sends_nothing
  description: >-
    Verifies an event action waiting on an agent call when the surface is deleted sends none of its later calls, reports no error, and is not dispatched.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
