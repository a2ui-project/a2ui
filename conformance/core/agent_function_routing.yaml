- name: test_agent_routing_action_calls_never_share_or_cache
  description: >-
    Verifies imperative action function calls never share an in-flight request and never read from or populate the surface value cache, executing fresh on every action.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "submitOrder"
        args:
          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - evaluate:
        "@call": "submitOrder"
        args:
          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - respond:
        call: 0
        value: true
    - respond:
        call: 1
        value: true
    - evaluate:
        "@call": "submitOrder"
        args:
          id: "o-1"
      as: action
      expectOutbound:
        - "@call": "submitOrder"
          catalogId: "conformance/routing"
          args:
            id: "o-1"
    - respond:
        call: 2
        value: true

- name: test_agent_routing_check_rule_validation_result_and_error
  description: >-
    Verifies a check rule condition routed to the agent handles ValidationResult object responses (valid true/false) and fails closed while reporting EXPRESSION_ERROR when the agent responds with an error.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "checkCoupon"
        args:
          code: "EXPIRED"
      as: check
      expectOutbound:
        - "@call": "checkCoupon"
          catalogId: "conformance/routing"
          args:
            code: "EXPIRED"
    - respond:
        call: 0
        value:
          valid: false
          message: "Coupon expired"
      expectValues: [false]
    - evaluate:
        "@call": "checkCoupon"
        args:
          code: "SAVE10"
      as: check
      expectOutbound:
        - "@call": "checkCoupon"
          catalogId: "conformance/routing"
          args:
            code: "SAVE10"
    - respond:
        call: 1
        value:
          valid: true
          message: "10% off"
      expectValues: [false, true]
    - evaluate:
        "@call": "checkCoupon"
        args:
          code: "ERR"
      as: check
      expectOutbound:
        - "@call": "checkCoupon"
          catalogId: "conformance/routing"
          args:
            code: "ERR"
    - respond:
        call: 2
        error:
          code: "EXECUTION_ERROR"
          message: "Coupon service unavailable"
      expectValues: [false, true, false]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Coupon service unavailable"

- name: test_agent_routing_event_context_resolves_in_order
  description: >-
    Verifies the context entries of an event action are resolved one after another in declared order, so a later agent call is sent only once the earlier one has answered, and the action is dispatched with every answer once the last call settles.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        name: "checkout"
        context:
          rate:
            "@call": "fetchFxRate"
            args:
              base: "EUR"
          stock:
            "@call": "lookupSku"
            args:
              sku: "A-1"
      as: event
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
    - respond:
        call: 0
        value: 1.08
      expectOutbound:
        - "@call": "lookupSku"
          catalogId: "conformance/routing"
          args:
            sku: "A-1"
    - respond:
        call: 1
        value: 3
      expectActions:
        - name: "checkout"
          context:
            rate: 1.08
            stock: 3

- name: test_agent_routing_event_context_stops_at_first_failure
  description: >-
    Verifies that when an agent call in an event action's context fails, the failure is reported once as an EXPRESSION_ERROR, no later context entry is evaluated, so no later call is sent, and the action is not dispatched.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        name: "checkout"
        context:
          rate:
            "@call": "fetchFxRate"
            args:
              base: "EUR"
          stock:
            "@call": "lookupSku"
            args:
              sku: "A-1"
      as: event
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
    - respond:
        call: 0
        error:
          code: "EXECUTION_ERROR"
          message: "Rate feed offline"
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Rate feed offline"

- name: test_agent_routing_non_json_argument_fails_locally
  description: >-
    Verifies a call whose resolved arguments hold a number with no JSON form (NaN or an infinity) is not sent to the agent and fails locally with an EXPRESSION_ERROR naming the function.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          amount: .nan
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchFxRate"
    - evaluate:
        "@call": "fetchFxRate"
        args:
          amount: .inf
      as: action
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchFxRate"

- name: test_agent_routing_cancelled_calls_report_no_error
  description: >-
    Verifies deleting the surface cancels its pending agent calls from a binding, a check rule and an action without reporting an error for any of them.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
