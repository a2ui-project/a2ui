# Fallback routing of function calls to the agent with `callAgentFunction`
# ("Function Location Resolution & Fallback Routing" in
# specification/v1_0/docs/a2ui_protocol.md). Every case builds its catalogs,
# creates surface `main` through a message processor, evaluates function calls
# on it, and answers the `callAgentFunction` messages the processor sends. See
# "Writing cases for `route_agent_function`" in conformance/README.md.

- name: test_agent_routing_undeclared_function_names_resolved_catalog
  description: >-
    Verifies a call to a function the surface default catalog does not declare is sent to the agent with its bound arguments resolved, naming the default catalog even though the call names no catalogId, and that its value is null until the agent answers.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  dataModel:
    base: "EUR"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base:
            "@path": "/base"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - respond:
        call: 0
        value: 1.08
      expectValues: [1.08]

- name: test_agent_routing_explicit_catalog_id_is_carried
  description: >-
    Verifies a call that names an available catalog other than the surface default, which does not declare the function, is sent to the agent naming that catalog.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
    - catalogId: "conformance/routing_extra"
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "lookupSku"
        catalogId: "conformance/routing_extra"
        args:
          sku: "A-1"
      expectOutbound:
        - "@call": "lookupSku"
          catalogId: "conformance/routing_extra"
          args:
            sku: "A-1"
      expectValues: [null]
    - respond:
        call: 0
        value:
          inStock: 3
      expectValues:
        - inStock: 3

- name: test_agent_routing_implemented_function_runs_locally
  description: >-
    Verifies a call to a function the resolved catalog implements runs on the renderer and nothing is sent to the agent.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value: "Hello"
      expectValues: ["Hello"]

- name: test_agent_routing_agent_result_feeds_local_function
  description: >-
    Verifies an agent call nested in the arguments of a local function is sent first, and the local function runs with the agent's answer once it arrives.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value:
            "@call": "fetchGreeting"
            args: {}
      expectOutbound:
        - "@call": "fetchGreeting"
          catalogId: "conformance/routing"
          args: {}
      expectValues: [null]
    - respond:
        call: 0
        value: "Hello"
      expectValues: ["Hello"]

- name: test_agent_routing_agent_error_is_expression_error
  description: >-
    Verifies an agent error response is reported as an EXPRESSION_ERROR carrying the agent's message, and the value stays null.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null]
    - respond:
        call: 0
        error:
          code: "UNKNOWN_FUNCTION"
          message: "No such function: fetchFxRate"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "No such function: fetchFxRate"

- name: test_agent_routing_unknown_catalog_is_catalog_error
  description: >-
