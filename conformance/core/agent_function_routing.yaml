  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        catalogId: "conformance/missing"
        args:
          base: "EUR"
      expectValues: [null]
      expectErrors:
        - code: "CATALOG_ERROR"

- name: test_agent_routing_no_default_catalog_is_catalog_error
  description: >-
