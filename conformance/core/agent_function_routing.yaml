- name: test_agent_routing_schema_only_function_sends_parsed_arguments
  description: >-
    Verifies a function the resolved catalog declares without an implementation is sent to the agent with its arguments parsed against its schema, so schema defaults (including nested object defaults) are applied.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        quote:
          returnType: number
          args:
            type: object
            properties:
              symbol:
                type: string
              currency:
                type: string
                default: "USD"
              options:
                type: object
                properties:
                  extendedHours:
                    type: boolean
                    default: false
                additionalProperties: false
            required: [symbol]
            additionalProperties: false
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "quote"
        args:
          symbol: "GOOG"
          options: {}
      expectOutbound:
        - "@call": "quote"
          catalogId: "conformance/routing"
          args:
            symbol: "GOOG"
            currency: "USD"
            options:
              extendedHours: false
      expectValues: [null]
    - respond:
        call: 0
        value: 180
      expectValues: [180]

- name: test_agent_routing_schema_only_function_with_invalid_arguments_is_not_sent
  description: >-
    Verifies a call to a schema-only function whose arguments do not match its schema is reported as an EXPRESSION_ERROR and is not sent to the agent.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        quote:
          args:
            type: object
            properties:
              symbol:
                type: string
              currency:
                type: string
                default: "USD"
            required: [symbol]
            additionalProperties: false
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "quote"
        args:
          symbol: 42
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Validation failed for function 'quote'"

- name: test_agent_routing_schema_only_function_requires_user_activation
  description: >-
    Verifies a schema-only function that requires user activation is not sent from a binding, which reports an EXPRESSION_ERROR, but is sent when an action runs it.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        confirmOrder:
          args:
            type: object
          requiresUserActivation: true
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "confirmOrder"
        args: {}
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "requires user activation"
    - evaluate:
        "@call": "confirmOrder"
        args: {}
      as: action
      expectOutbound:
        - "@call": "confirmOrder"
          catalogId: "conformance/routing"
          args: {}

- name: test_agent_routing_failed_agent_argument_stops_enclosing_function
  description: >-
    Verifies when an agent call nested in the arguments of a local function or an outer agent function fails, only the inner error is reported, the enclosing function does not run or send an outbound call, and its value stays null.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "formatString"
        args:
          value:
            "@call": "fetchGreeting"
            args: {}
      expectOutbound:
        - "@call": "fetchGreeting"
          catalogId: "conformance/routing"
          args: {}
      expectValues: [null]
    - respond:
        call: 0
        error:
          code: "EXECUTION_ERROR"
          message: "Greeting service unavailable"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Greeting service unavailable"
    - evaluate:
        "@call": "outerAgent"
        args:
          nested:
            "@call": "fetchFxRate"
            args:
              base: "EUR"
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
      expectValues: [null, null]
    - respond:
        call: 1
        error:
          code: "EXECUTION_ERROR"
          message: "Rate feed offline"
      expectValues: [null, null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "Rate feed offline"

- name: test_agent_routing_failed_schema_only_argument_stops_enclosing_function
  description: >-
    Verifies when a schema-only function nested in the arguments of a local function or an outer agent function fails argument validation synchronously, only the inner error is reported, the enclosing function does not run or send an outbound call, and its value stays null.
  action: route_agent_function
