              base: "EUR"
          stock:
            "@call": "lookupSku"
            args:
              sku: "A-1"
      as: event
      expectOutbound:
        - "@call": "fetchFxRate"
          catalogId: "conformance/routing"
          args:
            base: "EUR"
    - deleteSurface: true

- name: test_agent_routing_agent_only_function_is_refused
  description: >-
    Verifies a schema-only function whose allowedCallers is agentOnly is refused with an EXPRESSION_ERROR and not sent to the agent, from a binding and from an action.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
      agentFunctions:
        auditLog:
          args:
            type: object
          allowedCallers: agentOnly
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        "@call": "auditLog"
        args: {}
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "auditLog"
    - evaluate:
        "@call": "auditLog"
        args: {}
      as: action
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "auditLog"

- name: test_agent_routing_pending_check_rule_is_not_failing
  description: >-
    Verifies a check rule whose condition waits on an agent call does not fail while the call is pending, and fails, reporting an EXPRESSION_ERROR, once the agent answers with an error.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
