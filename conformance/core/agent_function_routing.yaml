  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectValues: [null]
      expectErrors:
        - code: "CATALOG_ERROR"

- name: test_agent_routing_without_outbound_listener_fails_locally
  description: >-
    Verifies a processor without a way to send outbound messages does not route the call, which fails locally with an EXPRESSION_ERROR naming the function.
  action: route_agent_function
  protocolVersion: "1.0"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
    outboundListener: false
  steps:
    - evaluate:
        "@call": "fetchFxRate"
        args:
          base: "EUR"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchFxRate"

- name: test_agent_routing_pre_v1_surface_is_not_routed
  description: >-
    Verifies a call on a v0.9 surface is never sent to the agent, even when the processor has an outbound listener, and fails locally with an EXPRESSION_ERROR naming the function.
  action: route_agent_function
  protocolVersion: "v0.9"
  catalogs:
    - catalogId: "conformance/routing"
      localFunctions: [formatString]
  surface:
    catalogId: "conformance/routing"
  steps:
    - evaluate:
        call: "fetchFxRate"
        args:
          base: "EUR"
      expectValues: [null]
      expectErrors:
        - code: "EXPRESSION_ERROR"
          message: "fetchFxRate"

- name: test_agent_routing_system_function_is_not_routed
