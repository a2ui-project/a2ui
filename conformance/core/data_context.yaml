# Scoped path resolution in `DataContext`: resolving relative, nested, empty,
# dot (`.`), and absolute JSON Pointer paths against a context scope path.

- name: test_resolve_path_relative_against_context
  description: >-
    Resolves a relative path against a scoped context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "name"
    contextPath: "/user"
  expect: "/user/name"

- name: test_resolve_path_nested_relative_against_context
  description: >-
    Resolves a multi-segment relative path against a scoped context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "address/city"
    contextPath: "/user"
  expect: "/user/address/city"

- name: test_resolve_path_absolute_ignores_context
  description: >-
    An absolute path starting with `/` ignores the context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "/list/0"
    contextPath: "/user"
  expect: "/list/0"

- name: test_resolve_path_relative_against_root
  description: >-
    Resolves a relative path against the root context `/`.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "user/name"
    contextPath: "/"
  expect: "/user/name"

- name: test_resolve_path_relative_without_context
  description: >-
    Resolves a relative path when no context path is provided.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "foo"
  expect: "/foo"

- name: test_resolve_path_context_with_trailing_slash
  description: >-
    Strips a trailing slash on the context path before joining a relative path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "foo"
    contextPath: "/bar/"
  expect: "/bar/foo"

- name: test_resolve_path_empty_in_scoped_context
  description: >-
    An empty relative path resolves to the current context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: ""
    contextPath: "/user"
  expect: "/user"

- name: test_resolve_path_empty_in_trailing_slash_context
  description: >-
    An empty relative path in a context with a trailing slash resolves to the
    trimmed context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: ""
    contextPath: "/user/"
  expect: "/user"

- name: test_resolve_path_dot_in_scoped_context
  description: >-
    A `.` path resolves to the current context path.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "."
    contextPath: "/user"
  expect: "/user"

- name: test_resolve_path_empty_in_root_context
  description: >-
    An empty relative path in the root context resolves to `/`.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: ""
    contextPath: "/"
  expect: "/"

- name: test_resolve_path_dot_in_root_context
  description: >-
    A `.` path in the root context resolves to `/`.
  catalog:
    protocolVersion: "v0.9"
  action: resolve_path
  args:
    path: "."
    contextPath: "/"
  expect: "/"
