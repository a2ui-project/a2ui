- name: test_evaluate_function_pluralize_explicit_zero
  description: Verifies pluralize selects explicit zero category over CLDR (D27).
  action: evaluate_function
  function: pluralize
  args:
    value: 0
    zero: "No items"
    one: "1 item"
    other: "{n} items"
