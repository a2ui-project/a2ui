- name: test_function_format_date_tr35_tokens
  description: Verifies formatDate TR35 token expansion (yyyy-MM-dd).
  catalog:
    protocolVersion: "v1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Text"
                text:
                  "@call": "formatDate"
                  args:
                    value: "2026-09-04T12:00:00Z"
                    format: "yyyy-MM-dd"
  expect:
    surfaces:
      main:
        components:
          root:
            component: "Text"
            text: "2026-09-04"

- name: test_function_format_currency_locale_and_symbol
  description: Verifies formatCurrency with currency symbol, decimals, and grouping separators.
  catalog:
    protocolVersion: "v1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Text"
                text:
                  "@call": "formatCurrency"
                  args:
                    value: 1234.5
                    currency: "USD"
                    decimals: 2
  expect:
    surfaces:
      main:
        components:
          root:
            component: "Text"
            text: "$1,234.50"

- name: test_function_pluralize_categories
  description: Verifies pluralize resolving CLDR categories (one, other).
  catalog:
    protocolVersion: "v1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Column"
                children: ["t1", "t2"]
              - id: "t1"
                component: "Text"
                text:
                  "@call": "pluralize"
                  args:
                    value: 1
                    one: "1 item"
                    other: "items"
              - id: "t2"
                component: "Text"
                text:
                  "@call": "pluralize"
                  args:
                    value: 5
                    one: "1 item"
                    other: "5 items"
  expect:
    surfaces:
      main:
        components:
          t1:
            component: "Text"
            text: "1 item"
          t2:
            component: "Text"
            text: "5 items"

- name: test_function_logical_and_or_not
  description: Verifies and, or, and not logical function evaluations.
  catalog:
    protocolVersion: "v1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Column"
                children: ["t_and", "t_or", "t_not"]
              - id: "t_and"
                component: "Text"
                text:
                  "@call": "and"
                  args:
                    values: [true, false]
              - id: "t_or"
                component: "Text"
                text:
                  "@call": "or"
                  args:
                    values: [true, false]
              - id: "t_not"
                component: "Text"
                text:
                  "@call": "not"
                  args:
                    value: false
  expect:
    surfaces:
      main:
        components:
          t_and:
            component: "Text"
            text: false
          t_or:
            component: "Text"
            text: true
          t_not:
            component: "Text"
            text: true

- name: test_function_invalid_argument_schema_error
  description: Verifies ValidationError when a function is invoked with an argument of the wrong type.
  catalog:
    protocolVersion: "v1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Text"
                text:
                  "@call": "formatNumber"
                  args:
                    value: "not_a_number"
      expectError:
        category: "ValidationError"

# ==============================================================================
# Direct Function Evaluation Conformance Tests (evaluate_function)
# ==============================================================================

# --- RequiredFunction (D20) ---
- name: test_evaluate_function_required_string_valid
  description: Verifies required returns true for non-empty string.
  action: evaluate_function
  function: required
  args:
    value: "hello"
  expect: true

- name: test_evaluate_function_required_string_empty
  description: Verifies required returns false for empty string.
  action: evaluate_function
  function: required
  args:
    value: ""
  expect: false

- name: test_evaluate_function_required_null
  description: Verifies required returns false for null.
  action: evaluate_function
  function: required
  args:
    value: null
  expect: false

- name: test_evaluate_function_required_array_valid
  description: Verifies required returns true for non-empty array.
  action: evaluate_function
  function: required
  args:
    value: [1, 2]
  expect: true

- name: test_evaluate_function_required_array_empty
  description: Verifies required returns false for empty array.
  action: evaluate_function
  function: required
  args:
    value: []
  expect: false

- name: test_evaluate_function_required_object_empty
  description: Verifies required returns true for empty object (D20).
  action: evaluate_function
  function: required
  args:
    value: {}
  expect: true

# --- RegexFunction (D21) ---
- name: test_evaluate_function_regex_match
  description: Verifies regex returns true on matching string.
  action: evaluate_function
  function: regex
  args:
    pattern: "^[0-9]+$"
    value: "12345"
  expect: true

- name: test_evaluate_function_regex_mismatch
  description: Verifies regex returns false on non-matching string.
  action: evaluate_function
  function: regex
  args:
    pattern: "^[0-9]+$"
    value: "abc"
  expect: false

- name: test_evaluate_function_regex_invalid_pattern
  description: Verifies regex raises ExpressionError on invalid regex pattern (D21).
  action: evaluate_function
  function: regex
  args:
    pattern: "[invalid("
    value: "abc"
  expectError:
    category: ExpressionError

# --- EmailFunction (D22) ---
- name: test_evaluate_function_email_valid
  description: Verifies email returns true on standard email address.
  action: evaluate_function
