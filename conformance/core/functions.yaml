# --- Logical functions over ValidationResult operands (v1.0) ---
# In v1.0 the validators return a ValidationResult object, so a nested
# and(required(...), or(...)) receives objects, not booleans. An object with
# a boolean `valid` member is truthy by its validity, not by being an object.
- name: test_evaluate_function_and_validation_result_operands
  description: Verifies and reads a failing ValidationResult operand as false in v1.0.
  protocolVersion: "v1.0"
  action: evaluate_function
  function: and
  args:
    values:
      - valid: true
      - valid: false
        message: "Required"
        code: "required"
  expect: false

- name: test_evaluate_function_or_validation_result_operands
  description: Verifies or over two failing ValidationResult operands is false in v1.0.
  protocolVersion: "v1.0"
  action: evaluate_function
  function: or
  args:
    values:
      - valid: false
      - valid: false
  expect: false

- name: test_evaluate_function_not_validation_result_operand
  description: Verifies not inverts the validity of a ValidationResult operand in v1.0.
  protocolVersion: "v1.0"
  action: evaluate_function
  function: not
  args:
    value:
      valid: false
  expect: true

- name: test_evaluate_function_not_validation_result_operand_v0_9
  description: Verifies v0.9, whose validators return booleans, treats a {valid} object as a plain truthy object.
  protocolVersion: "v0.9"
  action: evaluate_function
  function: not
  args:
    value:
      valid: false
  expect: false

