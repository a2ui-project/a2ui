- name: test_evaluate_function_pluralize_explicit_one
  description: Verifies pluralize selects explicit one category.
  action: evaluate_function
  function: pluralize
  args:
    value: 1
    zero: "No items"
    one: "1 item"
    other: "{n} items"
  expect: "1 item"

- name: test_evaluate_function_pluralize_explicit_two
  description: Verifies pluralize selects explicit two category (D27).
  action: evaluate_function
  function: pluralize
  args:
    value: 2
    zero: "No items"
    one: "1 item"
    two: "A couple items"
    other: "{n} items"
  expect: "A couple items"

- name: test_evaluate_function_pluralize_explicit_empty_string
  description: Verifies pluralize preserves explicit empty string without falling back to other (D27).
  action: evaluate_function
  function: pluralize
  args:
    value: 0
