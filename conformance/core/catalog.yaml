# ==============================================================================
# A2UI Core Conformance Test Suite: Catalog
#
# Covers the core Catalog API across all protocol versions (v0.8, v0.9,
# v0.9.1, v1.0), grouped by entry point:
#
# 1. from_json: `Catalog.fromJson(json)` ingests an authored catalog
#    document. Basic cases check that the published basic catalogs load into
#    the SDK's own basic catalog implementation; custom cases cover parsing
#    rules, metadata, identifiers and validation.
# 2. to_json: `catalog.toJson()` emits the unbundled catalog document
#    (external references kept, no common types injected). Each case
#    serializes the SDK's own basic catalog (`builtinCatalog: basic`) and
#    compares the whole document with the published catalog file.
# 3. round_trip: `fromJson(c).toJson()` must equal `c`, and serializing again
#    must not change it. The catalog is always loaded with `fromJson`, never
#    with an SDK's own implementation of it.
# 4. validation_schema: `catalog.validationSchema` (formerly `catalogSchema`)
#    emits the self-contained, bundled JSON Schema. Each case loads a published
#    basic catalog with `fromJson` and compares the whole schema with a golden
#    artifact under conformance/test_data/validation_schema/.
# 5. derive: `catalog.derive(...)` builds a catalog with a new ID from named
#    entries of a catalog and new entries. Each case loads a catalog with
#    `fromJson`, derives a catalog from it, and checks the derived
#    catalog's entries and its `toJson()` document.
#
# Comparisons ignore object key order and the order of `enum` values and
# `required` names.
# ==============================================================================

# ==============================================================================
# 1. from_json
# ==============================================================================

# ------------------------------------------------------------------------------
# 1a. Basic catalogs match the SDK implementation
# ------------------------------------------------------------------------------

- name: test_v08_basic_catalog_from_json
  description: Tests that loading the published v0.8 basic catalog with fromJson yields a catalog equivalent to the SDK's own v0.8 basic catalog implementation. The v0.8 document has no $ref, so there is no self-contained check.
  action: from_json
  protocolVersion: "v0.8"
  catalogId: "https://a2ui.org/specification/v0_8/standard_catalog_definition.json"
  catalogPath: "specification/v0_8/json/standard_catalog_definition.json"
  expect:
    matchesBuiltinCatalog: true

- name: test_v09_basic_catalog_from_json
  description: Tests that the published v0.9 basic catalog loads with fromJson into a catalog equivalent to the SDK's own v0.9 basic catalog implementation, with its common_types references localised so every $ref resolves within the resolved catalog schema.
  action: from_json
  protocolVersion: "v0.9"
  catalogPath: "specification/v0_9/catalogs/basic/catalog.json"
  expect:
    selfContained: true
    matchesBuiltinCatalog: true

- name: test_v10_basic_catalog_from_json
  description: Tests that the published v1 basic catalog loads with fromJson into a catalog equivalent to the SDK's own v1 basic catalog implementation, with its common_types references localised so every $ref resolves within the resolved catalog schema.
  action: from_json
  protocolVersion: "1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    selfContained: true
    matchesBuiltinCatalog: true

# ------------------------------------------------------------------------------
# 1b. Custom catalogs
# ------------------------------------------------------------------------------

- name: test_catalog_from_json_missing_catalog_id_error
  description: Tests that Catalog.from_json raises CatalogError when catalogId is missing.
  action: from_json
  catalog:
    components:
      Text: {type: object}
  expectError:
    category: "CatalogError"
    message: "catalog_id must be provided or exist in catalog schema"

- name: test_catalog_from_json_override_catalog_id
  description: Tests overriding catalogId during Catalog.from_json.
  action: from_json
  catalogId: "https://a2ui.org/catalogs/overridden"
  catalog:
    catalogId: "https://a2ui.org/catalogs/original"
    components:
      Text: {type: object}
  expect:
    catalogId: "https://a2ui.org/catalogs/overridden"
    protocolVersion: "v0.9"
    components:
      Text:
        type: object

- name: test_v10_catalog_from_json_v1_0_attributes
  description: Tests parsing allowedParents, allowedChildren, allowedCallers, and requiresUserActivation in a v1.0 catalog schema.
  action: from_json
  catalog:
    protocolVersion: "1.0"
    catalogId: "https://a2ui.org/catalogs/v10/attributes"
    components:
      CustomCard:
        type: object
        description: "A custom card layout."
        allowedParents: ["Surface", "Row"]
        allowedChildren: ["Button"]
    functions:
      fetchData:
        returnType: object
        allowedCallers: agentOnly
        requiresUserActivation: false
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/attributes"
    protocolVersion: "1.0"
    components:
      CustomCard:
        type: object
        description: "A custom card layout."
        allowedParents: ["Surface", "Row"]
        allowedChildren: ["Button"]
    functions:
      fetchData:
        returnType: object
        allowedCallers: agentOnly
        requiresUserActivation: false

- name: test_v10_catalog_from_json_uax31_validation
