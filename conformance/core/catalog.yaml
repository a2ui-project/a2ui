- name: test_v10_custom_catalog_round_trip_leaf_defs
  description: Tests that a v1.0 catalog with leaf $defs, chained leaf $defs, call-site description and default overrides on $ref properties, unused leaf $defs, and metadata.extensions round-trips with its $defs and property $ref pointers intact.
  action: round_trip
  protocolVersion: "1.0"
  catalog:
    protocolVersion: "1.0"
    catalogId: "https://a2ui.org/catalogs/v10/leaf_defs_round_trip"
    metadata:
      displayName: "Leaf Defs Round Trip"
      extensions:
        x-vendor: "acme"
    components:
      SelectBox:
        type: object
        description: "A selector with reusable leaf definitions."
        allOf:
          - $ref: "common_types.json#/$defs/ComponentCommon"
          - type: object
            properties:
              component: {const: SelectBox}
              label: {$ref: "common_types.json#/$defs/DynamicString"}
              weight: {$ref: "#/$defs/Weight"}
              customWeight:
                $ref: "#/$defs/Weight"
                description: "Custom flex weight override."
                default: 2
              primaryWeight: {$ref: "#/$defs/PrimaryWeight"}
              color: {$ref: "#/$defs/ColorValue"}
              options:
                type: array
                items: {$ref: "#/$defs/SelectOption"}
            required: [component, label]
        unevaluatedProperties: false
    $defs:
      Weight:
        type: number
        description: "Relative flex weight."
        minimum: 1
      PrimaryWeight:
        $ref: "#/$defs/Weight"
      ColorToken:
        type: string
        enum: [primary, secondary, accent]
      ColorValue:
        anyOf:
          - $ref: "#/$defs/ColorToken"
          - type: string
            pattern: "^#[0-9a-fA-F]{6}$"
      SelectOption:
        type: object
        properties:
          label: {type: string}
          value: {type: string}
          component: {type: string}
        required: [label, value]
        additionalProperties: false
      UnusedToken:
        type: string
        const: "unused"
      anyComponent:
        oneOf:
          - $ref: "#/components/SelectBox"
        discriminator:
          propertyName: component
      anyFunction:
        not: {}

