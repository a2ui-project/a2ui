- name: test_v10_published_basic_catalog_validates_function_calls
  description: Tests that the published v1.0 basic catalog accepts a Button whose action calls a catalog function, and rejects a call to a function the catalog does not define.
  action: from_json
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    validComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            "@call": openUrl
            args: {url: "https://example.com"}
    invalidComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            "@call": notAFunction
            args: {}

- name: test_v10_published_basic_catalog_rejects_function_call_extra_key
  description: Tests that the published v1.0 basic catalog rejects a function call carrying a key that its function definition does not declare.
  action: from_json
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    invalidComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            "@call": openUrl
            args: {url: "https://example.com"}
            bogus: 1

