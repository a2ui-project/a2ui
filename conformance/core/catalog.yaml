# ==============================================================================
# A2UI Core Conformance Test Suite: Catalog
#
# Covers the core Catalog API across all protocol versions (v0.8, v0.9,
# v0.9.1, v1.0), grouped by entry point:
#
# 1. from_json: `Catalog.fromJson(json)` ingests an authored catalog
#    document. Basic cases check that the published basic catalogs load into
#    the SDK's own basic catalog implementation; custom cases cover parsing
#    rules, metadata, identifiers and validation.
# 2. to_json: `catalog.toJson()` emits the unbundled catalog document
#    (external references kept, no common types injected). Basic cases
#    serialize the SDK's own basic catalog (`builtinCatalog: basic`) and
#    compare it with the published catalog file; custom cases load a catalog
#    file. Each case compares the whole document with `expectFile`.
# 3. round_trip: `fromJson(c).toJson()` must equal `c`, and serializing again
#    must not change it. The catalog is always loaded with `fromJson`, never
#    with an SDK's own implementation of it.
# 4. validation_schema: `catalog.validationSchema` (formerly `catalogSchema`)
#    emits the self-contained, bundled JSON Schema. Each case loads a published
#    basic catalog with `fromJson` and compares the whole schema with a golden
#    artifact under conformance/test_data/validation_schema/.
#
# Comparisons ignore object key order and the order of `enum` values and
# `required` names.
# ==============================================================================

# ==============================================================================
# 1. from_json
# ==============================================================================

# ------------------------------------------------------------------------------
# 1a. Basic catalogs match the SDK implementation
# ------------------------------------------------------------------------------

- name: test_v08_basic_catalog_from_json_matches_builtin
  description: Tests that loading the published v0.8 basic catalog with fromJson yields a catalog equivalent to the SDK's own v0.8 basic catalog implementation.
  action: from_json
  protocolVersion: "v0.8"
  catalogId: "https://a2ui.org/specification/v0_8/standard_catalog_definition.json"
  catalogPath: "specification/v0_8/json/standard_catalog_definition.json"
  expect:
    matchesBuiltinCatalog: true

- name: test_v10_basic_catalog_from_json_matches_builtin
  description: Tests that loading the published v1 basic catalog with fromJson yields a catalog equivalent to the SDK's own v1 basic catalog implementation.
  action: from_json
  protocolVersion: "v1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    matchesBuiltinCatalog: true

- name: test_v09_basic_catalog_from_json_matches_builtin
  description: Tests that loading the published v0.9 basic catalog with fromJson yields a catalog equivalent to the SDK's own v0.9 basic catalog implementation.
  action: from_json
  protocolVersion: "v0.9"
  catalogPath: "specification/v0_9/catalogs/basic/catalog.json"
  expect:
    matchesBuiltinCatalog: true

# ------------------------------------------------------------------------------
# 1b. Custom catalogs
# ------------------------------------------------------------------------------

- name: test_v08_catalog_from_json_basic
  description: Tests parsing a v0.8 catalog with styles, verifying backward-compatible mapping into theme and components.
  action: from_json
  protocolVersion: "v0.8"
  catalogId: "https://a2ui.org/catalogs/v08/basic"
  catalog:
    components:
      Text:
        type: object
        properties:
          text: {type: string}
      Button:
        type: object
        properties:
          label: {type: string}
    styles:
      font:
        type: string
      primaryColor:
        type: string
  expect:
    catalogId: "https://a2ui.org/catalogs/v08/basic"
    protocolVersion: "v0.8"
    components:
      Button:
        type: object
        properties:
          label: {type: string}
      Text:
        type: object
        properties:
          text: {type: string}
    functions: {}
    theme:
      font:
        type: string
      primaryColor:
        type: string

- name: test_v09_catalog_from_json_basic
  description: Tests parsing a v0.9 catalog with theme schema, components, and functions.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    theme:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fontFamily:
          type: string
    components:
      Card:
        type: object
        properties:
          title: {type: string}
      Divider:
        type: object
    functions:
      formatCurrency:
        returnType: string
        parameters:
          amount: {type: number}
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    protocolVersion: "v0.9"
    theme:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fontFamily:
          type: string
    components:
      Card:
        type: object
        properties:
          title: {type: string}
      Divider:
        type: object
    functions:
      formatCurrency:
        returnType: string
        parameters:
          amount: {type: number}

- name: test_v09_catalog_from_json_any_component_filter
  description: Tests that $defs.anyComponent.oneOf filters components to only permitted ones.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/filtered"
    $defs:
      anyComponent:
        oneOf:
          - $ref: "#/components/Text"
          - $ref: "#/components/Button"
    components:
      Text:
        type: object
      Button:
        type: object
      HiddenComponent:
        type: object
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/filtered"
    protocolVersion: "v0.9"
    components:
      Button:
        type: object
      Text:
        type: object

- name: test_v09_catalog_from_json_any_function_filter
  description: Tests that $defs.anyFunction.oneOf filters functions to only permitted ones.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/func_filtered"
    $defs:
      anyFunction:
        oneOf:
          - $ref: "#/functions/validateEmail"
    functions:
