- name: test_v10_published_basic_catalog_validates_nested_calls
  description: >-
    Tests that validating a component against the published v1.0 basic catalog alone checks every nested function call that names no catalogId, or names this catalog, against this catalog. That includes a call nested in another call's args, in @index's args, and in the args of a call that names another catalog. A call that names another catalog runs there, so this catalog cannot judge its function or args and accepts it; the message processor checks it against the catalog it resolves to.
  action: from_json
  protocolVersion: "1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    validComponents:
      - id: t1
        component: Text
        text:
          "@call": formatString
          catalogId: other-catalog
          args: {value: 3}
      - id: t1b
        component: Text
        text:
          "@call": shout
          catalogId: other-catalog
          args: {value: hi, loud: true}
    invalidComponents:
      - id: t5
        component: Text
        text:
          "@call": notAFunction
          catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
          args: {}
      - id: t6
        component: Text
        text:
          "@call": formatString
          catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
          args: {value: hi, extra: 1}
      - id: t7
        component: Text
        text:
          "@call": shout
          catalogId: other-catalog
          args:
            value:
              "@call": notAFunction
              args: {}
      - id: t2
        component: Text
        text:
          "@call": notAFunction
          args: {}
      - id: t3
        component: Text
        text:
          "@call": formatString
          args:
            value:
              "@call": notAFunction
              args: {}
      - id: t4
        component: Text
        text:
          "@call": "@index"
          args:
            offset:
              "@call": notAFunction
              args: {}

- name: test_v10_published_basic_catalog_rejects_nested_call_bad_identifiers
  description: >-
    Tests that validating a component against the published v1.0 basic catalog alone still rejects what it can judge without resolving a nested call's catalog: a function name that is not a valid identifier (even when the call names another catalog), an argument name that is not a valid identifier, and a call to @foo in the reserved @ namespace, where v1.0 defines only @index.
  action: from_json
  protocolVersion: "1.0"
  catalogPath: "catalogs/basic/v1/catalog.json"
  expect:
    invalidComponents:
      - id: t1
        component: Text
        text:
          "@call": not-a-function
          catalogId: other-catalog
      - id: t2
        component: Text
        text:
          "@call": formatString
          catalogId: other-catalog
          args: {bad-arg: x}
      - id: t3
        component: Text
        text:
          "@call": "@foo"
          catalogId: other-catalog

- name: test_v10_catalog_from_json_filters_entries_by_unions
  description: Tests that a catalog loaded from a document whose anyComponent and anyFunction unions list only some of its entries defines only the listed ones.
  action: from_json
  catalog:
    protocolVersion: "1.0"
    catalogId: "https://a2ui.org/catalogs/v10/filtered"
    components:
      Listed: {type: object}
      Unlisted: {type: object}
    functions:
      listed: {returnType: string}
      unlisted: {returnType: string}
    $defs:
      anyComponent:
        oneOf: [{$ref: "#/components/Listed"}]
        discriminator: {propertyName: component}
      anyFunction:
        oneOf: [{$ref: "#/functions/listed"}]
  expect:
    components: [Listed]
    functions: [listed]

- name: test_v10_catalog_from_json_leaf_defs
  description: Tests that a v1.0 catalog declaring leaf $defs (token enums, open string unions, nested objects with a component property, and allOf-composed leaf definitions) resolves them in memory, produces a self-contained validationSchema, and validates component instances against all leaf definition constraints.
  action: from_json
  protocolVersion: "1.0"
  catalog:
    protocolVersion: "1.0"
    catalogId: "https://a2ui.org/catalogs/v10/leaf_defs"
    metadata:
      displayName: "Leaf Defs Catalog"
      extensions:
        x-vendor: "acme"
    components:
      SelectBox:
        type: object
        description: "A selector with reusable leaf definitions."
        allOf:
          - $ref: "common_types.json#/$defs/ComponentCommon"
          - type: object
            properties:
              component: {const: SelectBox}
              label: {$ref: "common_types.json#/$defs/DynamicString"}
              color: {$ref: "#/$defs/ColorValue"}
              weight:
                $ref: "#/$defs/Weight"
                description: "Custom flex weight override."
                default: 2
              options:
                type: array
                items: {$ref: "#/$defs/SelectOption"}
              composite: {$ref: "#/$defs/CompositeOption"}
            required: [component, label]
        unevaluatedProperties: false
    $defs:
      Weight:
        type: number
        description: "Relative flex weight."
        minimum: 1
      ColorToken:
        type: string
        enum: [primary, secondary, accent]
      ColorValue:
        anyOf:
          - $ref: "#/$defs/ColorToken"
          - type: string
            pattern: "^#[0-9a-fA-F]{6}$"
      SelectOption:
        type: object
        properties:
          label: {type: string}
          value: {type: string}
          component: {type: string}
        required: [label, value]
      CompositeOption:
        type: object
        allOf:
          - $ref: "#/$defs/SelectOption"
          - type: object
            properties:
              disabled: {type: boolean}
        unevaluatedProperties: false
      anyComponent:
        oneOf:
          - $ref: "#/components/SelectBox"
        discriminator:
          propertyName: component
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/leaf_defs"
    protocolVersion: "1.0"
    components: [SelectBox]
    selfContained: true
    validComponents:
      - id: sb1
        component: SelectBox
        label: "Choose a theme"
        color: primary
        weight: 3
        options:
          - label: "Dark"
            value: "dark"
            component: "Icon"
        composite:
          label: "Default"
          value: "default"
          disabled: false
      - id: sb2
        component: SelectBox
        label: "Custom hex color"
        color: "#1a2b3c"
    invalidComponents:
      - id: sb_bad_color
        component: SelectBox
        label: "Invalid color"
        color: "not-a-color"
      - id: sb_bad_weight
        component: SelectBox
        label: "Invalid weight"
        weight: 0
      - id: sb_bad_option
        component: SelectBox
        label: "Missing required value in SelectOption"
        options:
          - label: "Only label"
      - id: sb_extra_composite_prop
        component: SelectBox
        label: "Extra property on closed CompositeOption"
        composite:
          label: "Default"
          value: "default"
          extra: true
