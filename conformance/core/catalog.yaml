- name: test_v09_custom_validation_schema_flattening
  description: Tests that validationSchema flattens a v0.9 component that mixes in ComponentCommon, Checkable and a local $defs mixin, and that a property the component declares itself wins over the one its mixin declares.
  action: validation_schema
  protocolVersion: "v0.9"
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/flattening"
    components:
      Toggle:
        type: object
