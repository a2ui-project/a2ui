# ------------------------------------------------------------------------------
# 2. Catalog Serialization (catalog_schema)
# ------------------------------------------------------------------------------

- name: test_v08_catalog_schema_basic
  description: Tests serializing a v0.8 Catalog into JSON schema with styles and components.
  action: catalog_schema
  protocolVersion: "v0.8"
  catalog:
    catalogId: "https://a2ui.org/catalogs/v08/basic"
    components:
      Text:
        type: object
        properties:
          text: {type: string}
      Button:
        type: object
        properties:
          label: {type: string}
    theme:
      type: object
      properties:
        primaryColor: {type: string}
  expect:
    $schema: "https://json-schema.org/draft/2020-12/schema"
    catalogId: "https://a2ui.org/catalogs/v08/basic"
    components:
      Text:
        type: object
        properties:
          text: {type: string}
      Button:
        type: object
        properties:
          label: {type: string}
    $defs:
      theme:
        type: object
        properties:
          primaryColor: {type: string}
      anyComponent:
        oneOf:
          - $ref: "#/components/Text"
          - $ref: "#/components/Button"
        discriminator:
          propertyName: "component"

- name: test_v09_catalog_schema_with_defs
  description: Tests serializing a v0.9 Catalog into JSON schema with generated $defs.anyComponent and $defs.theme.
  action: catalog_schema
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    components:
      Button:
        type: object
        properties:
          component: {const: Button}
          label: {type: string}
        required: [component, label]
      Card:
        type: object
        properties:
          component: {const: Card}
          title: {type: string}
        required: [component, title]
    functions:
      formatCurrency:
        type: object
        properties:
          call: {const: formatCurrency}
          args:
            type: object
            properties:
              amount: {type: number}
            required: [amount]
        required: [call, args]
    theme:
      type: object
      properties:
        primaryColor: {type: string}
  expect:
    $schema: "https://json-schema.org/draft/2020-12/schema"
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    components:
      Button:
        type: object
        properties:
          id:
            $ref: "#/$defs/ComponentId"
          component: {const: Button}
          label: {type: string}
        required: [id, label, component]
      Card:
        type: object
        properties:
          id:
            $ref: "#/$defs/ComponentId"
          component: {const: Card}
          title: {type: string}
        required: [id, title, component]
    functions:
      formatCurrency:
        type: object
        properties:
          call: {const: formatCurrency}
          args:
            type: object
            properties:
              amount: {type: number}
            required: [amount]
        required: [call, args]
    $defs:
      theme:
        type: object
        properties:
          primaryColor: {type: string}
      anyComponent:
        oneOf:
          - $ref: "#/components/Button"
          - $ref: "#/components/Card"
        discriminator:
          propertyName: "component"
      anyFunction:
        oneOf:
          - $ref: "#/functions/formatCurrency"

- name: test_v09_catalog_schema_no_theme
  description: Tests serializing a v0.9 Catalog without theme (omits $defs.theme).
  action: catalog_schema
  catalog:
