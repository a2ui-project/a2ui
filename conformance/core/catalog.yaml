# ------------------------------------------------------------------------------
# 1c. Published catalogs load without the specification tree
#
# Every catalog published under specification/<version>/catalogs/ and
# catalogs/<name>/<version>/ refers to the shared types in common_types.json.
# Loading it must localise those references, so that the resolved catalog
# schema is self-contained: every $ref resolves within the document. Each
# catalog also validates a Button whose action calls one of its functions,
# which exercises the FunctionCall reference into the catalog's own function
# definitions, and rejects function calls that match no definition.
# The v0.9 and v1 basic catalogs are checked for self-containment in 1a,
# together with matchesBuiltinCatalog. test_catalog_conformance_covers_published_catalogs
# in the Python suite fails when a published catalog has no self-contained case.
# ------------------------------------------------------------------------------

- name: test_v09_published_basic_catalog_validates_function_calls
  description: Tests that the published v0.9 basic catalog accepts a Button whose action calls a catalog function, and rejects a call to a function the catalog does not define.
  action: from_json
  protocolVersion: "v0.9"
  catalogPath: "specification/v0_9/catalogs/basic/catalog.json"
  expect:
    validComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            call: openUrl
            args: {url: "https://example.com"}
    invalidComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            call: notAFunction
            args: {}

- name: test_v09_published_basic_catalog_rejects_function_call_extra_key
  description: Tests that the published v0.9 basic catalog rejects a function call carrying a key that its function definition does not declare.
  action: from_json
  protocolVersion: "v0.9"
  catalogPath: "specification/v0_9/catalogs/basic/catalog.json"
  expect:
    invalidComponents:
      - id: btn1
        component: Button
        child: txt1
        action:
          functionCall:
            call: openUrl
            args: {url: "https://example.com"}
            bogus: 1

