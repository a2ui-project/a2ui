- name: test_v09_catalog_allof_envelope_flattening
  description: Tests that a v0.9 Catalog document with allOf envelopes (ComponentCommon, CatalogComponentCommon, Checkable) flattens component properties and serializes a clean unified catalog schema.
  action: catalog_schema
  protocolVersion: "v0.9"
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/composed"
    components:
      Text:
        type: object
        allOf:
          - $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/ComponentCommon"
          - $ref: "#/$defs/CatalogComponentCommon"
          - type: object
            properties:
              text:
                $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/DynamicString"
              variant:
                type: string
            required: [text]
      Button:
        type: object
        allOf:
          - $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/ComponentCommon"
          - $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/Checkable"
          - type: object
            properties:
              label:
                $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/DynamicString"
            required: [label]
    functions:
      formatNumber:
        type: object
        properties:
          call: {const: formatNumber}
          args:
            type: object
            properties:
              value: {type: number}
            required: [value]
          returnType: {const: string}
        required: [call, args]
    $defs:
      CatalogComponentCommon:
        type: object
        properties:
          weight:
            type: number
            description: "Flex weight within parent container."
  expect:
    $schema: "https://json-schema.org/draft/2020-12/schema"
    catalogId: "https://a2ui.org/catalogs/v09/composed"
    components:
      Text:
        type: object
        properties:
          id:
            $ref: "#/$defs/ComponentId"
          component:
            const: Text
          accessibility:
            $ref: "#/$defs/AccessibilityAttributes"
            description: "Accessibility properties"
          weight:
            type: number
            description: "Flex weight within parent container."
          text:
            $ref: "#/$defs/DynamicString"
          variant:
            type: string
        required: [id, text, component]
      Button:
        type: object
        properties:
          id:
            $ref: "#/$defs/ComponentId"
          component:
            const: Button
          accessibility:
            $ref: "#/$defs/AccessibilityAttributes"
            description: "Accessibility properties"
          checks:
            type: array
            description: "A list of checks to perform."
            items:
              $ref: "#/$defs/CheckRule"
          label:
            $ref: "#/$defs/DynamicString"
        required: [id, label, component]
    functions:
      formatNumber:
        type: object
        properties:
          call: {const: formatNumber}
          args:
            type: object
            properties:
              value: {type: number}
            required: [value]
          returnType: {const: string}
        required: [call, args]
        unevaluatedProperties: false
    $defs:
      anyComponent:
        oneOf:
          - $ref: "#/components/Text"
          - $ref: "#/components/Button"
        discriminator:
          propertyName: "component"
      anyFunction:
        oneOf:
          - $ref: "#/functions/formatNumber"

