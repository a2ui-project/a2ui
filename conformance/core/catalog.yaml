# ==============================================================================
# A2UI Core Conformance Test Suite: Catalog
#
# Covers the core Catalog API specification across all protocol versions
# (v0.8, v0.9, v1.0), consolidating tests for:
# 1. Catalog Deserialization & Structural Inlining
# 2. Catalog Serialization (catalog_schema)
# ==============================================================================

- name: test_v08_catalog_from_json_basic
  description: Tests parsing a v0.8 catalog with styles, verifying backward-compatible mapping into theme and components.
  action: from_json
  protocolVersion: "v0.8"
  catalogId: "https://a2ui.org/catalogs/v08/basic"
  catalog:
    components:
      Text:
        type: object
        properties:
          text: {type: string}
      Button:
        type: object
        properties:
          label: {type: string}
    styles:
      font:
        type: string
      primaryColor:
        type: string
  expect:
    catalogId: "https://a2ui.org/catalogs/v08/basic"
    protocolVersion: "v0.8"
    components:
      Button:
        type: object
        properties:
          label: {type: string}
      Text:
        type: object
        properties:
          text: {type: string}
    functions: {}
    theme:
      font:
        type: string
      primaryColor:
        type: string

- name: test_v09_catalog_from_json_basic
  description: Tests parsing a v0.9 catalog with theme schema, components, and functions.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    theme:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fontFamily:
          type: string
    components:
      Card:
        type: object
        properties:
          title: {type: string}
      Divider:
        type: object
    functions:
      formatCurrency:
        returnType: string
        parameters:
          amount: {type: number}
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    protocolVersion: "v0.9"
    theme:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fontFamily:
          type: string
    components:
      Card:
        type: object
        properties:
          title: {type: string}
      Divider:
        type: object
    functions:
      formatCurrency:
        returnType: string
        parameters:
          amount: {type: number}

- name: test_v09_catalog_from_json_any_component_filter
  description: Tests that $defs.anyComponent.oneOf filters components to only permitted ones.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/filtered"
    $defs:
      anyComponent:
        oneOf:
          - $ref: "#/components/Text"
          - $ref: "#/components/Button"
    components:
      Text:
        type: object
      Button:
        type: object
      HiddenComponent:
        type: object
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/filtered"
    protocolVersion: "v0.9"
    components:
      Button:
        type: object
      Text:
        type: object

- name: test_v09_catalog_from_json_any_function_filter
  description: Tests that $defs.anyFunction.oneOf filters functions to only permitted ones.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/func_filtered"
    $defs:
      anyFunction:
        oneOf:
          - $ref: "#/functions/validateEmail"
    functions:
      validateEmail:
        returnType: boolean
      internalSecretFunc:
        returnType: string
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/func_filtered"
    protocolVersion: "v0.9"
    functions:
      validateEmail:
        returnType: boolean

- name: test_v09_catalog_from_json_inlines_local_pointer_defs
  description: Tests that Catalog.from_json inlines local #/$defs references into component schemas.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/defs"
    $defs:
      BadgeType:
        type: object
        properties:
          text: {type: string}
          variant:
            type: string
            enum: [info, success, warning, error]
        required: [text]
    components:
      CardWithBadge:
        type: object
        properties:
          title: {type: string}
          badge:
            $ref: "#/$defs/BadgeType"
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/defs"
    protocolVersion: "v0.9"
    components:
      CardWithBadge:
        type: object
        properties:
          title: {type: string}
          badge:
            type: object
            properties:
              text: {type: string}
              variant:
                type: string
                enum: [info, success, warning, error]
            required: [text]

- name: test_v09_catalog_from_json_inlines_nested_defs
  description: Tests resolving transitively nested local $defs references.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/nested_defs"
    $defs:
      InnerStyle:
        type: object
        properties:
          color: {type: string}
      OuterConfig:
        type: object
        properties:
          style:
            $ref: "#/$defs/InnerStyle"
    components:
      StyledBox:
        type: object
        properties:
          config:
            $ref: "#/$defs/OuterConfig"
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/nested_defs"
    protocolVersion: "v0.9"
    components:
      StyledBox:
        type: object
        properties:
          config:
            type: object
            properties:
              style:
                type: object
                properties:
                  color: {type: string}

- name: test_v09_catalog_from_json_resolves_common_types_refs
  description: Tests that Catalog.from_json resolves and inlines standard common_types schema references.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/with_common_types"
    components:
      DataField:
        type: object
        properties:
          id:
            $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/ComponentId"
          binding:
            $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/DataBinding"
        required: ["id", "binding"]
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/with_common_types"
    protocolVersion: "v0.9"
    components:
      DataField:
        type: object
        properties:
          id:
            type: string
            description: "The unique identifier for a component, used for both definitions and references within the same surface."
          binding:
            type: object
            properties:
              path:
                type: string
                description: "A JSON Pointer path to a value in the data model."
            required: ["path"]
            additionalProperties: false
        required: ["id", "binding"]

- name: test_v09_catalog_from_json_resolves_common_types_child_list
  description: Tests that Catalog.from_json resolves and inlines ChildList from common_types.
  action: from_json
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/container"
    components:
      Container:
        type: object
        properties:
          children:
            $ref: "https://a2ui.org/specification/v0_9/common_types.json#/$defs/ChildList"
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/container"
    protocolVersion: "v0.9"
    components:
      Container:
        type: object
        properties:
          children:
            oneOf:
              - type: array
                items:
                  type: string
                  description: "The unique identifier for a component, used for both definitions and references within the same surface."
                description: "A static list of child component IDs."
              - type: object
                description: "A template for generating a dynamic list of children from a data model list. The `componentId` is the component to use as a template."
                properties:
                  componentId:
                    type: string
                    description: "The unique identifier for a component, used for both definitions and references within the same surface."
                  path:
                    type: string
                    description: "The path to the list of component property objects in the data model."
                required: ["componentId", "path"]
                additionalProperties: false

- name: test_v10_catalog_from_json_no_theme
  description: Tests parsing a v1.0 catalog without theme using protocolVersion in catalog schema.
  action: from_json
  catalog:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/basic"
    components:
      Layout:
        type: object
        properties:
          orientation: {type: string, enum: [horizontal, vertical]}
      ActionButton:
        type: object
        properties:
          label: {type: string}
          onClick: {type: string}
    functions:
      calculateTax:
        returnType: number
        parameters:
          subtotal: {type: number}
          rate: {type: number}
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/basic"
    protocolVersion: "v1.0"
    theme: {}
    components:
      ActionButton:
        type: object
        properties:
          label: {type: string}
          onClick: {type: string}
      Layout:
        type: object
        properties:
          orientation: {type: string, enum: [horizontal, vertical]}
    functions:
      calculateTax:
        returnType: number
        parameters:
          subtotal: {type: number}
          rate: {type: number}

- name: test_v10_catalog_from_json_functions_metadata
  description: Tests extracting function parameters and returnType from v1.0 catalog using protocolVersion in catalog schema.
  action: from_json
  catalog:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/functions"
    functions:
      formatDate:
        returnType: string
        parameters:
          timestamp: {type: integer}
          format: {type: string}
      isPositive:
        returnType: boolean
        parameters:
          value: {type: number}
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/functions"
    protocolVersion: "v1.0"
    functions:
      formatDate:
        returnType: string
        parameters:
          timestamp: {type: integer}
          format: {type: string}
      isPositive:
        returnType: boolean
        parameters:
          value: {type: number}

- name: test_catalog_from_json_missing_catalog_id_error
  description: Tests that Catalog.from_json raises CatalogError when catalogId is missing.
  action: from_json
  catalog:
    components:
      Text: {type: object}
  expectError:
    category: "CatalogError"
    message: "catalog_id must be provided or exist in catalog_schema"

- name: test_catalog_from_json_override_catalog_id
  description: Tests overriding catalogId during Catalog.from_json.
  action: from_json
  catalogId: "https://a2ui.org/catalogs/overridden"
  catalog:
    catalogId: "https://a2ui.org/catalogs/original"
    components:
      Text: {type: object}
  expect:
    catalogId: "https://a2ui.org/catalogs/overridden"
    protocolVersion: "v0.9"
    components:
      Text:
        type: object

- name: test_v10_catalog_from_json_v1_0_attributes
  description: Tests parsing allowedParents, allowedChildren, allowedCallers, and requiresUserActivation in a v1.0 catalog schema.
  action: from_json
  catalog:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/attributes"
    components:
      CustomCard:
        type: object
        description: "A custom card layout."
        allowedParents: ["Surface", "Row"]
        allowedChildren: ["Button"]
    functions:
      fetchData:
        returnType: object
        allowedCallers: agentOnly
        requiresUserActivation: false
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/attributes"
    protocolVersion: "v1.0"
    components:
      CustomCard:
        type: object
        description: "A custom card layout."
        allowedParents: ["Surface", "Row"]
        allowedChildren: ["Button"]
    functions:
      fetchData:
        returnType: object
        allowedCallers: agentOnly
        requiresUserActivation: false

- name: test_v10_catalog_from_json_uax31_validation
  description: Tests parsing valid UAX #31 component and function identifiers in a v1.0 catalog.
  action: from_json
  catalog:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/uax31"
    components:
      MyComponent_1:
        type: object
      组件_1:
        type: object
    functions:
      format_text_1:
        returnType: string
      "@index":
        returnType: number
  expect:
    catalogId: "https://a2ui.org/catalogs/v10/uax31"
    protocolVersion: "v1.0"
    components:
      MyComponent_1:
        type: object
      组件_1:
        type: object
    functions:
      format_text_1:
        returnType: string
      "@index":
        returnType: number

- name: test_v10_catalog_from_json_invalid_uax31_identifier_error
  description: Tests that invalid UAX #31 component identifier with hyphen raises CatalogError under v1.0.
  action: from_json
  catalog:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/invalid_uax31"
    components:
      My-Component:
        type: object
  expectError:
    category: "CatalogError"
    message: "Invalid UAX #31 component identifier"

- name: test_v09_catalog_from_json_allows_hyphen_identifiers
  description: Tests that v0.9 catalogs permit hyphenated component identifiers.
  action: from_json
  catalog:
    protocolVersion: "v0.9"
    catalogId: "https://a2ui.org/catalogs/v09/hyphen_allowed"
    components:
      My-Component:
        type: object
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/hyphen_allowed"
    protocolVersion: "v0.9"
    components:
      My-Component:
        type: object

# ------------------------------------------------------------------------------
# 2. Catalog Serialization (catalog_schema)
# ------------------------------------------------------------------------------

- name: test_v08_catalog_schema_basic
  description: Tests serializing a v0.8 Catalog into JSON schema with styles and components.
  action: catalog_schema
  protocolVersion: "v0.8"
  catalog:
    components:
      Text:
        type: object
        properties:
          text: {type: string}
      Button:
        type: object
        properties:
          label: {type: string}
    theme:
      primaryColor: {type: string}
  expect:
    protocolVersion: "v0.8"
    components:
      Button:
        type: object
        properties:
          label: {type: string}
      Text:
        type: object
        properties:
          text: {type: string}
    styles:
      primaryColor: {type: string}

- name: test_v09_catalog_schema_with_defs
  description: Tests serializing a v0.9 Catalog into JSON schema with generated $defs.anyComponent and $defs.theme.
  action: catalog_schema
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    components:
      Button:
        type: object
        properties:
          component: {const: Button}
          label: {type: string}
        required: [component, label]
      Card:
        type: object
        properties:
          component: {const: Card}
          title: {type: string}
        required: [component, title]
    functions:
      formatCurrency:
        type: object
        properties:
          call: {const: formatCurrency}
          args:
            type: object
            properties:
              amount: {type: number}
            required: [amount]
        required: [call, args]
    theme:
      type: object
      properties:
        primaryColor: {type: string}
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/basic"
    protocolVersion: "v0.9"
    components:
      Button:
        type: object
        properties:
          component: {const: Button}
          label: {type: string}
        required: [component, label]
      Card:
        type: object
        properties:
          component: {const: Card}
          title: {type: string}
        required: [component, title]
    functions:
      formatCurrency:
        type: object
        properties:
          call: {const: formatCurrency}
          args:
            type: object
            properties:
              amount: {type: number}
            required: [amount]
        required: [call, args]
    theme:
      type: object
      properties:
        primaryColor: {type: string}
    $defs:
      anyComponent:
        oneOf:
          - $ref: "#/components/Button"
          - $ref: "#/components/Card"
      theme:
        type: object
        properties:
          primaryColor: {type: string}

- name: test_v09_catalog_schema_no_theme
  description: Tests serializing a v0.9 Catalog without theme (omits $defs.theme).
  action: catalog_schema
  catalog:
    catalogId: "https://a2ui.org/catalogs/v09/simple"
    components:
      Text:
        type: object
        properties:
          component: {const: Text}
          text: {type: string}
        required: [component, text]
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/simple"
    components:
      Text:
        type: object
        properties:
          component: {const: Text}
          text: {type: string}
        required: [component, text]
    $defs:
      anyComponent:
        oneOf:
          - $ref: "#/components/Text"

- name: test_v10_catalog_schema_basic
  description: Tests serializing a v1.0 Catalog into JSON schema with protocolVersion and $defs.anyComponent.
  action: catalog_schema
  protocolVersion: "v1.0"
  catalog:
    catalogId: "https://a2ui.org/catalogs/v10/basic"
    components:
      Text:
        type: object
        properties:
          id: {type: string}
          component: {const: Text}
          text: {type: string}
        required: [id, component, text]
  expect:
    protocolVersion: "v1.0"
    catalogId: "https://a2ui.org/catalogs/v10/basic"
    components:
      Text:
        type: object
        properties:
          id: {type: string}
          component: {const: Text}
          text: {type: string}
        required: [id, component, text]
    $defs:
