        returnType: boolean
      internalSecretFunc:
        returnType: string
  expect:
    catalogId: "https://a2ui.org/catalogs/v09/func_filtered"
    protocolVersion: "v0.9"
    functions:
      validateEmail:
        returnType: boolean

