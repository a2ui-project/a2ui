- name: test_index_function_in_collection_loop
  description: Verifies built-in @index function evaluation during collection template iteration.
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: main
            catalogId: basic
            dataModel:
              tasks: ["Buy Milk", "Clean Kitchen", "Pay Bills"]
            components:
              - id: root
                component: Column
                children: [list]
              - id: list
                component: Collection
                items: "/tasks"
                template:
                  component: Row
                  children: [item_index, item_text]
                  components:
                    - id: item_index
                      component: Text
                      text:
                        call: "@index"
                        args: {}
                    - id: item_text
                      component: Text
                      text:
                        path: ""
  expect:
    surfaces:
      main:
        components:
          item_index_0:
            text: "0"
          item_text_0:
            text: "Buy Milk"
          item_index_1:
            text: "1"
          item_text_1:
            text: "Clean Kitchen"
          item_index_2:
            text: "2"
          item_text_2:
            text: "Pay Bills"

- name: test_index_function_with_offset
  description: Verifies built-in @index function with offset argument (@index(1) for 1-based indexing).
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: main
            catalogId: basic
            dataModel:
              players: ["Alice", "Bob"]
            components:
              - id: root
                component: Collection
                items: "/players"
                template:
                  component: Text
                  text:
                    call: "@index"
                    args:
                      offset: 1
  expect:
    surfaces:
      main:
        components:
          root_0:
            text: "1"
          root_1:
            text: "2"

- name: test_index_function_nested_path
  description: Verifies built-in @index function evaluation inside a deeply nested child property path of a template list.
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: main
            catalogId: basic
            dataModel:
              users:
                - name: Alice
                  address:
                    city: Seattle
                - name: Bob
                  address:
                    city: Portland
            components:
              - id: root
                component: Collection
                items: "/users"
                template:
                  component: Column
                  children: [nested_text]
                  components:
                    - id: nested_text
                      component: Text
                      text:
                        call: "@index"
                        args:
                          offset: 1
  expect:
    surfaces:
      main:
        components:
          nested_text_0:
            text: "1"
          nested_text_1:
            text: "2"

- name: test_index_function_outside_loop_error
  description: Verifies error thrown when @index function is called outside a collection iteration scope.
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              - id: root
                component: Text
                text:
                  call: "@index"
                  args: {}
      expect_error:
        category: "ValidationError"
        message: "@index function can only be evaluated inside a collection template iteration scope."
