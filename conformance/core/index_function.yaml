- name: test_index_function_in_collection_loop
  description: Verifies built-in @index function evaluation during collection template iteration.
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: main
            catalogId: basic
            dataModel:
              tasks: ["Buy Milk", "Clean Kitchen", "Pay Bills"]
            components:
              root:
                component: Column
                children: [list]
              list:
                component: Collection
                items: "/tasks"
                template:
                  component: Row
                  children: [item_index, item_text]
                  components:
                    item_index:
                      component: Text
                      text:
                        call: "@index"
                        args: {}
                    item_text:
                      component: Text
                      text:
                        path: ""

- name: test_index_function_with_offset
  description: Verifies built-in @index function with offset argument (@index(1) for 1-based indexing).
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: main
            catalogId: basic
            dataModel:
              players: ["Alice", "Bob"]
            components:
              root:
                component: Collection
                items: "/players"
                template:
                  component: Text
                  text:
                    call: "@index"
                    args:
                      offset: 1

- name: test_index_function_outside_loop_error
  description: Verifies error thrown when @index function is called outside a collection iteration scope.
  catalog:
    version: "1.0"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "main"
            catalogId: "basic"
            components:
              root:
                component: Text
                text:
                  call: "@index"
                  args: {}
      expect_error:
        category: "ValidationError"
        message: "@index function can only be evaluated inside a collection template iteration scope."
