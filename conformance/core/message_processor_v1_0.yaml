# ==============================================================================
# Protocol v1.0 MessageProcessor Conformance Test Suite (Candidate Specification)
# ==============================================================================

- name: test_v10_create_surface_inline_initialization
  description: Tests v1.0 createSurface message with inline components and initial dataModel initialization.
  action: process_messages
  protocolVersion: "v1.0"
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_v10"
        catalogId: "test-catalog-v10"
        sendDataModel: true
        components:
          - id: "root"
            component: "Column"
            children: ["btn1"]
          - id: "btn1"
            component: "Button"
            title: "Inline Button"
        dataModel:
          counter: 42
  expect:
    surfaces:
      s_v10:
        exists: true
        sendDataModel: true
        components:
          - id: "root"
            component: "Column"
            children: ["btn1"]
          - id: "btn1"
            component: "Button"
            title: "Inline Button"
        dataModel:
          counter: 42

- name: test_v10_create_surface_optional_catalog_id
  description: Tests that v1.0 createSurface permits omitting catalogId.
  action: process_messages
  protocolVersion: "v1.0"
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_v10_nocat"
  expect:
    surfaces:
      s_v10_nocat:
        exists: true

- name: test_v10_create_surface_with_metadata_extensions
  description: Tests v1.0 createSurface with metadata and extension descriptors.
  action: process_messages
  protocolVersion: "v1.0"
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_v10_meta"
        catalogId: "test-catalog-v10"
        metadata:
          extensions:
            "a2ui:experimental":
              streaming: true
  expect:
    surfaces:
      s_v10_meta:
        exists: true

- name: test_v10_component_catalog_override
  description: Tests that individual components in v1.0 can specify a catalogId override different from the surface default.
  action: process_messages
  catalogs:
    - catalogId: main-catalog
      protocolVersion: "v1.0"
    - catalogId: charts-catalog
      protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_v10_multi"
        catalogId: "main-catalog"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_v10_multi"
        components:
          - id: "root"
            component: "Column"
            children: ["c1"]
          - id: "c1"
            component: "PieChart"
            catalogId: "charts-catalog"
            data: [10, 20, 30]
  expect:
    surfaces:
      s_v10_multi:
        exists: true
        components:
          - id: "root"
            component: "Column"
            children: ["c1"]
          - id: "c1"
            component: "PieChart"
            data: [10, 20, 30]

- name: test_v10_update_data_model_deletion
  description: Tests that updating a path with value null deletes the key from the data model in v1.0.
  action: process_messages
  protocolVersion: "v1.0"
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_v10_del"
        catalogId: "test-catalog-v10"
        dataModel:
          user:
            name: "Alice"
            temporaryToken: "abc123xyz"
    - version: "v1.0"
      updateDataModel:
        surfaceId: "s_v10_del"
        path: "/user/temporaryToken"
        value: null
  expect:
    surfaces:
      s_v10_del:
        dataModel:
          user:
            name: "Alice"

- name: test_v10_get_renderer_capabilities
  description: Tests generating v1.0 renderer capabilities structure.
  action: get_renderer_capabilities
  catalogs:
    - catalogId: cat-v10
      protocolVersion: "v1.0"
  args:
    includeInlineCatalogs: false
    version: "v1.0"
  expect:
    v1.0:
      supportedCatalogIds:
        - "cat-v10"

- name: test_multiple_update_types_error
  description: Tests that sending a single message envelope containing multiple update actions raises a ValidationError.
  action: process_messages
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "test-catalog-v10"
      deleteSurface:
        surfaceId: "s1"
  expectError:
    category: "ValidationError"
    message: "Message contains multiple conflicting update actions"

- name: test_batch_message_array_and_wrapper
  description: Tests that message processor correctly processes message list arrays and wrapped container payloads.
  action: process_messages
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    messages:
      - version: "v1.0"
        createSurface:
          surfaceId: "s1"
          catalogId: "test-catalog-v10"
      - version: "v1.0"
        createSurface:
          surfaceId: "s2"
          catalogId: "test-catalog-v10"
  expect:
    surfaces:
      s1:
        exists: true
      s2:
        exists: true

- name: test_v10_rejects_v08_begin_rendering_action
  description: Tests that v1.0 MessageProcessor ignores v0.8 beginRendering action when protocolVersion is v1.0.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      beginRendering:
        surfaceId: "s_v10_invalid"
        catalogId: "test-catalog-v10"
  expect:
    surfaces:
      s_v10_invalid:
        exists: false

- name: test_v10_non_string_surface_id_error
  description: Tests that a v1.0 action with a non-string surfaceId raises a ValidationError.
  action: process_messages
  catalogPaths:
    - "specification/v1_0/catalogs/basic/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: 12345
        catalogId: "test-catalog-v10"
  expectError:
    category: "ValidationError"
    message: "surfaceId must be a string"

- name: test_v10_update_components_mismatched_catalog_protocol_version_error
  description: Tests that updating a component with a catalog of a different protocol version raises CatalogError.
  action: process_messages
  catalogs:
    - catalogId: cat-v10
      protocolVersion: "v1.0"
    - catalogId: cat-v09
      protocolVersion: "v0.9"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_mismatch"
        catalogId: "cat-v10"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_mismatch"
        components:
          - id: "c1"
            component: "Button"
            catalogId: "cat-v09"
  expectError:
    category: "CatalogError"

- name: test_unsupported_protocol_version_error
  description: Verifies rejecting unsupported protocol version strings (v99.0).
  action: process_messages
  messages:
    - version: "v99.0"
      createSurface:
        surfaceId: "s1"
  expectError:
    category: "ValidationError"
    message: "Unsupported protocol version 'v99.0'"

- name: test_v091_version_string_compatibility
  description: Verifies processing messages with version v0.9.1.
  action: process_messages
  protocolVersion: "v0.9.1"
  messages:
    - version: "v0.9.1"
      createSurface:
        surfaceId: "s_v091"
        catalogId: "basic"
  expect:
    surfaces:
      s_v091:
        exists: true

- name: test_missing_version_field_in_v10_process_messages_error
  description: Verifies ValidationError on missing version field during process_messages.
  action: process_messages
  messages:
    - createSurface:
        surfaceId: "s1"
        catalogId: "basic"
  expectError:
    category: "ValidationError"
    message: "Missing required version field"

- name: test_batch_multi_stage_lifecycle_pipeline
  description: Verifies create, component update, data update, and component mutation within a single batch array.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_pipeline"
        catalogId: "test-catalog-v10"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_pipeline"
        components:
          - id: "root"
            component: "Column"
            children: ["btn1"]
          - id: "btn1"
            component: "Button"
            title: "Initial"
    - version: "v1.0"
      updateDataModel:
        surfaceId: "s_pipeline"
        path: "/status"
        value: "ready"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_pipeline"
        components:
          - id: "btn1"
            component: "Button"
            title: "Updated"
  expect:
    surfaces:
      s_pipeline:
        exists: true
        dataModel:
          status: "ready"
        components:
          - id: "root"
            component: "Column"
          - id: "btn1"
            component: "Button"

- name: test_batch_duplicate_component_ids_in_same_message_error
  description: Verifies IntegrityError on duplicate component IDs within a single updateComponents message.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_dup"
        catalogId: "basic"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_dup"
        components:
          - id: "root"
            component: "Column"
            children: ["c1"]
          - id: "c1"
            component: "Text"
            text: "First"
          - id: "c1"
            component: "Text"
            text: "Duplicate"
  expectError:
    category: "IntegrityError"

- name: test_batch_atomic_rollback_on_candidate_topology_cycle
  description: Verifies candidate topology pre-flight cycle check aborts without mutating existing valid component tree.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_cycle"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Column"
                children: ["c1"]
              - id: "c1"
                component: "Text"
                text: "Valid Text"
      expect:
        surfaces:
          s_cycle:
            exists: true
            components:
              - id: "root"
                component: "Column"
              - id: "c1"
                component: "Text"
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: "s_cycle"
            components:
              - id: "c1"
                component: "Column"
                children: ["c2"]
              - id: "c2"
                component: "Column"
                children: ["c1"]
      expectError:
        category: "IntegrityError"

- name: test_update_components_on_deleted_surface_error
  description: Verifies updating components on a deleted surface raises IntegrityError.
  action: process_messages
  protocolVersion: "v1.0"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_del"
            catalogId: "basic"
        - version: "v1.0"
          deleteSurface:
            surfaceId: "s_del"
      expect:
        surfaces:
          s_del:
            exists: false
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: "s_del"
            components:
              - id: "root"
                component: "Text"
                text: "Fail"
      expectError:
        category: "IntegrityError"

- name: test_update_data_model_on_deleted_surface_error
  description: Verifies updating data model on a deleted surface raises IntegrityError.
  action: process_messages
  protocolVersion: "v1.0"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_del_data"
            catalogId: "basic"
        - version: "v1.0"
          deleteSurface:
            surfaceId: "s_del_data"
      expect:
        surfaces:
          s_del_data:
            exists: false
    - messages:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s_del_data"
            path: "/key"
            value: "value"
      expectError:
        category: "IntegrityError"

- name: test_delete_non_existent_surface_is_safe_noop
  description: Verifies deleting a non-existent surface ID executes cleanly as a no-op.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "non_existent_surface_id"
  expect:
    surfaces:
      non_existent_surface_id:
        exists: false

- name: test_permissive_mode_allows_orphan_components
  description: Verifies strictMode false accepts components unreachable from root.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: false
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_permissive_orphan"
        catalogId: "test-catalog-v10"
        components:
          - id: "root"
            component: "Column"
            children: []
          - id: "orphan_comp"
            component: "Button"
            title: "Unreachable Button"
  expect:
    surfaces:
      s_permissive_orphan:
        exists: true
        components:
          - id: "root"
            component: "Column"
          - id: "orphan_comp"
            component: "Button"

- name: test_permissive_mode_allows_dangling_references
  description: Verifies strictMode false accepts containers referencing uncreated child IDs.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: false
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_permissive_dangling"
        catalogId: "test-catalog-v10"
        components:
          - id: "root"
            component: "Column"
            children: ["uncreated_child_node"]
  expect:
    surfaces:
      s_permissive_dangling:
        exists: true
        components:
          - id: "root"
            component: "Column"

- name: test_composition_constraints_preserved_on_partial_parent_update
  description: Verifies updating container property without redefining children preserves existing child relationships.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_partial_parent"
        catalogId: "test-catalog-v10"
        components:
          - id: "root"
            component: "Column"
            children: ["btn_child"]
          - id: "btn_child"
            component: "Button"
            title: "Child Button"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_partial_parent"
        components:
          - id: "btn_child"
            component: "Button"
            title: "Updated Child Title"
  expect:
    surfaces:
      s_partial_parent:
        exists: true
        components:
          - id: "root"
            component: "Column"
          - id: "btn_child"
            component: "Button"

