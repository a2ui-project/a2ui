- name: test_composition_constraints_preserved_on_partial_parent_update
  description: Verifies updating container property without redefining children preserves existing child relationships.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_partial_parent"
        catalogId: "test-catalog-v10"
        components:
          - id: "root"
            component: "Column"
            children: ["btn_child"]
          - id: "btn_child"
            component: "Button"
            title: "Child Button"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_partial_parent"
        components:
          - id: "btn_child"
            component: "Button"
            title: "Updated Child Title"
  expect:
    surfaces:
      s_partial_parent:
        exists: true
        components:
          - id: "root"
            component: "Column"
          - id: "btn_child"
            component: "Button"

