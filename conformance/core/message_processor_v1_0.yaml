- name: test_batch_multi_stage_lifecycle_pipeline
  description: Verifies create, component update, data update, and component mutation within a single batch array.
  action: process_messages
  protocolVersion: "v1.0"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_pipeline"
        catalogId: "test-catalog-v10"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_pipeline"
        components:
          - id: "root"
            component: "Column"
            children: ["btn1"]
          - id: "btn1"
            component: "Button"
            title: "Initial"
    - version: "v1.0"
      updateDataModel:
        surfaceId: "s_pipeline"
        path: "/status"
        value: "ready"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_pipeline"
        components:
          - id: "btn1"
            component: "Button"
            title: "Updated"
  expect:
    surfaces:
      s_pipeline:
        exists: true
        dataModel:
          status: "ready"
        components:
          - id: "root"
            component: "Column"
          - id: "btn1"
            component: "Button"

- name: test_batch_duplicate_component_ids_in_same_message_error
  description: Verifies IntegrityError on duplicate component IDs within a single updateComponents message.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s_dup"
        catalogId: "basic"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s_dup"
        components:
          - id: "root"
            component: "Column"
            children: ["c1"]
          - id: "c1"
            component: "Text"
            text: "First"
          - id: "c1"
            component: "Text"
            text: "Duplicate"
  expectError:
    category: "IntegrityError"

- name: test_batch_atomic_rollback_on_candidate_topology_cycle
  description: Verifies candidate topology pre-flight cycle check aborts without mutating existing valid component tree.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_cycle"
            catalogId: "basic"
            components:
              - id: "root"
                component: "Column"
                children: ["c1"]
              - id: "c1"
                component: "Text"
                text: "Valid Text"
      expect:
        surfaces:
          s_cycle:
            exists: true
            components:
              - id: "root"
                component: "Column"
              - id: "c1"
                component: "Text"
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: "s_cycle"
            components:
              - id: "c1"
                component: "Column"
                children: ["c2"]
              - id: "c2"
                component: "Column"
                children: ["c1"]
      expectError:
        category: "IntegrityError"

- name: test_update_components_on_deleted_surface_error
  description: Verifies updating components on a deleted surface raises IntegrityError.
  action: process_messages
  protocolVersion: "v1.0"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_del"
            catalogId: "basic"
        - version: "v1.0"
          deleteSurface:
            surfaceId: "s_del"
      expect:
        surfaces:
          s_del:
            exists: false
    - messages:
        - version: "v1.0"
          updateComponents:
            surfaceId: "s_del"
            components:
              - id: "root"
                component: "Text"
                text: "Fail"
      expectError:
        category: "IntegrityError"

- name: test_update_data_model_on_deleted_surface_error
