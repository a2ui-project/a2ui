# Catalog resolution, continued. A call resolves its catalog on its own
# wherever it appears: in another call's args, in @index's args, or inside a
# list. Resolution happens whether or not strictMode is on.

- name: test_v10_nested_call_in_args_resolves_its_own_catalog
  description: >-
    A call nested in the args of another call resolves its catalog on its own and does not inherit the catalog of the call around it. The outer wrap names custom-v10; the inner shout names no catalogId, so it resolves to the surface default (the basic catalog), which declares no shout.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  catalogs:
    - catalogId: "custom-v10"
      protocolVersion: "v1.0"
      components:
        Badge:
          type: object
          properties:
            component:
              const: Badge
            label:
              $ref: "common_types.json#/$defs/DynamicString"
          required: ["component", "label"]
        Tags:
          type: object
          properties:
            component:
              const: Tags
            items:
              type: array
          required: ["component", "items"]
      functions:
        shout:
          type: object
          returnType: string
          properties:
            "@call":
              const: shout
            args:
              type: object
              properties:
                value:
                  type: string
              required: ["value"]
              additionalProperties: false
          required: ["@call", "args"]
        wrap:
          type: object
          returnType: string
          properties:
            "@call":
              const: wrap
            args:
              type: object
              properties:
                value: {}
              required: ["value"]
              additionalProperties: false
          required: ["@call", "args"]
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s"
        components:
          - id: "root"
            component: "Text"
            text:
              "@call": "wrap"
              catalogId: "custom-v10"
              args:
                value:
                  "@call": "shout"
                  args:
                    value: "hi"
  expectError:
    category: "ValidationError"
    message: "Unrecognized function 'shout'"

