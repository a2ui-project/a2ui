# Data model requests and surfaces without a default catalog. A surface keeps
# the protocol version of the message that created it, so a surface with no
# default catalog is still filtered by version.

- name: test_v10_get_renderer_data_model_includes_surface_without_default
  description: >-
    A v1.0 surface created without a default catalog keeps the protocol version of the message that created it, so it is part of a v1.0 data model request. Its data model is empty.
  action: get_renderer_data_model
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s"
        sendDataModel: true
  args:
    version: "v1.0"
  expect:
    version: "v1.0"
    surfaces:
      s: {}

- name: test_v10_get_renderer_data_model_excludes_surface_without_default_from_v09
  description: >-
    A v1.0 surface created without a default catalog is not part of a v0.9 data model request, so the request finds no surface to report.
  action: get_renderer_data_model
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s"
        sendDataModel: true
  args:
    version: "v0.9"
  expect: null

- name: test_v10_get_renderer_data_model_filters_by_surface_protocol_version
  description: >-
    With a v1.0 surface that has no default catalog and a v0.9 surface side by side, a v0.9 data model request reports only the v0.9 surface. The surfaces are created in separate steps, one batch per protocol version.
  action: get_renderer_data_model
  protocolVersion: "v1.0"
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
    - "specification/v0_9/catalogs/basic/catalog.json"
  steps:
    - messages:
        - version: "v1.0"
          createSurface:
            surfaceId: "s"
            sendDataModel: true
    - messages:
        - version: "v0.9"
          createSurface:
            surfaceId: "t"
            catalogId: "https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json"
            sendDataModel: true
  args:
    version: "v0.9"
  expect:
    version: "v0.9"
    surfaces:
      t: {}
