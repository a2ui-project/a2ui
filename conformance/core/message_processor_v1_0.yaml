# Catalog resolution (spec section "Catalog resolution"): a component or
# function call uses the catalog it names, else the surface default catalog;
# if neither exists, resolution fails.

- name: test_v10_component_without_catalog_id_on_surface_without_default_errors
  description: >-
    A component that names no catalogId on a surface that names no default catalog cannot be resolved, so the update fails instead of falling back to the first registered catalog.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  catalogs:
    - catalogId: "custom-v10"
      protocolVersion: "v1.0"
      components:
        Badge:
          type: object
          properties:
            component:
              const: Badge
            label:
              $ref: "common_types.json#/$defs/DynamicString"
          required: ["component", "label"]
      functions:
        shout:
          type: object
          returnType: string
          properties:
            "@call":
              const: shout
            args:
              type: object
              properties:
                value:
                  type: string
              required: ["value"]
              additionalProperties: false
          required: ["@call", "args"]
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"
  expectError:
    category: "CatalogError"
    message: "has no default catalogId"

- name: test_v10_components_naming_catalogs_on_surface_without_default
  description: >-
    A surface without a default catalog accepts components that each name their catalog.
  action: process_messages
  protocolVersion: "v1.0"
  strictMode: true
  catalogPaths:
    - "catalogs/basic/v1/catalog.json"
  catalogs:
    - catalogId: "custom-v10"
      protocolVersion: "v1.0"
      components:
        Badge:
          type: object
          properties:
            component:
              const: Badge
            label:
              $ref: "common_types.json#/$defs/DynamicString"
          required: ["component", "label"]
      functions:
        shout:
          type: object
          returnType: string
          properties:
            "@call":
              const: shout
            args:
              type: object
              properties:
                value:
                  type: string
              required: ["value"]
              additionalProperties: false
          required: ["@call", "args"]
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s"
        components:
          - id: "root"
            component: "Column"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            children: ["greeting", "badge"]
          - id: "greeting"
            component: "Text"
            catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
            text: "Hello"
          - id: "badge"
            component: "Badge"
            catalogId: "custom-v10"
