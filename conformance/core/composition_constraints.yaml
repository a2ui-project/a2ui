- name: test_composition_surface_implicit_parent_container
  description: Verifies root components treating Surface as canonical parent container when allowedParents includes Surface.
  catalog:
    protocolVersion: "1.0"
  action: process_messages
  validationConfig: {}
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "basic"
            components:
              - id: root
                component: Column
                children: [t1]
              - id: t1
                component: Text
                text: "Hello World"
  expect:
    surfaces:
      s1:
        components:
          root:
            component: Column
            children: [t1]
          t1:
            component: Text
            text: "Hello World"

- name: test_composition_unallowed_parent_error
  description: Verifies validation error thrown when component is placed under an unallowed parent component type.
  catalog:
    catalogId: "custom"
    protocolVersion: "1.0"
    components:
      ColumnHeader:
        type: "object"
        allowedParents: ["Column"]
      Row:
        type: "object"
        properties:
          children:
            $ref: "#/$defs/ChildList"
  action: process_messages
  validationConfig: {}
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: Row
                children: [invalid_header]
              - id: invalid_header
                component: ColumnHeader
  expectError:
    category: "ValidationError"
    code: "UNALLOWED_PARENT"
    surfaceId: "s1"
    path: "/components/1"
    message: "Component 'invalid_header' (ColumnHeader) cannot be placed under parent 'root' (Row). Allowed parents: ['Column']."
    details:
      - path: "/components/1"
        code: "UNALLOWED_PARENT"
        surfaceId: "s1"
    rendererError:
      version: "1.0"
      error:
        code: "UNALLOWED_PARENT"
        surfaceId: "s1"
        path: "/components/1"
        message: "Component 'invalid_header' (ColumnHeader) cannot be placed under parent 'root' (Row). Allowed parents: ['Column']."

- name: test_composition_unallowed_parent_root_error
  description: Verifies validation error thrown when root component does not allow Surface as its implicit parent.
  catalog:
    protocolVersion: "1.0"
    catalogSchema:
      catalogId: "custom"
      components:
        ColumnHeader:
          allowedParents: ["Column"]
  action: validate
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: ColumnHeader
  expectError:
    category: "ValidationError"
    code: "UNALLOWED_PARENT"
    surfaceId: "s1"
    path: "/components/0"
    message: "Component 'root' (ColumnHeader) cannot be placed under parent 'Surface' (Surface). Allowed parents: ['Column']."
    details:
      - path: "/components/0"
        code: "UNALLOWED_PARENT"
        surfaceId: "s1"
    rendererError:
      version: "1.0"
      error:
        code: "UNALLOWED_PARENT"
        surfaceId: "s1"
        path: "/components/0"
        message: "Component 'root' (ColumnHeader) cannot be placed under parent 'Surface' (Surface). Allowed parents: ['Column']."

- name: test_composition_unallowed_child_error
  description: Verifies validation error thrown when container contains an unallowed child component type.
  catalog:
    catalogId: "custom"
    protocolVersion: "1.0"
    components:
      RestrictedBox:
        type: "object"
        allowedChildren: ["Text", "Button"]
        properties:
          children:
            $ref: "#/$defs/ChildList"
      Video:
        type: "object"
  action: process_messages
  validationConfig: {}
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: RestrictedBox
                children: [v1]
              - id: v1
                component: Video
  expectError:
    category: "ValidationError"
    code: "UNALLOWED_CHILD"
    surfaceId: "s1"
    path: "/components/0/children/0"
    message: "Container 'root' (RestrictedBox) cannot contain child 'v1' (Video). Allowed children: ['Text', 'Button']."
    details:
      - path: "/components/0/children/0"
        code: "UNALLOWED_CHILD"
        surfaceId: "s1"
    rendererError:
      version: "1.0"
      error:
        code: "UNALLOWED_CHILD"
        surfaceId: "s1"
        path: "/components/0/children/0"
        message: "Container 'root' (RestrictedBox) cannot contain child 'v1' (Video). Allowed children: ['Text', 'Button']."

# Each case sets the validation flags it relies on in `validationConfig`; a
# flag it leaves out is false. The cases below share their catalogs and, where
# only the validation config differs, their payloads through YAML anchors, so
# that what differs between two cases is written in the cases themselves.

- name: test_composition_dropped_child_is_not_checked_against_surface
  description: >-
    A container rewritten to drop a child leaves a component that nothing
    references. Only the surface's root is checked against Surface in
    allowedParents, so when orphans are allowed the update is accepted, even
    though the child's allowedParents does not include Surface. The other
    checks are on, so the processor checks the whole surface.
  catalog: &box_header_catalog
    catalogId: "custom"
    protocolVersion: "1.0"
    components:
      Box:
        type: "object"
        properties:
          children:
            $ref: "#/$defs/ChildList"
      Header:
        type: "object"
        allowedParents: ["Box"]
  action: process_messages
  validationConfig:
    allowOrphanComponents: true
  steps:
    - payload: &create_box_holding_header
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: Box
                children: [h]
              - id: h
                component: Header
    - payload: &drop_header_from_box
        - version: "1.0"
          updateComponents:
            surfaceId: "s1"
            components:
              - id: root
                component: Box
                children: []
  expect:
    surfaces:
      s1:
        components:
          root:
            component: Box
            children: []
          h:
            component: Header

- name: test_composition_dropped_child_is_not_checked_against_surface_when_references_may_dangle
  description: >-
    The same payloads as test_composition_dropped_child_is_not_checked_against_surface,
    when references to components that have not arrived are also allowed. An
    SDK may then check only the components each update changes; the dropped
    child is still not checked against Surface.
  catalog: *box_header_catalog
  action: process_messages
  validationConfig:
    allowOrphanComponents: true
    allowDanglingReferences: true
  steps:
    - payload: *create_box_holding_header
    - payload: *drop_header_from_box
  expect:
    surfaces:
      s1:
        components:
          root:
            component: Box
            children: []
          h:
            component: Header

- name: test_composition_dropped_child_is_reported_as_orphan
  description: >-
    The same payloads as test_composition_dropped_child_is_not_checked_against_surface,
    when orphans are not allowed. The topology check reports the dropped child
    as unreachable from the root; it is not reported as UNALLOWED_PARENT
    against Surface.
  catalog: *box_header_catalog
  action: process_messages
  validationConfig:
    allowOrphanComponents: false
  steps:
    - payload: *create_box_holding_header
    - payload: *drop_header_from_box
      expectError:
        category: "IntegrityError"
        message: "Component 'h' is not reachable from 'root'"

- name: test_composition_root_referenced_by_another_component_checked_against_surface
  description: >-
    The surface's root is checked against Surface in allowedParents even when
    another component also lists it as a child. The other component is an
    orphan, which the config allows.
  catalog:
    catalogId: "custom"
    protocolVersion: "1.0"
    components:
      Box:
        type: "object"
        properties:
          children:
            $ref: "#/$defs/ChildList"
      Card:
        type: "object"
        allowedParents: ["Box"]
  action: process_messages
  validationConfig:
    allowOrphanComponents: true
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: Card
              - id: box
                component: Box
                children: [root]
      expectError:
        category: "ValidationError"
        code: "UNALLOWED_PARENT"
        message: "Component 'root' (Card) cannot be placed under parent 'Surface' (Surface). Allowed parents: ['Box']."

- name: test_composition_multiple_parents_disallowed_first
  description: >-
    Every parent of a component is checked against its allowedParents. Here the
    disallowed parent comes first in surface order.
  catalog: &box_card_header_catalog
    catalogId: "custom"
    protocolVersion: "1.0"
    components:
      Box:
        type: "object"
        properties:
          children:
            $ref: "#/$defs/ChildList"
      Card:
        type: "object"
        properties:
          children:
            $ref: "#/$defs/ChildList"
      Header:
        type: "object"
        allowedParents: ["Box"]
  action: process_messages
  validationConfig: {}
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: Box
                children: [card, b]
              - id: card
                component: Card
                children: [h]
              - id: b
                component: Box
                children: [h]
              - id: h
                component: Header
      expectError:
        category: "ValidationError"
        code: "UNALLOWED_PARENT"
        message: "Component 'h' (Header) cannot be placed under parent 'card' (Card). Allowed parents: ['Box']."

- name: test_composition_multiple_parents_disallowed_second
  description: >-
    The same as test_composition_multiple_parents_disallowed_first, with the
    disallowed parent second in surface order.
  catalog: *box_card_header_catalog
  action: process_messages
  validationConfig: {}
  steps:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "custom"
            components:
              - id: root
                component: Box
                children: [b, card]
              - id: b
                component: Box
                children: [h]
              - id: card
                component: Card
                children: [h]
              - id: h
                component: Header
      expectError:
        category: "ValidationError"
        code: "UNALLOWED_PARENT"
        message: "Component 'h' (Header) cannot be placed under parent 'card' (Card). Allowed parents: ['Box']."
