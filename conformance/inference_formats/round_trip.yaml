# --- Format-Independent Round-Trip Conformance Tests ---
# Round-tripping verifies that an A2UI payload decompiled to DSL and
# compiled back produces a semantically equivalent A2UI payload.

- name: test_round_trip_product_card
  description: Verifies round tripping of a product card example.
  action: round_trip
  input_file: "specification/v1_0/catalogs/basic/examples/05_product-card.json"

- name: test_round_trip_contact_card
  description: Verifies round tripping of a contact card example with text and icon components.
  action: round_trip
  input_file: "specification/v1_0/catalogs/basic/examples/25_contact-card.json"

- name: test_round_trip_countdown_timer
  description: Verifies round tripping of a countdown timer example.
  action: round_trip
  input_file: "specification/v1_0/catalogs/basic/examples/28_countdown-timer.json"

- name: test_round_trip_flight_status
  description: Verifies round tripping of the flight status example.
  action: round_trip
  input_file: "specification/v1_0/catalogs/basic/examples/01_flight-status.json"

- name: test_round_trip_email_compose
  description: Verifies round tripping of the email compose example.
  action: round_trip
  input_file: "specification/v1_0/catalogs/basic/examples/02_email-compose.json"

- name: test_round_trip_data_model
  description: Verifies round tripping of shared data model assignments with UI components.
  action: round_trip
  surface_id: "test_data_surf"
  input:
    version: "v1.0"
    createSurface:
      surfaceId: "test_data_surf"
      dataModel:
        icon: "check"
        title: "Enable notification"
        user:
          firstName: "Alice"
          age: 30
      components:
        - id: "root"
          component: "Card"
          child: "main_column"
        - id: "main_column"
          component: "Column"
          children: ["icon", "title"]
          align: "center"
        - id: "icon"
          component: "Icon"
          name:
            path: "/icon"
        - id: "title"
          component: "Text"
          text:
            path: "/title"
          variant: "body"

- name: test_round_trip_buttons_and_events
  description: Verifies round tripping of buttons with event actions and context.
  action: round_trip
  surface_id: "test_surf"
  input:
    version: "v1.0"
    createSurface:
      surfaceId: "test_surf"
      components:
        - id: "root"
          component: "Column"
          children: ["btn1", "btn2"]
        - id: "btn1"
          component: "Button"
          child: "btn1Label"
          variant: "primary"
          action:
            event:
              name: "submit"
              context:
                val: "42"
        - id: "btn1Label"
          component: "Text"
          text: "Save"
        - id: "btn2"
          component: "Button"
          child: "btn2Label"
          variant: "borderless"
          action:
            event:
              name: "close"
        - id: "btn2Label"
          component: "Text"
          text: "Cancel"

- name: test_round_trip_text_field_checks
  description: Verifies round tripping of form text fields with validation checks.
  action: round_trip
  surface_id: "test_surf"
  input:
    version: "v1.0"
    createSurface:
      surfaceId: "test_surf"
      components:
        - id: "root"
          component: "Column"
          children: ["nameField"]
        - id: "nameField"
          component: "TextField"
          label: "Name"
          value:
            path: "/form/name"
          checks:
            - condition:
                call: "required"
                args:
                  value:
                    path: "/form/name"
              message: "Required check failed"

- name: test_round_trip_tabs
  description: Verifies round tripping of tabs with embedded tab definitions.
  action: round_trip
  surface_id: "test_surf"
  input:
    version: "v1.0"
    createSurface:
      surfaceId: "test_surf"
      components:
        - id: "root"
          component: "Tabs"
          tabs:
            - title: "Overview"
              child: "contentCol"
        - id: "contentCol"
          component: "Column"
          children: []

- name: test_round_trip_format_string
  description: Verifies round tripping of text components using formatString expressions.
  action: round_trip
  surface_id: "test_surf"
  input:
    version: "v1.0"
    createSurface:
      surfaceId: "test_surf"
      components:
        - id: "root"
          component: "Text"
          text:
            call: "formatString"
            args:
              value: "Welcome, ${/user/name}!"
