# --- Express Format Prompt Generation Conformance Tests ---

- name: test_prompt_generation_basic
  description: Verifies prompt generation with role, workflow, and schema inclusion.
  action: generate_prompt
  args:
    role_description: "You are a helpful assistant."
    workflow_description: "Please adhere to constraints."
    include_schema: true
  expect_contains:
    - "You are a helpful assistant."
    - "Please adhere to constraints."
    - "# A2UI Express DSL Output Contract"
    - "Text("

- name: test_prompt_generation_allowed_components_pruning
  description: Verifies prompt generation prunes components not in the allowed list.
  action: generate_prompt
  args:
    role_description: "Test role"
    include_schema: true
    allowed_components: ["Button"]
  expect_contains:
    - "Button("
  expect_not_contains:
    - "Text("

- name: test_prompt_generation_custom_workflow_and_ui
  description: Verifies prompt generation includes custom workflow and UI instructions.
  action: generate_prompt
  args:
    role_description: "Test role"
    workflow_description: "Custom workflow instructions"
    ui_description: "Custom UI rules"
    include_schema: true
  expect_contains:
    - "Custom workflow instructions"
    - "Custom UI rules"

- name: test_prompt_generation_with_examples
  description: Verifies prompt generation includes and transforms examples.
  action: generate_prompt
  args:
    role_description: "Test role"
    include_schema: true
    include_examples: true
    examples_path: "specification/v1_0/catalogs/basic/examples"
    validate_examples: false
  expect_contains:
    - "### Examples:"
