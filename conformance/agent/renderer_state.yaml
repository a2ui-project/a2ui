        [
          {"version": "1.0", "deleteSurface": {"surfaceId": "s1"}}
        ]
        </a2ui-json>
      expect_surfaces: {}
    - format: direct_json
      response: |-
        <a2ui-json>
        [
          {
            "version": "1.0",
            "createSurface": {
              "surfaceId": "s1",
              "catalogId": "conformance/simplified"
            }
          },
          {
            "version": "1.0",
            "updateComponents": {
              "surfaceId": "s1",
              "components": [
                {"id": "root", "component": "Text", "text": "Second"}
              ]
            }
          }
        ]
        </a2ui-json>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Text"
              text: "Second"

# --- Express multi-turn state ---

- name: test_renderer_state_express_retains_state_across_turns
  description: An Express surface created on turn 1 can have its components and data model updated on turn 2 without re-creating the surface.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: express
      response: |-
        Creating the main surface.
        <a2ui>
        surface("s1")
        root = Column([header, subtitle])
        header = Text("Hello")
        subtitle = Text($/title)
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["header", "subtitle"]
            header:
              component: "Text"
              text: "Hello"
            subtitle:
              component: "Text"
              text:
                "@path": "/title"
          data: {}
    - format: express
      response: |-
        Updating the existing surface.
        <a2ui>
        surface("s1")
        header = Text("Updated")
        $/title = "Updated"
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["header", "subtitle"]
            header:
              component: "Text"
              text: "Updated"
            subtitle:
              component: "Text"
              text:
                "@path": "/title"
          data:
            title: "Updated"

- name: test_renderer_state_express_unknown_surface_rejected
  description: Updating a surface with updateDataModel when the surface was never created in the stateful session is rejected with a ValidationError.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: express
      response: |-
        <a2ui>
        surface("missing_surface")
        $/title = "Orphan"
        </a2ui>
      expect_error:
        category: "ValidationError"

- name: test_renderer_state_express_failed_turn_rolls_back_state
  description: An Express turn that fails topology validation after mutating a surface rolls back to the last committed state so the next turn succeeds against turn 1's state.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Column([item_a])
        item_a = Text("Item A")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["item_a"]
            item_a:
              component: "Text"
              text: "Item A"
          data: {}
    - format: express
      response: |-
        <a2ui>
        surface("s1", update=true)
        $/status = "draft"
        root = Column([nonexistent_child])
        </a2ui>
      expect_error:
        category: "ValidationError"
        message: "nonexistent_child"
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        item_a = Text("Item A Updated")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["item_a"]
            item_a:
              component: "Text"
              text: "Item A Updated"
          data: {}

- name: test_renderer_state_express_delete_then_recreate_surface
  description: Deleting an Express surface on turn 2 allows re-creating the same surface on turn 3.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Text("First")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Text"
              text: "First"
    - format: express
      response: |-
        <a2ui>
        deleteSurface("s1")
        </a2ui>
      expect_surfaces: {}
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Text("Second")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Text"
              text: "Second"

# --- Decoded message payload multi-turn state ---

- name: test_renderer_state_payload_applies_and_rolls_back_messages
  description: Applying decoded AgentToRendererMessage payloads inside a RendererState transaction retains state across turns and rolls back failed turns atomically.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - payload:
        - version: "1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "conformance/simplified"
            components:
              - id: "root"
                component: "Column"
                children: ["title_text"]
              - id: "title_text"
                component: "Text"
                text:
                  "@path": "/title"
            dataModel:
              title: "Initial"
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["title_text"]
            title_text:
              component: "Text"
              text:
                "@path": "/title"
          data:
            title: "Initial"
    - payload:
        - version: "1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/title"
            value: "Discarded"
        - version: "1.0"
          updateComponents:
            surfaceId: "s1"
            components:
              - id: "root"
                component: "Column"
                children: ["nonexistent_child"]
      expect_error:
        category: "ValidationError"
        message: "nonexistent_child"
    - payload:
        - version: "1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/title"
            value: "Committed"
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["title_text"]
            title_text:
              component: "Text"
              text:
                "@path": "/title"
          data:
            title: "Committed"

# --- Surfaces another agent created ---

- name: test_renderer_state_assumes_unknown_surface_when_asked
  description: A state made with assumeUnknownSurfaces accepts an update to a surface it never saw created, as a sub-agent sends to a surface another agent created, and keeps the surface for the next turn.
  action: renderer_state_turns
  assumeUnknownSurfaces: true
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: direct_json
      response: |-
        <a2ui-json>
        [
          {
            "version": "1.0",
            "updateComponents": {
              "surfaceId": "shared_surface",
              "components": [
                {"id": "status", "component": "Text", "text": "Ready"}
              ]
            }
          }
        ]
        </a2ui-json>
      expect_surfaces:
        shared_surface:
          components:
            status:
              component: "Text"
              text: "Ready"
    - payload:
        - version: "1.0"
          updateDataModel:
            surfaceId: "shared_surface"
            path: "/title"
            value: "Updated"
      expect_surfaces:
        shared_surface:
          components:
            status:
              component: "Text"
              text: "Ready"
          data:
            title: "Updated"

- name: test_renderer_state_does_not_assume_a_surface_the_payload_deleted
  description: Even a state made with assumeUnknownSurfaces rejects an update to a surface that an earlier message of the same payload deleted, since the renderer no longer holds it.
  action: renderer_state_turns
  assumeUnknownSurfaces: true
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - payload:
        - version: "1.0"
          deleteSurface:
            surfaceId: "shared_surface"
        - version: "1.0"
          updateComponents:
            surfaceId: "shared_surface"
            components:
              - id: "status"
                component: "Text"
                text: "Ready"
      expect_error:
        category: "ValidationError"
