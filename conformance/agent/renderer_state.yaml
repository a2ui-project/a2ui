              children: ["item_a"]
            item_a:
              component: "Text"
              text: "Item A"
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Column([nonexistent_child])
        </a2ui>
      expect_error:
        category: "ValidationError"
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        item_a = Text("Item A Updated")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Column"
              children: ["item_a"]
            item_a:
              component: "Text"
              text: "Item A Updated"

- name: test_renderer_state_express_delete_then_recreate_surface
  features: [F-AGT-37, F-AGT-56]
  description: Deleting an Express surface on turn 2 allows re-creating the same surface on turn 3.
  action: renderer_state_turns
  catalogs:
    - "test_data/catalogs/simplified_catalog_v1_0.json"
  turns:
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Text("First")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Text"
              text: "First"
    - format: express
      response: |-
        <a2ui>
        deleteSurface("s1")
        </a2ui>
      expect_surfaces: {}
    - format: express
      response: |-
        <a2ui>
        surface("s1")
        root = Text("Second")
        </a2ui>
      expect_surfaces:
        s1:
          components:
            root:
              component: "Text"
              text: "Second"
