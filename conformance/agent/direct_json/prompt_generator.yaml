# Direct JSON prompt snippets: the system prompt text the direct JSON format
# renders for the catalogs that are active in a session.
#
# A case names the catalogs the agent registered along with the transformers
# applied to them, and optionally the prompt examples. Each case compares the
# entire rendered prompt verbatim against its golden file under
# `test_data/prompts/direct_json/`.
#
# The prompt snippet embeds the agent-to-renderer schema (pruned to
# `allowed_messages`), the common types schema (pruned to definitions reachable
# from the active catalogs and agent-to-renderer schema), and the serialized
# catalog document (`catalog.to_json()` / `catalog.toJson()`) for each active
# catalog, followed by any supplied examples inside `<a2ui-json>` tags.
#
# Every case here is written against v1.0. A case states no version of its own:
# the version it runs under is the one its catalog document declares, or the one
# `args` hands the implementation.

# --- What the catalog contributes ---

- name: test_snippet_names_every_component_of_the_catalog
  description: The snippet renders the full prompt for a single active catalog, including workflow rules, agent-to-renderer schema, pruned common types schema, and the catalog's serialized JSON document.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/simplified_catalog.txt"

- name: test_snippet_names_every_function_of_the_catalog
  description: The snippet names each function of the active catalog alongside its components in the serialized catalog schema.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/simplified_catalog.txt"

- name: test_snippet_omits_a_pruned_component
  description: A component a transformer removed never reaches the model, and unreferenced common types are pruned accordingly.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Text", "Card"]
  expect_file: "test_data/prompts/direct_json/pruned_components.txt"

- name: test_snippet_omits_a_pruned_function
  description: A function a transformer removed never reaches the model either.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        transformers:
          - function_pruning: ["formatString"]
  expect_file: "test_data/prompts/direct_json/pruned_functions.txt"

- name: test_snippet_names_both_catalogs_and_their_ids
  description: With two catalogs active the snippet emits a shared common types schema once and both catalogs' serialized JSON documents.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/two_catalogs.txt"

- name: test_snippet_with_two_catalogs_and_pruning
  description: When multiple catalogs are active and transformed, each catalog in the direct JSON snippet reflects its own component and function pruning rules and common types are pruned to the union of reachable definitions.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Text"]
          - function_pruning: ["formatString"]
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Chart"]
  expect_file: "test_data/prompts/direct_json/two_catalogs_pruned.txt"

# --- Examples ---

- name: test_snippet_renders_supplied_examples
  description: An example reaches the snippet as the payload the model is meant to imitate, wrapped in a2ui-json tags.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    examples:
      - "test_data/examples/greeting_surface.json"
  expect_file: "test_data/prompts/direct_json/single_example.txt"

- name: test_snippet_renders_multi_catalog_examples
  description: Examples spanning multiple active catalogs are validated against their respective catalogs and rendered in the prompt snippet.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
    examples:
      - "test_data/examples/greeting_surface.json"
      - "test_data/examples/chart_series.json"
  expect_file: "test_data/prompts/direct_json/multi_catalog_examples.txt"

- name: test_snippet_without_examples_carries_no_example
  description: The same catalog without examples omits the Examples section altogether.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/simplified_catalog.txt"

# --- Format specifics ---

- name: test_direct_json_snippet_names_its_sentinel_tag
  description: A direct JSON snippet tells the model to write payloads inside the a2ui-json tags.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/simplified_catalog.txt"

- name: test_snippet_describes_only_the_allowed_envelopes
  description: An allowlist of payload envelopes prunes the agent-to-renderer schema and reachable common types to only the allowed envelopes.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    allowed_messages: ["createSurface", "updateComponents"]
  expect_file: "test_data/prompts/direct_json/allowed_messages.txt"

- name: test_snippet_describes_every_envelope_without_an_allowlist
  description: Without an allowlist the snippet describes all envelopes of its protocol version.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_file: "test_data/prompts/direct_json/simplified_catalog.txt"

# --- Determinism ---

- name: test_direct_json_snippet_is_deterministic
  description: Two calls with the same catalogs and examples return the same string, matching the golden prompt verbatim.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
    examples:
      - "test_data/examples/greeting_surface.json"
  expect_file: "test_data/prompts/direct_json/two_catalogs_single_example.txt"
  expect_deterministic: true

# --- Errors ---

- name: test_no_active_catalogs_is_an_error
  description: Generating a snippet with no active catalogs fails, because there is no component the model could be told to write.
  action: generate_prompt_snippet
  args:
    format: direct_json
    catalogs: []
  expect_error:
    category: CatalogError
