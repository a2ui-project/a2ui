- name: test_decompile_json_messages
  description: Messages are written back out as the JSON a model would have emitted,
    and compiling that returns them.
  action: decompile
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: s1
        catalogId: conformance/simplified
    - version: "1.0"
      updateComponents:
        surfaceId: s1
        components:
          - id: root
            component: Text
            text: Hello
  expect_contains:
    - '"updateComponents"'
    - '"Hello"'
  expect_round_trip: true
  features:
    - F-AGT-19
- name: test_decompile_json_update_data_model
  description: A data model update writes back out with its path and value, so an
    example that changes state can be authored from messages.
  action: decompile
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  messages:
    - version: "1.0"
      updateDataModel:
        surfaceId: s1
        path: /title
        value: Hello
  expect_contains:
    - '"updateDataModel"'
    - '"/title"'
  expect_round_trip: true
  features:
    - F-AGT-19
- name: test_decompile_json_delete_surface
  description: A surface deletion writes back out as its own message, which is the
    envelope most likely to be dropped by a decompiler that only walks components.
  action: decompile
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  messages:
    - version: "1.0"
      deleteSurface:
        surfaceId: s1
  expect_contains:
    - '"deleteSurface"'
    - '"s1"'
  expect_round_trip: true
  features:
    - F-AGT-19
- name: test_decompile_json_two_surfaces_in_two_catalogs
  description: Messages targeting two surfaces across two active catalogs round-trip
    cleanly when both catalogs are registered on the decompiler.
  action: decompile
  args:
    format: direct_json
    catalogs:
      - test_data/catalogs/simplified_catalog_v1_0.json
      - test_data/catalogs/custom_catalog_v1_0.json
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: s1
        catalogId: conformance/simplified
    - version: "1.0"
      updateComponents:
        surfaceId: s1
        components:
          - id: root
            component: Text
            text: Summary
    - version: "1.0"
      createSurface:
        surfaceId: s2
        catalogId: conformance/custom
    - version: "1.0"
      updateComponents:
        surfaceId: s2
        components:
          - id: root
            component: Chart
            values:
              - 1
              - 2
            caption: Q1
  expect_contains:
    - '"conformance/simplified"'
    - '"conformance/custom"'
    - '"Chart"'
  expect_round_trip: true
