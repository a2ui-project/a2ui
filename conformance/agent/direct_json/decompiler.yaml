# Direct JSON decompilation: writing A2UI messages back out as JSON.
#
# `decompile` is the inverse of `compile`. It exists so a prompt example can be
# authored as messages and shown to a model in the notation the model is being
# asked to produce. Every case below recompiles its own output and expects the
# messages it started from, so a format that cannot round-trip an envelope fails
# here rather than quietly teaching a model a spelling its own compiler rejects.
#
# This is the shortest suite in the tree for a reason: decompiling direct JSON
# is serialization, and the round trip carries nearly all of the assertion. What
# the payload means is fixed by `agent/direct_json/compiler.yaml`.
#
# A case asserts fragments through `expect_contains` rather than the whole
# output, since indentation and key order are the implementation's as long as it
# recompiles.
#
# The Express counterpart of this suite is `agent/express/decompiler.yaml`,
# which is much longer: Express has a notation to get right, and direct JSON
# does not.
#
# The catalogs under test live in `args`, and every case here is written against
# v1.0. A case states no version of its own: the version it runs under is the
# one its catalog document declares.

# A round trip checks the recompiled block on its own, as `validate_payload`
# does: a surface that the block updates without creating is assumed to exist.

- name: test_decompile_json_messages
  description: Messages are written back out as the JSON a model would have emitted, and compiling that returns them.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"
  expect_contains:
    - '"updateComponents"'
    - '"Hello"'
  expect_round_trip: true

- name: test_decompile_json_update_data_model
  description: A data model update writes back out with its path and value, so an example that changes state can be authored from messages.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      updateDataModel:
        surfaceId: "s1"
        path: "/title"
        value: "Hello"
  expect_contains:
    - '"updateDataModel"'
    - '"/title"'
  expect_round_trip: true

- name: test_decompile_json_delete_surface
  description: A surface deletion writes back out as its own message, which is the envelope most likely to be dropped by a decompiler that only walks components.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      deleteSurface:
        surfaceId: "s1"
  expect_contains:
    - '"deleteSurface"'
    - '"s1"'
  expect_round_trip: true

- name: test_decompile_json_two_surfaces_in_two_catalogs
  description: Messages targeting two surfaces across two active catalogs round-trip cleanly when both catalogs are registered on the decompiler.
  action: decompile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Summary"
    - version: "1.0"
      createSurface:
        surfaceId: "s2"
        catalogId: "conformance/custom"
    - version: "1.0"
      updateComponents:
        surfaceId: "s2"
        components:
          - id: "root"
            component: "Chart"
            values: [1, 2]
            caption: "Q1"
  expect_contains:
    - '"conformance/simplified"'
    - '"conformance/custom"'
    - '"Chart"'
  expect_round_trip: true

- name: test_decompile_json_nested_template_child_list
  description: Nested collection templates preserve outer absolute and inner item-relative paths across a decompile and compile round trip.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            children:
              componentId: "dept_col"
              path: "/departments"
          - id: "dept_col"
            component: "Column"
            children:
              componentId: "emp_txt"
              path: "employees"
          - id: "emp_txt"
            component: "Text"
            text:
              "@path": "name"
  expect_contains:
    - '"/departments"'
    - '"employees"'
    - '"componentId"'
  expect_round_trip: true

- name: test_decompile_json_call_renderer_function
  description: A standalone callRendererFunction envelope serializes with its functionCallId, catalogId, and arguments, and recompiles to the same message.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/allowed_callers_catalog_v1_0.json"
  messages:
    - version: "1.0"
      callRendererFunction:
        functionCallId: "call_1"
        callFunction:
          catalogId: "conformance/allowed_callers"
          "@call": "showToast"
          args:
            message: "Saved"
  expect_contains:
    - '"callRendererFunction"'
    - '"showToast"'
    - '"Saved"'
  expect_round_trip: true

- name: test_decompile_json_multi_surface_payload
  description: A single payload that creates, populates, and updates data on multiple surfaces round-trips with every message intact.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Header"
    - version: "1.0"
      updateDataModel:
        surfaceId: "s1"
        path: "/header"
        value: "Overview"
    - version: "1.0"
      createSurface:
        surfaceId: "s2"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s2"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Details"
  expect_contains:
    - '"s1"'
    - '"s2"'
    - '"updateDataModel"'
  expect_round_trip: true

- name: test_decompile_json_catalog_qualified_components
  description: A single surface whose components carry explicit per-component catalogId fields across two active catalogs round-trips cleanly.
  action: decompile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            catalogId: "conformance/simplified"
            children: ["title", "chart"]
          - id: "title"
            component: "Text"
            catalogId: "conformance/simplified"
            text: "Revenue"
          - id: "chart"
            component: "Chart"
            catalogId: "conformance/custom"
            values: [10, 20, 30]
            caption: "Q1-Q3"
  expect_contains:
    - '"conformance/simplified"'
    - '"conformance/custom"'
    - '"Chart"'
  expect_round_trip: true

- name: test_decompile_json_data_bindings_and_function_calls
  description: Dynamic property expressions using @path data bindings and @call function invocations serialize and recompile without loss.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            children: ["bound_txt", "fn_txt"]
          - id: "bound_txt"
            component: "Text"
            text:
              "@path": "/user/name"
          - id: "fn_txt"
            component: "Text"
            text:
              "@call": "formatString"
              args:
                value:
                  "@path": "/user/greeting"
  expect_contains:
    - '"/user/name"'
    - '"formatString"'
    - '"/user/greeting"'
  expect_round_trip: true

- name: test_decompile_json_button_with_event_action
  description: A Button component with an event action and bound context entries round-trips cleanly.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Button"
            child: "lbl"
            action:
              event:
                name: "save_item"
                context:
                  itemId:
                    "@path": "/item/id"
          - id: "lbl"
            component: "Text"
            text: "Save"
  expect_contains:
    - '"event"'
    - '"save_item"'
    - '"/item/id"'
  expect_round_trip: true

- name: test_decompile_json_button_with_function_call_action
  description: A Button component with a client-side functionCall action round-trips cleanly.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Button"
            child: "lbl"
            action:
              functionCall:
                "@call": "openUrl"
                args:
                  url: "https://example.com"
          - id: "lbl"
            component: "Text"
            text: "Open"
  expect_contains:
    - '"functionCall"'
    - '"openUrl"'
    - '"https://example.com"'
  expect_round_trip: true
