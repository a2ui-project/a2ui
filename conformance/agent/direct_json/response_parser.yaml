# Direct JSON response parsing: turning what a model emitted into ordered text
# and A2UI payload parts.
#
# The suite covers the four steps of the parser contract and the entry point
# that runs them. `unwrap` tokenizes a response into raw parts.
# `wrap` writes raw parts back out as a model would have emitted them.
# `compile` turns one raw block into A2UI messages, `decompile`
# writes messages back into the format's own notation, and `parse_response`
# unwraps a whole response and compiles each block it finds.
#
# A direct JSON payload sits between `<a2ui-json>` tags.
#
# A part carries either text or a payload, never both. Text that precedes a
# payload is its own list item, which is the union the parser returns.
#
# This suite fixes several things the blueprint leaves open. They are decisions
# rather than readings of the spec, so they are stated here rather than left
# for a reader to infer from the cases:
#
# - A response with no sentinel tags unwraps to a single text part, and is not
#   an error. The legacy suite in `legacy/parser.yaml` raises `ParseError` for
#   the same input. The other reading is reached through `parse_response` with
#   `wrapped: false`, which hands the whole body to the compiler.
# - An empty response unwraps to no parts at all.
# - A text run is trimmed of leading and trailing whitespace, and a run left
#   empty by that is dropped. The whitespace between two blocks is not a part.
# - `ParseError` is for payload text the format cannot read. `ValidationError`
#   is for a payload that reads but names something the catalog does not
#   declare. No case uses `CompileError`, because the compilation error type
#   does not yet descend from the base error type and so no harness can match
#   that category.
# - A component carrying a property its catalog does not declare is invalid,
#   but the rule lives in the message envelope rather than in the catalog. Like
#   the published catalogs, the fixtures here leave their component schemas
#   open, and `agent_to_renderer.json` closes each component with
#   `unevaluatedProperties` once it has added the envelope's own `id`. An
#   implementation that validates a component against the bare catalog schema
#   will miss this; it has to validate the message it is about to emit.
# - Decompiling is the inverse of compiling, so every envelope a case compiles
#   has a decompile case that writes it back out and recompiles it to the same
#   messages. A format that cannot round-trip an envelope cannot be used to
#   author the prompt examples the snippet carries.
#
# The Express counterpart of this suite is `agent/express/response_parser.yaml`.
# The two are deliberately parallel: a rule that holds for both formats has a
# case in each, written against that format's own notation.
#
# The catalogs under test live in `args`, and every case here is written against
# v1.0. A case states no version of its own: the version it runs under is the
# one its catalog document declares.

# --- Unwrapping a response ---

- name: test_unwrap_text_before_between_and_after_blocks
  description: Parts come back in the order the model emitted them.
  action: unwrap
  args:
    format: direct_json
  input: |-
    Here is the first surface.
    <a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>
    And here is the second.
    <a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s2"}}]</a2ui-json>
    That is everything.
  expect:
    - text: "Here is the first surface."
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
    - text: "And here is the second."
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s2"}}]'
    - text: "That is everything."

- name: test_unwrap_block_with_no_surrounding_text
  description: A response that is only a block yields only a payload part.
  action: unwrap
  args:
    format: direct_json
  input: '<a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>'
  expect:
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'

- name: test_unwrap_response_without_tags_is_one_text_part
  description: A response that carries no tags is conversational text rather than an error.
  action: unwrap
  args:
    format: direct_json
  input: "No interface this turn, just an answer."
  expect:
    - text: "No interface this turn, just an answer."

- name: test_unwrap_empty_response_has_no_parts
  description: An empty response yields no parts, not an empty text part.
  action: unwrap
  args:
    format: direct_json
  input: ""
  expect: []

- name: test_unwrap_unterminated_block_is_not_final
  description: A block the model left open comes back as a payload part that states it is not closed.
  action: unwrap
  args:
    format: direct_json
  input: |-
    Here it comes.
    <a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}
  expect:
    - text: "Here it comes."
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}'
      is_final: false

- name: test_unwrap_close_tag_inside_a_string_does_not_end_the_block
  description: A close tag that appears inside a payload string is payload text rather than the end of the block.
  action: unwrap
  args:
    format: direct_json
  input: '<a2ui-json>[{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text": "</a2ui-json>"}]}}]</a2ui-json>'
  expect:
    - a2ui_raw: '[{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text": "</a2ui-json>"}]}}]'

- name: test_unwrap_markdown_fence_inside_block_stripped
  description: A markdown fence the model wrapped around the payload is removed with the surrounding whitespace.
  action: unwrap
  args:
    format: direct_json
  input: |-
    <a2ui-json>
    ```json
    [{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]
    ```
    </a2ui-json>
  expect:
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'

- name: test_unwrap_attributes_on_open_tag_tolerated
  description: An open tag that carries attributes still opens a block.
  action: unwrap
  args:
    format: direct_json
  input: '<a2ui-json version="v1.0">[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>'
  expect:
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'

- name: test_unwrap_whitespace_only_text_run_dropped
  description: The blank line between two blocks is not a text part.
  action: unwrap
  args:
    format: direct_json
  input: |-
    <a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>

    <a2ui-json>[{"version": "v1.0", "deleteSurface": {"surfaceId": "s2"}}]</a2ui-json>
  expect:
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s2"}}]'

# --- Writing parts back out ---

- name: test_wrap_text_only_parts_are_the_text
  description: Parts that carry no payload write out as their text, with no tags added.
  action: wrap
  args:
    format: direct_json
  parts:
    - text: "No interface this turn, just an answer."
  expect_output: "No interface this turn, just an answer."

- name: test_wrap_no_parts_is_an_empty_string
  description: An empty part list writes out as an empty string.
  action: wrap
  args:
    format: direct_json
  parts: []
  expect_output: ""

- name: test_wrap_restores_tags_around_a_raw_part
  description: A raw part is written back inside the sentinel tags it was taken from.
  action: wrap
  args:
    format: direct_json
  parts:
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
  expect_contains:
    - "<a2ui-json>"
    - '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
    - "</a2ui-json>"
  expect_round_trip: true

- name: test_wrap_keeps_text_and_blocks_in_order
  description: Text and payload parts are written out in the order they are given, and unwrapping returns them.
  action: wrap
  args:
    format: direct_json
  parts:
    - text: "Here is the surface."
    - a2ui_raw: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
    - text: "Tell me if you want it changed."
  expect_round_trip: true

# --- Compiling a payload ---

- name: test_compile_json_message_list
  description: A well formed message list compiles to those messages.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    [
      {"version": "v1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}},
      {"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text": "Hello"}]}}
    ]
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_json_single_object_is_wrapped_in_a_list
  description: A payload that is one message rather than a list compiles to a list of one.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: '{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}'
  expect:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "s1"

- name: test_compile_json_trailing_commas_removed
  description: Trailing commas in a list and an object are dropped rather than failing the parse.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: '[{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text": "Hello",},]}},]'
  expect:
    - version: "v1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_json_smart_quotes_normalised
  description: Curly quotes a model reached for are read as straight quotes.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "[{“version”: “v1.0”, “deleteSurface”: {“surfaceId”: “s1”}}]"
  expect:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "s1"

- name: test_compile_json_malformed_is_a_parse_error
  description: Payload text that is not JSON is a parse error.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "here is your surface"
  expect_error:
    category: "ParseError"

- name: test_compile_json_empty_block_is_a_parse_error
  description: A block with nothing in it is a parse error rather than an empty message list.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: ""
  expect_error:
    category: "ParseError"

- name: test_compile_json_unknown_component_is_a_validation_error
  description: A payload that reads but names a component the catalog does not declare is a validation error.
  action: compile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: '[{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Sparkline", "values": [1, 2]}]}}]'
  expect_error:
    category: "ValidationError"

# --- Writing messages back out ---

- name: test_decompile_json_messages
  description: Messages are written back out as the JSON a model would have emitted, and compiling that returns them.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
    - version: "v1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"
  expect_contains:
    - '"updateComponents"'
    - '"Hello"'
  expect_round_trip: true

- name: test_decompile_json_update_data_model
  description: A data model update writes back out with its path and value, so an example that changes state can be authored from messages.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      updateDataModel:
        surfaceId: "s1"
        path: "/title"
        value: "Hello"
  expect_contains:
    - '"updateDataModel"'
    - '"/title"'
  expect_round_trip: true

- name: test_decompile_json_delete_surface
  description: A surface deletion writes back out as its own message, which is the envelope most likely to be dropped by a decompiler that only walks components.
  action: decompile
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "s1"
  expect_contains:
    - '"deleteSurface"'
    - '"s1"'
  expect_round_trip: true

# --- Parsing a whole response ---

- name: test_parse_response_keeps_text_and_payloads_in_order
  description: A response with text around a block yields the text, the compiled payload and the closing text, in that order.
  action: parse_response
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    Here is the surface.
    <a2ui-json>[{"version": "v1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text": "Hello"}]}}]</a2ui-json>
    Tell me if you want it changed.
  expect:
    - text: "Here is the surface."
    - a2ui:
        - version: "v1.0"
          updateComponents:
            surfaceId: "s1"
            components:
              - id: "root"
                component: "Text"
                text: "Hello"
    - text: "Tell me if you want it changed."

- name: test_parse_response_without_tags_is_one_text_part
  description: A response with no block is a single text part, and the compiler is never called.
  action: parse_response
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "No interface this turn, just an answer."
  expect:
    - text: "No interface this turn, just an answer."

- name: test_parse_response_unwrapped_compiles_the_whole_body
  description: A response the case declares unwrapped is handed to the compiler whole, with no tags to look for.
  action: parse_response
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    wrapped: false
  input: '[{"version": "v1.0", "deleteSurface": {"surfaceId": "s1"}}]'
  expect:
    - a2ui:
        - version: "v1.0"
          deleteSurface:
            surfaceId: "s1"

- name: test_parse_response_compile_failure_surfaces
  description: A block whose payload cannot be read fails the whole parse rather than becoming a text part.
  action: parse_response
  args:
    format: direct_json
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    Here is the surface.
    <a2ui-json>here is your surface</a2ui-json>
  expect_error:
    category: "ParseError"
