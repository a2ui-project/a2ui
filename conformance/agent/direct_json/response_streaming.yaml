- name: test_chunk_text_emitted_as_it_arrives
  description: Text outside a block is handed on per chunk rather than held until the response ends.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  steps:
    - input: Here is the sur
      expect:
        - text: Here is the sur
    - input: face.
      expect:
        - text: face.
  features:
    - F-AGT-08
    - F-AGT-20
- name: test_chunk_text_then_block_at_part_boundaries
  description: Chunks that fall between parts yield exactly the parts a single call would.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input: "Here is the surface.

        "
      expect:
        - text: Here is the surface.
    - input:
        '<a2ui-json>[{"version": "1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id":
        "root", "component": "Text", "text": "Hello"}]}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Text
                    text: Hello
    - input: "

        That is everything."
      expect:
        - text: That is everything.
  expect_matches_single_shot: true
  features:
    - F-AGT-08
    - F-AGT-20
- name: test_chunk_whole_response_in_one_chunk
  description: A response that arrives whole is parsed as a whole.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  steps:
    - input: 'Here is the surface.

        <a2ui-json>[{"version": "1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>'
      expect:
        - text: Here is the surface.
        - a2ui:
            - version: "1.0"
              deleteSurface:
                surfaceId: s1
  expect_matches_single_shot: true
  features:
    - F-AGT-08
    - F-AGT-20
- name: test_chunk_open_tag_split_across_chunks
