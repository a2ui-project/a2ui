- name: test_chunk_two_blocks_in_one_stream
  description: A stream with two blocks keeps the text between them in its place.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input: "First the greeting.

        "
      expect:
        - text: First the greeting.
    - input:
        '<a2ui-json>[{"version": "1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id":
        "root", "component": "Text", "text": "Hello"}]}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Text
                    text: Hello
    - input: "

        Then I take it away.

        "
      expect:
        - text: Then I take it away.
    - input: '<a2ui-json>[{"version": "1.0", "deleteSurface": {"surfaceId": "s1"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              deleteSurface:
                surfaceId: s1
  expect_matches_single_shot: true
  features: *id001
