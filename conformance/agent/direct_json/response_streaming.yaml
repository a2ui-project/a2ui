- name: test_chunk_closed_components_emit_while_the_next_arrives
  description:
    The components that have closed are emitted while the next one is still arriving, and the
    message is emitted again once that one closes.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
    progressive_keys:
      - text
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input:
        '<a2ui-json>[{"version": "1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id":
        "root", "component": "Card", "child": "body"}, {"id": "body", "component": "Text", "text": "Hel'
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Card
                    child: body
    - input: lo"}]}}]</a2ui-json>
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Card
                    child: body
                  - id: body
                    component: Text
                    text: Hello
  features:
    - F-AGT-20
