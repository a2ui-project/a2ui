- name: test_chunk_progressive_key_heals_a_partial_string
  description:
    A string still arriving under a progressive key is closed where it stands, so the payload
    is emitted and emitted again when the rest of the value lands.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
    progressive_keys:
      - greeting
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input:
        '<a2ui-json>[{"version": "1.0", "updateDataModel": {"surfaceId": "s1", "value": {"greeting":
        "Hel'
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: s1
                value:
                  greeting: Hel
    - input: lo"}}}]</a2ui-json>
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: s1
                value:
                  greeting: Hello
  features:
    - F-AGT-20
- name: test_chunk_key_outside_the_progressive_set_withholds
  description:
    A value arriving under a key that may not be closed early holds the whole payload back,
    incomplete pair and all.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
    progressive_keys:
      - text
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input:
        '<a2ui-json>[{"version": "1.0", "updateComponents": {"surfaceId": "s1", "components": [{"id":
        "root", "component": "Text", "text": "Hello", "variant": "cap'
      expect: []
    - input: tion"}]}}]</a2ui-json>
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: s1
                components:
                  - id: root
                    component: Text
                    text: Hello
                    variant: caption
  expect_matches_single_shot: true
  features: *id001
- name: test_chunk_progressive_keys_name_the_healable_properties
  description:
    The healable set is the one the case names rather than a fixed list, so the value of an
    `updateDataModel` heals when the case names `value`.
  action: parse_chunk
  args:
    format: direct_json
    catalog: test_data/catalogs/simplified_catalog_v1_0.json
    progressive_keys:
      - value
  steps:
    - input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId": "conformance/simplified"}}]</a2ui-json>'
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: s1
                catalogId: conformance/simplified
    - input:
        '<a2ui-json>[{"version": "1.0", "updateDataModel": {"surfaceId": "s1", "path": "/greeting",
        "value": "Hel'
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: s1
                path: /greeting
                value: Hel
    - input: lo"}}]</a2ui-json>
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: s1
                path: /greeting
                value: Hello
  features: *id001
