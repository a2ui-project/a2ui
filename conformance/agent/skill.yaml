# --- Skill Generator Conformance Tests ---

- name: test_express_monolithic_skill
  description: Generates a complete monolithic skill for Express format and basic catalog.
  action: from_format
  args:
    format: express
    catalog: specification/v1_0/catalogs/basic/catalog.json
    name: a2ui
  expected_file: conformance/test_data/skills/express_basic_monolithic.skill.md

- name: test_express_core_skill
  description: Generates a core syntax skill for Express format.
  action: core_syntax
  args:
    format: express
    catalog: specification/v1_0/catalogs/basic/catalog.json
    name: a2ui-core
  expected_file: conformance/test_data/skills/express_core.skill.md

- name: test_express_catalog_skill
  description: Generates a catalog skill for basic catalog in Express format.
  action: from_catalog
  args:
    format: express
    catalog: specification/v1_0/catalogs/basic/catalog.json
  expected_file: conformance/test_data/skills/express_basic_catalog.skill.md

- name: test_express_skill_set
  description: Generates a modular SkillSet for Express format.
  action: skill_set
  args:
    format: express
    catalog: specification/v1_0/catalogs/basic/catalog.json
  expected_skills:
    - a2ui-core/SKILL.md
    - a2ui-basic/SKILL.md
