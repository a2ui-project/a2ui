suite: "a2ui_macros_conformance"

# Protocol-agnostic macro conformance suite covering A2UI v0.9/v0.9.1 and v1.0.
# Individual cases declare envelope_version (defaulting to "v0.9") and optional
# macro_version / expander_protocol_version overrides.
#
# Macro definitions specify the signature and declarative builder AST returned
# by each macro. Runners can inspect these templates to synthesize or verify
# language-specific fluent builder macro implementations.
#
# Sentinels:
#   {$param: "name"}        - Injects parameter value (slot, string, binding, action).
#   {$spreadParam: "name"}  - Spreads a list parameter into children.
#   ${name}                 - String interpolation for primitive arguments
#                             (booleans format lowercase as "true" / "false").

custom_catalogs:
  "https://example.com/catalogs/foo/v1/catalog.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/catalogs/foo/v1/catalog.json"
    components:
      FooPanel:
        type: "object"
        properties:
          component: {const: "FooPanel"}
          id: {type: "string"}
          children:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ChildList"}
        required: ["component", "id", "children"]
      FooHeader:
        type: "object"
        properties:
          component: {const: "FooHeader"}
          id: {type: "string"}
          title:
            {
              $ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/DynamicString",
            }
        required: ["component", "id", "title"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/FooPanel"}
          - {$ref: "#/components/FooHeader"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/catalogs/bar/v1/catalog.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/catalogs/bar/v1/catalog.json"
    components:
      BarBadge:
        type: "object"
        properties:
          component: {const: "BarBadge"}
          id: {type: "string"}
          tag: {type: "string"}
        required: ["component", "id", "tag"]
      BarButton:
        type: "object"
        properties:
          component: {const: "BarButton"}
          id: {type: "string"}
          label:
            {
              $ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/DynamicString",
            }
          action: {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/Action"}
        required: ["component", "id", "label", "action"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/BarBadge"}
          - {$ref: "#/components/BarButton"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/brand.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/brand.json"
    components:
      BrandBox:
        type: "object"
        properties:
          component: {const: "BrandBox"}
          id: {type: "string"}
          child:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ComponentId"}
        required: ["component", "id", "child"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/BrandBox"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/brand_surface.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/brand_surface.json"
    components:
      BrandBox:
        type: "object"
        properties:
          component: {const: "BrandBox"}
          id: {type: "string"}
          child:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ComponentId"}
        required: ["component", "id", "child"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/BrandBox"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/theme.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/theme.json"
    components:
      ThemeShell:
        type: "object"
        properties:
          component: {const: "ThemeShell"}
          id: {type: "string"}
          child:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ComponentId"}
        required: ["component", "id", "child"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/ThemeShell"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/charts.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/charts.json"
    components:
      Chart:
        type: "object"
        properties:
          component: {const: "Chart"}
          id: {type: "string"}
          series: {type: "string"}
        required: ["component", "id", "series"]
      ChartCard:
        type: "object"
        properties:
          component: {const: "ChartCard"}
          id: {type: "string"}
          child:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ComponentId"}
        required: ["component", "id", "child"]
      ChartGrid:
        type: "object"
        properties:
          component: {const: "ChartGrid"}
          id: {type: "string"}
          children:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ChildList"}
        required: ["component", "id", "children"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/Chart"}
          - {$ref: "#/components/ChartCard"}
          - {$ref: "#/components/ChartGrid"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/catalog_a.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/catalog_a.json"
    components:
      ProductCard:
        type: "object"
        properties:
          component: {const: "ProductCard"}
          id: {type: "string"}
          sku: {type: "string"}
        required: ["component", "id", "sku"]
      BrandBox:
        type: "object"
        properties:
          component: {const: "BrandBox"}
          id: {type: "string"}
          child:
            {$ref: "https://a2ui.org/specification/v1_0/json/common_types.json#/$defs/ComponentId"}
        required: ["component", "id", "child"]
    $defs:
      anyComponent:
        oneOf:
          - {$ref: "#/components/ProductCard"}
          - {$ref: "#/components/BrandBox"}
        discriminator:
          propertyName: "component"
      anyFunction:
        not: {}

  "https://example.com/catalog_b.json":
    $schema: "https://json-schema.org/draft/2020-12/schema"
    protocolVersion: "1.0"
    catalogId: "https://example.com/catalog_b.json"
    components: {}
    $defs:
      anyComponent:
        not: {}
      anyFunction:
        not: {}

macros:
  - name: "StatusBadge"
    description: "Status badge with uppercase status and title"
    parameters:
      status: {type: "string"}
      title: {type: "string"}
    # Imperative transform: status is uppercased (status.upper()).
    # Variant note: v0.9 uses variant="h3" for title; v1.0 uses variant="body".
    template:
      component: "Card"
      child:
        component: "Row"
        children:
          - component: "Text"
            text: {$param: "status"}
            variant: "caption"
          - component: "Text"
            text: {$param: "title"}
            variant: "h3"

  - name: "SlotContainer"
    description: "Container accepting an external child slot"
    parameters:
      title: {type: "string"}
      content: {type: "component"}
    # Native builder:
    #   Card(child=Column(children=[Text(text=title, variant="h2"), content]))
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "title"}
            variant: "h2"
          - {$param: "content"}

  - name: "MultiSlotContainer"
    description: "Container accepting a list of child slots"
    parameters:
      header: {type: "string"}
      items: {type: "component_list"}
    # Native builder:
    #   Card(child=Column(children=[Text(text=header, variant="h2"), *items]))
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "header"}
            variant: "h2"
          - {$spreadParam: "items"}

  - name: "ActionButton"
    description: "Button with coerced action"
    parameters:
      label: {type: "string"}
      action: {type: "action"}
    # Native builder:
    #   Button(child=Text(text=label, variant="body"), variant="primary", action=action)
    template:
      component: "Button"
      variant: "primary"
      child:
        component: "Text"
        text: {$param: "label"}
        variant: "body"
      action: {$param: "action"}

  - name: "BoundMetric"
    description: "Metric card displaying a dynamic value"
    parameters:
      label: {type: "string"}
      value: {type: "dynamic_string"}
    # Native builder:
    #   Card(child=Column(children=[Text(text=label, variant="caption"), Text(text=value, variant="h1")]))
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "label"}
            variant: "caption"
          - component: "Text"
            text: {$param: "value"}
            variant: "h1"

  - name: "ConfigCard"
    description: "Configuration card displaying primitives and metadata"
    parameters:
      name: {type: "string"}
      port: {type: "integer"}
      active: {type: "boolean"}
    # Imperative transform: boolean active interpolates lowercase ("true" / "false");
    # v0.9 uses variant="h2" for name while v1.0 uses variant="body".
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "name"}
            variant: "h2"
          - component: "Text"
            text: "Port: ${port}"
            variant: "body"
          - component: "Text"
            text: "Active: ${active}"
            variant: "body"

  - name: "NestedMacroCard"
    description: "Macro composing another macro"
    parameters:
      title: {type: "string"}
      status: {type: "string"}
    # Native builder:
    #   Card(child=Column(children=[Text(text=title, variant="h1"), StatusBadge(status=status, title=f"{title} Status")]))
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "title"}
            variant: "h1"
          - component: "StatusBadge"
            status: {$param: "status"}
            title: "${title} Status"
  - name: "RecursiveCard"
    description: "Macro composing itself recursively"
    parameters:
      title: {type: "string"}
    # Native builder:
    #   Card(child=RecursiveCard(title=title))
    template:
      component: "Card"
      child:
        component: "RecursiveCard"
        title: {$param: "title"}

  - name: "ComplexCard"
    description: "Card testing protocol common types in macro parameter schemas"
    parameters:
      title: {type: "string"}
      dynamic_title: {type: "dynamic_string"}
      metric: {type: "dynamic_number"}
      is_active: {type: "dynamic_boolean"}
      tags: {type: "dynamic_string_list"}
      anything: {type: "dynamic_value"}
      on_click: {type: "action"}
      checks: {type: "check_rule_list"}
      accessibility: {type: "accessibility"}
      footer: {type: "component"}
      items: {type: "component_list"}
      theme:
        type: "string"
        enum: ["primary", "secondary"]
    # Native builder:
    #   Card(child=Text(text=title))
    template:
      component: "Card"
      child:
        component: "Text"
        text: {$param: "title"}

  - name: "Text"
    catalog_id: "https://example.com/brand.json"
    description: "Custom brand Text macro wrapping a basic Text inside a Card"
    parameters:
      text: {type: "string"}
      variant:
        type: "string"
        default: "body"
    # Native builder:
    #   Card(child=Text(text=f"[Brand] {text}", variant=variant))
    template:
      component: "Card"
      child:
        component: "Text"
        text: "[Brand] ${text}"
        variant: {$param: "variant"}

  - name: "PayloadButton"
    protocol_version: "1.0"
    description: "Button sending dynamic payload values inside an Action event context"
    parameters:
      label: {type: "string"}
      event_name: {type: "string"}
      payload: {type: "dynamic_value"}
      extra: {type: "dynamic_value"}
    template:
      component: "Button"
      variant: "primary"
      child:
        component: "Text"
        text: {$param: "label"}
      action:
        event:
          name: {$param: "event_name"}
          context:
            payload: {$param: "payload"}
            extra: {$param: "extra"}

  - name: "DynamicFormCard"
    protocol_version: "1.0"
    description: "Form card with dynamic child list, check rules, and submit action"
    parameters:
      label: {type: "string"}
      placeholder: {type: "dynamic_string"}
      items: {type: "child_list"}
      checks: {type: "check_rule_list"}
      on_submit: {type: "action"}
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "TextField"
            label: {$param: "label"}
            value: {"@path": "/form/email"}
            placeholder: {$param: "placeholder"}
            checks: {$param: "checks"}
          - component: "List"
            children: {$param: "items"}
          - component: "Button"
            variant: "primary"
            child:
              component: "Text"
              text: "Submit"
            action: {$param: "on_submit"}

  - name: "AnnotatedBadge"
    protocol_version: "1.0"
    description: "Status badge whose root Card defines default accessibility and metadata extensions"
    parameters:
      status: {type: "string"}
      title: {type: "string"}
    # Imperative transform: status is uppercased (status.upper()).
    template:
      component: "Card"
      accessibility:
        description: "Default badge description"
      metadata:
        extensions:
          macroMeta:
            source: "AnnotatedBadge"
      child:
        component: "Row"
        children:
          - component: "Text"
            text: {$param: "status"}
            variant: "caption"
          - component: "Text"
            text: {$param: "title"}
            variant: "body"

  - name: "DeclaredA11yCard"
    protocol_version: "1.0"
    description: "Card declaring accessibility as an explicit macro parameter"
    parameters:
      title: {type: "string"}
      accessibility: {type: "accessibility", required: false}
    # Imperative transform: sets root accessibility.label to "Custom: ${accessibility.label}"
    # when accessibility.label is provided, or "Internal" otherwise (verifying that a
    # declared accessibility parameter is coerced and passed to the macro rather than merged
    # by _apply_envelope_fields).
    template:
      component: "Card"
      accessibility:
        label: "Custom: ${accessibility.label}"
      child:
        component: "Text"
        text: {$param: "title"}

  - name: "WeightedCard"
    protocol_version: "1.0"
    description: "Card declaring weight as an explicit macro parameter"
    parameters:
      label: {type: "string"}
      weight: {type: "number", required: false}
    template:
      component: "Card"
      weight: {$param: "weight"}
      child:
        component: "Text"
        text: {$param: "label"}

  - name: "PositiveCountCard"
    protocol_version: "1.0"
    description: "Card raising ValidationError when count is negative"
    parameters:
      count: {type: "integer"}
    # Imperative guard: raises ValidationError when count < 0.
    template:
      component: "Card"
      child:
        component: "Text"
        text: "Count: ${count}"

  - name: "UnannotatedBrandCard"
    catalog_id: "https://example.com/brand.json"
    protocol_version: "1.0"
    description: "Brand card emitting unannotated Card, BrandBox, and Text nodes"
    parameters:
      title: {type: "string"}
    template:
      component: "Card"
      child:
        component: "BrandBox"
        child:
          component: "Text"
          text: {$param: "title"}
          variant: "body"

  - name: "BrandBadge"
    catalog_id: "https://example.com/brand.json"
    protocol_version: "1.0"
    description: "Brand badge emitting basic Card and Text with explicit catalogId"
    parameters:
      label: {type: "string"}
    template:
      component: "Card"
      catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
      child:
        component: "Text"
        catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
        text: "[Badge] ${label}"
        variant: "body"

  - name: "InnerBadgeScoped"
    catalog_id: "https://example.com/brand.json"
    protocol_version: "1.0"
    description: "Scoped inner badge emitting BrandBox and unannotated basic Text"
    parameters:
      label: {type: "string"}
    template:
      component: "BrandBox"
      catalogId: "https://example.com/brand.json"
      child:
        component: "Text"
        text: "Scoped Badge: ${label}"
        variant: "caption"

  - name: "OuterPanelScoped"
    catalog_id: "https://example.com/brand.json"
    protocol_version: "1.0"
    description: "Scoped outer panel emitting unannotated Text alongside deferred InnerBadgeScoped"
    parameters:
      title: {type: "string"}
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "title"}
            variant: "body"
          - component: "InnerBadgeScoped"
            catalogId: "https://example.com/brand.json"
            label: {$param: "title"}

  - name: "Chart"
    catalog_id: "https://example.com/brand.json"
    protocol_version: "1.0"
    description: "Brand Chart macro emitting ChartCard wrapping an unannotated Chart primitive"
    parameters:
      series: {type: "string"}
    template:
      component: "ChartCard"
      child:
        component: "Chart"
        series: "[Brand] ${series}"

  - name: "Text"
    catalog_id: "https://example.com/brand_surface.json"
    protocol_version: "1.0"
    description: "Brand surface Text macro emitting cross-catalog basic Card and Text around BrandBox"
    parameters:
      text: {type: "string"}
      variant: {type: "string", default: "body"}
    template:
      component: "Card"
      catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
      child:
        component: "BrandBox"
        catalogId: "https://example.com/brand_surface.json"
        child:
          component: "Text"
          catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
          text: "[Brand] ${text}"
          variant: {$param: "variant"}

  - name: "BrandBadge"
    catalog_id: "https://example.com/brand_surface.json"
    protocol_version: "1.0"
    description: "Brand surface badge emitting cross-catalog basic Card and Text around BrandBox"
    parameters:
      label: {type: "string"}
    template:
      component: "Card"
      catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
      child:
        component: "BrandBox"
        catalogId: "https://example.com/brand_surface.json"
        child:
          component: "Text"
          catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json"
          text: "[Badge] ${label}"
          variant: "body"

  - name: "BazMacro"
    catalog_id: "https://example.com/catalogs/baz_macros.json"
    protocol_version: "1.0"
    description: "Composite macro combining FooCatalog and BarCatalog primitives with explicit catalogIds"
    parameters:
      headline: {type: "dynamic_string"}
      badge_tag: {type: "string"}
      cta_label: {type: "string"}
      on_cta: {type: "action"}
    template:
      component: "FooPanel"
      catalogId: "https://example.com/catalogs/foo/v1/catalog.json"
      children:
        - component: "FooHeader"
          catalogId: "https://example.com/catalogs/foo/v1/catalog.json"
          title: {$param: "headline"}
        - component: "BarBadge"
          catalogId: "https://example.com/catalogs/bar/v1/catalog.json"
          tag: {$param: "badge_tag"}
        - component: "BarButton"
          catalogId: "https://example.com/catalogs/bar/v1/catalog.json"
          label: {$param: "cta_label"}
          action: {$param: "on_cta"}

  - name: "ProductCard"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Macro sharing its name with ProductCard primitive in catalog_a.json"
    parameters:
      name: {type: "string"}
    template:
      component: "Card"
      child:
        component: "Text"
        text: "Product: ${name}"

  - name: "BrandBox"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Macro wrapping a same-named BrandBox primitive from catalog_a.json"
    parameters:
      title: {type: "string"}
    template:
      component: "Card"
      child:
        component: "BrandBox"
        catalogId: "https://example.com/catalog_a.json"
        child:
          component: "Text"
          text: {$param: "title"}

  - name: "InnerBadgeInherited"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Deferred inner macro inheriting enclosing catalogId when surface catalog is registered"
    parameters:
      label: {type: "string"}
    template:
      component: "BrandBox"
      catalogId: "https://example.com/catalog_a.json"
      child:
        component: "Text"
        text: "Inherited Badge: ${label}"
        variant: "caption"

  - name: "OuterPanelInherited"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Outer macro emitting unannotated deferred InnerBadgeInherited node"
    parameters:
      title: {type: "string"}
    template:
      component: "Card"
      child:
        component: "Column"
        children:
          - component: "Text"
            text: {$param: "title"}
            variant: "body"
          - component: "InnerBadgeInherited"
            label: {$param: "title"}

  - name: "DeferredCycle"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Deferred self-recursive macro node"
    parameters:
      label: {type: "string"}
    template:
      component: "Card"
      child:
        component: "DeferredCycle"
        label: {$param: "label"}

  - name: "CycleA"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Mutually recursive deferred macro A referencing CycleB"
    parameters:
      label: {type: "string"}
    template:
      component: "Card"
      child:
        component: "CycleB"
        label: {$param: "label"}

  - name: "CycleB"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Mutually recursive deferred macro B referencing CycleA"
    parameters:
      label: {type: "string"}
    template:
      component: "Card"
      child:
        component: "CycleA"
        label: {$param: "label"}

  - name: "EmitsSurface"
    catalog_id: "https://example.com/catalog_b.json"
    protocol_version: "1.0"
    description: "Macro illegally emitting reserved Surface component in v1.0"
    parameters: {}
    template:
      component: "Surface"

tests:
