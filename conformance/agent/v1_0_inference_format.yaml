- name: test_agent_v1_0_direct_json_envelope_parsing
  description: Verifies parsing Direct JSON v1.0 payload envelopes wrapped in <a2ui-json> sentinel tags.
  catalog:
    version: "1.0"
  action: process_chunk
  steps:
    - input: |
        Here is the requested user interface:
        <a2ui-json>
        [
          {
            "version": "v1.0",
            "createSurface": {
              "surfaceId": "main",
              "catalogId": "basic",
              "components": {
                "root": {
                  "component": "Text",
                  "text": "Welcome to A2UI v1.0"
                }
              }
            }
          }
        ]
        </a2ui-json>
      expect:
        - text: "Here is the requested user interface:\n"
          a2ui:
            - version: "v1.0"
              createSurface:
                surfaceId: "main"
                catalogId: "basic"
                components:
                  root:
                    component: "Text"
                    text: "Welcome to A2UI v1.0"

- name: test_agent_v1_0_express_dsl_rpc_expressions
  description: Verifies Express DSL compiler and decompiler parsing callRendererFunction and callAgentFunction expressions.
  catalog:
    version: "1.0"
  action: process_chunk
  steps:
    - input: |
        <a2ui-express>
        callRendererFunction(callId: "call-99", functionName: "showNotification", catalogId: "basic", args: { message: "Task complete" });
        </a2ui-express>
      expect:
        - a2ui:
            - version: "v1.0"
              callRendererFunction:
                callId: "call-99"
                functionName: "showNotification"
                catalogId: "basic"
                args:
                  message: "Task complete"
