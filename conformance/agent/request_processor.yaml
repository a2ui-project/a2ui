- name: test_format_binds_catalogs_to_its_prompt_generator
  description: A format built by the factory carries a prompt generator that describes
    the catalogs it was bound to.
  action: create_format
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
  expect:
    prompt_snippet_contains:
      - Text
      - Button
      - Card
      - Column
      - <a2ui-json>
  features:
    - F-AGT-12
- name: test_format_binds_the_transformed_catalogs
  description: The factory binds the transformed catalogs, so a component the agent
    pruned is missing from the format's prompt.
  action: create_format
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
        transformers:
          - component_pruning:
              - Text
              - Card
  expect:
    prompt_snippet_contains:
      - Text
      - Card
    prompt_snippet_absent:
      - Button
      - Column
  features:
    - F-AGT-14
- name: test_express_format_binds_catalogs_to_its_prompt_generator
  description: The Express factory produces a format whose prompt uses the Express
    tags and positional signatures.
  action: create_format
  args:
    format: express
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
  expect:
    prompt_snippet_contains:
      - <a2ui>
      - Text(
      - Button(
    prompt_snippet_absent:
      - <a2ui-json>
  features:
    - F-AGT-12
- name: test_format_renders_examples_in_its_prompt
  description: Examples handed to the factory reach the prompt the format generates.
  action: create_format
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
    examples:
      - test_data/examples/greeting_surface.json
  expect:
    prompt_snippet_contains:
      - Hello
      - s1
  features:
    - F-AGT-14
- name: test_create_parser_returns_a_fresh_parser
  description: Two calls return two parsers rather than one shared instance, so two
    turns can be parsed at once.
  action: create_format
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
  expect:
    parsers_are_distinct: true
- name: test_parser_state_is_not_shared_between_parsers
  description: A parser built after another has consumed a half finished payload yields
    the same parts from that stream, so the two hold separate buffers.
  action: create_format
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
    probe_chunks:
      - '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", '
      - '"catalogId": "conformance/simplified"}}]</a2ui-json>'
  expect:
    parsers_are_distinct: true
    parser_state_isolated: true
- name: test_capabilities_select_the_active_catalogs
  description: A renderer that names one of the agent's catalogs gets a processor
    bound to that one.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/custom
  expect:
    active_catalog_ids:
      - conformance/custom
  features:
    - F-AGT-15
- name: test_absent_capabilities_is_an_error
  description: A request that carries no capabilities fails, because create_processor
    requires renderer capabilities to negotiate against.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
  expect_error:
    category: CatalogError
- name: test_active_catalogs_follow_the_renderer_preference_order
  description: The active catalogs come back in the order the renderer listed them,
    not the order the agent registered them.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/custom
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/custom
      - conformance/simplified
- name: test_empty_supported_catalog_ids_is_an_error
  description: A renderer that declares an empty list and no inline catalogs has said
    it can render nothing, which no processor can serve.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds: []
  expect_error:
    category: CatalogError
- name: test_creating_a_processor_leaves_the_generator_alone
  description: The generator holds the same catalogs after a negotiation as before,
    so one renderer's session cannot narrow the next renderer's.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/custom
  expect:
    active_catalog_ids:
      - conformance/custom
    generator_catalogs_unchanged: true
  features:
    - F-AGT-15
- name: test_prompt_snippet_describes_the_active_catalogs
  description: The snippet describes what was negotiated, so a catalog the renderer
    did not ask for is never offered to the model.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/custom
  expect:
    active_catalog_ids:
      - conformance/custom
    prompt_snippet_contains:
      - Chart
      - Gauge
      - percent
    prompt_snippet_absent:
      - Button
      - Column
  features:
    - F-AGT-16
- name: test_prompt_snippet_describes_the_transformed_catalogs
  description: A transformer the agent registered is visible in the prompt the processor
    renders, since the resolved catalogs are the transformed ones.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
        transformers:
          - component_pruning:
              - Text
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/simplified
    prompt_snippet_contains:
      - Text
    prompt_snippet_absent:
      - Button
      - Card
      - Column
- name: test_processor_holds_the_transformed_catalog
  description: The catalog the processor holds is the pruned one, which is what its
    validator will check a payload against.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
        transformers:
          - component_pruning:
              - Text
          - function_pruning:
              - formatString
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/simplified
    catalogs:
      - catalog_id: conformance/simplified
        components:
          - Text
        functions:
          - formatString
  features:
    - F-AGT-16
- name: test_format_override_replaces_the_generator_format
  description: A format passed when the processor is created takes the place of the
    generator's own, for that processor only.
  action: create_processor
  args:
    format: direct_json
    format_override: express
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/simplified
    prompt_snippet_contains:
      - <a2ui>
      - Text(
    prompt_snippet_absent:
      - <a2ui-json>
  features:
    - F-AGT-12
- name: test_example_using_an_unknown_component_fails_at_creation
  description: An example that uses a component the active catalogs do not declare
    fails when the processor is created, not when a response is parsed.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
    examples:
      - test_data/examples/chart_series.json
  expect_error:
    category: ValidationError
  features:
    - F-AGT-49
- name: test_processor_parses_a_response_within_the_active_catalogs
  description: A response using the negotiated catalog parses into the text the model
    wrote and the messages it emitted, in that order. This case is the counterweight
    to the one below, which a processor that rejected every response would also pass.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/simplified
  then_parse:
    input: 'Here is a greeting.<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId":
      "s1", "catalogId": "conformance/simplified"}}, {"version": "1.0", "updateComponents":
      {"surfaceId": "s1", "components": [{"id": "root", "component": "Text", "text":
      "Hello"}]}}]</a2ui-json>'
    expect:
      - text: Here is a greeting.
      - a2ui:
          - version: "1.0"
            createSurface:
              surfaceId: s1
              catalogId: conformance/simplified
          - version: "1.0"
            updateComponents:
              surfaceId: s1
              components:
                - id: root
                  component: Text
                  text: Hello
  features:
    - F-AGT-09
    - F-AGT-16
- name: test_response_outside_the_active_catalogs_is_rejected
  description: A response naming a component the negotiated catalogs do not declare
    fails validation, even though the agent registered a catalog that declares it.
    Only a processor can state this, since the rule is about what negotiation left
    active.
  action: create_processor
  args:
    format: direct_json
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
  expect:
    active_catalog_ids:
      - conformance/simplified
  then_parse:
    input: '<a2ui-json>[{"version": "1.0", "createSurface": {"surfaceId": "s1", "catalogId":
      "conformance/simplified"}}, {"version": "1.0", "updateComponents": {"surfaceId":
      "s1", "components": [{"id": "root", "component": "Chart", "values": [1, 2, 3]}]}}]</a2ui-json>'
    expect_error:
      category: ValidationError
  features:
    - F-AGT-09
    - F-AGT-63
- name: test_express_format_binds_multiple_catalogs_and_examples
  description: An Express format bound to two catalogs renders both catalog schemas
    and decompiles examples belonging to each catalog into Express notation.
  action: create_format
  args:
    format: express
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    examples:
      - test_data/examples/greeting_surface.json
      - test_data/examples/chart_series.json
  expect:
    prompt_snippet_contains:
      - conformance/simplified
      - conformance/custom
      - Text(
      - Chart(
      - root = Text("Hello")
      - root = Chart([1, 2, 3])
- name: test_processor_parses_multi_catalog_express_response
  description: A processor negotiated with two active catalogs and Express format
    parses a response that creates surfaces with components from both catalogs.
  action: create_processor
  args:
    format: express
    catalogs:
      - catalog: test_data/catalogs/simplified_catalog_v1_0.json
      - catalog: test_data/catalogs/custom_catalog_v1_0.json
    renderer_capabilities:
      "1.0":
        supportedCatalogIds:
          - conformance/simplified
          - conformance/custom
  expect:
    active_catalog_ids:
      - conformance/simplified
      - conformance/custom
    prompt_snippet_contains:
      - conformance/simplified
      - conformance/custom
      - Text(
      - Chart(
  then_parse:
    input: 'Here are both views.<a2ui>

      surface("s1")

      root = Text("Summary")

      surface("s2")

      root = Chart([1, 2], "Q1")

      </a2ui>

      '
    expect:
      - text: Here are both views.
      - a2ui:
          - version: "1.0"
            createSurface:
              surfaceId: s1
              components:
                - id: root
                  component: Text
                  catalogId: conformance/simplified
                  text: Summary
          - version: "1.0"
            createSurface:
              surfaceId: s2
              components:
                - id: root
                  component: Chart
                  catalogId: conformance/custom
                  values:
                    - 1
                    - 2
                  caption: Q1
