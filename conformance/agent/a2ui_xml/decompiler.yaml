# A2UI XML decompilation conformance test suite.
#
# Verifies writing A2UI messages back into idiomatic A2UI XML markup and round-tripping.

- name: test_decompile_xml_components
  description: A createSurface writes back out as nested A2UI XML component tags.
  action: decompile
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Hello"
  expect_contains:
    - "<Card"
    - "<Text"
    - 'text="Hello"'
  expect_round_trip: true

- name: test_decompile_xml_column_with_children
  description: Multi-child container decompiles to nested children elements and round-trips.
  action: decompile
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children:
              - "c1"
              - "c2"
          - id: "c1"
            component: "Text"
            text: "First"
          - id: "c2"
            component: "Text"
            text: "Second"
  expect_contains:
    - "<Column"
    - 'text="First"'
    - 'text="Second"'
  expect_round_trip: true

- name: test_decompile_xml_data_binding
  description: Dynamic data binding paths decompile to $/path string attribute and round-trips.
  action: decompile
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              "@path": "/user/email"
  expect_contains:
    - "<Text"
    - "$/user/email"
  expect_round_trip: true

- name: test_decompile_xml_button_with_action
  description: Button action decompiles to submit action and round-trips.
  action: decompile
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "btn_text"
            action:
              event:
                name: "submit"
          - id: "btn_text"
            component: "Text"
            text: "Submit"
  expect_contains:
    - "<Button"
    - 'action="submit"'
  expect_round_trip: true

- name: test_decompile_xml_with_data_model
  description: createSurface containing dataModel decompiles to dataModel tag and round-trips.
  action: decompile
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Welcome"
        dataModel:
          count: 42
  expect_contains:
    - "dataModel"
    - "42"
    - "<Text"
  expect_round_trip: true
