# A2UI XML response streaming conformance test suite.
#
# Verifies chunk-by-chunk streaming emission of text and A2UI XML messages.

- name: test_xml_stream_text_and_single_chunk_block
  description: Text outside a2ui tags and a complete XML block stream in order.
  action: parse_chunk
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  steps:
    - input: "Here is the greeting:\n"
      expect:
        - text: "Here is the greeting:"
    - input: "<a2ui>\n<Text id=\"root\" text=\"Hello\" />\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "default_surface"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello"

- name: test_xml_stream_multi_chunk_block
  description: An A2UI XML block streamed in two chunks emits the complete surface upon block close.
  action: parse_chunk
  args:
    format: a2ui-xml
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  steps:
    - input: "<a2ui>\n<Card id=\"root\">\n"
      expect: []
    - input: "<Text id=\"body\" text=\"Streamed\" />\n</Card>\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "default_surface"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "body"
                  - id: "body"
                    component: "Text"
                    text: "Streamed"
