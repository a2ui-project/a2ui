# A2UI XML prompt generator conformance test suite.
#
# Verifies prompt snippet generation across single and multi-catalog scenarios.

- name: test_xml_snippet_names_components_and_tags
  description: The prompt snippet includes A2UI XML syntax guidance and active components.
  action: generate_prompt_snippet
  args:
    format: a2ui-xml
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_contains:
    - "<a2ui>"
    - "</a2ui>"
    - "<Text"
    - "<Button"
    - "<Column"

- name: test_xml_snippet_omits_pruned_component
  description: Pruned components are absent from generated XML prompt signatures.
  action: generate_prompt_snippet
  args:
    format: a2ui-xml
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Text"]
  expect_contains:
    - "<Text"
  expect_absent:
    - "<Button"
    - "<Card"
    - "<Column"

- name: test_xml_snippet_multiple_catalogs
  description: With multiple catalogs active the snippet names both catalog identifiers.
  action: generate_prompt_snippet
  args:
    format: a2ui-xml
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  expect_contains:
    - "conformance/simplified"
    - "conformance/custom"
    - "<Text"
