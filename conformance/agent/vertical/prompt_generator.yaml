# Vertical prompt generation conformance: system prompt rules and component signatures.

- name: test_vertical_snippet_filters_children_components
  description: Verifies that components requiring children (Card, Column) are filtered out from Vertical prompt signatures.
  action: generate_prompt_snippet
  args:
    format: vertical
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_contains:
    - "Text("
  expect_absent:
    - "Card("
    - "Column("

- name: test_vertical_snippet_base_rules
  description: Verifies that sentinel tags and core contract headers appear in the generated prompt snippet.
  action: generate_prompt_snippet
  args:
    format: vertical
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  expect_contains:
    - "<a2ui>"
    - "## Component Signatures"
