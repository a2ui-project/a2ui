# Vertical streaming response conformance: progressive chunk parsing and surface-per-component emission.

- name: test_chunk_vertical_streaming_components
  description: Verifies that streaming chunks progressively yield text and independent surface envelopes as constructors complete across chunks.
  action: parse_chunk
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  steps:
    - input: |
        Here is the UI:
        <a2ui>
        Text(
      expect:
        - text: "Here is the UI:\n"
    - input: |
        "First")
        Text(
      expect:
        - a2ui:
            - version: "v1.0"
              createSurface:
                surfaceId: "default_surface"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "First"
    - input: |
        "Second")
        </a2ui>
        Done!
      expect:
        - a2ui:
            - version: "v1.0"
              createSurface:
                surfaceId: "default_surface_1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Second"
        - text: "\nDone!\n"
