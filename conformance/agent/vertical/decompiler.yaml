# Vertical decompilation: writing A2UI messages back into Vertical notation.
#
# `decompile` is the inverse of `compile`. It turns A2UI protocol messages
# back into clean constructor invocations. Round-trip cases verify that
# compile(decompile(messages)) == messages.

- name: test_decompile_vertical_single_component
  description: Decompiles a single surface component into a direct constructor call with round-trip equality.
  action: decompile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello world"
  expect_contains:
    - "Text("
    - "Hello world"
  expect_round_trip: true

- name: test_decompile_vertical_named_properties
  description: Decompiles component with multiple properties into keyword arguments with round-trip equality.
  action: decompile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Caption text"
            variant: "caption"
  expect_contains:
    - "Text("
    - "Caption text"
    - "variant="
  expect_round_trip: true

- name: test_decompile_vertical_data_binding
  description: Decompiles dynamic path objects into '$' path expressions with round-trip equality.
  action: decompile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              path: "/user/name"
  expect_contains:
    - "Text("
    - "$/user/name"
  expect_round_trip: true

- name: test_decompile_vertical_multi_surface
  description: Decompiles multiple surface roots into a newline-separated sequence of constructor calls with round-trip equality.
  action: decompile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Card 1"
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface_1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Card 2"
  expect_contains:
    - "Text("
    - "Card 1"
    - "Card 2"
  expect_round_trip: true
