      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |-
    Text("Quarterly Revenue")
    Gauge(value=84)
  expect:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        components:
          - id: "root"
            component: "Text"
            catalogId: "conformance/simplified"
            text: "Quarterly Revenue"
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface_1"
        components:
          - id: "root"
            component: "Gauge"
