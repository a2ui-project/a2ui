- name: test_compile_vertical_checkable_input
  description: Compiles ?check rules on a standalone checkable input component and binds sibling value automatically.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'TextField(label="Postal code", value=$/address/zip, checks=[?required, ?regex("^[0-9]{5}$", "Must be 5 digits")])'
  expect_present:
    - "/0/createSurface/components/0/checks/0/message"
  expect:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Postal code"
            value:
              "@path": "/address/zip"
            checks:
              - condition:
                  "@call": "required"
                  args:
                    value:
                      "@path": "/address/zip"
              - condition:
                  "@call": "regex"
                  args:
                    value:
                      "@path": "/address/zip"
                    pattern: "^[0-9]{5}$"
                message: "Must be 5 digits"

- name: test_compile_vertical_standalone_call_renderer_function
  description: Compiles a top-level call to an agent-callable catalog function into a v1.0 callRendererFunction message.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/allowed_callers_catalog_v1_0.json"
  input: "readSessionToken()"
  expect:
    - version: "1.0"
      callRendererFunction:
        functionCallId: "call_1"
        callFunction:
          catalogId: "https://a2ui.org/catalogs/v10/allowed_callers"
          "@call": "readSessionToken"
          args: {}

- name: test_compile_vertical_coercion_preserves_data_binding
  description: Verifies that data binding paths starting with '$' are preserved and not coerced when targeting numeric properties.
  action: compile
  args:
    format: vertical
    catalog:
      catalogId: "conformance/dynamic_gauge"
      protocolVersion: "1.0"
      components:
        Gauge:
          type: object
          properties:
            component: {const: "Gauge"}
            value: {$ref: "common_types.json#/$defs/DynamicNumber"}
          required: ["component", "value"]
      $defs:
        anyComponent:
          oneOf: [{$ref: "#/components/Gauge"}]
  input: "Gauge(value=$/state/gauge_val)"
  expect:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/dynamic_gauge"
        components:
          - id: "root"
            component: "Gauge"
            value:
              "@path": "/state/gauge_val"

