# Vertical compilation: compiling flat, constructor-based DSL blocks into standard A2UI messages.
#
# `compile` takes the content of a Vertical block and returns the A2UI protocol messages.
# In Vertical:
# - Each constructor statement maps to an independent surface (`default_surface`, `default_surface_1`, ...).
# - Components within each surface have id "root".
# - Positional arguments resolve according to the catalog schema's positionalIndex.
# - Quoted numbers, booleans, and percentages are coerced to native primitives according to the catalog schema.
# - Data bindings starting with '$' are preserved as path references.

- name: test_compile_vertical_single_component
  description: Compiles a single constructor invocation to a createSurface envelope.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'Text("Hello world")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello world"

- name: test_compile_vertical_named_arguments
  description: Compiles keyword arguments explicitly passed by property name.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'Text(text="Welcome", variant="caption")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Welcome"
            variant: "caption"

- name: test_compile_vertical_colon_syntax
  description: "Tolerates colon syntax (key: value) alongside equals syntax (key=value)."
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    Text(text: "Hello colon", variant: "body")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello colon"
            variant: "body"

- name: test_compile_vertical_data_binding
  description: Compiles dynamic data-binding paths starting with '$' into protocol path objects.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "Text(text=$/user/profile/name)"
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              path: "/user/profile/name"

- name: test_compile_vertical_multi_component_surface_per_component
  description: Compiles multiple constructors into separate independent surfaces (default_surface and default_surface_1).
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    Text("First card")
    Text("Second card")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "First card"
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface_1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Second card"

- name: test_compile_vertical_quoted_number_coercion
  description: Automatically coerces quoted numbers into numeric primitives when the catalog property expects number.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: 'Gauge(value="42")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Gauge"
            value: 42

