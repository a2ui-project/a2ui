- name: test_compile_vertical_action_event
  description: Compiles Event helper constructor into an action object with event name and context payload.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/event_property_catalog_v1_0.json"
  input: 'Select(label="Country", event="change", options=["AU", "US"], action=Event("submit_form", payload="abc"))'
  expect:
    - version: "1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/event_property"
        components:
          - id: "root"
            component: "Select"
            label: "Country"
            event: "change"
            options: ["AU", "US"]
            action:
              event:
                name: "submit_form"
                context:
                  payload: "abc"

