- name: test_compile_vertical_action_event
  description: Compiles Event helper constructor into an action object with event name and context payload.
  action: compile
  args:
    format: vertical
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'Button(child="t1", action=Event("submit_form", payload="abc"))'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "t1"
            action:
              event:
                name: "submit_form"
                context:
                  payload: "abc"

