# Prompt rendering for the inference formats described by
# `blueprints/modules/a2ui_agent.blueprint.md` sections 3.E and 4.
#
# Catalog loading moved to `catalog_provider.yaml` and capability negotiation to
# `catalog_resolver.yaml`, which own those APIs. The `select_catalog` cases at
# the end of this file stay put: that helper is frozen, not removed, and the
# shipped Python and Kotlin agent SDKs still run against them. See the Legacy
# Surfaces table in section 6.

- name: test_generate_system_prompt_minimal
  description: Tests prompt generation with minimal arguments.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Just Role"
  expect_contains:
    - "Just Role"
    - "## Workflow Description:"
    - "The generated response MUST follow these rules:"

- name: test_generate_system_prompt_custom_workflow
  description: Tests appending custom workflow rules.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Role"
    workflow_description: "Custom Rule Content"
  expect_contains:
    - "Role"
    - "## Workflow Description:"
    - "The generated response MUST follow these rules:"
    - "Custom Rule Content"

- name: test_generate_system_prompt_full
  description: Tests full prompt generation with all descriptions.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Role"
    workflow_description: "Workflow"
    ui_description: "Render UI."
  expect_contains:
    - "Role"
    - "## Workflow Description:"
    - "Workflow"
    - "## UI Description:"
    - "Render UI."

- name: test_generate_system_prompt_with_schema
  description: Tests prompt generation with schema included.
  action: generate_prompt
  args:
    version: "0.9"
    role_description: "Role"
    include_schema: true
  expect_contains:
    - "Role"
    - "---BEGIN A2UI JSON SCHEMA---"
    - "### Server To Client Schema:"
    - "### Catalog Schema:"
    - "---END A2UI JSON SCHEMA---"

- name: test_generate_system_prompt_with_examples
  description: Tests prompt generation with examples included.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Role"
    include_examples: true
    examples_path: "test_data/load_examples/basic"
  expect_contains:
    - "Role"
    - "### Examples:"
    - "---BEGIN example1---"
    - "---END example1---"
    - "---BEGIN example2---"
    - "---END example2---"

- name: test_generate_system_prompt_with_inline_catalog
  description: Tests inline catalog handling in prompt generation.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Role"
    include_schema: true
    accepts_inline_catalogs: true
    client_ui_capabilities:
      inlineCatalogs:
        - catalogId: id_inline
          components:
            Button: {}
  expect_contains:
    - "Role"
    - "---BEGIN A2UI JSON SCHEMA---"
    - "### Server To Client Schema:"
    - "### Catalog Schema:"
    - '"Button": {}'
    - "---END A2UI JSON SCHEMA---"

# --- New Tests requested by User ---

- name: test_generate_system_prompt_v0_9_common_types
  description: Tests v0.9 prompt generation with common types included.
  action: generate_prompt
  args:
    version: "0.9"
    role_description: "Role"
    include_schema: true
  expect_contains:
    - "Role"
    - "---BEGIN A2UI JSON SCHEMA---"
    - "### Server To Client Schema:"
    - "### Common Types Schema:"
    - "### Catalog Schema:"
    - "---END A2UI JSON SCHEMA---"

- name: test_generate_system_prompt_full_with_caps
  description: Tests full prompt generation with capabilities and allowed components.
  action: generate_prompt
  args:
    version: "0.8"
    role_description: "Role"
    include_schema: true
    client_ui_capabilities:
      supportedCatalogIds: ["https://a2ui.org/specification/v0_8/standard_catalog_definition.json"]
    allowed_components: ["Text"]
  expect_contains:
    - "Role"
    - "---BEGIN A2UI JSON SCHEMA---"
    - "### Server To Client Schema:"
    - "### Catalog Schema:"
    - '"Text": {'
    - "---END A2UI JSON SCHEMA---"

# --- Legacy: Catalog Selection Tests ---
#
# `select_catalog` is frozen. `resolve_catalogs` supersedes it, and section 6 of
# `blueprints/modules/a2ui_agent.blueprint.md` lists it under Legacy Surfaces:
# do not implement it in a new SDK and do not add cases here. The cases below
# stay because the shipped Python and Kotlin agent SDKs still expose the helper,
# and deleting them would leave that code untested. New negotiation coverage
# belongs in `catalog_resolver.yaml`.

- name: test_select_catalog_default
  description: If supported_catalog_ids is not provided, return the first supported catalog.
  action: select_catalog
  args:
    supported_catalogs:
      - catalogId: id_basic
        components: {}
      - catalogId: id_custom1
        components: {}
      - catalogId: id_custom2
        components: {}
    client_capabilities: {}
  expect_selected: id_basic

- name: test_select_catalog_intersection
  description: Find the intersection, return any catalog that matches.
  action: select_catalog
  args:
    supported_catalogs:
      - catalogId: id_basic
        components: {}
      - catalogId: id_custom1
        components: {}
      - catalogId: id_custom2
        components: {}
    client_capabilities:
      supportedCatalogIds: ["id_custom2", "id_custom1"]
  expect_selected: id_custom2

- name: test_select_catalog_priority
  description: Priority is determined by the order in supported_catalog_ids.
  action: select_catalog
  args:
    supported_catalogs:
      - catalogId: id_basic
        components: {}
      - catalogId: id_custom1
        components: {}
      - catalogId: id_custom2
        components: {}
    client_capabilities:
      supportedCatalogIds: ["id_custom1", "id_custom2"]
  expect_selected: id_custom1

- name: test_select_catalog_no_match
  description: Raise error if supported list is non-empty but no match exists.
  action: select_catalog
  args:
    supported_catalogs:
      - catalogId: id_basic
        components: {}
      - catalogId: id_custom1
        components: {}
    client_capabilities:
      supportedCatalogIds: ["id_not_exists"]
  expect_error:
    category: "CatalogError"
    message: "No client-supported catalog found"

- name: test_select_catalog_inline
  description: Inline catalog loading (merges onto base).
  action: select_catalog
  args:
    accepts_inline_catalogs: true
    supported_catalogs:
      - catalogId: id_basic
        components:
          Text: {}
    client_capabilities:
      inlineCatalogs:
        - catalogId: id_inline
          components:
            Button: {}
  expect_catalog_schema:
    catalogId: id_basic
    components:
      Text: {}
      Button: {}

- name: test_select_catalog_inline_not_accepted
  description: Inline catalog loading should fail if not accepted.
  action: select_catalog
  args:
    accepts_inline_catalogs: false
    supported_catalogs:
      - catalogId: id_basic
    client_capabilities:
      inlineCatalogs:
        - catalogId: id_inline
  expect_error:
    category: "CatalogError"
    message: "the agent does not accept inline catalogs"

- name: test_select_catalog_multiple_inline
  description: Tests that multiple inline catalogs are merged.
  action: select_catalog
  args:
    accepts_inline_catalogs: true
    supported_catalogs:
      - catalogId: id_basic
        components:
          Text: {}
    client_capabilities:
      inlineCatalogs:
        - catalogId: id_basic
          components:
            Button: {}
        - catalogId: id_basic
          components:
            Icon: {}
  expect_catalog_schema:
    catalogId: id_basic
    components:
      Text: {}
      Button: {}
      Icon: {}

- name: test_select_catalog_no_match_with_inline
  description: Fallback to default catalog when no match in supported list but inline is present.
  action: select_catalog
  args:
    accepts_inline_catalogs: true
    supported_catalogs:
      - catalogId: id_basic
        components:
          Text: {}
      - catalogId: id_custom1
        components: {}
    client_capabilities:
      supportedCatalogIds: ["id_not_exists"]
      inlineCatalogs:
        - catalogId: id_basic
          components:
            Button: {}
  expect_catalog_schema:
    catalogId: id_basic
    components:
      Text: {}
      Button: {}
