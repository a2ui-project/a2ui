# Agent functions and the agent's side of function RPC (v1.0): functions an
# agent declares on its copy of a catalog and runs when a renderer sends
# `callAgentFunction`, and the agent's own calls to renderer functions with
# `callRendererFunction`.
#
# A case declares each agent function with the JSON Schema of its `args` and a
# scripted behaviour in place of a handler, so every SDK runs the same
# function: it returns a fixed value, returns the arguments it received,
# returns the context of the call, or fails. Renderer calls run on a fake
# clock that only an `advance_ms` step moves, so no case waits on real time.
# See "Writing cases for the agent function suite" in conformance/README.md.

# --- Declaring agent functions ---

- name: test_declare_agent_function_lists_it_with_the_catalog_functions
  description: >-
    An agent function is one of the catalog's functions, so validation, prompts and compilers see it, and the catalog document lists it like any declared function.
  action: declare_agent_functions
  args:
    catalog:
      catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      agent_functions:
        fetchFxRate:
          description: Current exchange rate from base to target.
          returnType: number
          args:
            type: object
            properties:
              base: {type: string}
              target: {type: string, default: USD}
            required: [base]
            additionalProperties: false
          behavior: {returns: 1.08}
  expect:
    functions: [required, formatString, openUrl, fetchFxRate]
    agent_functions: [fetchFxRate]
    document_functions: [required, formatString, openUrl, fetchFxRate]

- name: test_declare_agent_function_with_a_taken_name_is_a_catalog_error
  description: >-
    An agent function may not take the name of a function the catalog already declares, since a renderer would then run its own function and never send the call to the agent.
  action: declare_agent_functions
  args:
    catalog:
      catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      agent_functions:
        formatString:
          returnType: string
          args:
            type: object
            properties:
              value: {type: string}
            required: [value]
          behavior: {returns: "formatted"}
  expect_error:
    category: CatalogError
    message: "formatString"

# --- Answering callAgentFunction ---

- name: test_handle_agent_function_returns_the_value_and_copies_the_call_id
  description: >-
    The response carries the handler's value and copies the call's functionCallId verbatim, however it is spelled.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args:
              type: object
              properties:
                base: {type: string}
                target: {type: string, default: USD}
              required: [base]
              additionalProperties: false
            behavior: {returns: 1.08}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: "fx call/ü 42"
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: EUR}
  expect:
    functionCallId: "fx call/ü 42"
    value: 1.08

- name: test_handle_agent_function_sends_a_null_value
  description: >-
    A handler that returns null still answers with a value, so the renderer can tell the answer from a missing one.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          lookupNickname:
            returnType: string
            args:
              type: object
              properties:
                userId: {type: string}
              required: [userId]
            behavior: {returns: null}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: nick-1
        callFunction:
          "@call": lookupNickname
          catalogId: conformance/simplified
          args: {userId: u1}
  expect:
    functionCallId: nick-1
    value: null

- name: test_handle_agent_function_applies_schema_defaults
  description: >-
    The arguments are validated against the function's schema before the handler runs, and the handler receives them with the schema's defaults applied.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: object
            args:
              type: object
              properties:
                base: {type: string}
                target: {type: string, default: USD}
              required: [base]
              additionalProperties: false
            behavior: {returns_args: true}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: fx-1
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: EUR}
  expect:
    functionCallId: fx-1
    value: {base: EUR, target: USD}

- name: test_handle_agent_function_passes_the_call_context
  description: >-
    The handler learns the catalog the call resolved to, the surface it was made on, and its functionCallId.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          whereAmI:
            returnType: object
            args: {type: object, properties: {}}
            behavior: {returns_context: true}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: checkout
        functionCallId: ctx-1
        callFunction:
          "@call": whereAmI
          catalogId: conformance/simplified
          args: {}
  expect:
    functionCallId: ctx-1
    value:
      catalogId: conformance/simplified
      surfaceId: checkout
      functionCallId: ctx-1

- name: test_handle_agent_function_with_an_argument_of_the_wrong_type
  description: Arguments that fail the function's schema get INVALID_FUNCTION_CALL, and the handler does not run.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args:
              type: object
              properties:
                base: {type: string}
                target: {type: string, default: USD}
              required: [base]
              additionalProperties: false
            behavior: {returns: 1.08}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: fx-2
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: 3}
  expect:
    functionCallId: fx-2
    error:
      code: INVALID_FUNCTION_CALL
      message: fetchFxRate

- name: test_handle_agent_function_with_a_missing_required_argument
  description: A call that leaves out a required argument gets INVALID_FUNCTION_CALL.
  action: handle_agent_function
  args:
