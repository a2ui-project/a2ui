      callAgentFunction:
        surfaceId: s1
        functionCallId: fx-4
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: EUR, precision: 4}
  expect:
    functionCallId: fx-4
    error:
      code: INVALID_FUNCTION_CALL

- name: test_handle_agent_function_with_an_unknown_name
  description: A call to a name no catalog registers as an agent function gets UNKNOWN_FUNCTION.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args: {type: object, properties: {base: {type: string}}}
            behavior: {returns: 1.08}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: u-1
        callFunction:
          "@call": fetchStockPrice
          catalogId: conformance/simplified
          args: {}
  expect:
    functionCallId: u-1
    error:
      code: UNKNOWN_FUNCTION

- name: test_handle_agent_function_in_an_unknown_catalog
  description: A call that names a catalog the agent does not have gets UNKNOWN_FUNCTION, even when another catalog registers the name.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args: {type: object, properties: {base: {type: string}}}
            behavior: {returns: 1.08}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: u-2
        callFunction:
          "@call": fetchFxRate
          catalogId: https://example.com/other/catalog.json
          args: {base: EUR}
  expect:
    functionCallId: u-2
    error:
      code: UNKNOWN_FUNCTION

- name: test_handle_agent_function_for_a_renderer_function
  description: >-
    A function the catalog declares for the renderer to run is not an agent function, so a call to it gets UNKNOWN_FUNCTION.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args: {type: object, properties: {base: {type: string}}}
            behavior: {returns: 1.08}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: u-3
        callFunction:
          "@call": formatString
          catalogId: conformance/simplified
          args: {value: Hello}
  expect:
    functionCallId: u-3
    error:
      code: UNKNOWN_FUNCTION

- name: test_handle_agent_function_whose_handler_fails
  description: >-
    A handler that fails gets EXECUTION_ERROR, with the failure's message.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args: {type: object, properties: {base: {type: string}}}
            behavior:
              raises: {message: "rate service unavailable"}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: e-1
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: EUR}
  expect:
    functionCallId: e-1
    error:
      code: EXECUTION_ERROR
      message: "rate service unavailable"

- name: test_handle_agent_function_whose_handler_fails_with_its_own_code
  description: >-
    A handler that fails with an RPC error code of its choosing sends that code instead of EXECUTION_ERROR.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          fetchFxRate:
            returnType: number
            args: {type: object, properties: {base: {type: string}}}
            behavior:
              raises: {code: PROVIDER_NOT_FOUND, message: "no rate provider for EUR"}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: e-2
        callFunction:
          "@call": fetchFxRate
          catalogId: conformance/simplified
          args: {base: EUR}
  expect:
    functionCallId: e-2
    error:
      code: PROVIDER_NOT_FOUND
      message: "no rate provider for EUR"

- name: test_handle_agent_function_that_only_the_agent_may_call
  description: >-
    A renderer may not call a function whose allowedCallers is agentOnly, so the call gets INVALID_FUNCTION_CALL and the handler does not run.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          resetLedger:
            returnType: void
            allowedCallers: agentOnly
            args: {type: object, properties: {}}
            behavior: {returns: null}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: a-1
        callFunction:
          "@call": resetLedger
          catalogId: conformance/simplified
          args: {}
  expect:
    functionCallId: a-1
    error:
      code: INVALID_FUNCTION_CALL
      message: agentOnly

- name: test_handle_agent_function_picks_the_catalog_the_call_names
  description: >-
    Two catalogs may each register an agent function of the same name, and a call runs the one in the catalog it names.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          lookup:
            returnType: string
            args: {type: object, properties: {}}
            behavior: {returns: "from simplified"}
      - catalog: "test_data/catalogs/agent_functions_catalog_v1_0.json"
        agent_functions:
          lookup:
            returnType: string
            args: {type: object, properties: {}}
            behavior: {returns: "from agent_functions"}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: m-1
        callFunction:
          "@call": lookup
          catalogId: conformance/agent_functions
          args: {}
  expect:
    functionCallId: m-1
    value: "from agent_functions"

- name: test_handle_agent_function_without_catalog_id_runs_the_only_match
  description: >-
    Renderers name the catalog on every call. A call that names none runs the agent function of that name if exactly one catalog registers it.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        agent_functions:
          lookup:
            returnType: string
            args: {type: object, properties: {}}
            behavior: {returns: "from simplified"}
      - catalog: "test_data/catalogs/agent_functions_catalog_v1_0.json"
        agent_functions: {}
    message:
      version: "1.0"
      callAgentFunction:
        surfaceId: s1
        functionCallId: m-2
        callFunction:
          "@call": lookup
          args: {}
  expect:
    functionCallId: m-2
    value: "from simplified"

- name: test_handle_agent_function_without_catalog_id_and_no_match
  description: A call that names no catalog, to a name no catalog registers, gets UNKNOWN_FUNCTION.
  action: handle_agent_function
  args:
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
