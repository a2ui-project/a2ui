# Express compilation: turning one raw Express block into A2UI messages.
#
# `compile` takes the content of one block, without its sentinel tags, and
# returns the messages an agent sends. This is where the notation is given
# meaning, so most of what a reader needs to know about Express is stated here.
#
# The inverse, writing messages back into Express, is
# `agent/express/decompiler.yaml`. Finding the blocks in a response and putting
# them back is `agent/express/response_parser.yaml`. The blueprint's `Parser`
# declares `compile`, `decompile`, `wrap`, `unwrap` and `parse_response` as one
# interface; the suites are split by call because each has rules of its own and
# the Express compilation rules alone run to a page.
#
# Two error categories carry the load. `ParseError` is for payload text the
# format cannot read. `ValidationError` is for a payload that reads but names
# something the catalog does not declare.
#
# A component carrying a property its catalog does not declare is invalid, but
# the rule lives in the message envelope rather than in the catalog. Like the
# published catalogs, the fixtures here leave their component schemas open, and
# `agent_to_renderer.json` closes each component with `unevaluatedProperties`
# once it has added the envelope's own `id`. An implementation that validates a
# component against the bare catalog schema will miss this; it has to validate
# the message it is about to emit.
#
# Express compilation is younger than the direct JSON path, and the cases below
# fix these rules for it:
#
# - A variable name becomes the id of the component it holds.
# - A component written inline is hoisted out and takes the id
#   `<parent id>_<property>`, or `<parent id>_<property>_<index>` inside an
#   array. It is emitted after its parent.
# - An argument that is omitted, or skipped with `_`, is left out of the
#   compiled component. The Express specification's worked example writes
#   `null` for a skipped argument, which the catalogs here reject, since their
#   optional properties are enums that do not admit it.
# - A block with no `surface(...)` line compiles against the surface id
#   `default_surface`.
# - A case compiles one block with no session behind it, so a block that
#   declares `root` creates its surface rather than updating one.
# - `Event(name)` compiles to whatever shape the catalog declares for an
#   action. In the fixtures here that is `{"event": {"name": name}}`, and a map
#   passed as a second argument becomes `context` beside the name.
# - `_template(path, component)` compiles to the child list template shape the
#   protocol defines, which is `{"componentId": ..., "path": ...}`.
# - A `?check` passes the component's own bound value as the checked value, and
#   a trailing string literal becomes the rule's message.
# - Only a variable holding a component becomes a component. A variable holding
#   a map, an `Event` or a check is substituted wherever it is named, and emits
#   nothing of its own. Without this rule the two would be indistinguishable,
#   since both are written `name = value`.
# - A map literal is data. Its keys are kept as written, quoted or not, even a
#   key that shares its name with an Express construct, such as `variable`,
#   `path`, `call` or `check`, and a variable of the same name as one of its
#   string values does not replace that value.
# - As compile-time repairs on top of `Express.g4` (whose `COMMENT` rule is
#   `#` and `//` only), `--` single-line comments outside string literals, raw
#   line breaks at the edges of standard double-quoted strings, and tokens
#   split across a line break outside strings and comments are tolerated.
# - A check written without parentheses supplies no message. `CheckRule.message`
#   is optional, but a renderer with no message has nothing to show a user, so
#   an implementation fills one in; its wording is not fixed here. That is what
#   `expect_present` is for.
# - A standalone function call compiles to `callRendererFunction`, with the
#   call id `call_<n>` counting from 1 within the block and the surface's
#   catalog id on the call. The Express proposal shows this message with
#   `functionCallId` and `callFunction` at the top level instead, which
#   `agent_to_renderer.json` rejects; the schema is the authority, so the
#   proposal is wrong and these cases follow the schema.
# - A number literal is a JSON number with an optional leading `+`: the
#   grammar's `NUMBER` is `[+-]? ([0-9]+ ('.' [0-9]*)? | '.' [0-9]+)
#   ([eE] [+-]? [0-9]+)?`, so `.5`, `1.`, `+3` and `1e-7` all read as numbers.
#   A literal outside the range of a double, such as `1e999`, is a `ParseError`.
#   Integers are exact up to ±(2^53−1); beyond that an implementation may read
#   them as doubles, so they are not portable and no case here relies on them.
#
# Three things the cases below rely on are the grammar's rather than this
# suite's, and are stated here only because a reader of the cases would
# otherwise take them for invention. `specification/inference_formats/express/
# Express.g4` skips `#`, `//` and `/* */` comments, skips semicolons, and skips
# newlines like any other whitespace, so a statement may span lines and several
# may share one. Trailing commas are admitted in arrays, maps and argument
# lists. `PATH` is `'$' [a-zA-Z0-9_/]*`, so a bare `$` is a path of zero
# characters: the whole bound value, which inside a template child is the
# current item.
#
# Positional arguments follow the property order of the catalog document, so
# against `simplified_catalog_v1_0.json` the signatures are
# `Text(text, variant)`, `Button(child, action)`, `Card(child)` and
# `Column(children)`. A few cases need a property that fixture does not
# declare, such as a list of checks or a slot that admits a function call;
# those inline a small catalog in `args.catalog` rather than stretch the
# fixture.
#
# The direct JSON counterpart of this suite is
# `agent/direct_json/compiler.yaml`. The two are deliberately parallel: a rule
# that holds for both formats has a case in each, written against that format's
# own notation.
#
# The catalogs under test live in `args`, and every case here is written against
# v1.0. A case states no version of its own: the version it runs under is the
# one its catalog document declares.

# A compile case checks the block on its own, as `validate_payload` does: a
# surface that the block updates without creating is assumed to exist.

- name: test_compile_express_minimal_root
  description: A block that assigns root compiles to one createSurface carrying that component.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_express_unicode_identifier
  description: A variable name that is a UAX 31 Unicode identifier lexes and compiles to a component with that id.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column([größe])
    größe = Text("x")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["größe"]
          - id: "größe"
            component: "Text"
            text: "x"

- name: test_compile_express_nesting_by_variable_reference
  description: A child named by variable becomes a component id in the parent and a component of its own.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Card(body)
    body = Text("Hello")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Hello"

- name: test_compile_express_inline_nesting
  description: A component written inline is hoisted out after its parent and takes an id built from the parent and the property it fills.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Card(Text("Hello"))'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "root_child"
          - id: "root_child"
            component: "Text"
            text: "Hello"

- name: test_compile_express_keyword_and_positional_arguments_mixed
  description: A keyword argument names its property and can follow a positional one.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello", variant="caption")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"
            variant: "caption"

- name: test_compile_express_placeholder_skips_an_optional_argument
  description: An underscore leaves the property it stands in for out of the compiled component.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", _, "you@example.com")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"
            placeholder: "you@example.com"

- name: test_compile_express_raw_string_literal
  description: A raw string keeps its backslashes, because no escape is processed inside one.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text(r"C:\temp\notes")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: 'C:\temp\notes'

- name: test_compile_express_escapes_in_a_standard_string
  description: A standard string processes its escapes, which is what tells it apart from a raw one.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Line 1\nLine 2")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Line 1\nLine 2"

- name: test_compile_express_array_of_children
  description: An array maps to the child list slot and holds the ids of the components it names.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column([greeting, farewell])
    greeting = Text("Hello")
    farewell = Text("Goodbye")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["greeting", "farewell"]
          - id: "greeting"
            component: "Text"
            text: "Hello"
          - id: "farewell"
            component: "Text"
            text: "Goodbye"

- name: test_compile_express_template_children
  description: The _template helper fills the child list with the catalog's template shape, and the template component reads relative paths.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column(_template($/items, itemRow))
    itemRow = Text($label)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children:
              componentId: "itemRow"
              path: "/items"
          - id: "itemRow"
            component: "Text"
            text:
              "@path": "label"

- name: test_compile_express_absolute_data_binding_path
  description: A path argument binds the property to the data model rather than setting a literal.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "root = Text($/user/name)"
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              "@path": "/user/name"

- name: test_compile_express_nested_function_call
  description: A catalog function called in a property slot compiles to that function call, which is how text is interpolated.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text(formatString("Hello, ${/user/name}"))'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              "@call": "formatString"
              args:
                value: "Hello, ${/user/name}"

- name: test_compile_express_validation_expression
  description: A check expression compiles to a check rule whose condition calls the named function on the component's own value, with a trailing string as its message.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", $/email, _, [?required("Email is required")])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"
            value:
              "@path": "/email"
            checks:
              - condition:
                  "@call": "required"
                  args:
                    value:
                      "@path": "/email"
                message: "Email is required"

- name: test_compile_express_validation_expression_with_an_argument
  description: A check expression passes the component's own value first and the written arguments after it, so a trailing string is the message rather than the last declared argument.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Zip", $/zip, _, [?regex(r"^[0-9]{5}$", "Must be five digits")])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Zip"
            value:
              "@path": "/zip"
            checks:
              - condition:
                  "@call": "regex"
                  args:
                    value:
                      "@path": "/zip"
                    pattern: "^[0-9]{5}$"
                message: "Must be five digits"

- name: test_compile_express_event_action
  description: An Event compiles to the action shape the catalog declares.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label, Event("submit"))
    label = Text("Submit")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              event:
                name: "submit"
          - id: "label"
            component: "Text"
            text: "Submit"

- name: test_compile_express_event_action_with_context
  description: A map passed to an Event becomes the context beside the event name.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label, Event("submit", {itemId: "42"}))
    label = Text("Submit")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              event:
                name: "submit"
                context:
                  itemId: "42"
          - id: "label"
            component: "Text"
            text: "Submit"

- name: test_compile_express_data_model_assignment
  description: A data path assignment beside a root fills the surface's initial data model.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    $/title = "Hello"
    root = Text($/title)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              "@path": "/title"
        dataModel:
          title: "Hello"

- name: test_compile_express_data_model_only_block
  description: A block of nothing but data path assignments updates the data model rather than creating a surface.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    $/icon = "check"
    $/title = "Enable notifications"
  expect:
    - version: "v1.0"
      updateDataModel:
        surfaceId: "default_surface"
        path: "/"
        value:
          icon: "check"
          title: "Enable notifications"

- name: test_compile_express_surface_targeting
  description: A surface line names the surface the block is for, in place of the default id.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    surface("dashboard")
    root = Text("Hello")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "dashboard"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_express_surface_targeting_names_a_catalog
  description: With multiple active catalogs, a component resolves against the catalog that defines it and carries its catalogId while createSurface omits catalogId.
  action: compile
  args:
    format: express
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |-
    surface("dashboard")
    root = Gauge(0.5)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "dashboard"
        components:
          - id: "root"
            component: "Gauge"
            catalogId: "conformance/custom"
            value: 0.5

- name: test_compile_express_delete_surface
  description: A deleteSurface line compiles to the lifecycle message of that name.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'deleteSurface("dashboard")'
  expect:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "dashboard"

- name: test_compile_express_delete_surface_with_a_keyword_argument
  description: The lifecycle commands take keyword arguments like any other call, since the grammar admits a named argument anywhere a positional one is admitted.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'deleteSurface(surfaceId="dashboard")'
  expect:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "dashboard"

- name: test_compile_express_two_surfaces_in_one_block
  description: A second surface line starts a second surface rather than retargeting the first, so one block can open two. Each surface has its own root, which is why the same variable name appears twice without collision.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    surface("first")
    root = Text("One")
    surface("second")
    root = Text("Two")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "first"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "One"
    - version: "v1.0"
      createSurface:
        surfaceId: "second"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Two"

- name: test_compile_express_standalone_function_call
  description: A call written as a statement of its own asks the renderer to run a function, and compiles to callRendererFunction with the surface's catalog on the call. The function must be one the agent may call, which agent_functions_catalog_v1_0.json declares. The Express proposal shows this message with functionCallId and callFunction at the top level, which the v1.0 envelope rejects.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/agent_functions_catalog_v1_0.json"
  input: 'notify("Saved")'
  expect:
    - version: "v1.0"
      callRendererFunction:
        functionCallId: "call_1"
        callFunction:
          catalogId: "conformance/agent_functions"
          "@call": "notify"
          args:
            message: "Saved"

- name: test_compile_express_function_call_action
  description: A function call in an action slot is the local branch of Action, which is how a control does something in the renderer rather than send the agent an event.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label, openUrl("https://example.com"))
    label = Text("Open the docs")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              functionCall:
                "@call": "openUrl"
                args:
                  url: "https://example.com"
          - id: "label"
            component: "Text"
            text: "Open the docs"

- name: test_compile_express_map_variable_is_inlined_where_it_is_used
  description: A variable holding a map is substituted where it is named and emits no component of its own, which is what tells it apart from a variable holding a component. A compiler that treated every assignment as a component would emit a component named ctx.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    ctx = {itemId: "42"}
    root = Button(label, Event("submit", ctx))
    label = Text("Submit")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              event:
                name: "submit"
                context:
                  itemId: "42"
          - id: "label"
            component: "Text"
            text: "Submit"

- name: test_compile_express_event_variable_is_inlined_at_each_use
  description: An Event held in a variable is substituted at every use, so two controls can share one action without either of them referring to a component that does not exist.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    submit = Event("submit")
    root = Column([save, send])
    save = Button(saveLabel, submit)
    send = Button(sendLabel, submit)
    saveLabel = Text("Save")
    sendLabel = Text("Send")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["save", "send"]
          - id: "save"
            component: "Button"
            child: "saveLabel"
            action:
              event:
                name: "submit"
          - id: "send"
            component: "Button"
            child: "sendLabel"
            action:
              event:
                name: "submit"
          - id: "saveLabel"
            component: "Text"
            text: "Save"
          - id: "sendLabel"
            component: "Text"
            text: "Send"

- name: test_compile_express_trailing_optional_arguments_may_be_omitted
  description: An argument list may simply stop once the required properties are filled, without an underscore for each property left behind.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"

- name: test_compile_express_string_containing_an_equals_sign
  description: An equals sign inside a string is content rather than an assignment or a keyword argument, which a compiler splitting the line on the character before tokenizing would get wrong.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("width=100")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "width=100"

- name: test_compile_express_comments_are_ignored
  description: The grammar skips all three comment forms, so a model that annotates what it is building compiles to the same messages as one that does not.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    # The greeting the user asked for.
    -- SQL-style single-line comment.
    root = Text("Hello")  // the only component
    /* Nothing follows, but a block
       comment spanning lines still ends the block cleanly. */
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_express_semicolons_and_trailing_commas
  description: Semicolons are skipped like whitespace, so several statements may share a line, and a trailing comma closes an array without adding an element to it.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Column([first, second,]); first = Text("One"); second = Text("Two")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["first", "second"]
          - id: "first"
            component: "Text"
            text: "One"
          - id: "second"
            component: "Text"
            text: "Two"

- name: test_compile_express_statement_spans_several_lines
  description: A newline is whitespace rather than a statement terminator, so an argument list may be broken across lines. A model emitting a long component list will wrap it, and a line-based compiler would see each fragment as a statement of its own.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Card(
      body
    )
    body = Text("Hello")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Hello"

- name: test_compile_express_bare_path_is_the_whole_bound_value
  description: A path of no characters is the value the component is bound to rather than a missing path, which inside a template child is the item being rendered. This is the only way to template over a list of plain strings.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column(_template($/names, nameRow))
    nameRow = Text($)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children:
              componentId: "nameRow"
              path: "/names"
          - id: "nameRow"
            component: "Text"
            text:
              "@path": ""

- name: test_compile_express_several_checks_in_one_list
  description: A check list holds more than one rule, each compiled against the component's own bound value. The single-rule cases above would also pass an implementation that kept only the first.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Zip", $/zip, _, [?required("Zip is required"), ?regex(r"^[0-9]{5}$", "Must be five digits")])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Zip"
            value:
              "@path": "/zip"
            checks:
              - condition:
                  "@call": "required"
                  args:
                    value:
                      "@path": "/zip"
                message: "Zip is required"
              - condition:
                  "@call": "regex"
                  args:
                    value:
                      "@path": "/zip"
                    pattern: "^[0-9]{5}$"
                message: "Must be five digits"

- name: test_compile_express_check_without_a_message_still_carries_one
  description: A check may be written bare, without parentheses. The protocol leaves CheckRule.message optional, but a renderer given no message has nothing to show, so the format supplies one; what it says is the implementation's business and is not compared.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", $/email, _, [?required])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"
            value:
              "@path": "/email"
            checks:
              - condition:
                  "@call": "required"
                  args:
                    value:
                      "@path": "/email"
  expect_present:
    - "/0/createSurface/components/0/checks/0/message"

- name: test_compile_express_empty_block_is_a_parse_error
  description: A block with no statements is a parse error rather than an empty message list.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: ""
  expect_error:
    category: "ParseError"

- name: test_compile_express_syntax_error_is_a_parse_error
  description: A statement the grammar cannot read is a parse error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello"'
  expect_error:
    category: "ParseError"

- name: test_compile_express_unknown_component_is_a_validation_error
  description: A block that parses but names a component the catalog does not declare is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "root = Sparkline([1, 2, 3])"
  expect_error:
    category: "ValidationError"

- name: test_compile_express_undeclared_property_is_a_validation_error
  description: A keyword argument naming a property the component does not declare is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello", tooltip="Greeting")'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_missing_required_property_is_a_validation_error
  description: A component left without a property its catalog requires is a validation error. Nothing in the notation marks an argument list as short, so an implementation that only checked the arguments it was given would emit the invalid component instead.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label)
    label = Text("Save")
  expect_error:
    category: "ValidationError"

- name: test_compile_express_value_outside_an_enum_is_a_validation_error
  description: A value the property's enum does not list is a validation error rather than a string passed through, which is the case that tells whether an implementation validates against the property schema or only against the property name.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello", variant="headline")'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_binding_a_static_property_is_a_validation_error
  description: A path given to a property with a static type, such as a plain number, is a validation error, because a renderer reading that property will not resolve it. Only a dynamic type, such as DynamicString or DynamicNumber, admits a binding.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: "root = Gauge($/value)"
  expect_error:
    category: "ValidationError"

- name: test_compile_express_unknown_function_is_a_validation_error
  description: A call the catalog does not declare is a validation error, on the same footing as a component it does not declare. A compiler that fell back to emitting the call verbatim would hand the renderer something it cannot run.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text(titleCase("hello"))'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_empty_argument_is_a_parse_error
  description: A comma with no expression before it is a parse error. The grammar admits a trailing comma only after an argument, so the two cannot be confused.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: "root = TextField(,)"
  expect_error:
    category: "ParseError"

- name: test_compile_express_unexpected_character_is_a_parse_error
  description: A character no lexer rule admits is a parse error, and is reported as one rather than escaping as an internal failure from the tokenizer.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = @Text("Hello")'
  expect_error:
    category: "ParseError"

- name: test_compile_express_template_without_a_component_is_a_parse_error
  description: The template helper takes a path and a component, and a call missing the second is a parse error. It reads as a well-formed call, so an implementation checking only the grammar would accept it and emit a child list with no component to render.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "root = Column(_template($/items))"
  expect_error:
    category: "ParseError"

- name: test_compile_express_list_of_numbers
  description: An array of plain numbers passed to a numeric list property compiles to a JSON array of numbers, whereas every other array case in this suite holds child component references or inline components.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: 'root = Chart([10, 20, 30], "Sales")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Chart"
            values: [10, 20, 30]
            caption: "Sales"

- name: test_compile_express_number_with_exponent
  description: A number written with an exponent compiles to the double it names. The grammar admits the exponent, so a compiler that read only digits and a dot would reject text a model copies straight out of JSON.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: "root = Gauge(2.5e-7)"
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Gauge"
            value: 2.5e-7

- name: test_compile_express_number_forms_match_json
  description: Every spelling the number grammar admits compiles to the same value JSON would give it, including a leading dot, a trailing dot, an explicit plus sign and an upper-case exponent. An implementation that converted the token with a narrower reader than its JSON parser would disagree with the other SDKs on one of these.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: 'root = Chart([.5, -.25, 1e2, 1E-2, +3, 1.], "Mixed")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Chart"
            values: [0.5, -0.25, 100, 0.01, 3, 1]
            caption: "Mixed"

- name: test_compile_express_integers_exact_to_2_pow_53
  description: Integers up to ±(2^53−1) compile exactly in every SDK, since that is the largest magnitude a double represents without loss. Larger integers are not portable and are left unpinned.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: 'root = Chart([9007199254740991, -9007199254740991], "Limits")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Chart"
            values: [9007199254740991, -9007199254740991]
            caption: "Limits"

- name: test_compile_express_number_out_of_range_is_a_parse_error
  description: A literal the grammar admits but no double can hold is a parse error. Every SDK's number reader turns it into infinity, which no message can carry, so the compiler rejects the text rather than emit a value the renderer cannot read.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: "root = Gauge(1e999)"
  expect_error:
    category: "ParseError"

- name: test_compile_express_exponent_without_digits_is_a_parse_error
  description: An exponent marker with no digits after it is a parse error. The lexer reads `1e` as the number `1` followed by the identifier `e`, and the parser rejects the leftover inside a call argument.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  input: "root = Gauge(1e)"
  expect_error:
    category: "ParseError"

- name: test_compile_express_inline_id_collision_is_a_validation_error
  description: An inline child component takes the synthesized id <parent>_<property>, so a block that also assigns a variable of that name collides on the component id and fails validation rather than silently overwriting one of the two.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root_child = Text("c2")
    root = Card(Text("c1"))
  expect_error:
    category: "ValidationError"

- name: test_compile_express_inline_array_id_collision_is_a_validation_error
  description: An inline child inside an array takes the synthesized id <parent>_<property>_<index> (1-based), so a block that also assigns a variable of that name collides on the component id and fails validation.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root_children_1 = Text("conflict")
    root = Column([Text("a"), Text("b")])
  expect_error:
    category: "ValidationError"

- name: test_compile_express_checks_on_uncheckable_component_is_a_validation_error
  description: Passing a check list ([?...]) to a component whose catalog schema does not declare a checks property is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("hi", [?required])'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_check_with_value_on_uncheckable_component_is_a_validation_error
  description: A check that names the value it checks, passed to a component whose catalog schema does not declare a checks property, is a validation error. The check is complete, so the missing checks property is the only error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("hi", [?required($/name)])'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_components_without_root_is_update_components
  description: A block that assigns components without defining root compiles to an updateComponents message for an existing surface rather than createSurface.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'some_var = Text("Hi")'
  expect:
    - version: "v1.0"
      updateComponents:
        surfaceId: "default_surface"
        components:
          - id: "some_var"
            component: "Text"
            text: "Hi"

- name: test_compile_express_duplicate_property_is_a_validation_error
  description: Supplying a component property both positionally and by keyword argument in the same call is a validation error rather than letting one overwrite the other.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("hi", text="duplicate")'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_undeclared_function_parameter_is_a_validation_error
  description: A keyword argument on a function call naming a parameter the catalog function does not declare is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Button(Text("hi"), action=openUrl("https://example.com", badArg=1))'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_duplicate_function_parameter_is_a_validation_error
  description: Supplying a function parameter both positionally and by keyword argument in the same call is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Button(Text("hi"), action=openUrl("https://example.com", url="https://other.com"))'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_component_outside_pinned_surface_catalog_is_a_validation_error
  description: When surface(...) explicitly pins a catalogId, referencing a component that belongs to a different active catalog is a validation error.
  action: compile
  args:
    format: express
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |-
    surface("s1", catalogId="conformance/simplified")
    root = Gauge(30)
  expect_error:
    category: "ValidationError"

- name: test_compile_express_surface_targeting_unknown_catalog_is_a_validation_error
  description: A surface(...) declaration naming a catalogId that is not among the active catalogs is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    surface("main", catalogId="unknown")
    root = Text("hi")
  expect_error:
    category: "ValidationError"

- name: test_compile_express_non_identifier_id_from_v1_0_is_a_validation_error
  description: From v1.0, component IDs must be valid UAX 31 identifiers, so setting id="..." to a non-identifier string is rejected with a validation error at compile time.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Column([t]); t = Text("x", id="main-title")'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_sql_style_comment_and_edge_newlines_repaired
  description: A SQL-style -- comment outside strings is ignored and raw line breaks at the edges of a standard string literal are stripped.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    -- Greeting surface
    root = Text("
    Hello -- world
    ")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello -- world"

- name: test_compile_express_split_identifier_and_split_path_repaired
  description: An identifier or data binding path broken across a line outside string literals is joined when the joined identifier resolves to a declared variable.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    greeting_
    label = Text($/user/
    name)
    root = Card(
      greeting_
      label
    )
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "greeting_label"
            component: "Text"
            text:
              "@path": "/user/name"
          - id: "root"
            component: "Card"
            child: "greeting_label"

- name: test_compile_express_triple_quoted_strings_not_corrupted_by_line_joins
  description: Triple-quoted strings containing newlines, commas, parentheses, assignments, and $/ paths are kept verbatim without line-join rewrites.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    c1 = Text("""Colors: red, green
    blue, yellow""")
    c2 = Text("""Shopping list:
    apples
    pears = 2 kg""")
    c3 = Text("""Price in $/
    month""")
    root = Column([c1, c2, c3])
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "c1"
            component: "Text"
            text: "Colors: red, green\nblue, yellow"
          - id: "c2"
            component: "Text"
            text: "Shopping list:\napples\npears = 2 kg"
          - id: "c3"
            component: "Text"
            text: "Price in $/\nmonth"
          - id: "root"
            component: "Column"
            children: ["c1", "c2", "c3"]

- name: test_compile_express_missing_comma_between_defined_variables_is_a_parse_error
  description: Two defined variable names separated by a newline without a comma inside a list fail to parse even when their concatenation is also a defined variable.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    header = Text("H")
    body = Text("B")
    headerbody = Text("HB")
    root = Column([header
    body])
  expect_error:
    category: "ParseError"

- name: test_compile_express_positional_number_skips_optional_enums_to_weight
  description: A trailing numeric positional argument skips optional enum properties when exactly one later property accepts numbers.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    t = Text("Hello", 2)
    root = Column([t], 1)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/weighted"
        components:
          - id: "t"
            component: "Text"
            text: "Hello"
            weight: 2
          - id: "root"
            component: "Column"
            children: ["t"]
            weight: 1

- name: test_compile_express_positional_number_does_not_skip_non_enum_optional_property
  description: A numeric positional argument at an optional string property that is not an enum does not skip ahead to weight and fails validation.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: 'root = Image("https://example.com/a.png", 200)'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_positional_number_followed_by_more_args_is_a_validation_error
  description: A numeric positional argument that is not the last positional argument does not skip ahead to weight, and extra positional arguments are rejected.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    t = Text("Hello")
    root = Column([t], 2, "center")
  expect_error:
    category: "ValidationError"

- name: test_compile_express_split_data_path_not_joined_across_assignment
  description: A path ending in slash at the end of a line is not joined when the next line begins an identifier assignment.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    data = $/user/
    root = Text("hi")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "hi"

- name: test_compile_express_multiline_kwargs_not_treated_as_declared_lhs
  description: Keyword arguments in multiline component calls are at depth greater than 0 and are not collected as top-level declared identifiers.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Card(
      child = Text("Hello")
    )
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "root_child"
          - id: "root_child"
            component: "Text"
            text: "Hello"

- name: test_compile_express_positional_number_skips_optional_enum_to_ref_resolved_dynamic_number
  description: A trailing numeric positional argument skips optional enum properties to a property whose type is a $ref to DynamicNumber.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = Slider(50)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/weighted"
        components:
          - id: "root"
            component: "Slider"
            value: 50

- name: test_compile_express_positional_number_does_not_skip_required_enum
  description: A numeric positional argument does not skip a required enum property and fails validation.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = Status(1, state = "active")
  expect_error:
    category: "ValidationError"

- name: test_compile_express_positional_number_ambiguous_two_numeric_targets_is_validation_error
  description: A numeric positional argument does not skip when two later properties accept numbers, making the target ambiguous.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = DualMetric(10)
  expect_error:
    category: "ValidationError"

- name: test_compile_express_positional_number_target_in_kwargs_is_validation_error
  description: A numeric positional argument does not skip to a numeric property that is already provided in keyword arguments.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = Text("Hello", 2, weight = 1)
  expect_error:
    category: "ValidationError"

- name: test_compile_express_sql_comment_inside_comment_or_triple_string_preserved
  description: Double dashes inside single-line comments or triple-quoted strings are preserved as string or comment content.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    // comment with -- dash
    root = Text("""Value -- with dashes""")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Value -- with dashes"

- name: test_compile_express_split_identifier_one_half_resolves_not_joined
  description: A split identifier is not joined when only one half resolves to a declared variable and the joined name does not.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    header = Text("H")
    root = Column([header
    suffix])
  expect_error:
    category: "ParseError"

- name: test_compile_express_positional_number_skips_optional_enum_to_level_when_last_arg
  description: A numeric positional argument skips an optional enum property when it is the last positional argument and a single later property accepts numbers.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = Meter("CPU", 75)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/weighted"
        components:
          - id: "root"
            component: "Meter"
            label: "CPU"
            level: 75

- name: test_compile_express_positional_number_followed_by_more_args_pins_exact_assignment
  description: A numeric positional argument followed by more arguments does not skip ahead to level, rejecting the invalid enum assignment instead of succeeding.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/weighted_catalog_v1_0.json"
  input: |-
    root = Meter("CPU", 75, "High priority")
  expect_error:
    category: "ValidationError"

- name: test_compile_express_raw_newline_in_plain_string_preserved
  description: A raw newline inside a plain string literal is preserved and not altered by source normalization.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Text("Hello
    World")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello\nWorld"

- name: test_compile_express_map_literal_keeps_keys_named_like_express_constructs
  description: A map literal whose keys share a name with an Express construct compiles to the same map, not to a reference, binding, call or check.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe({variable: "m", path: "p", call: "c", check: "k", skipped: true, kind: "map", count: 6})
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              variable: "m"
              path: "p"
              call: "c"
              check: "k"
              skipped: true
              kind: "map"
              count: 6

- name: test_compile_express_map_literal_with_one_key_named_like_a_construct
  description: A map literal with only a variable key is still a map, not a variable reference.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe({variable: "m"})
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              variable: "m"

- name: test_compile_express_map_literal_keeps_quoted_keys_named_like_constructs
  description: Quoted keys are kept as written, like unquoted ones.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe({"variable": "m", "path": "p", "count": 6})
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              variable: "m"
              path: "p"
              count: 6

- name: test_compile_express_map_literal_string_value_ignores_a_variable_of_the_same_name
  description: A string value in a map literal stays a string even when a variable of that name is assigned.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    m = "replacement"
    root = Probe({variable: "m", count: 6})
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              variable: "m"
              count: 6

- name: test_compile_express_map_literal_value_still_resolves_a_variable_reference
  description: A bare identifier as a map value is still a variable reference, whatever the key is named.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    label = "hi"
    root = Probe({variable: label, title: label})
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              variable: "hi"
              title: "hi"

- name: test_compile_express_map_literals_in_function_arguments_keep_their_keys
  description: Map literals passed to a function, nested or not, keep keys named like Express constructs, and a string argument for such a parameter stays a string.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe(series(count=6, variable="m", item={variable: "inner", nested: {path: "deep", call: "c"}}))
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/literal_map"
        components:
          - id: "root"
            component: "Probe"
            payload:
              "@call": "series"
              args:
                count: 6
                variable: "m"
                item:
                  variable: "inner"
                  nested:
                    path: "deep"
                    call: "c"

- name: test_compile_express_map_with_call_like_keys_still_rejects_bindings
  description: A path inside a map literal given to a property that admits no binding is a validation error, even when the map has keys named like an event or a function call, since a map literal is data and is searched like any other.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe({event: "e", functionCall: "f", "@call": "c", inner: $/y})
  expect_error:
    category: "ValidationError"

- name: test_compile_express_skipped_outside_an_argument_is_a_validation_error
  description: The `_` placeholder only stands in for an argument. Inside an array or a map literal it is a validation error rather than a value.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    root = Probe({items: [_]})
  expect_error:
    category: "ValidationError"

- name: test_compile_express_check_options_with_other_keys_is_a_validation_error
  description: A map literal with a catalogId key in a check's arguments holds the check's options, and catalogId is the only option, so any other key is a validation error.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", $/email, _, [?required("Email is required", {catalogId: "conformance/forms", extra: 1})])'
  expect_error:
    category: "ValidationError"

- name: test_compile_express_variable_cycle_is_a_validation_error
  description: A variable whose value refers back to it, directly or through other variables, has no value to compile.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/literal_map_catalog_v1_0.json"
  input: |-
    a = {next: b}
    b = a
    root = Probe(a)
  expect_error:
    category: "ValidationError"

- name: test_compile_express_check_options_with_null_catalog_id_is_a_validation_error
  description: A check's options map must name its catalog with a string; a null catalogId is rejected rather than read as no catalogId.
  action: compile
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", $/email, _, [?required({catalogId: null})])'
  expect_error:
    category: "ValidationError"
