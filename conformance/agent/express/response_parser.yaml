# Express response parsing: turning what a model emitted into ordered text and
# A2UI payload parts.
#
# The suite covers the four steps of the parser contract and the entry point
# that runs them. `unwrap_response` tokenizes a response into raw parts.
# `wrap_response` writes raw parts back out as a model would have emitted them.
# `compile_payload` turns one raw block into A2UI messages, `decompile_payload`
# writes messages back into Express notation, and `parse_response` unwraps a
# whole response and compiles each block it finds.
#
# An Express payload sits between `<a2ui>` tags. The agent blueprint calls the
# Express tag `<a2ui-express>`, which is an error in the blueprint; the Express
# specification's `<a2ui>` is what these cases use.
#
# A part carries either text or a payload, never both. Text that precedes a
# payload is its own list item, which is the union the parser returns.
#
# This suite fixes several things the blueprint leaves open. They are decisions
# rather than readings of the spec, so they are stated here rather than left
# for a reader to infer from the cases:
#
# - A response with no sentinel tags unwraps to a single text part, and is not
#   an error. The other reading is reached through `parse_response` with
#   `wrapped: false`, which hands the whole body to the compiler.
# - An empty response unwraps to no parts at all.
# - A text run is trimmed of leading and trailing whitespace, and a run left
#   empty by that is dropped. The whitespace between two blocks is not a part.
# - `ParseError` is for payload text the format cannot read. `ValidationError`
#   is for a payload that reads but names something the catalog does not
#   declare. No case uses `CompileError`, because the compilation error type
#   does not yet descend from the base error type and so no harness can match
#   that category.
# - A component carrying a property its catalog does not declare is invalid,
#   but the rule lives in the message envelope rather than in the catalog. Like
#   the published catalogs, the fixtures here leave their component schemas
#   open, and `agent_to_renderer.json` closes each component with
#   `unevaluatedProperties` once it has added the envelope's own `id`. An
#   implementation that validates a component against the bare catalog schema
#   will miss this; it has to validate the message it is about to emit.
# - Decompiling is the inverse of compiling, so every envelope a case compiles
#   has a decompile case that writes it back out and recompiles it to the same
#   messages. A format that cannot round-trip an envelope cannot be used to
#   author the prompt examples the snippet carries.
#
# Express compilation is younger than the direct JSON path, and the cases below
# fix these rules for it:
#
# - A variable name becomes the id of the component it holds.
# - A component written inline is hoisted out and takes the id
#   `<parent id>_<property>`, or `<parent id>_<property>_<index>` inside an
#   array. It is emitted after its parent.
# - An argument that is omitted, or skipped with `_`, is left out of the
#   compiled component. The Express specification's worked example writes
#   `null` for a skipped argument, which the catalogs here reject, since their
#   optional properties are enums that do not admit it.
# - A block with no `surface(...)` line compiles against the surface id
#   `default_surface`.
# - A case compiles one block with no session behind it, so a block that
#   declares `root` creates its surface rather than updating one.
# - `Event(name)` compiles to whatever shape the catalog declares for an
#   action. In the fixtures here that is `{"event": {"name": name}}`, and a map
#   passed as a second argument becomes `context` beside the name.
# - `_template(path, component)` compiles to the child list template shape the
#   protocol defines, which is `{"componentId": ..., "path": ...}`.
# - A `?check` passes the component's own bound value as the checked value, and
#   a trailing string literal becomes the rule's message.
#
# Positional arguments follow the property order of the catalog document, so
# against `simplified_catalog_v1_0.json` the signatures are
# `Text(text, variant)`, `Button(child, action)`, `Card(child)` and
# `Column(children)`. A few cases need a property that fixture does not
# declare, such as a list of checks or a slot that admits a function call;
# those inline a small catalog in `args.catalog` rather than stretch the
# fixture.
#
# The direct JSON counterpart of this suite is
# `agent/direct_json/response_parser.yaml`. The two are deliberately parallel:
# a rule that holds for both formats has a case in each, written against that
# format's own notation. Streaming is the exception. There is no Express
# streaming suite, because the Express parser does not implement `parse_chunk`:
# an Express agent buffers a response and parses it whole, through the cases
# here. The blueprint declares `parse_chunk` abstract on every parser and says
# the Express parser handles streaming chunks, which is a claim the code has
# never met; if Express does gain streaming, its suite belongs beside
# `agent/direct_json/response_streaming.yaml`.
#
# The catalogs under test live in `args`, and every case here is written against
# v1.0. A case states no version of its own: the version it runs under is the
# one its catalog document declares.

# --- Unwrapping a response ---

- name: test_unwrap_express_text_between_blocks
  description: Express blocks sit between a2ui tags and are ordered against the text the same way.
  action: unwrap_response
  args:
    format: express
  input: |-
    Here is a greeting.
    <a2ui>
    root = Text("Hello")
    </a2ui>
    And here is a second one.
    <a2ui>
    root = Text("Hello again")
    </a2ui>
  expect:
    - text: "Here is a greeting."
    - a2ui_raw: 'root = Text("Hello")'
    - text: "And here is a second one."
    - a2ui_raw: 'root = Text("Hello again")'

- name: test_unwrap_express_block_with_no_surrounding_text
  description: A response that is only a block yields only a payload part.
  action: unwrap_response
  args:
    format: express
  input: |-
    <a2ui>
    root = Text("Hello")
    </a2ui>
  expect:
    - a2ui_raw: 'root = Text("Hello")'

- name: test_unwrap_express_response_without_tags_is_one_text_part
  description: An Express response with no tags is conversational text, as it is for direct JSON.
  action: unwrap_response
  args:
    format: express
  input: "I need the city name before I can draw the forecast."
  expect:
    - text: "I need the city name before I can draw the forecast."

- name: test_unwrap_express_empty_response_has_no_parts
  description: An empty response yields no parts, not an empty text part.
  action: unwrap_response
  args:
    format: express
  input: ""
  expect: []

- name: test_unwrap_express_unterminated_block_is_not_final
  description: An Express block the model left open states that it is not closed.
  action: unwrap_response
  args:
    format: express
  input: |-
    <a2ui>
    root = Card(body)
    body = Text("Hello")
  expect:
    - a2ui_raw: |-
        root = Card(body)
        body = Text("Hello")
      is_final: false

- name: test_unwrap_express_close_tag_inside_a_string_does_not_end_the_block
  description: A close tag inside an Express string literal is part of the payload.
  action: unwrap_response
  args:
    format: express
  input: |-
    <a2ui>
    root = Text("</a2ui>")
    </a2ui>
  expect:
    - a2ui_raw: 'root = Text("</a2ui>")'

- name: test_unwrap_express_markdown_fence_inside_block_stripped
  description: A markdown fence the model carried over from the prompt examples is removed with the surrounding whitespace.
  action: unwrap_response
  args:
    format: express
  input: |-
    <a2ui>
    ```
    root = Text("Hello")
    ```
    </a2ui>
  expect:
    - a2ui_raw: 'root = Text("Hello")'

- name: test_unwrap_express_attributes_on_open_tag_tolerated
  description: An open tag that carries attributes still opens a block.
  action: unwrap_response
  args:
    format: express
  input: '<a2ui version="v1.0">root = Text("Hello")</a2ui>'
  expect:
    - a2ui_raw: 'root = Text("Hello")'

- name: test_unwrap_express_whitespace_only_text_run_dropped
  description: The blank line between two blocks is not a text part.
  action: unwrap_response
  args:
    format: express
  input: |-
    <a2ui>
    root = Text("Hello")
    </a2ui>

    <a2ui>
    root = Text("Hello again")
    </a2ui>
  expect:
    - a2ui_raw: 'root = Text("Hello")'
    - a2ui_raw: 'root = Text("Hello again")'

# --- Writing parts back out ---

- name: test_wrap_express_text_only_parts_are_the_text
  description: A part that carries no payload writes out as its text, with no a2ui tags added.
  action: wrap_response
  args:
    format: express
  parts:
    - text: "I need the city name before I can draw the forecast."
  expect_output: "I need the city name before I can draw the forecast."

- name: test_wrap_express_no_parts_is_an_empty_string
  description: An empty part list writes out as an empty string rather than a pair of empty tags.
  action: wrap_response
  args:
    format: express
  parts: []
  expect_output: ""

- name: test_wrap_express_restores_tags_and_order
  description: Express parts are written back inside a2ui tags, in order.
  action: wrap_response
  args:
    format: express
  parts:
    - text: "Here is the greeting."
    - a2ui_raw: 'root = Text("Hello")'
  expect_contains:
    - "<a2ui>"
    - 'root = Text("Hello")'
    - "</a2ui>"
  expect_round_trip: true

# --- Compiling a payload ---

- name: test_compile_express_minimal_root
  description: A block that assigns root compiles to one createSurface carrying that component.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_express_nesting_by_variable_reference
  description: A child named by variable becomes a component id in the parent and a component of its own.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Card(body)
    body = Text("Hello")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Hello"

- name: test_compile_express_inline_nesting
  description: A component written inline is hoisted out after its parent and takes an id built from the parent and the property it fills.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Card(Text("Hello"))'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "root_child"
          - id: "root_child"
            component: "Text"
            text: "Hello"

- name: test_compile_express_keyword_and_positional_arguments_mixed
  description: A keyword argument names its property and can follow a positional one.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello", variant="caption")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"
            variant: "caption"

- name: test_compile_express_placeholder_skips_an_optional_argument
  description: An underscore leaves the property it stands in for out of the compiled component.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", _, "you@example.com")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"
            placeholder: "you@example.com"

- name: test_compile_express_raw_string_literal
  description: A raw string keeps its backslashes, because no escape is processed inside one.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text(r"C:\temp\notes")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: 'C:\temp\notes'

- name: test_compile_express_escapes_in_a_standard_string
  description: A standard string processes its escapes, which is what tells it apart from a raw one.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Line 1\nLine 2")'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Line 1\nLine 2"

- name: test_compile_express_array_of_children
  description: An array maps to the child list slot and holds the ids of the components it names.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column([greeting, farewell])
    greeting = Text("Hello")
    farewell = Text("Goodbye")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["greeting", "farewell"]
          - id: "greeting"
            component: "Text"
            text: "Hello"
          - id: "farewell"
            component: "Text"
            text: "Goodbye"

- name: test_compile_express_template_children
  description: The _template helper fills the child list with the catalog's template shape, and the template component reads relative paths.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Column(_template($/items, itemRow))
    itemRow = Text($label)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children:
              componentId: "itemRow"
              path: "/items"
          - id: "itemRow"
            component: "Text"
            text:
              path: "label"

- name: test_compile_express_absolute_data_binding_path
  description: A path argument binds the property to the data model rather than setting a literal.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "root = Text($/user/name)"
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              path: "/user/name"

- name: test_compile_express_nested_function_call
  description: A catalog function called in a property slot compiles to that function call, which is how text is interpolated.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text(formatString("Hello, ${/user/name}"))'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              call: "formatString"
              args:
                value: "Hello, ${/user/name}"

- name: test_compile_express_validation_expression
  description: A check expression compiles to a check rule whose condition calls the named function on the component's own value, with a trailing string as its message.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Email", $/email, _, [?required("Email is required")])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Email"
            value:
              path: "/email"
            checks:
              - condition:
                  call: "required"
                  args:
                    value:
                      path: "/email"
                message: "Email is required"

- name: test_compile_express_validation_expression_with_an_argument
  description: A check expression passes the component's own value first and the written arguments after it, so a trailing string is the message rather than the last declared argument.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/forms_catalog_v1_0.json"
  input: 'root = TextField("Zip", $/zip, _, [?regex(r"^[0-9]{5}$", "Must be five digits")])'
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/forms"
        components:
          - id: "root"
            component: "TextField"
            label: "Zip"
            value:
              path: "/zip"
            checks:
              - condition:
                  call: "regex"
                  args:
                    value:
                      path: "/zip"
                    pattern: "^[0-9]{5}$"
                message: "Must be five digits"

- name: test_compile_express_event_action
  description: An Event compiles to the action shape the catalog declares.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label, Event("submit"))
    label = Text("Submit")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              event:
                name: "submit"
          - id: "label"
            component: "Text"
            text: "Submit"

- name: test_compile_express_event_action_with_context
  description: A map passed to an Event becomes the context beside the event name.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    root = Button(label, Event("submit", {itemId: "42"}))
    label = Text("Submit")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Button"
            child: "label"
            action:
              event:
                name: "submit"
                context:
                  itemId: "42"
          - id: "label"
            component: "Text"
            text: "Submit"

- name: test_compile_express_data_model_assignment
  description: A data path assignment beside a root fills the surface's initial data model.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    $/title = "Hello"
    root = Text($/title)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "default_surface"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              path: "/title"
        dataModel:
          title: "Hello"

- name: test_compile_express_data_model_only_block
  description: A block of nothing but data path assignments updates the data model rather than creating a surface.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    $/icon = "check"
    $/title = "Enable notifications"
  expect:
    - version: "v1.0"
      updateDataModel:
        surfaceId: "default_surface"
        path: "/"
        value:
          icon: "check"
          title: "Enable notifications"

- name: test_compile_express_surface_targeting
  description: A surface line names the surface the block is for, in place of the default id.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    surface("dashboard")
    root = Text("Hello")
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "dashboard"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text: "Hello"

- name: test_compile_express_surface_targeting_names_a_catalog
  description: A second argument to surface picks which of the active catalogs the block is written against.
  action: compile_payload
  args:
    format: express
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |-
    surface("dashboard", "conformance/custom")
    root = Gauge(0.5)
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "dashboard"
        catalogId: "conformance/custom"
        components:
          - id: "root"
            component: "Gauge"
            value: 0.5

- name: test_compile_express_delete_surface
  description: A deleteSurface line compiles to the lifecycle message of that name.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'deleteSurface("dashboard")'
  expect:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "dashboard"

- name: test_compile_express_empty_block_is_a_parse_error
  description: A block with no statements is a parse error rather than an empty message list.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: ""
  expect_error:
    category: "ParseError"

- name: test_compile_express_syntax_error_is_a_parse_error
  description: A statement the grammar cannot read is a parse error.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello"'
  expect_error:
    category: "ParseError"

- name: test_compile_express_unknown_component_is_a_validation_error
  description: A block that parses but names a component the catalog does not declare is a validation error.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: "root = Sparkline([1, 2, 3])"
  expect_error:
    category: "ValidationError"

- name: test_compile_express_undeclared_property_is_a_validation_error
  description: A keyword argument naming a property the component does not declare is a validation error.
  action: compile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: 'root = Text("Hello", tooltip="Greeting")'
  expect_error:
    category: "ValidationError"

# --- Writing messages back out ---

- name: test_decompile_express_components
  description: A createSurface writes back out as the surface line and the component assignments it came from.
  action: decompile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Card"
            child: "body"
          - id: "body"
            component: "Text"
            text: "Hello"
  expect_contains:
    - 'surface("s1")'
    - "root = Card(body)"
    - 'body = Text("Hello")'
  expect_round_trip: true

- name: test_decompile_express_data_model
  description: An initial data model writes back out as the data path assignments that would produce it.
  action: decompile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              path: "/title"
        dataModel:
          title: "Hello"
  expect_contains:
    - '$/title = "Hello"'
    - "root = Text($/title)"
  expect_round_trip: true

- name: test_decompile_express_update_components
  description: An updateComponents writes back out as the component assignments it came from, and a block naming no root is an update to a surface that already exists rather than a create.
  action: decompile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      updateComponents:
        surfaceId: "s1"
        components:
          - id: "greeting"
            component: "Text"
            text: "Hello"
  expect_contains:
    - 'surface("s1")'
    - 'greeting = Text("Hello")'
  expect_round_trip: true

- name: test_decompile_express_update_data_model
  description: A standalone data model update writes back out as the data path assignment that would produce it, with no component assignment beside it to make the block a create.
  action: decompile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      updateDataModel:
        surfaceId: "s1"
        path: "/"
        value:
          title: "Hello"
  expect_contains:
    - 'surface("s1")'
    - '$/title = "Hello"'
  expect_round_trip: true

- name: test_decompile_express_delete_surface
  description: A deleteSurface writes back out as the statement of that name, which is what lets a lifecycle turn be shown to a model as an example.
  action: decompile_payload
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      deleteSurface:
        surfaceId: "s1"
  expect_contains:
    - 'deleteSurface("s1")'
  expect_round_trip: true

# --- Parsing a whole response ---

- name: test_parse_response_express_two_blocks
  description: Two Express blocks in one response compile separately and keep their place against the text.
  action: parse_response
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    First the greeting.
    <a2ui>
    surface("s1")
    root = Text("Hello")
    </a2ui>
    Then I take it away.
    <a2ui>
    deleteSurface("s1")
    </a2ui>
  expect:
    - text: "First the greeting."
    - a2ui:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "conformance/simplified"
            components:
              - id: "root"
                component: "Text"
                text: "Hello"
    - text: "Then I take it away."
    - a2ui:
        - version: "v1.0"
          deleteSurface:
            surfaceId: "s1"

- name: test_parse_response_express_unwrapped_compiles_the_whole_body
  description: An unwrapped Express response is compiled whole.
  action: parse_response
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    wrapped: false
  input: 'root = Text("Hello")'
  expect:
    - a2ui:
        - version: "v1.0"
          createSurface:
            surfaceId: "default_surface"
            catalogId: "conformance/simplified"
            components:
              - id: "root"
                component: "Text"
                text: "Hello"

- name: test_parse_response_express_validation_failure_surfaces
  description: An Express block naming a component the catalog does not declare fails the parse as a validation error.
  action: parse_response
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |-
    <a2ui>
    root = Sparkline([1, 2, 3])
    </a2ui>
  expect_error:
    category: "ValidationError"
