# Streaming an Express response: what an Express parser emits as chunks arrive.
#
# A case feeds one response to `open_stream()` in chunks. Each step states the
# parts that chunk yields as a delta since the previous chunk. An empty list
# means the parser is buffering until a statement boundary, root declaration, or
# closing tag arrives.
#
# Key rules tested by this suite:
# 1. Text outside `<a2ui>...</a2ui>` blocks streams immediately, holding back
#    trailing whitespace, edge backticks, and any tail that could be the prefix
#    of an `<a2ui>` sentinel tag.
# 2. When an entire `<a2ui>...</a2ui>` block opens and closes in a single
#    `feed()` call (or when pre-`root` statements are buffered until the final
#    chunk), the parser emits a single v1.0 `createSurface` message containing
#    both `components` and `dataModel`, matching single-shot `parse_response`.
# 3. For a new surface (`update != true` and not yet in `RendererState`),
#    statements before `root = ...` (`$/path = ...` and bottom-up child
#    variables) are held until `root = ...` arrives, then flushed together with
#    `root` in `createSurface`. Subsequent chunks emit delta `updateComponents`
#    and per-path `updateDataModel` messages.
# 4. Forward component ID references in `ComponentId` and `ChildList` slots are
#    emitted immediately using the variable name as the provisional ID, and
#    re-emitted if the child later declares an explicit `id="..."`.
# 5. Components that reference an undefined value variable (`Event`, function
#    call, `_template`, check, map, or literal) are held until that variable is
#    defined.
# 6. When `progressive_keys` is non-empty (defaulting to `["text"]`), a trailing
#    incomplete string literal inside a matching component argument, or a data
#    path assignment whose last segment is a matching key, is healed on a
#    scratch copy and emitted progressively.
# 7. At `</a2ui>`, any remaining undefined variable or broken topology raises
#    `ValidationError`.

# --- 1. Text and sentinel tags across chunk boundaries ---

- name: test_express_stream_text_and_single_chunk_block
  description: Conversational text streams as it arrives and a whole block in one chunk matches single-shot parsing.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
  steps:
    - input: "Here is the "
      expect:
        - text: "Here is the"
    - input: "greeting.\n"
      expect:
        - text: " greeting."
    - input: "<a2ui>surface(\"s1\")\nroot = Text(\"Hello\")</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello"
    - input: "\nAll done."
      expect:
        - text: "All done."
  expect_matches_single_shot: true

- name: test_express_stream_split_open_and_close_sentinel_tags
  description: Split `<a2ui>` and `</a2ui>` tags are held across chunk boundaries and never leak into text parts.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "Preparing surface.\n<a2"
      expect:
        - text: "Preparing surface."
    - input: "ui>\nsurface(\"s1\")\nroot = Text(\"Ready\")\n</a2"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Ready"
    - input: "ui>\nFinished."
      expect:
        - text: "Finished."
  expect_matches_single_shot: true

- name: test_express_stream_outer_markdown_fences_around_block
  description: Markdown code fences and inline backticks placed outside `<a2ui>` and `</a2ui>` tags are held and stripped across chunk boundaries, while prose code blocks are kept.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "Run:\n```sh\nls\n```\nAnd UI:\n```"
      expect:
        - text: "Run:\n```sh\nls\n```\nAnd UI:"
    - input: "a2ui\n<a2ui>\nsurface(\"s1\")\nroot = Text(\"Hello\")\n</a2ui>\n`"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello"
    - input: "``\nDone."
      expect:
        - text: "Done."
  expect_matches_single_shot: true

# --- 2. Top-down component and data model streaming across chunks ---

- name: test_express_stream_top_down_components_across_chunks
  description: Top-down statements emit createSurface once root is seen and delta updateComponents for children in later chunks.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\n$/title = \"Menu\"\nroot = Card(col)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "col"
                dataModel:
                  title: "Menu"
    - input: "col = Column([item1])\n"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "col"
                    component: "Column"
                    children: ["item1"]
    - input: "item1 = Text($/title)\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "item1"
                    component: "Text"
                    text:
                      "@path": "/title"

- name: test_express_stream_post_root_data_model_emits_per_path_deltas
  description: Data path assignments arriving in chunks after createSurface emit per-path updateDataModel messages.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text($/title)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text:
                      "@path": "/title"
    - input: "$/title = \"Welcome\"\n"
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: "s1"
                path: "/title"
                value: "Welcome"
    - input: "</a2ui>"
      expect: []

# --- 3. Pre-root gating on new surfaces ---

- name: test_express_stream_pre_root_statements_held_until_root
  description: On a new surface, data model assignments and bottom-up child definitions before root are held and flushed with root in createSurface.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\n$/title = \"Menu\"\n"
      expect: []
    - input: "body = Text($/title)\n"
      expect: []
    - input: "root = Card(body)\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "body"
                    component: "Text"
                    text:
                      "@path": "/title"
                  - id: "root"
                    component: "Card"
                    child: "body"
                dataModel:
                  title: "Menu"
  expect_matches_single_shot: true

# --- 4. Progressive string healing (progressive_keys) ---

- name: test_express_stream_progressive_text_healing_positional
  description: An unclosed positional text string on Text is healed while streaming and updated when the string closes.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: ["text"]
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Hello "
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello "
    - input: "world\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello world"

- name: test_express_stream_progressive_keys_disabled_waits_for_statement_close
  description: When progressive_keys is empty, an unclosed Text string waits until the statement finishes.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Hello "
      expect: []
    - input: "world\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello world"
  expect_matches_single_shot: true

- name: test_express_stream_progressive_data_path_healing
  description: An unclosed string in a post-root data path assignment heals progressively when the path's last segment is in progressive_keys.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: ["text"]
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text($/text)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text:
                      "@path": "/text"
    - input: '$/text = "Good '
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: "s1"
                path: "/text"
                value: "Good "
    - input: "morning\"\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: "s1"
                path: "/text"
                value: "Good morning"

- name: test_express_stream_data_path_outside_progressive_keys_waits
  description: An unclosed string in a data path assignment whose last segment is not in progressive_keys waits until the string closes.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: ["text"]
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text($/status)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
