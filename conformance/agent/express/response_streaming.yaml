# --- 5. Forward value variable holdback ---

- name: test_express_stream_forward_value_variable_held_until_defined
  description: A component referencing an undefined Event variable waits until that variable is defined before emitting.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Button(Text(\"Save\"), action=save_evt)\n"
      expect: []
    - input: "save_evt = Event(\"save\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Button"
                    child: "root_child"
                    action:
                      event:
                        name: "save"
                  - id: "root_child"
                    component: "Text"
                    text: "Save"
  expect_matches_single_shot: true

# --- 6. Forward component with explicit id="..." override ---

- name: test_express_stream_forward_component_explicit_id_re_emits_parent
  description: When a forward-referenced child later declares an explicit id, both the child and the updated parent are emitted in the delta.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Card(hdr)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "hdr"
    - input: "hdr = Text(\"Header\", id=\"custom_hdr\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "root"
                    component: "Card"
                    child: "custom_hdr"
                  - id: "custom_hdr"
                    component: "Text"
                    text: "Header"

# --- 7. Updating existing surfaces and deleteSurface ---

- name: test_express_stream_update_existing_surface_and_delete_surface
  description: Updating an already-created surface streams updateDataModel and updateComponents without waiting for root, followed by deleteSurface.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Card(body)\nbody = Text($/msg)\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "body"
                  - id: "body"
                    component: "Text"
                    text:
                      "@path": "/msg"
    - input: "<a2ui>\nsurface(\"s1\", update=true)\n$/msg = \"Updated\"\n"
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: "s1"
                path: "/msg"
                value: "Updated"
    - input: "body = Text(\"Replaced\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "body"
                    component: "Text"
                    text: "Replaced"
    - input: "<a2ui>\ndeleteSurface(\"s1\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              deleteSurface:
                surfaceId: "s1"

- name: test_express_stream_delete_and_recreate_surface_in_same_block
  description: Deleting an existing surface and recreating the same surface ID in later chunks of the same block emits deleteSurface followed by createSurface.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"First\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "First"
    - input: "<a2ui>\ndeleteSurface(\"s1\")\n"
      expect:
        - a2ui:
            - version: "1.0"
              deleteSurface:
                surfaceId: "s1"
    - input: "surface(\"s1\")\nroot = Text(\"Second\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Second"

- name: test_express_stream_comment_with_apostrophe_before_close_tag
  description: A single-line comment with an apostrophe or quote before the closing tag does not swallow the closing tag.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\n# user's \"card\nroot = Text(\"Hello\")\n</a2ui>\nDone."
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hello"
        - text: "Done."
  expect_matches_single_shot: true

# --- 8. Error and cut-off handling ---

- name: test_express_stream_dangling_forward_component_raises_validation_error_on_close
  description: A forward component reference that is never defined raises a ValidationError when the block closes.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Card(missing_child)\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "missing_child"
    - input: "</a2ui>"
      expect_error:
        category: "ValidationError"

- name: test_express_stream_dangling_value_variable_raises_validation_error_on_close
  description: A value variable reference that is never defined is held during streaming and raises a ValidationError when the block closes.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(missing_var)\n"
      expect: []
    - input: "</a2ui>"
      expect_error:
        category: "ValidationError"

- name: test_express_stream_unknown_component_raises_validation_error
  description: Calling a component that is not in the catalog raises a ValidationError on the chunk that completes the statement.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = UnknownWidget(\"Hello\")\n"
      expect_error:
        category: "ValidationError"

- name: test_express_stream_cutoff_block_raises_parse_error_on_close
  description: A stream cut off inside an open block after emitting completed statements raises a ParseError when closed.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Complete\")\nextra = Text(\"Cut off"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Complete"
  expect_error:
    category: "ParseError"

# --- 9. Partial results, reading past rejected blocks, and isInBlock ---
#
# These cases follow the Direct JSON suite's `expect_partial_results`,
# `after_rejected_block` and `expect_in_block` keys. An SDK that does not
# implement them yet skips these cases, as it skips the Direct JSON ones.

- name: test_express_stream_error_carries_the_text_before_the_failing_block
  description: A chunk that fails on a block returns the text before the block in the error's partial results.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "Before <a2ui>\nroot = (\n</a2ui>"
      expect_error:
        category: "ParseError"
      expect_partial_results:
        - text: "Before"
      expect_in_block: false

- name: test_express_stream_continue_returns_an_error_part_for_an_unreadable_block
  description: Reading past rejected blocks, a block that cannot be compiled becomes an error part, and the text after it is read as usual.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
    after_rejected_block: continue
  steps:
    - input: "Before <a2ui>\nroot = (\n</a2ui> after"
      expect:
        - text: "Before"
        - error:
            category: "ParseError"
        - text: "after"
  expect_close: []

- name: test_express_stream_continue_keeps_the_messages_emitted_before_the_rejection
  description: Reading past rejected blocks, the messages a block emitted before it was rejected stay applied, the rest of the block is skipped, and the next block is read.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
    after_rejected_block: continue
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Kept\")\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Kept"
      expect_in_block: true
    - input: "extra = UnknownWidget(\"x\")\n"
      expect:
        - error:
            category: "ValidationError"
      expect_in_block: true
    - input: "more = Text(\"skipped\")\n</a2ui>\n<a2ui>\nsurface(\"s1\", update=true)\n$/title = \"Next\"\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateDataModel:
                surfaceId: "s1"
                path: "/title"
                value: "Next"
      expect_in_block: false
  expect_close: []

- name: test_express_stream_continue_returns_an_error_part_for_a_block_still_open_at_the_end
  description: Reading past rejected blocks, a block still open when the stream closes becomes an error part instead of raising.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
    after_rejected_block: continue
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Open\")\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Open"
  expect_close:
    - error:
        category: "ParseError"

- name: test_express_stream_in_block_from_the_open_tag_to_the_close_tag
  description: The response ends inside a block from its opening tag to its closing tag, and not while an opening tag is still arriving.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "Text <a2"
      expect:
        - text: "Text"
      expect_in_block: false
    - input: "ui>\n"
      expect: []
      expect_in_block: true
    - input: "surface(\"s1\")\nroot = Text(\"Hi\")\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Hi"
      expect_in_block: true
    - input: "</a2ui> after"
      expect:
        - text: "after"
      expect_in_block: false

# --- 10. Regression cases for edge conditions ---

- name: test_express_stream_progressive_heal_followed_by_explicit_id_override
  description: When a progressively healed component later finishes with an explicit id="...", the provisional variable-named component is superseded and topology validation succeeds at block close.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: ["text"]
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Card(hdr)\nhdr = Text(\"Head"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "hdr"
                  - id: "hdr"
                    component: "Text"
                    text: "Head"
    - input: "er\", id=\"custom_hdr\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "root"
                    component: "Card"
                    child: "custom_hdr"
                  - id: "custom_hdr"
                    component: "Text"
                    text: "Header"

- name: test_express_stream_syntax_error_on_completed_statement_before_close_tag
  description: A syntax error in a statement whose brackets and newline have closed is reported on that chunk rather than deferred until </a2ui>.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"ok\")\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "ok"
    - input: "broken = = Text(\"bad\")\n"
      expect_error:
        category: "ParseError"

- name: test_express_stream_triple_quoted_string_split_after_two_quotes
  description: A chunk boundary right after two opening quotes holds the statement until the next chunk reveals whether it is an empty string or a triple-quoted string.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"\""
      expect: []
    - input: "\"Line 1\nLine 2\"\"\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Line 1\nLine 2"
  expect_matches_single_shot: true

- name: test_express_stream_update_existing_default_surface_without_surface_directive
  description: Updating an existing default_surface in a later block without a surface() directive streams updateComponents rather than raising an undefined root error.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nroot = Card(body)\nbody = Text(\"Initial\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "default_surface"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Card"
                    child: "body"
                  - id: "body"
                    component: "Text"
                    text: "Initial"
    - input: "<a2ui>\nbody = Text(\"Updated\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "default_surface"
                components:
                  - id: "body"
                    component: "Text"
                    text: "Updated"

- name: test_express_stream_recreate_existing_surface_without_update_is_rejected
  description: A later block that defines root on an already-created surface without update=true attempts createSurface and is rejected with ValidationError.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"First\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "First"
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(\"Second\")\n</a2ui>"
      expect_error:
        category: "ValidationError"

- name: test_express_stream_close_tag_inside_string_and_block_comment
  description: A closing </a2ui> tag inside a string literal or block comment does not terminate the block early or strip the literal content.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\n/* comment with </a2ui> inside */\nroot = Text(\"Literal </a2ui> tag\")\n</a2ui>\nDone."
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Literal </a2ui> tag"
        - text: "Done."

- name: test_express_stream_raw_string_ending_in_backslash_before_close_tag
  description: A raw string literal ending in a backslash does not escape its closing quote or swallow the closing </a2ui> tag.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Text(r\"C:\\path\\\")\n</a2ui>\nAfter"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "C:\\path\\"
        - text: "After"

- name: test_express_stream_inner_markdown_fences_and_inline_code_after_close_tag
  description: Markdown code fences inside <a2ui> are stripped while inline code backticks in prose after </a2ui> are preserved when <a2ui> was not opened with inline backticks.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\n```express\nsurface(\"s1\")\nroot = Text(\"Fenced\")\n```\n</a2ui> `code` after"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Text"
                    text: "Fenced"
        - text: "`code` after"

- name: test_express_stream_nested_child_slot_in_tabs_streams_top_down
  description: A forward component reference inside a nested Child slot (such as Tabs tabItems[].child) is emitted immediately on the parent and resolved when the child arrives.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/list_item_action_catalog_v1_0.json"
    progressive_keys: []
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Tabs([{title: \"Tab 1\", child: panel1}])\n"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/list_item_action"
                components:
                  - id: "root"
                    component: "Tabs"
                    tabItems:
                      - title: "Tab 1"
                        child: "panel1"
    - input: "panel1 = Text(\"Content\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "panel1"
                    component: "Text"
                    text: "Content"

- name: test_express_stream_update_surface_heals_reassigned_custom_id_without_dropping_baseline
  description: Healing a progressive string on an update=true block for a variable name that already existed on the surface restores the baseline component in RendererState when a custom id kwarg arrives.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys:
      - "text"
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Column([hdr, body])\nhdr = Text(\"Header\")\nbody = Text(\"Initial\")\n</a2ui>"
      expect:
        - a2ui:
