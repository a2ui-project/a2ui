                    children:
                      - "hdr"
                      - "body"
                  - id: "hdr"
                    component: "Text"
                    text: "Header"
                  - id: "body"
                    component: "Text"
                    text: "Initial"
    - input: "<a2ui>\nsurface(\"s1\", update=true)\nhdr = Text(\"Upd"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "hdr"
                    component: "Text"
                    text: "Upd"
    - input: "ated\", id=\"body\")\n</a2ui>"
      expect:
        - a2ui:
            - version: "1.0"
              updateComponents:
                surfaceId: "s1"
                components:
                  - id: "body"
                    component: "Text"
                    text: "Updated"

- name: test_express_stream_duplicate_component_id_across_variables_raises_validation_error
  description: A variable that resolves to a custom component ID colliding with another variable's component ID after progressive healing raises ValidationError.
  action: parse_chunk
  args:
    format: express
    catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
    progressive_keys:
      - "text"
  steps:
    - input: "<a2ui>\nsurface(\"s1\")\nroot = Column([b, a])\nb = Text(\"bbbb\")\na = Text(\"aaaa"
      expect:
        - a2ui:
            - version: "1.0"
              createSurface:
                surfaceId: "s1"
                catalogId: "conformance/simplified"
                components:
                  - id: "root"
                    component: "Column"
                    children:
                      - "b"
                      - "a"
                  - id: "b"
                    component: "Text"
                    text: "bbbb"
                  - id: "a"
                    component: "Text"
                    text: "aaaa"
    - input: " aaaa\", id=\"b\")\n</a2ui>"
      expect_error:
        category: "ValidationError"

- name: test_express_stream_cached_inline_component_id_collision_raises_validation_error
  description: A later variable whose name collides with a previously cached inline child component ID raises ValidationError instead of reusing the cached entry.
  action: parse_chunk
  args:
