# Behaviour of the catalog transformers described by
# `blueprints/modules/a2ui_agent.blueprint.md` section 3.A. Transformation is an
# agent concern: a renderer implements the whole catalog it advertises, while an
# agent narrows one before prompting. The `prune` cases in
# `conformance/core/catalog.yaml` predate that split and stay where the SDKs
# already read them from.
#
# The `$defs/anyComponent` and `$defs/anyFunction` unions of a catalog document
# must be narrowed alongside the entries they reference, otherwise a pruned
# catalog still advertises components the agent may not emit. The ref shapes
# here match `specification/v0_9_1/catalogs/basic/catalog.json`.

- name: test_prune_components_narrows_any_component_union
  description: Pruning components narrows the anyComponent union to the kept components.
  catalog:
    version: "0.9"
    catalog_schema:
      catalogId: "https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json"
      components:
        Text: {type: object}
        Card: {type: object}
        Button: {type: object}
        Video: {type: object}
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Card"
            - $ref: "#/components/Button"
            - $ref: "#/components/Video"
  action: prune
  args:
    allowed_components: [Text, Card, Button]
  expect:
    catalog_schema:
      catalogId: "https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json"
      components:
        Text: {type: object}
        Card: {type: object}
        Button: {type: object}
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Card"
            - $ref: "#/components/Button"

- name: test_prune_unknown_component_names_are_ignored
  description: Allowlist entries the catalog does not declare are ignored, not errors.
  catalog:
    version: "0.9"
    catalog_schema:
      catalogId: basic
      components:
        Text: {type: object}
        Card: {type: object}
  action: prune
  args:
    allowed_components: [Text, NotInCatalog]
  expect:
    catalog_schema:
      catalogId: basic
      components:
        Text: {type: object}
