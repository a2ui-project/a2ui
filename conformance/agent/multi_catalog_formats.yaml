- name: test_elemental_decompile_mixed_catalog_components_and_functions
  description: Decompiling a multi-catalog surface where each component and function name is unique across the active catalogs into Elemental HTML omits redundant catalog-id attributes and round-trips cleanly.
  action: decompile
  args:
    format: elemental
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
