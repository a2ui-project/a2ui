- name: test_atom_prompt_snippet_multi_catalogs_and_examples
  description: Atom prompt generation with multiple catalogs and pruning renders S-expression signatures for each catalog and decompiles multi-catalog examples into Atom notation.
  action: generate_prompt_snippet
  args:
