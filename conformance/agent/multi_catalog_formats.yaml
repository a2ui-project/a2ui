- name: test_elemental_prompt_snippet_multi_catalogs_and_examples
  description: Elemental prompt generation with multiple catalogs and pruning renders TypeScript declarations for each catalog and decompiles multi-catalog examples into Elemental HTML.
  action: generate_prompt_snippet
  args:
    format: elemental
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Text", "Column"]
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
        transformers:
          - component_pruning: ["Chart"]
    examples:
      - "test_data/examples/greeting_surface.json"
      - "test_data/examples/chart_series.json"
  expect_contains:
    - "conformance/simplified"
    - "conformance/custom"
    - "ui-text"
    - "ui-chart"
    - '<ui-chart id="root" values="{[1, 2, 3]}" />'
  expect_absent:
    - "ui-button"
    - "ui-gauge"
    - '<link rel="catalog" href="conformance/custom">'

- name: test_elemental_create_format_binds_multi_catalogs
  description: Creating an Elemental format with multiple catalogs binds both catalogs to its prompt generator and creates distinct parsers.
  action: create_format
  args:
    format: elemental
    catalogs:
      - catalog: "test_data/catalogs/simplified_catalog_v1_0.json"
      - catalog: "test_data/catalogs/custom_catalog_v1_0.json"
  expect:
    parsers_are_distinct: true
    prompt_snippet_contains:
      - "conformance/simplified"
      - "conformance/custom"
      - "ui-text"
      - "ui-chart"

# =============================================================================
# 3. Atom Format: Mixed-Catalog Compilation, Decompilation, Parsing & Prompts
# =============================================================================

- name: test_atom_compile_surface_and_component_catalog_override
  description: With multiple active catalogs, an Atom S-expression surface omits catalogId on createSurface while each component resolves its catalog by name or explicit :catalogId attribute and carries catalogId in the compiled output.
  action: compile
  args:
    format: atom
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |
    (surface "s1")
    (Column :id "root"
      (Text :id "title" :text "Quarterly Revenue")
      (Chart :id "chart" :catalogId "conformance/custom" :values [10 20 30] :caption "Q1-Q3"))
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            catalogId: "conformance/simplified"
            children: ["title", "chart"]
