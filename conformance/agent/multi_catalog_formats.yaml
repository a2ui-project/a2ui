- name: test_atom_decompile_mixed_catalog_components_and_functions
  description: Decompiling a multi-catalog surface where each component and function name is unique across the active catalogs into Atom S-expressions omits redundant :catalogId attributes.
  action: decompile
  args:
    format: atom
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            catalogId: "conformance/simplified"
            children: ["title", "chart"]
          - id: "title"
            component: "Text"
            catalogId: "conformance/simplified"
            text: "Metrics"
          - id: "chart"
            component: "Chart"
            catalogId: "conformance/custom"
            values: [10, 20]
            caption:
              "@call": "formatString"
              catalogId: "conformance/simplified"
              args:
                value: "Total"
  expect_contains:
    - '(surface "s1")'
    - '(Chart :id "chart" :values [10 20] :caption (formatString :value "Total"))'
  expect_absent:
    - ':catalogId "conformance/simplified"'
    - ':catalogId "conformance/custom"'

- name: test_atom_decompile_omits_redundant_catalog_id
  description: Decompiling a component whose name is unique across active catalogs omits the redundant :catalogId attribute in Atom S-expressions.
  action: decompile
  args:
    format: atom
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Text"
            catalogId: "conformance/simplified"
            text: "Hello"
  expect_contains:
    - '(Text :text "Hello")'
  expect_absent:
    - ":catalogId"

- name: test_atom_decompile_function_catalog_differs_from_surface
  description: Decompiling a component whose name is defined in two active catalogs into Atom S-expressions keeps :catalogId on the component.
  action: decompile
  args:
    format: atom
    catalogs:
      - catalogId: "conformance/cat_a"
        protocolVersion: "v1.0"
        components:
          Badge:
            type: object
            properties:
              component: {const: "Badge"}
              label: {$ref: "common.json#/$defs/DynamicString"}
            required: ["component", "label"]
      - catalogId: "conformance/cat_b"
        protocolVersion: "v1.0"
        components:
          Badge:
            type: object
            properties:
              component: {const: "Badge"}
              count: {$ref: "common.json#/$defs/DynamicNumber"}
            required: ["component", "count"]
  messages:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Badge"
            catalogId: "conformance/cat_b"
            count: 42
  expect_contains:
    - '(surface "s1")'
    - '(Badge :catalogId "conformance/cat_b" :count 42)'

