# Multi-catalog and mixed-catalog conformance across inference formats.
#
# This suite verifies that compilers, decompilers, response parsers, prompt
# generators, and format factories resolve per-component and per-function
# `catalogId` overrides across active catalogs.

# =============================================================================
# Direct JSON Format: Per-Component & Per-Function catalogId Overrides
# =============================================================================

- name: test_direct_json_compile_single_catalog_create_surface_has_catalog_id
  description: With a single active catalog, createSurface defines catalogId and components and function calls omit redundant per-item catalogId fields.
  action: compile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
  input: |
    [
      {
        "version": "v1.0",
        "createSurface": {
          "surfaceId": "s1",
          "catalogId": "conformance/simplified",
          "components": [
            {
              "id": "root",
              "component": "Text",
              "text": {
                "@call": "formatString",
                "args": {
                  "value": "Quarterly Revenue"
                }
              }
            }
          ]
        }
      }
    ]
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Text"
            text:
              "@call": "formatString"
              args:
                value: "Quarterly Revenue"

- name: test_direct_json_compile_component_and_function_catalog_override
  description: With multiple active catalogs, createSurface omits catalogId and each component and function call validates against its per-item catalogId.
  action: compile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |
    [
      {
        "version": "v1.0",
        "createSurface": {
          "surfaceId": "s1",
          "components": [
            {
              "id": "root",
              "component": "Column",
              "catalogId": "conformance/simplified",
              "children": ["title", "chart", "gauge"]
            },
            {
              "id": "title",
              "component": "Text",
              "catalogId": "conformance/simplified",
              "text": {
                "@call": "formatString",
                "catalogId": "conformance/simplified",
                "args": {
                  "value": "Quarterly Revenue"
                }
              }
            },
            {
              "id": "chart",
              "component": "Chart",
              "catalogId": "conformance/custom",
              "values": [10, 20, 30],
              "caption": "Q1-Q3"
            },
            {
              "id": "gauge",
              "component": "Gauge",
              "catalogId": "conformance/custom",
              "value": 75
            }
          ]
        }
      }
    ]
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        components:
          - id: "root"
            component: "Column"
            catalogId: "conformance/simplified"
            children: ["title", "chart", "gauge"]
          - id: "title"
            component: "Text"
            catalogId: "conformance/simplified"
            text:
              "@call": "formatString"
              catalogId: "conformance/simplified"
              args:
                value: "Quarterly Revenue"
          - id: "chart"
            component: "Chart"
            catalogId: "conformance/custom"
            values: [10, 20, 30]
            caption: "Q1-Q3"
          - id: "gauge"
            component: "Gauge"
            catalogId: "conformance/custom"
            value: 75

- name: test_direct_json_compile_unknown_component_catalog_override_fails
  description: A direct JSON component whose catalogId override names an unregistered catalog fails validation.
  action: compile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |
    [
      {
        "version": "v1.0",
        "createSurface": {
          "surfaceId": "s1",
          "catalogId": "conformance/simplified",
          "components": [
            {
              "id": "root",
              "component": "Text",
              "catalogId": "conformance/unknown",
              "text": "Hello"
            }
          ]
        }
      }
    ]
  expect_error:
    category: ValidationError
