# 4. Direct JSON Format: Per-Component & Per-Function catalogId Overrides
# =============================================================================

- name: test_direct_json_compile_component_and_function_catalog_override
  description: Direct JSON messages with per-component and per-function catalogId overrides validate each component and function against its overridden catalog.
  action: compile
  args:
    format: direct_json
    catalogs:
      - "test_data/catalogs/simplified_catalog_v1_0.json"
      - "test_data/catalogs/custom_catalog_v1_0.json"
  input: |
    [
      {
        "version": "v1.0",
        "createSurface": {
          "surfaceId": "s1",
          "catalogId": "conformance/simplified",
          "components": [
            {
              "id": "root",
              "component": "Column",
              "children": ["title", "chart", "gauge"]
            },
            {
              "id": "title",
              "component": "Text",
              "text": {
                "@call": "formatString",
                "catalogId": "conformance/simplified",
                "args": {
                  "value": "Quarterly Revenue"
                }
              }
            },
            {
              "id": "chart",
              "component": "Chart",
              "catalogId": "conformance/custom",
              "values": [10, 20, 30],
              "caption": "Q1-Q3"
            },
            {
              "id": "gauge",
              "component": "Gauge",
              "catalogId": "conformance/custom",
              "value": 75
            }
          ]
        }
      }
    ]
  expect:
    - version: "v1.0"
      createSurface:
        surfaceId: "s1"
        catalogId: "conformance/simplified"
        components:
          - id: "root"
            component: "Column"
            children: ["title", "chart", "gauge"]
          - id: "title"
            component: "Text"
            text:
              "@call": "formatString"
              catalogId: "conformance/simplified"
              args:
                value: "Quarterly Revenue"
          - id: "chart"
            component: "Chart"
            catalogId: "conformance/custom"
            values: [10, 20, 30]
            caption: "Q1-Q3"
          - id: "gauge"
            component: "Gauge"
            catalogId: "conformance/custom"
            value: 75

- name: test_direct_json_compile_unknown_component_catalog_override_fails
