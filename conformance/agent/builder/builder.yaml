suite: a2ui_fluent_builder_conformance
version: v0.9
tests:
  - id: 01_primitive_components
    description: Primitive components with static attributes and strict enums
    golden: 01_primitive_components.json
    surface_id: conformance
    validation:
      allow_missing_root: true
      allow_orphan_components: true
    input:
      - component: Text
        id: header_text
        text: Welcome to A2UI
        variant: h1
      - component: Divider
        id: divider_0
        axis: horizontal
      - component: Text
        id: body_text
        text: This is a simple text component.
        variant: body
    features:
      - F-AGT-26
  - id: 02_nested_hierarchy_and_slots
    description: Nested component trees with single and multi-child slots
    golden: 02_nested_hierarchy_and_slots.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Card
      id: main_card
      child:
        component: Column
        id: main_col
        children:
          - component: Text
            id: title
            text: Dashboard
            variant: h2
          - component: Divider
            id: div_1
          - component: Row
            id: action_row
            children:
              - component: Icon
                id: save_icon
                name: check
              - component: Button
                id: btn_save
                variant: primary
                child:
                  component: Text
                  id: btn_save_text
                  text: Save Changes
                action:
                  $action:
                    event: save_changes
    features:
      - F-AGT-26
  - id: 03_automatic_id_allocation
    description: Scoped deterministic ID allocation and macro namespacing
    golden: 03_automatic_id_allocation.json
    surface_id: conformance
    root_id: panel
    validation:
      allow_missing_root: true
    input:
      component: Card
      child:
        component: Column
        children:
          - component: Text
            text: First Item
          - component: Text
            text: Second Item
  - id: 04_data_bindings
    description: Data bindings preserve relative and absolute paths exactly as written
    golden: 04_data_bindings.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Card
      id: profile_card
      child:
        component: Column
        id: profile_col
        children:
          - component: Text
            id: user_greeting
            text:
              $bind: user/displayName
            variant: h3
          - component: Text
            id: user_balance
            text:
              $bind: /account/balance
            variant: body
    features:
      - F-AGT-26
  - id: 05_accessibility_attributes
    description: Native serialization of AccessibilityAttributes
    golden: 05_accessibility_attributes.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Button
      id: accessible_button
      accessibility:
        $accessibility:
          label: Submit Application
          description: Transmits all form entries to the review server
      child:
        component: Text
        id: btn_label
        text: Submit
      action:
        $action:
          event: submit_application
  - id: 06_actions_and_function_calls
    description: Actions with server event context maps and client function calls
    golden: 06_actions_and_function_calls.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Column
      id: action_col
      children:
        - component: Button
          id: btn_checkout
          variant: primary
          child:
            component: Text
            id: txt_checkout
            text: Checkout
          action:
            $action:
              event:
                name: order_checkout
                context:
                  cartId: cart_99
                  userId:
                    $bind: /session/uid
                  total: 49.99
        - component: Button
          id: btn_help
          child:
            component: Text
            id: txt_help
            text: Help Center
          action:
            $action:
              functionCall:
                call: openUrl
                args:
                  url: https://a2ui.org/docs
    features:
      - F-AGT-26
  - id: 07_dynamic_child_list
    description: Collection templates keep item-relative bindings inside the child scope
    golden: 07_dynamic_child_list.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Column
      id: feed_container
      children:
        $dynamicChildList:
          path: /feed/posts
          template:
            component: Card
            id: post_card
            child:
              component: Text
              id: post_title
              text:
                $bind: title
    features:
      - F-AGT-26
  - id: 08_component_references
    description: External surface component slot references (ComponentRef)
    golden: 08_component_references.json
    surface_id: conformance
    validation:
      allow_missing_root: true
      allow_dangling_references: true
    input:
      component: Card
      id: outer_card
      child:
        component: Column
        id: inner_col
        children:
          - component: Text
            id: intro_text
            text: Header
          - $componentRef: existing_surface_widget
    features:
      - F-AGT-26
      - F-AGT-54
  - id: 09_surface_lifecycle_envelopes
    description: "Full surface lifecycle: createSurface, updateComponents, updateDataModel"
    golden: 09_surface_lifecycle_envelopes.json
    surface_id: main_surface
    catalog_id: https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json
    data_model:
      /session/user: Alice
    validation:
      allow_missing_root: true
    input:
      component: Card
      id: hero_card
      child:
        component: Text
        id: hero_txt
        text: A2UI
    features:
      - F-AGT-26
  - id: 10_validation_rules
    description: Client-side validation rules (CheckRule) on a checkable component
    golden: 10_validation_rules.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: TextField
      id: zip_field
      label: ZIP code
      value:
        $bind: /user/zip
      checks:
        - $checkRule:
            condition:
              call: regex
              args:
                value:
                  $bind: /user/zip
                pattern: ^[0-9]{5}$
            message: ZIP code must be 5 digits
    features:
      - F-AGT-26
  - id: 11_nested_collection_templates
    description: Two-level templates address the inner list relative to the outer item
      scope
    golden: 11_nested_collection_templates.json
    surface_id: conformance
    validation:
      allow_missing_root: true
    input:
      component: Column
      id: org_chart
      children:
        $dynamicChildList:
          path: /departments
          template:
            component: Column
            id: department_block
            children:
              $dynamicChildList:
                path: employees
                template:
                  component: Text
                  id: employee_name
                  text:
                    $bind: name
