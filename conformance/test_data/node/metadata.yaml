catalog: ../catalogs/basic/v1/catalog.json
data: {name: Ada}
components:
  - id: root
    component: Card
    child: button
    metadata: {extensions: {com_example_policy: restricted}}
  - id: button
    component: Button
    child: label
    action:
      event:
        name: save
        context: {name: {'@path': /name}}
    metadata: {extensions: {com_example_trace: t1}}
  - {id: label, component: Text, text: Save}
