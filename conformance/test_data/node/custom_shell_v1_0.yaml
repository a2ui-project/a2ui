catalog: test_data/catalogs/custom_shell_catalog_v1_0.json
data:
  heading: Overview
  secTitle: Details
  rows:
    - label: First
    - label: Second
components:
  - id: root
    component: CustomShell
    title:
      "@path": /heading
    header:
      "@child": hdr
    items:
      "@child": rowTpl
      "@path": /rows
    sections:
      - title:
          "@path": /secTitle
        body:
          "@child": secBody
    onSave:
      "@action":
        name: saved
        context:
          v:
            "@path": /heading
    onOpen:
      "@functionCall":
        "@call": openUrl
        args:
          url: "https://example.test"
    meta:
      "@@child": not_a_node
      "@@action": literal
  - id: hdr
    component: Text
    text: Header Text
  - id: rowTpl
    component: Text
    text:
      "@path": label
  - id: secBody
    component: Text
    text: Section Body
