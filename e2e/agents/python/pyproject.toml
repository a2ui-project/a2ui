[project]
name = "a2ui-e2e-agent"
version = "0.1.0"
description = "Scripted A2UI test agent that replays conformance/e2e scenarios over A2A, for the live-pair end-to-end tests."
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "a2a-sdk[http-server]>=0.3.0",
  "a2ui-a2a",
  "a2ui-adk[a2a]",
  "a2ui-agent-sdk",
  "click>=8.1.8",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "uvicorn>=0.40.0",
]

[project.scripts]
a2ui-e2e-agent = "a2ui_e2e_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui_e2e_agent"]

[tool.uv.sources]
a2ui-a2a = { workspace = true }
a2ui-adk = { workspace = true }
a2ui-agent-sdk = { workspace = true }
