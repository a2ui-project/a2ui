[project]
name = "a2ui-workspace"
version = "0.1.0"
description = "A2UI Python Workspace Root"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "conformance",
  "python/a2ui_a2a",
  "python/a2ui_adk",
  "python/a2ui_agent",
  "python/a2ui_core",
  "eval",
  "samples/agent/adk/custom-components-example",
  "samples/agent/adk/restaurant_finder",
  "samples/community/agent/adk/gemini_enterprise/agent_engine",
  "samples/community/agent/adk/gemini_enterprise/cloud_run",
  "samples/community/agent/adk/mcp-apps-in-a2ui-sample",
  "samples/community/agent/adk/mcp_app_proxy",
  "samples/community/agent/adk/file_upload_summarizer",
  "samples/community/agent/adk/orchestrator",
  "samples/community/agent/adk/personalized_learning",
  "samples/community/agent/adk/rizzcharts/python",
  "samples/community/mcp/a2ui-in-mcpapps/server",
  "samples/community/mcp/a2ui-over-mcp-recipe",
  "samples/community/mcp/mcp-apps-calculator",
  "samples/community/macros",
  "python/catalogs/mcp",
  "tools/build_catalog",
]

[dependency-groups]
dev = [
    "pyink>=25.12.0",
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "types-jsonschema>=4.26.0",
    "types-PyYAML>=6.0.12.20241221",
    "types-regex>=2024.11.6",
    "pytest-asyncio>=1.3.0",
]
release = [
    "hatch>=1.14.0",
    "twine>=7.0.0",
    "keyring>=25.6.0",
    "keyrings.google-artifactregistry-auth>=1.1.2",
]

[tool.pytest.ini_options]
testpaths = [
    "conformance/tests",
    "python/a2ui_a2a/tests",
    "python/a2ui_adk/tests",
    "python/a2ui_agent/tests",
    "python/a2ui_core/tests",
    "eval/tests",
    "samples/agent/adk/tests",
    "samples/community/agent/adk/personalized_learning/tests",
    "samples/community/mcp/a2ui-over-mcp-recipe/tests",
]
norecursedirs = [
    ".*",
    "docs",
    "typescript",
    "specification",
    "node_modules",
    ".venv",
]
# Timing tests are deselected here; `uv run pytest -m performance` runs only
# them. See python/a2ui_core/tests/timing_harness.py.
addopts = "--import-mode=importlib -m 'not performance'"
markers = [
    "performance: times an operation; run apart from the other tests with `-m performance`",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
a2ui-core = { workspace = true }
a2ui-agent-sdk = { workspace = true }
a2ui-a2a = { workspace = true }
a2ui-adk = { workspace = true }

[tool.pyink]
unstable = true
target-version = []
pyink-indentation = 4
pyink-use-majority-quotes = true
extend-exclude = '''(?x)(
  /generated/
  | python/a2ui_agent/src/a2ui/builder/v0_9/catalogs/
  | python/a2ui_agent/src/a2ui/builder/v1_0/catalogs/
)'''
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]


[tool.mypy]
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "python/a2ui_core/src:python/a2ui_agent/src:python/a2ui_a2a/src:python/a2ui_adk/src:blueprints:eval:eval/bin"
exclude = [
    "^python/a2ui_core/tests/",
    "^python/a2ui_agent/tests/",
    "^python/a2ui_a2a/tests/",
    "^python/a2ui_adk/tests/",
    "^conformance/tests/",
    "^eval/",
    # TODO(#1614): Typecheck all packages here.
    "^python/a2ui_agent/src/a2ui/inference_formats/experimental/",
    "^python/a2ui_agent/src/a2ui/inference_formats/express/generated/",
    "^samples/",
    "^tools/",
    "^docs/",
    "^scripts/",
    "^specification/",
    "^blueprints/",
    "^hooks\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "a2ui.inference_formats.express.generated.*",
    "antlr4.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "a2ui.builder.v1_0.catalogs.*",
]
disable_error_code = ["call-arg"]
