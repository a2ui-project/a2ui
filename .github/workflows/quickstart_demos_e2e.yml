name: Quickstart Demos E2E

on:
  pull_request:
    paths:
      - "samples/**"
      - "renderers/**"
      - "agent_sdks/**"
      - "scripts/test_demos.sh"
      - ".github/workflows/quickstart_demos_e2e.yml"
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*.*.*"
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      demo_target:
        description: "Target demo to verify (lit, react, angular, flutter, all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lit
          - react
          - angular
          - flutter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-demos:
    name: Quickstart E2E (${{ matrix.demo }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        demo: [lit, react, angular, flutter]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install Python Agent Dependencies
        run: |
          cd samples/agent/adk/restaurant_finder
          uv sync

      - name: Setup Node.js (Web Demos)
        if: matrix.demo != 'flutter'
        uses: ./.github/actions/setup-node

      - name: Setup Flutter & Dart
        if: matrix.demo == 'flutter'
        uses: ./.github/actions/setup-dart
        with:
          channel: stable

      - name: Run Demo Verification
        env:
          GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: |
          chmod +x ./scripts/test_demos.sh
          # If triggered manually with a specific single demo, only run that matrix demo
          TARGET_DEMO="${{ inputs.demo_target }}"
          if [ -n "$TARGET_DEMO" ] && [ "$TARGET_DEMO" != "all" ] && [ "$TARGET_DEMO" != "${{ matrix.demo }}" ]; then
            echo "Skipping ${{ matrix.demo }} (target was $TARGET_DEMO)"
            exit 0
          fi

          ./scripts/test_demos.sh "" "${{ matrix.demo }}"
