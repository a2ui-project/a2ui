# This workflow is used to check that CHANGELOG.md is properly updated,
# and the version in it is in agreement with pubspec.yaml.
# https://github.com/dart-lang/ecosystem/tree/main/pkgs/firehose#integrating-this-tool-into-a-repo
name: Pub Health
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  health:
    # Ignored because dart-lang ecosystem reusable workflows are designed to run from @main.
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@main # zizmor: ignore[unpinned-uses]
    with:
      checks: "version, changelog"
      fail_on: "version, changelog"
    permissions:
      pull-requests: write