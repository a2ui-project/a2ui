# This workflow is used to check that CHANGELOG.md is properly updated,
# and the version in it is in agreement with pubspec.yaml.
# See more information at
# https://github.com/dart-lang/ecosystem/tree/main/pkgs/firehose#integrating-this-tool-into-a-repo
name: Pub Health
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  # The comment job of the health workflow downloads every artifact of the run
  # and then lists the download directory. A pull request labeled
  # skip-changelog-check uploads no comment file, so without this artifact the
  # directory does not exist and the comment job fails. The file is not
  # Markdown, so it never becomes part of the comment.
  artifact_placeholder:
    name: Health artifact placeholder
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Write the placeholder file
        run: echo "Keeps the artifact directory of the health comment job present." > placeholder.txt
      - name: Upload the placeholder file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-artifact-placeholder
          path: placeholder.txt
          if-no-files-found: error
          retention-days: 1

  health:
    needs: artifact_placeholder
    # Pinned to a commit, as required by the unpinned-uses policy. The workflow
    # itself installs package:firehose from the tip of main, so the checks stay
    # up to date; bump this hash to pick up changes to the workflow steps.
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@cda8bd535dfbcff45010bc3c843d325682f944b2 # main, 2026-08-17
    with:
      # The changelog check also verifies the version in CHANGELOG.md agrees
      # with pubspec.yaml. "version" is not a valid check name.
      checks: "changelog"
      fail_on: "changelog"
    permissions:
      pull-requests: write
