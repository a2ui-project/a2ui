# Removes the "waiting-for-user-response" label from an issue or PR as soon as
# its original author replies (a comment, a PR review, or an inline review
# comment). These trigger events run with the base repository's token, so this
# also works for pull requests opened from forks.

name: Remove Waiting-For-User-Response Label

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove label when the author responds
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'waiting-for-user-response';
            const payload = context.payload;

            // The target is an issue (issue_comment) or a PR (review events).
            const target = payload.issue || payload.pull_request;
            if (!target) return;

            const author = target.user.login;
            const responder =
              (payload.comment && payload.comment.user.login) ||
              (payload.review && payload.review.user.login);

            if (!responder || responder !== author) {
              core.info(`Responder "${responder}" is not the author "${author}"; nothing to do.`);
              return;
            }

            const labels = (target.labels || []).map((l) => l.name);
            if (!labels.includes(LABEL)) {
              core.info(`Label "${LABEL}" not present on #${target.number}; nothing to do.`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                name: LABEL,
              });
              core.info(`Removed "${LABEL}" from #${target.number}.`);
            } catch (err) {
              // 404 means the label was already removed (e.g. a concurrent run).
              if (err.status === 404) {
                core.info(`Label "${LABEL}" already removed from #${target.number}.`);
              } else {
                throw err;
              }
            }
