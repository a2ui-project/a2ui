# Auto-assigns every newly opened issue to a maintainer. The assignee is picked
# round-robin from a hardcoded list in scripts/auto-assignment.mjs, so triage
# always has a clear owner without anyone watching the queue.

# This automation adds/removes the 'triage-flag' label to issues and PRs.
# 
# 1. Issues, without ‘waiting-for-user-response’ that are:  
#    1. without priority  
#    2. P0 and P1 without assignment  
#    3. P0 and stale for more than 3 days  
#    4. P1 and stale for more than 30 days  
#    5. P2 and stale for more than 90 days  
# 2. PRs stale for more than month  
# 3. External comments, not responded for more than a day 
