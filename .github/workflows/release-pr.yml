name: Scheduled Release PR Creator

on:
  schedule:
    # Run weekly every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform dry run without creating PRs"
        type: boolean
        default: false

jobs:
  create-release-pr:
    name: Check Status & Open Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run Release PR Creator Script
        env:
          GH_TOKEN: ${{ secrets.A2UI_UPSTREAM_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          ./.agents/skills/a2ui-release-sdks/scripts/create_release_pr.py $EXTRA_ARGS
