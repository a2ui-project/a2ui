name: Scheduled Release PR Creator

on:
  schedule:
    # Run weekly every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform dry run without creating PRs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-release-pr:
    name: Check Status & Open Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: $/.github/actions/setup-node

      - name: Setup Python
        uses: $/.github/actions/setup-python

      - name: Run Release PR Creator Script
        env:
          GH_TOKEN: ${{ secrets.A2UI_UPSTREAM_TOKEN }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          EXTRA_ARGS=""
          if [ "$DRY_RUN_INPUT" == "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          ./scripts/release/release_manager.py --create-pr $EXTRA_ARGS
