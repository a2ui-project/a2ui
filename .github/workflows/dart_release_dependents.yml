# On a pull request that releases a2ui_core, fails if a Dart package on pub.dev
# that depends on a2ui_core is neither released with it nor accepts the new
# version. See .github/scripts/check_dart_dependents.py.
name: Dart Release Dependents

on:
  pull_request:
    branches:
      - main
    paths:
      - "dart/a2ui_core/pubspec.yaml"
      - ".github/scripts/check_dart_dependents.py"
      - ".github/workflows/dart_release_dependents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-dependents:
    name: Check Dart Release Dependents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check packages that depend on a2ui_core
        run: python3 .github/scripts/check_dart_dependents.py --base HEAD^1
