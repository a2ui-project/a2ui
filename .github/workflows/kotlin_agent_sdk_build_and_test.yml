name: A2UI-agent Kotlin SDK

on:
  push:
    branches:
      - "*"
    paths:
      - "kotlin/agent_sdk_legacy/**"
      - "specification/**/json/**"
      - "specification/inference_formats/**"
      - "conformance/**"
  pull_request:
    paths:
      - "kotlin/agent_sdk_legacy/**"
      - "specification/**/json/**"
      - "specification/inference_formats/**"
      - "conformance/**"
  # Catches breakage from outside the repository, such as a new dependency
  # release or runner image, when no change touches the paths above.
  schedule:
    - cron: "15 4 * * *" # daily at 04:15 UTC
  workflow_dispatch:

# A scheduled run has a group of its own, so that a push does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        working-directory: kotlin/agent_sdk_legacy
        run: chmod +x gradlew

      - name: Check formatting
        working-directory: kotlin/agent_sdk_legacy
        run: ./gradlew ktfmtCheck

      - name: Run tests
        working-directory: kotlin/agent_sdk_legacy
        run: ./gradlew test --info

  # Files an issue when the nightly run fails, or adds the run to the open
  # issue. A manual run does not file one.
  report-failure:
    needs: [build-and-test]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Lets create_issue.sh find the last passing run.
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Kotlin agent SDK CI" "ci_failure"
