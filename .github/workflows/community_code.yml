# Validates the community samples, which live outside the main workspace and are
# self-contained (they depend on the published @a2ui/* packages, not workspace
# builds) so this folder can be lifted into its own repository.

name: Community code

on:
  push:
    branches: [main]
    paths:
      - "samples/community/**"
      - ".github/workflows/community_code.yml"
  pull_request:
    paths:
      - "samples/community/**"
      - ".github/workflows/community_code.yml"

permissions:
  contents: read

jobs:
  web:
    name: Build web samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: samples/community
        run: yarn install --immutable

      - name: Build Angular samples
        working-directory: samples/community/client/angular
        run: |
          yarn ng build a2a-chat-canvas
          yarn ng build orchestrator

      - name: Build Lit samples
        working-directory: samples/community
        run: |
          yarn workspace @a2ui/mcp-apps-in-a2ui-sample build
          yarn workspace personalized-learning-demo build

  python:
    name: Validate python agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Resolve and install agent dependencies
        working-directory: samples/community/agent/adk
        run: |
          for agent in \
            gemini_enterprise/agent_engine \
            gemini_enterprise/cloud_run \
            mcp_app_proxy \
            mcp-apps-in-a2ui-sample \
            personalized_learning \
            rizzcharts/python; do
            echo "::group::$agent"
            (cd "$agent" && uv sync --no-install-project)
            echo "::endgroup::"
          done
