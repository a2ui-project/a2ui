# CI for the unmaintained samples under samples/community. The folder is
# self-contained: its samples depend on the published @a2ui/* (npm) and
# a2ui-agent-sdk (PyPI) packages rather than on the monorepo workspace. The
# one exception is @a2ui/catalog-mcp, which is not published yet: the MCP
# samples alias it, with the @a2ui/lit and @a2ui/web_core builds it depends
# on, to the monorepo dist/ directories built below.

name: Community Code CI

on:
  push:
    branches: [main]
    paths:
      - "samples/community/**"
      - "typescript/catalogs/**"
      - "typescript/web_core/**"
      - "renderers/lit/**"
      - ".github/workflows/community_code.yml"
  pull_request:
    paths:
      - "samples/community/**"
      - "typescript/catalogs/**"
      - "typescript/web_core/**"
      - "renderers/lit/**"
      - ".github/workflows/community_code.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/community
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: |
            yarn.lock
            samples/community/yarn.lock
      - name: Build @a2ui/catalog-mcp and @a2ui/lit from the monorepo workspace
        # TODO(https://github.com/a2ui-project/a2ui/issues/1698): remove once
        # @a2ui/catalog-mcp is published and the MCP samples install it from npm.
        working-directory: .
        run: |
          yarn install --immutable
          yarn workspace @a2ui/catalog-mcp run build
          yarn workspace @a2ui/lit run build
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build web samples (Angular a2a-chat-canvas + orchestrator, Lit mcp-apps + personalized_learning)
        run: yarn build:web

      - name: Build custom-lit-components (type-check + bundle verification pages)
        # Kept as its own step rather than folded into the build:web chain above:
        # it type-checks the custom component catalog against the published
        # @a2ui/* API and bundles test/*.html, so a break there reports on its own
        # instead of being masked by an earlier sample in the chain.
        run: yarn workspace custom-lit-components run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: uv sync each agent under samples/community
        # These samples are runnable apps, not publishable packages (several use a
        # flat module layout with no wheel target), so --no-install-project verifies
        # that their dependencies resolve and install without building each as a wheel.
        run: |
          set -euo pipefail
          find samples/community -name pyproject.toml -not -path "*/.venv/*" -not -path "*/node_modules/*" -print0 |
            while IFS= read -r -d '' manifest; do
              dir="$(dirname "$manifest")"
              echo "::group::uv sync $dir"
              uv sync --no-install-project --project "$dir"
              echo "::endgroup::"
            done
