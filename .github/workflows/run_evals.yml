name: Run A2UI Evals

on:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/run_evals.yml"
      - "python/**"
      - "typescript/core/**"
      - "typescript/a2ui_agent/**"
      - "typescript/catalogs/**"
      - "dart/**"
  pull_request:
    paths:
      - "eval/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/run_evals.yml"
      - "python/**"
      - "typescript/core/**"
      - "typescript/a2ui_agent/**"
      - "typescript/catalogs/**"
      - "dart/**"
  # Run evals on schedule, in order to:
  # - catch regressions introduced by changes in environment
  # - have more data for observing dynamics of performance degradation
  schedule:
    - cron: "0 0 * * *" # daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ts: ${{ steps.filter.outputs.ts }}
      dart: ${{ steps.filter.outputs.dart }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            python:
              - 'specification/**'
              - 'catalogs/**'
              - 'python/**'
              - 'eval/**'
              - '!eval/a2ui_eval/bridges/ts*'
              - '!eval/a2ui_eval/bridges/dart*'
              - '.github/workflows/run_evals.yml'
            ts:
              - 'specification/**'
              - 'catalogs/**'
              - 'typescript/core/**'
              - 'typescript/a2ui_agent/**'
              - 'typescript/catalogs/**'
              - 'eval/**'
              - '!eval/a2ui_eval/bridges/python*'
              - '!eval/a2ui_eval/bridges/dart*'
              - '.github/workflows/run_evals.yml'
            dart:
              - 'specification/**'
              - 'catalogs/**'
              - 'dart/**'
              - 'eval/**'
              - '!eval/a2ui_eval/bridges/python*'
              - '!eval/a2ui_eval/bridges/ts*'
              - '.github/workflows/run_evals.yml'

  eval-python:
    name: Evaluate Python SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
      REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (Python SDK)
        working-directory: eval
        run: uv run python -m pytest -k "not [ts] and not [dart]"

      - name: Run Evals (Python SDK)
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' && env.REPO_GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ env.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk python --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (Python SDK)" "eval_failure" "eval/eval_summary.md"

  eval-ts:
    name: Evaluate TypeScript SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
      REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node

      - name: Build TypeScript Agent SDK
        run: yarn workspace @a2ui/web_core build && yarn workspace @a2ui/agent build

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (TypeScript SDK)
        working-directory: eval
        run: uv run python -m pytest tests/test_bridges.py tests/test_scorers.py tests/test_strategies.py tests/test_main.py tests/test_run_ci_evals.py -k "not [dart]"

      - name: Run Evals (TypeScript SDK)
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' && env.REPO_GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ env.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk ts --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (TypeScript SDK)" "eval_failure" "eval/eval_summary.md"

  eval-dart:
    name: Evaluate Dart SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.dart == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
      REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Flutter and Dart
        # Before bumping, verify the new version is on the flutter org's
        # enterprise actions allowlist, or CI will fail with startup_failure.
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: beta
          cache: false

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (Dart SDK)
        working-directory: eval
        run: uv run python -m pytest tests/test_bridges.py tests/test_scorers.py tests/test_strategies.py tests/test_main.py tests/test_run_ci_evals.py -k "not [ts]"

      - name: Run Evals (Dart SDK)
        working-directory: eval
        if: ${{ env.TRANSCRYPT_PASSWORD != '' && env.REPO_GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ env.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk dart --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (Dart SDK)" "eval_failure" "eval/eval_summary.md"
