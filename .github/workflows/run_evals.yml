name: Run A2UI Evals

on:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/run_evals.yml"
      - "python/**"
      - "typescript/core/**"
      - "typescript/a2ui_agent/**"
      - "typescript/catalogs/**"
      - "dart/**"
  pull_request:
    paths:
      - "eval/**"
      - "specification/**"
      - "catalogs/**"
      - ".github/workflows/run_evals.yml"
      - "python/**"
      - "typescript/core/**"
      - "typescript/a2ui_agent/**"
      - "typescript/catalogs/**"
      - "dart/**"
  # Run evals on schedule, in order to:
  # - catch regressions introduced by changes in environment
  # - have more data for observing dynamics of performance degradation
  schedule:
    - cron: "0 0 * * *" # daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ts: ${{ steps.filter.outputs.ts }}
      dart: ${{ steps.filter.outputs.dart }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # With 'every', a changed file counts only if it matches every rule of
          # a filter. Each filter therefore has one positive rule that lists its
          # paths as a brace alternation, followed by negations that exclude the
          # bridge files of the other SDKs. A change to a shared eval file, the
          # specification, the catalogs or this workflow triggers every SDK.
          predicate-quantifier: "every"
          filters: |
            python:
              - '{specification/**,catalogs/**,python/**,eval/**,.github/workflows/run_evals.yml}'
              - '!eval/a2ui_eval/bridges/{ts,dart}_*'
            ts:
              - '{specification/**,catalogs/**,typescript/core/**,typescript/a2ui_agent/**,typescript/catalogs/**,eval/**,.github/workflows/run_evals.yml}'
              - '!eval/a2ui_eval/bridges/{python,dart}_*'
            dart:
              - '{specification/**,catalogs/**,dart/**,eval/**,.github/workflows/run_evals.yml}'
              - '!eval/a2ui_eval/bridges/{python,ts}_*'

  eval-python:
    name: Evaluate Python SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    # Full runs on main have taken up to two hours; cap a stuck run well
    # below GitHub's six-hour default.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets are only passed to the steps that need them, so that dependency
      # install and build scripts never see them. Forks and Dependabot runs have
      # no secrets; this step records which ones are present for later `if:`s.
      - name: Check eval secrets
        id: secrets
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
          REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: |
          has_transcrypt=false
          has_gemini=false
          if [ -n "$TRANSCRYPT_PASSWORD" ]; then has_transcrypt=true; fi
          if [ -n "$REPO_GEMINI_API_KEY" ]; then has_gemini=true; fi
          echo "transcrypt=$has_transcrypt" >> "$GITHUB_OUTPUT"
          if [ "$has_transcrypt" = true ] && [ "$has_gemini" = true ]; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ steps.secrets.outputs.transcrypt == 'true' }}
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (Python SDK)
        working-directory: eval
        run: uv run python -m pytest -k "not [ts] and not [dart]"

      - name: Run Evals (Python SDK)
        working-directory: eval
        if: ${{ steps.secrets.outputs.evals == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk python --strategies direct,subagent_tool,express --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (Python SDK)" "eval_failure" "eval/eval_summary.md"

  eval-ts:
    name: Evaluate TypeScript SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    # Full runs on main have taken up to two hours; cap a stuck run well
    # below GitHub's six-hour default.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets are only passed to the steps that need them, so that dependency
      # install and build scripts never see them. Forks and Dependabot runs have
      # no secrets; this step records which ones are present for later `if:`s.
      - name: Check eval secrets
        id: secrets
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
          REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: |
          has_transcrypt=false
          has_gemini=false
          if [ -n "$TRANSCRYPT_PASSWORD" ]; then has_transcrypt=true; fi
          if [ -n "$REPO_GEMINI_API_KEY" ]; then has_gemini=true; fi
          echo "transcrypt=$has_transcrypt" >> "$GITHUB_OUTPUT"
          if [ "$has_transcrypt" = true ] && [ "$has_gemini" = true ]; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js and Yarn
        uses: ./.github/actions/setup-node

      - name: Build TypeScript Agent SDK
        run: yarn workspace @a2ui/web_core build && yarn workspace @a2ui/agent build

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ steps.secrets.outputs.transcrypt == 'true' }}
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (TypeScript SDK)
        working-directory: eval
        run: uv run python -m pytest tests/test_bridges.py tests/test_scorers.py tests/test_strategies.py tests/test_main.py tests/test_run_ci_evals.py -k "not [dart]"

      - name: Run Evals (TypeScript SDK)
        working-directory: eval
        if: ${{ steps.secrets.outputs.evals == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk ts --strategies direct,subagent_tool,express --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (TypeScript SDK)" "eval_failure" "eval/eval_summary.md"

  eval-dart:
    name: Evaluate Dart SDK
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.dart == 'true') }}
    runs-on: ubuntu-latest
    # Full runs on main have taken up to two hours; cap a stuck run well
    # below GitHub's six-hour default.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets are only passed to the steps that need them, so that dependency
      # install and build scripts never see them. Forks and Dependabot runs have
      # no secrets; this step records which ones are present for later `if:`s.
      - name: Check eval secrets
        id: secrets
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
          REPO_GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: |
          has_transcrypt=false
          has_gemini=false
          if [ -n "$TRANSCRYPT_PASSWORD" ]; then has_transcrypt=true; fi
          if [ -n "$REPO_GEMINI_API_KEY" ]; then has_gemini=true; fi
          echo "transcrypt=$has_transcrypt" >> "$GITHUB_OUTPUT"
          if [ "$has_transcrypt" = true ] && [ "$has_gemini" = true ]; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Flutter and Dart
        # Before bumping, verify the new version is on the flutter org's
        # enterprise actions allowlist, or CI will fail with startup_failure.
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: beta
          cache: false

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Decrypt dataset
        working-directory: eval
        if: ${{ steps.secrets.outputs.transcrypt == 'true' }}
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
        run: ./bin/transcrypt -p "$TRANSCRYPT_PASSWORD" -y

      - name: Install `uv` globally
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Run Unit Tests (Dart SDK)
        working-directory: eval
        run: uv run python -m pytest tests/test_bridges.py tests/test_dart_bridge.py tests/test_scorers.py tests/test_strategies.py tests/test_main.py tests/test_run_ci_evals.py -k "not [ts]"

      - name: Run Evals (Dart SDK)
        working-directory: eval
        if: ${{ steps.secrets.outputs.evals == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
        run: ./bin/run_ci_evals.py --sdk dart --strategies direct,subagent_tool,express --threshold 90

      - name: Create Issue if evals fail on main branch
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Evals (Dart SDK)" "eval_failure" "eval/eval_summary.md"
