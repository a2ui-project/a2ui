name: Presubmit Lint

on:
  push:
    branches: [main]
  pull_request:
  # Catches breakage from outside the repository, such as a new dependency
  # release or runner image, when nothing is merged for a while.
  schedule:
    - cron: "45 2 * * *" # daily at 02:45 UTC
  workflow_dispatch:

# A scheduled run has a group of its own, so that a push does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for private index URL in uv.lock files
        run: |
          FORBIDDEN_URL="us-python.pkg.dev"
          FOUND_FILES=$(find . -type f -name "uv.lock" -print)
          if [ -n "$FOUND_FILES" ]; then
            if echo "$FOUND_FILES" | xargs grep -q "$FORBIDDEN_URL"; then
              echo "::error::Found private index URL ($FORBIDDEN_URL) in the following uv.lock files:"
              echo "$FOUND_FILES" | xargs grep -H "$FORBIDDEN_URL"
              exit 1
            else
              echo "No private index URLs found in uv.lock files."
            fi
          else
            echo "No uv.lock files found to check."
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.21"

      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.1.1

      - name: Run fix_licenses unit tests
        run: python3 -m unittest scripts.test_fix_licenses

      - name: Check license headers
        run: ./scripts/fix_licenses.py --check

  format-check:
    runs-on: ubuntu-24.04 # setup-swift does not support Ubuntu 26.04 yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          install: false
      - uses: ./.github/actions/setup-python
      - name: Set up Dart (Lightweight)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0"
      - name: Run enforce-formatting check
        run: ./scripts/fix_format.sh --check

  workspace-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build all workspaces
        run: yarn build:all
      - name: Run yarn lint:all
        run: yarn lint:all

  # Files an issue when the nightly run fails, or adds the run to the open
  # issue. A manual run does not file one.
  report-failure:
    needs: [static-checks, format-check, workspace-lint]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Lets create_issue.sh find the last passing run.
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Presubmit lint" "ci_failure"
