name: Presubmit Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check for private index URL in uv.lock files
        run: |
          FORBIDDEN_URL="us-python.pkg.dev"
          FOUND_FILES=$(find . -type f -name "uv.lock" -print)
          if [ -n "$FOUND_FILES" ]; then
            if echo "$FOUND_FILES" | xargs grep -q "$FORBIDDEN_URL"; then
              echo "::error::Found private index URL ($FORBIDDEN_URL) in the following uv.lock files:"
              echo "$FOUND_FILES" | xargs grep -H "$FORBIDDEN_URL"
              exit 1
            else
              echo "No private index URLs found in uv.lock files."
            fi
          else
            echo "No uv.lock files found to check."
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.21"

      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.1.1

      - name: Run fix_licenses unit tests
        run: python3 -m unittest scripts.test_fix_licenses

      - name: Check license headers
        run: ./scripts/fix_licenses.py --check

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          install: false
      - uses: ./.github/actions/setup-python
      - name: Set up Dart (Lightweight)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0"
      - name: Run enforce-formatting check
        run: ./scripts/fix_format.sh --check

  workspace-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build all workspaces
        run: yarn build:all
      - name: Run yarn lint:all
        run: yarn lint:all
