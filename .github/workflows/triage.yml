# This automation adds/removes the 'triage: flag' label to issues and PRs so
# that items needing attention are easy to find. The label is fully owned by
# this automation and reconciled on every run.
#
# The flagging rules live in ./scripts/triage.mjs — see the header comment
# there for the full specification:
# https://github.com/a2ui-project/a2ui/blob/main/scripts/triage.mjs

name: Flag/Unflag issues and PRs

on:
  # Periodic reconciliation: catches time-based rules (staleness, unanswered
  # external comments) and removes the label once an item no longer matches.
  schedule:
    - cron: "0 15 * * *" # daily at 15:00 UTC (07:00 PST), start of the team's day
  # React promptly to the events that can change an item's flag state.
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # PR lifecycle events (opened, labeled, assigned, ...) are deliberately
  # absent, so a new PR or a label or assignee change on a PR waits for the
  # daily cron. The `issues` events above fire for issues only, and a plain
  # `pull_request` trigger gets a read-only token on PRs from forks, so it
  # cannot label them. `pull_request_target` could, but zizmor rejects it as
  # an insecure trigger.
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Every run reconciles the whole repository, so runs are interchangeable and
# only the last one matters. A bulk triage session — relabelling or commenting
# on dozens of issues — otherwise fires one run per event, and each walks every
# open item, which exhausts the installation's API rate limit and fails the
# whole burst. Collapsing them to a single trailing run keeps that cheap.
#
# Cancelling mid-reconciliation is safe: the script reads live state and never
# depends on what a previous run did, so the surviving run reaches the same
# result on its own, and the daily cron is a backstop either way.
concurrency:
  group: triage
  # Not cancelling in-progress runs because otherwise some issues go unlabled
  # when multiple issues arrive concurrently.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  triage:
    name: Execute Triage
    # A standard runner, not the ubuntu-latest-extra-capacity pool that
    # https://github.com/a2ui-project/a2ui/pull/2338 set repo-wide. Jobs queue
    # for hours on that pool. Triage events arrive every few minutes and each
    # one cancels the queued run (see concurrency above), so a run waiting
    # hours for a machine never gets to start: nothing has been triaged since
    # 2026-08-21. A standard runner starts in seconds, and this job only calls
    # the GitHub API, so it has no use for the larger pool.
    runs-on: ubuntu-latest
    # Requires issue and PR write permissions for automated labeling and comment management
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # Always run the rules from main. A PR review event otherwise checks out
      # the PR's merge commit, whose copy of triage.mjs can predate a rule
      # change, and the two copies then add and remove each other's labels on
      # every run. It also keeps a PR's own edits to the script from running
      # with this job's write token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile triage flag labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');

            const filePath = path.resolve('./scripts/triage.mjs');
            const fileUrl = pathToFileURL(filePath).href;

            const importedModule = await import(fileUrl);
            await importedModule.default({ github, context });
