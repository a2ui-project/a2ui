name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "specification/**/json/**"
      - "specification/inference_formats/**"
      - "catalogs/**"
      - "conformance/**"
      - "samples/agent/adk/**"
      - ".agents/skills/**"
      - "dart/a2ui_cli/**"
      - "scripts/run_skills_tests.py"
      - ".github/scripts/**"
      - ".github/workflows/python_ci.yml"
      - ".github/actions/setup-python/**"
  pull_request:
    paths:
      - "python/**"
      - "specification/**/json/**"
      - "specification/inference_formats/**"
      - "catalogs/**"
      - "conformance/**"
      - "samples/agent/adk/**"
      - ".agents/skills/**"
      - "dart/a2ui_cli/**"
      - "scripts/run_skills_tests.py"
      - ".github/scripts/**"
      - ".github/workflows/python_ci.yml"
      - ".github/actions/setup-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a2ui_core and a2ui_agent derive their versions from git tags, so
          # the tags have to be present. Without this the build silently falls
          # back to the version pinned in pyproject.toml and CI would never
          # exercise the real versioning path.
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - name: Verify SDK version tags are reachable
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          for glob in 'python/a2ui-core/v*' 'python/a2ui-agent-sdk/v*'; do
            if ! git describe --tags --match "$glob" >/dev/null 2>&1; then
              if [ "$TARGET_BRANCH" != "main" ]; then
                echo "::warning::No tag matching $glob is reachable on branch $TARGET_BRANCH; fallback version will be used."
                continue
              fi
              echo "::error::No tag matching $glob is reachable, so package" \
                "versions would fall back instead of coming from tags."
              exit 1
            fi
            echo "$glob -> $(git describe --tags --match "$glob")"
          done
      - name: Install Dependencies
        run: uv sync --all-packages
      - name: Set Up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Check Generated Express Parser
        run: uv run python python/a2ui_agent/scripts/generate_express_parser.py --check
      - name: Check Formatting
        run: |
          uv run pyink --check .
      - name: Type Check
        run: |
          uv run --all-packages mypy .
      - name: Run Unit Tests
        run: uv run pytest
      - name: Set Up Dart
        uses: ./.github/actions/setup-dart
      - name: Run CLI Python Runtime Tests
        env:
          REQUIRE_PYTHON_TESTS: "true"
        run: |
          cd dart/a2ui_cli
          flutter pub get
          VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" flutter test test/python_runtime_test.dart
      - name: Build All Packages
        run: uv build --all
      - name: Run Skills Unit Tests
        run: uv run python3 scripts/run_skills_tests.py
      - name: Run Workflow Script Unit Tests
        run: python3 -m unittest discover -s .github/scripts/tests

  # Default python-ci stays on a2a-sdk 0.3: workspace members (samples) still
  # pin <0.4, so `uv sync --all-packages` cannot resolve 1.x. This sibling job
  # installs only a2ui-agent-sdk + a2a-sdk 1.x in an isolated venv.
  python-ci-a2a-sdk-1x:
    name: Python CI (a2a-sdk 1.x)
    runs-on: ubuntu-latest-extra-capacity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install a2ui-agent-sdk with a2a-sdk 1.x
        run: |
          uv venv .venv-a2a-sdk-1x
          venv="$PWD/.venv-a2a-sdk-1x"
          core="$PWD/python/a2ui_core"
          agent="$PWD/python/a2ui_agent"
          # uv pip install from the workspace root applies constraint-dependencies
          # (a2a-sdk<0.4). Run from /tmp so only a2ui-agent-sdk's pin (<2) applies.
          cd /tmp
          uv pip install --python "$venv" \
            -e "$core" \
            -e "$agent" \
            "a2a-sdk>=1.0.0,<2" \
            pytest \
            pytest-asyncio
      - name: Show a2a-sdk version
        run: |
          .venv-a2a-sdk-1x/bin/python -c "import importlib.metadata as m; print('a2a-sdk', m.version('a2a-sdk'))"
      - name: Run a2ui-agent-sdk tests on a2a-sdk 1.x
        run: |
          .venv-a2a-sdk-1x/bin/pytest python/a2ui_agent/tests -q
