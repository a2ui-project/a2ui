name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "agent_sdks/python/**"
      - "specification/**/json/**"
      - "conformance/**"
      - "samples/agent/adk/**"
      - ".agents/skills/**"
      - "scripts/run_skills_tests.py"
      - ".github/scripts/**"
      - ".github/workflows/python_ci.yml"
      - ".github/actions/setup-python/**"
  pull_request:
    paths:
      - "agent_sdks/python/**"
      - "specification/**/json/**"
      - "conformance/**"
      - "samples/agent/adk/**"
      - ".agents/skills/**"
      - "scripts/run_skills_tests.py"
      - ".github/scripts/**"
      - ".github/workflows/python_ci.yml"
      - ".github/actions/setup-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install Dependencies
        run: uv sync --all-packages
      - name: Check Formatting
        run: |
          uv run pyink --check .
      - name: Type Check
        run: |
          uv run --all-packages mypy .
      - name: Run Unit Tests
        run: uv run pytest
      - name: Verify Load Real
        run: uv run python agent_sdks/python/a2ui_agent/tests/integration/verify_load_real.py
      - name: Build All Packages
        run: uv build --all
      - name: Run Skills Unit Tests
        run: uv run python3 scripts/run_skills_tests.py
      - name: Run Workflow Script Unit Tests
        run: python3 -m unittest discover -s .github/scripts/tests

  # Default python-ci stays on a2a-sdk 0.3: workspace members (samples) still
  # pin <0.4, so `uv sync --all-packages` cannot resolve 1.x. This sibling job
  # installs only a2ui-agent-sdk + a2a-sdk 1.x in an isolated venv.
  python-ci-a2a-sdk-1x:
    name: Python CI (a2a-sdk 1.x)
    runs-on: ubuntu-latest-extra-capacity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install a2ui-agent-sdk with a2a-sdk 1.x
        run: |
          uv venv .venv-a2a-sdk-1x
          venv="$PWD/.venv-a2a-sdk-1x"
          core="$PWD/agent_sdks/python/a2ui_core"
          agent="$PWD/agent_sdks/python/a2ui_agent"
          # uv pip install from the workspace root applies constraint-dependencies
          # (a2a-sdk<0.4). Run from /tmp so only a2ui-agent-sdk's pin (<2) applies.
          cd /tmp
          uv pip install --python "$venv" \
            -e "$core" \
            -e "$agent" \
            "a2a-sdk>=1.0.0,<2" \
            pytest
      - name: Show a2a-sdk version
        run: |
          .venv-a2a-sdk-1x/bin/python -c "import importlib.metadata as m; print('a2a-sdk', m.version('a2a-sdk'))"
      - name: Run a2ui-agent-sdk 1.x Part tests
        run: |
          .venv-a2a-sdk-1x/bin/pytest agent_sdks/python/a2ui_agent/tests/a2a -q
