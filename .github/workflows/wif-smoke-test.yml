# Read-only check that this repository can authenticate to the OSS Exit Gate.
#
# Run this once after the builder identity CL lands internally, and again any
# time authentication looks broken. It never uploads anything and never
# triggers a publish, so it is safe to run at any time.
#
# This workflow needs its own builder entry in the internal project config,
# because authorization matches the workflow file path exactly:
#
#   builders: "github_workflow:a2ui-project/a2ui/.github/workflows/wif-smoke-test.yml@refs/heads/main"
#
# If you would rather not register a second path, delete this workflow and do
# the same checks by running release-pypi.yml with dry_run enabled.

name: OSS Exit Gate access check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  EXIT_GATE_PROJECT: oss-exit-gate-prod
  EXIT_GATE_AR_LOCATION: us
  EXIT_GATE_AR_REPOSITORY: a2ui--pypi
  EXIT_GATE_MANIFEST_PREFIX: gs://oss-exit-gate-prod-projects-bucket/a2ui/pypi/manifests
  WIF_PROVIDER: projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github

jobs:
  check:
    name: Verify Workload Identity Federation access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Only runs from main can authenticate. The workflow_ref" \
            "claim embeds the ref, and only refs/heads/main is allowlisted."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Show the federated identity
        run: gcloud auth list

      # Confirms the builders_wif binding on the Artifact Registry repository.
      - name: Read the Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "${EXIT_GATE_AR_REPOSITORY}" \
            --location="${EXIT_GATE_AR_LOCATION}" \
            --project="${EXIT_GATE_PROJECT}"

      # Confirms the triggerers_wif binding on the manifest managed folder. If
      # this fails while the step above passes, the internal config populated
      # builders_wif but not triggerers_wif.
      - name: List the manifest folder
        run: gcloud storage ls "${EXIT_GATE_MANIFEST_PREFIX}/" || true

      - name: Summarize
        run: |
          {
            echo "### OSS Exit Gate access check passed"
            echo
            echo "Artifact Registry and the manifest bucket are both reachable"
            echo "with the federated identity. Releases can be dispatched."
          } >> "$GITHUB_STEP_SUMMARY"
