name: Validate A2UI Blueprints

on:
  push:
    branches: [main]
    paths:
      - "blueprints/**"
      - ".github/workflows/validate_blueprints.yml"
  pull_request:
    paths:
      - "blueprints/**"
      - ".github/workflows/validate_blueprints.yml"
  # Catches breakage from outside the repository, such as a new dependency
  # release or runner image, when no change touches the paths above.
  schedule:
    - cron: "30 4 * * *" # daily at 04:30 UTC
  workflow_dispatch:

# A scheduled run has a group of its own, so that a push does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-blueprints:
    name: Validate Blueprints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Blueprint Validator
        run: python3 blueprints/validate_blueprints.py

      - name: Run Blueprint Compliance Script Unit Tests
        run: python3 -m unittest blueprints/skills/a2ui-blueprint-compliance/scripts/test_check_compliance.py

  # Files an issue when the nightly run fails, or adds the run to the open
  # issue. A manual run does not file one.
  report-failure:
    needs: [validate-blueprints]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Lets create_issue.sh find the last passing run.
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create_issue.sh "Blueprint validation" "ci_failure"
