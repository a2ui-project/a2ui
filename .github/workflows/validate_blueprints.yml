name: Validate A2UI Blueprints

on:
  push:
    branches: [main]
    paths:
      - "blueprints/**"
      - ".github/workflows/validate_blueprints.yml"
  pull_request:
    paths:
      - "blueprints/**"
      - ".github/workflows/validate_blueprints.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-blueprints:
    name: Validate Blueprints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Blueprint Validator
        run: python3 blueprints/validate_blueprints.py
