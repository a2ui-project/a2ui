name: ChatOps Remediation Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: remediation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-remediation:
    name: Execute Automated Remediation Draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/fix ') &&
      contains(github.event.issue.title, 'A2UI Compliance Report')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Parse Recommendation Index
        id: parse-command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 .github/scripts/parse_remediation_command.py

      - name: Verify Commenter Permissions
        if: steps.parse-command.outputs.triggered == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(permission.permission)) {
              core.setFailed(`User ${context.actor} does not have write access to trigger remediation.`);
            }

      - name: React with Eyes to Trigger Comment
        if: steps.parse-command.outputs.triggered == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Set up Python
        if: steps.parse-command.outputs.triggered == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google GenAI SDK
        if: steps.parse-command.outputs.triggered == 'true'
        run: |
          pip install "google-genai>=1.0.0"

      - name: Execute Automated Remediation Script
        if: steps.parse-command.outputs.triggered == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.REPO_GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/run_remediation.py
