name: Create Release Tags on Merge

on:
  push:
    branches:
      - main
    paths:
      - "renderers/**/package.json"
      - "agent_sdks/python/**/version.py"
      - "agent_sdks/python/**/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-release:
    name: Create & Push Namespaced Release Tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: $/.github/actions/setup-python

      - name: Detect Version Bumps & Create Git Tags
        env:
          GH_TOKEN: ${{ secrets.A2UI_UPSTREAM_TOKEN }}
        run: |
          ./scripts/release/create_release.py --create-tags
