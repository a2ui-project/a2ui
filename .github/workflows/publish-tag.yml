name: Publish Tagged Release

on:
  push:
    tags:
      - "javascript/**"
      - "python/**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. javascript/react/v0.11.0)"
        required: false
      dry_run:
        description: "Perform dry run without uploading artifacts"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Tagged Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: $/.github/actions/setup-node

      - name: Setup Python
        uses: $/.github/actions/setup-python

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7add45192d630463a9182d5f8b2 # v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Execute Tagged Release Script
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          TAG_NAME="${TAG_INPUT:-$REF_NAME}"
          DRY_RUN_ARG=""
          if [ "$DRY_RUN_INPUT" == "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          echo "=== Executing release for tag: $TAG_NAME ==="
          if [[ "$TAG_NAME" == "javascript/"* ]]; then
            ./renderers/release.sh "$TAG_NAME" $DRY_RUN_ARG
          elif [[ "$TAG_NAME" == "python/"* ]]; then
            ./agent_sdks/python/release.sh "$TAG_NAME" $DRY_RUN_ARG
          else
            echo "Unknown tag prefix in '$TAG_NAME'. Expected javascript/ or python/."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" != "true" ]; then
            TAG_NAME="${TAG_INPUT:-$REF_NAME}"
            gh release create "$TAG_NAME" -R a2ui-project/a2ui --generate-notes
          fi
