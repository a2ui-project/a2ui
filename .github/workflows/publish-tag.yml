name: Publish Tagged Release

on:
  push:
    tags:
      - "javascript/**"
      - "python/**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. javascript/react/v0.11.0)"
        required: false
      dry_run:
        description: "Perform dry run without uploading artifacts"
        type: boolean
        default: false

jobs:
  publish:
    name: Build & Publish Tagged Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Execute Tagged Release Script
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          echo "=== Executing release for tag: $TAG_NAME ==="
          if [[ "$TAG_NAME" == "javascript/"* ]]; then
            ./renderers/release.sh "$TAG_NAME" $DRY_RUN_ARG
          elif [[ "$TAG_NAME" == "python/"* ]]; then
            ./agent_sdks/python/release.sh "$TAG_NAME" $DRY_RUN_ARG
          else
            echo "Unknown tag prefix in '$TAG_NAME'. Expected javascript/ or python/."
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
