name: Lit renderer

on:
  push:
    branches: [main]
    paths:
      - "renderers/lit/**"
      - "renderers/web_core/**"
      - ".github/workflows/lit_build_and_test.yml"
  pull_request:
    paths:
      - "renderers/lit/**"
      - "renderers/web_core/**"
      - ".github/workflows/lit_build_and_test.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [unit, explorer]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install web_core dependencies
        working-directory: ./renderers/web_core
        run: npm i

      - name: Build web_core
        working-directory: ./renderers/web_core
        run: npm run build

      - name: Install Lit renderer dependencies
        working-directory: ./renderers/lit
        run: npm i

      - name: Build Lit renderer
        working-directory: ./renderers/lit
        run: npm run build

      - name: Run task
        run: |
          case "${{ matrix.task }}" in
            unit)
              cd ./renderers/lit && npm run test:unit
              ;;
            explorer)
              cd ./renderers/lit/a2ui_explorer && npm run build:deps && npm run test:ci
              ;;
          esac
