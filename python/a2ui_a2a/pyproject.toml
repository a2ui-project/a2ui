[project]
name = "a2ui-a2a"
dynamic = ["version"]
description = "A2UI extension for the Agent-to-Agent (A2A) protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["a2ui", "a2a", "agent", "ui"]
dependencies = [
  "a2a-sdk>=0.3.0,<0.4.0",
  # 0.8.0 is the last agent SDK release that still ships `a2ui.a2a` and
  # `a2ui.adk` itself. Installing it next to this package would make two
  # distributions write the same files, so require a later release.
  "a2ui-agent-sdk>0.8.0",
  "packaging>=23.0",
]

[project.urls]
Homepage = "https://a2ui.org/"
Repository = "https://github.com/a2ui-project/a2ui/tree/main/python/a2ui_a2a"
Changelog = "https://github.com/a2ui-project/a2ui/blob/main/python/a2ui_a2a/CHANGELOG.md"
Issues = "https://github.com/a2ui-project/a2ui/issues"

[tool.uv.sources]
a2ui-agent-sdk = { workspace = true }

[build-system]
requires = [
  "hatchling",
  "hatch-vcs",
]
build-backend = "hatchling.build"

# Version is derived from the `python/a2ui-a2a/v*` git tags. See the
# equivalent block in a2ui_core/pyproject.toml for how `fallback-version` is
# used.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.version.raw-options]
root = "../.."
tag_regex = '^python/a2ui-a2a/v(?P<version>.+)$'
local_scheme = "no-local-version"
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "python/a2ui-a2a/v*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
