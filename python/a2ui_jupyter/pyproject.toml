[project]
name = "a2ui-jupyter"
dynamic = ["version"]
description = "JupyterLab renderer for A2UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["a2ui", "jupyter", "jupyterlab", "renderer"]
dependencies = [
  "a2ui-core>=0.6.0,<0.7.0",
  "anywidget>=0.11.0",
  "ipykernel>=6.29.0,!=7.1.*,!=7.2.*,!=7.3.*",
  "jupyter-ui-poll>=1.0.0",
]

[project.urls]
Homepage = "https://a2ui.org/"
Repository = "https://github.com/a2ui-project/a2ui/tree/main/python/a2ui_jupyter"
Issues = "https://github.com/a2ui-project/a2ui/issues"

[tool.uv.sources]
a2ui-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.version.raw-options]
root = "../.."
tag_regex = '^python/a2ui-jupyter/v(?P<version>.+)$'
local_scheme = "no-local-version"
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "python/a2ui-jupyter/v*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui_jupyter"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[dependency-groups]
dev = [
  "jupyter-client>=8.6.0",
  "pytest>=9.1.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
